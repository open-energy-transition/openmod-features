# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against the OSeMOSYS GNU MathProg reference implementation v1.0.1 (released 21st May 2021)
# and the official OSeMOSYS documentation (https://osemosys.readthedocs.io, only `latest` is published).
# v1.0.1 is the release GitHub marks as latest and the newest model code: the later-dated v0.8.1 tag
# (25th August 2021) is a Zenodo re-release of the 2019 code line, and the default branch has only
# unreleased fixes to the short/fast model variants since v1.0.1 (src/osemosys.txt is unchanged).
# The entry covers the OSeMOSYS ecosystem: the reference model plus companion tools built specifically
# for OSeMOSYS with documented OSeMOSYS examples. These are otoole (data CLI / Python API), MUIO (GUI),
# clicSAND (Excel front-end), OSeMOSYS Cloud (web solver), OSeMOSYS Global (model generator, v2.0.0a),
# OSeMOSYS_PuLP (Python implementation with Monte Carlo runs), OSeMOSYS_step (myopic runs), esom_gsa
# (sensitivity analysis), osemosys-rdm (robust decision making ensembles), osemosys2iamc (IAMC
# reporting), the OSeMOSYS-FlexTool workflow, clewsy and GEOSeMOSYS. Each is named in the comments of the leaves it supports. Features that exist only in a
# companion tool's own copy of the model file (MUIO, OSeMOSYS Global) are marked Tenuous. The GAMS /
# Pyomo / linopy implementations and single-study repositories are not credited.
# The community extensions listed under Advanced functionalities are credited as `y` where they
# publish code that can be added to the reference model file (cascaded hydro), and as `dev` where
# they are only described in publications or code snippets written for older code versions.
# Other `dev` entries link to open pull requests.

version: 'v1.0.1'
features:
  processes:
    boundary_exchange:
      value: y
      source:
        # Every supply chain starts with a technology that has no input fuel (e.g. an import or
        # extraction technology), costed via VariableCost and bounded by activity/capacity limits.
        - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#starting-the-chain-with-a-technology
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#activity-constraints
    conversion:
      one_to_one:
        value: y
        source:
          # InputActivityRatio / OutputActivityRatio relate each technology's activity to its fuel
          # use and production.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#energy-balance-a
      multi_carrier_io:
        value: y
        source:
          # Several fuels can carry non-zero Input/OutputActivityRatio for the same technology and
          # mode.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#energy-balance-a
      flexible_ratio:
        value: y
        source:
          # MODE_OF_OPERATION: a technology can choose any linear combination of modes with
          # different input/output mixes (e.g. a CHP plant producing heat in one mode and
          # electricity in another).
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
    temporal_transfer:
      value: y
      source:
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage-equations
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage-constraints
    spatial_transfer:
      value: y
      source:
        # `Trade` between REGIONs enabled by TradeRoute (no capacity limit on the trade link itself,
        # see issue #62); capacity-limited transfer is modelled as a transmission technology
        # converting one region-specific fuel into another.
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#global-parameters
        - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#energy-balance-a
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/62
    delayed_transfer:
      value: n
      source: []
    buffered_transfer:
      value: n
      source: []
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source: []
    explicit_demand:
      inelastic:
        # Tenuous: demands themselves (SpecifiedAnnualDemand / AccumulatedAnnualDemand) are
        # exogenous; a constrainable demand process is built from an end-use technology with fixed
        # activity.
        value: y
        source:
          # End-use technologies consuming a final fuel are ordinary technologies; their annual
          # activity can be fixed with TotalTechnologyAnnualActivityLower/UpperLimit.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#annual-activity-constraints
          - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#the-atlantis-case-study
      price_responsive:
        value: dev
        source:
          # No elastic demand in the reference model. Load shedding of prioritised demand types at
          # user-defined costs is a community extension of the 2011 code, published only as a
          # paper appendix.
          - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#demand-flexibility
      mobile_storage:
        value: n
        source: []
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: n
          source:
            # Transport model only: energy balance per region/timeslice with no network physics.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#energy-balance-a
        ac_opf:
          value: n
          source: []
        unbalanced_flows:
          value: n
          source: []
      sensitivity_limits:
        ptdf:
          value: n
          source: []
        outage_factors:
          value: n
          source: []
        generic_constraints:
          value: n
          source: []
      network_limits:
        thermal:
          value: n
          source: []
        phase_angle:
          value: n
          source: []
      losses:
        # Transmission losses are only a fixed Input/OutputActivityRatio efficiency on a
        # transmission technology.
        value: n
        source: []
      network_devices:
        transformers:
          value: n
          source: []
        facts_devices:
          value: n
          source: []
        hvdc_converters:
          value: n
          source: []
    hydraulic_flow:
      linearised_flow:
        value: n
        source: []
      composition_tracking:
        value: n
        source: []
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          # ResidualCapacity; capacity can be fixed by setting TotalAnnualMaxCapacity equal to it.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
      continuous_capacity:
        value: y
        source:
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-variables
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#total-capacity-constraints
      integer_investment_exogenous_capacity:
        value: y
        source:
          # CapacityOfOneTechnologyUnit with the integer variable NumberOfNewTechnologyUnits turns
          # the problem into a MILP.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-a
          - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/src/osemosys.txt#L396
      integer_investment_continuous_capacity:
        value: n
        source: []
      multi_period:
        value: y
        source:
          # NewCapacity[r,t,y] is decided for every year in the YEAR set within one perfect-
          # foresight run.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-variables
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#objective-function
      retrofit:
        value: dev
        source:
          # Refurbishing existing units is a community extension described in a thesis; its
          # retrofitting equations are pasted in an issue but not integrated.
          - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-operational-constraints-of-power-plants
          - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/103
      endogenous_retirement:
        value: n
        source:
          # Capacity leaves only at the end of OperationalLife (CAa1); there is no early-retirement
          # variable.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-a
    operation:
      unit_commitment:
        value: n
        source:
          # Unit-commitment-style operating constraints exist only as published community
          # extensions, not in the reference code.
          - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-operational-constraints-of-power-plants
      maintenance_scheduling:
        value: n
        source:
          # AvailabilityFactor is an exogenous annual limit representing planned outages; outage
          # timing is not decided.
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
          - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-b
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            value: y
            source:
              # TotalAnnualMax/MinCapacityInvestment bound NewCapacity in each year.
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#new-capacity-constraints
          operation:
            availability_derating:
              value: y
              source:
                # CapacityFactor[r,t,l,y] bounds activity per timeslice; MinStorageCharge bounds the
                # stored level.
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-a
                - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#capacity-factors
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage
            minimum_stable_level:
              value: dev
              source:
                # Minimum duty is only described in a community extension, with no published code.
                - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-operational-constraints-of-power-plants
            forced_offline:
              # Tenuous: no commitment state, but setting CapacityFactor to 0 in given timeslices
              # forces the technology's activity to zero there.
              value: y
              source:
                - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#capacity-factors
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-a
            forced_online:
              value: n
              source:
                # No per-timeslice lower bound on activity; activity lower limits are annual or
                # model-period only. Mode-level activity limits are an open enhancement proposal.
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#activity-constraints
                - https://github.com/OSeMOSYS/OSeMOSYS/issues/124
        sequential:
          investment:
            availability_window:
              value: y
              source:
                # Year-indexed TotalAnnualMaxCapacityInvestment (set to 0 before a commissioning
                # date) restricts the years in which a technology may be built.
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#new-capacity-constraints
            relative_build_rate:
              value: n
              source:
                # Requested: growth constraint relative to previous periods.
                - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/88
            technical_lifetime:
              value: y
              source:
                # OperationalLife removes new capacity from AccumulatedNewCapacity after its
                # lifetime.
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-adequacy-a
          operation:
            ramping:
              value: dev
              source:
                # Ramping constraints are only described in the community short-term extensions,
                # with no published code.
                - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-planning
                - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-operational-constraints-of-power-plants
            start_shut_trajectory:
              value: n
              source: []
            commitment_duration:
              value: n
              source: []
            start_consumption:
              value: n
              source: []
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # TotalAnnualMax/MinCapacity bound installed capacity; ReserveMargin requires
                # capacity counted at the ReserveMarginTagTechnology fraction (0-1) to exceed tagged
                # demand.
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#capacity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#total-capacity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#reserve-margin
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#reserve-margin-constraints
            expansion_budget:
              value: n
              source: []
            event_count:
              value: n
              source: []
            path_dependent:
              value: n
              source: []
          operation:
            flow_volume:
              value: y
              source:
                # Annual and model-period activity limits per technology; minimum renewable
                # production share (REMinProductionTarget).
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#activity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#annual-activity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#total-activity-constraints
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#re-production-target
            impact_budget:
              value: y
              source:
                # AnnualEmissionLimit / ModelPeriodEmissionLimit on any user-defined EMISSION (used
                # for water, land etc. in CLEWs-type models).
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#emissions
                - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#emissions-accounting
            event_count:
              value: n
              source: []
            state_duration:
              value: n
              source: []
            path_dependent:
              value: n
              source: []
        boundary_conditions:
          investment:
            value: y
            source:
              # ResidualCapacity / ResidualStorageCapacity define the existing stock.
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#performance
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage
          operation:
            value: y
            source:
              # StorageLevelStart sets the initial storage level; no end-state condition.
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage-equations
              # Limits on the change in activity between years are an enhancement proposal for the
              # reference model; MUIO's model file limits year-on-year activity change per mode.
              - https://github.com/OSeMOSYS/OSeMOSYS/issues/106
              - https://github.com/OSeMOSYS/MUIO/blob/v5.6/WebAPP/SOLVERs/model.v.5.4.txt#L238-L241
      spatial:
        investment:
          # Tenuous: all limits are indexed by REGION, so they do not span several REGIONs. Nodes
          # can instead be encoded in fuel and technology names within one REGION, as OSeMOSYS
          # Global does systematically.
          value: y
          source:
            # The REGION set description suggests modelling several countries within one REGION through ad hoc fuels and technologies.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#reserve-margin-constraints
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/85
            # OSeMOSYS Global applies one reserve margin across all its nodes.
            - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/reserves/reserve_margin_tag_fuel.py#L7-L21
            - https://osemosys-global.readthedocs.io/en/latest/examples.html#example-4
            # Generic capacity targets across technologies (and so across such nodes) are an open PR.
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/pull/75
        operation:
          # Tenuous: as for `investment`: emission limits and the RE target span all nodes encoded
          # within one REGION, but never several REGIONs.
          value: y
          source:
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#emissions-accounting
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#re-production-target
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/85
            # OSeMOSYS Global sets country emission caps and national / system RE shares over nodes.
            - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/powerplant/renewable_targets.py#L7-L151
            - https://osemosys-global.readthedocs.io/en/latest/examples.html#example-4
      assets:
        spanning:
          investment:
            # Tenuous: the reserve margin (one per REGION, relative to tagged production) is the
            # only capacity limit spanning several technologies in the reference model.
            value: y
            source:
              # The reserve margin sums the capacity of all tagged technologies.
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#reserve-margin-constraints
              # Combined capacity targets are an enhancement proposal and an open PR (UDCs) for the
              # reference model; MUIO's model file ships UDCs.
              - https://github.com/OSeMOSYS/OSeMOSYS/issues/107
              - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/pull/75
              - https://github.com/OSeMOSYS/MUIO/blob/v5.6/WebAPP/SOLVERs/model.v.5.4.txt#L343-L351
          operation:
            value: y
            source:
              # Emission limits sum over all emitting technologies; the RE target sums production of
              # tagged technologies.
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#emissions-accounting
              - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#re-production-target
              # The RE target applies jointly to all RE-tagged fuels, not per fuel.
              - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/32
        dedicated_flow_routing:
          # Tenuous: no dedicated mechanism in the reference model; achieved through the
          # fuel/technology graph and storage links.
          value: y
          source:
            # TechnologyToStorage / TechnologyFromStorage link named technologies to a storage; an
            # intermediate FUEL produced and used by named technologies only routes flow between
            # them.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#storage
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
            # The community cascaded hydro code routes reservoir discharge into named downstream
            # reservoirs (DownstreamReservoirTag).
            - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#cascaded-water-storage
            - https://github.com/tniet/OSeMOSYS/blob/b78ae92bdb0877aa750bbf77b0540642b9271817/OSeMOSYS_GNU_MathProg/osemosys_short.txt#L457-L489
    functional_form:
      linear_multi_variable:
        investment:
          # Tenuous: only in MUIO's own model file; an open PR for the reference model.
          value: y
          source:
            # User-defined constraints (UDCs) with multipliers on NewCapacity / TotalCapacityAnnual
            # / annual activity.
            - https://github.com/OSeMOSYS/MUIO/blob/v5.6/WebAPP/SOLVERs/model.v.5.4.txt#L343-L351
            - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/structure-osemosys/parameters.rst
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/pull/75
        operation:
          value: y
          source:
            # Modes of operation define a convex operating region between several flows of one
            # technology; the RE target links production across technologies.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#re-production-target
            # Generic user-defined linear constraints on annual activity are in MUIO's model file
            # and an open PR for the reference model.
            - https://github.com/OSeMOSYS/MUIO/blob/v5.6/WebAPP/SOLVERs/model.v.5.4.txt#L343-L351
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/pull/75
      quadratic:
        investment:
          # Formulated as an LP / MILP for GLPK and other LP solvers.
          value: n
          source: []
        operation:
          value: n
          source: []
      nonlinear:
        investment:
          value: n
          source: []
        operation:
          value: n
          source:
            # Part-load efficiency code offered but not integrated.
            - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/issues/103
    reliability:
      unserved_demand:
        # Tenuous: no built-in VOLL; the documented approach is a dummy supply technology with a
        # very high variable cost.
        value: y
        source:
          - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#adding-a-dummy-technology
      operating_reserve:
        online_headroom:
          value: dev
          source:
            # ReserveMargin is a planning capacity margin, not a reserve held on running assets.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#reserve-margin-constraints
            # Reserve capacity dispatch is only described in a community extension, with no
            # published code.
            - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-operational-constraints-of-power-plants
        standby_capability:
