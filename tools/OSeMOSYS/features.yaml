      source:
        # Only individual example models (UTOPIA, SIMPLICITY, Atlantis) are distributed; OSeMOSYS
        # Global generates new models rather than retrieving pre-built ones.
        - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#downloading-model-files-and-running-the-model
    resource_conversion:
      # OSeMOSYS Global ships pre-computed capacity-factor series and only aggregates them to
      # timeslices.
      value: n
      source: []
    forecasting:
      value: y
      source:
        # OSeMOSYS Global projects annual demand from SSP data and scales an hourly profile to it.
        - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/demand/projection.py#L17-L88
        - https://osemosys-global.readthedocs.io/en/latest/getting-started.html#data-sources
    spatial_distribution:
      demand:
        value: y
        source:
          # OSeMOSYS Global downscales country demand to nodes by PLEXOS-World nodal shares.
          - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/demand/projection.py#L246-L279
      network_geometry:
        value: y
        source:
          # OSeMOSYS Global derives line lengths from node centre points for losses and costs.
          - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/transmission/data.py#L121-L142
          - https://osemosys-global.readthedocs.io/en/latest/getting-started.html#custom-nodes
    scenario_generation:
      value: y
      source:
        # OSeMOSYS_PuLP samples parameters from per-parameter distributions; esom_gsa samples
        # parameter ranges; OSeMOSYS_step builds all combinations of per-step options.
        - https://github.com/OSeMOSYS/OSeMOSYS_PuLP/blob/60cf0aaaa6020d7e9a735bd2310b4d4cb19717c6/OSeMOSYS_PuLP.py#L163-L202
        - https://github.com/KTH-dESA/esom_gsa/blob/c311704f800afbd932c53e5938ccfb8668a76234/workflow/rules/sample.smk
        - https://github.com/KTH-dESA/OSeMOSYS_step/blob/v0.2.0/README.md#datascenarios
        # The MathProg release's RunHPCNodes.py writes one data file per combination of scenario
        # parameter lists.
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/scripts/README.md#runhpcnodespy
    input_validation:
      value: y
      source:
        # `check` statements in the model file stop the run on inconsistent bounds or YearSplit not
        # summing to 1; otoole validate checks names and unconnected technologies/fuels.
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/docs/changelog.md#osemosys-checks-for-basic-errors-in-input-data
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/src/osemosys.txt#L168-L208
        - https://otoole.readthedocs.io/en/stable/functionality.html#validation
  postprocessing:
    metrics:
      operational:
        capacity_factor:
          # Results report production and capacity, but no derived capacity factor.
          value: n
          source: []
        operating_hours:
          value: n
          source: []
        binding_hours:
          value: n
          source: []
        curtailment:
          value: dev
          source:
            # Curtailment accounting is only described in the community short-term planning
            # extension, with no published code.
            - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#short-term-planning
      financial:
        marginal_price:
          # Tenuous: MUIO reports duals of the annual commodity balance per region, commodity and
          # year; no timeslice prices.
          value: y
          source:
            - https://github.com/OSeMOSYS/MUIO/blob/v5.6/API/Classes/Case/DataFileClass.py#L2593-L2611
            - https://github.com/OSeMOSYS/MUIO/releases/tag/v5.3
        price_formation:
          value: n
          source: []
        water_value:
          value: n
          source: []
        asset_accounts:
          # Tenuous: cost accounts only; there are no revenues.
          value: y
          source:
            # Per-technology CapitalInvestment, operating costs, emission penalties, salvage value
            # and TotalDiscountedCostByTechnology are reported.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#costing-variables
        contract_settlement:
          value: n
          source: []
        levelised_cost:
          # Tenuous: OSeMOSYS Global reports discounted system cost per MWh of demand; OSeMOSYS
          # Cloud estimates electricity cost with fixed annuity assumptions.
          value: y
          source:
            - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/summary/costs.py#L107-L111
            - https://github.com/OSeMOSYS/osemosys-cloud-visualization/blob/e28f8dde198240c3430c6b7a42d699209aa632c0/app/figures/cost_electricity_generation.py
        net_present_value:
          value: y
          source:
            # TotalDiscountedCost and ModelPeriodCostByRegion give the discounted system cost.
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#costing-variables
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#total-discounted-costs
      impact_assessment:
        emissions:
          value: y
          source:
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#id5
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#emissions-accounting
        resource_use:
          # Tenuous: via the generic EMISSION set, which CLEWs-type models use to account water,
          # land etc.
          value: y
          source:
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#sets
            - https://osemosys.readthedocs.io/en/latest/manual/Structure%20of%20OSeMOSYS.html#id5
        socioeconomic:
          value: n
          source: []
      network_transfer_metrics:
        transfer_capacity:
          # Tenuous: OSeMOSYS Global sums built line capacities between node and country pairs.
          value: y
          source:
            - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/summary/capacity.py#L6-L31
            - https://osemosys-global.readthedocs.io/en/latest/examples.html#example-1
        flow_sensitivity:
          value: n
          source: []
      probabilistic_reliability_assessment:
        loss_of_load:
          value: n
          source: []
        unserved_energy:
          value: dev
          source:
            # Energy-security extension (external Matlab disturbance model) described in a thesis.
            - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#stochastic-modelling-of-energy-security-assessment
        capacity_credit:
          value: n
          source: []
    transformation:
      aggregation:
        value: y
        source:
          # osemosys2iamc sums results matching user regexes on TECHNOLOGY / FUEL / EMISSION.
          - https://github.com/OSeMOSYS/osemosys2iamc/blob/v0.2.2/README.md#writing-a-configuration-file
          - https://github.com/OSeMOSYS/osemosys2iamc/blob/v0.2.2/src/osemosys2iamc/resultify.py#L241-L258
          # SelectedResults.csv summarises costs, emissions and production by region and year.
          - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/src/osemosys.txt#L816-L850
      disaggregation:
        value: n
        source: []
      scenario_comparison:
        value: y
        source:
          # MUIO's results pivot shows executed cases side by side; esom_gsa and osemosys-rdm
          # collate results across all runs; OSeMOSYS Cloud plots a "compare to" run beside the
          # selected one.
          - https://osemosys-rdm.readthedocs.io/en/latest/user-guide/rdm-pipeline.html#aggregated-outputs
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/WebAPP/AppResults/Controller/Pivot.js#L249
          - https://github.com/KTH-dESA/esom_gsa/blob/c311704f800afbd932c53e5938ccfb8668a76234/workflow/scripts/extract_results.py#L52-L100
          - https://github.com/OSeMOSYS/osemosys-cloud-visualization/blob/e28f8dde198240c3430c6b7a42d699209aa632c0/main.py#L60-L90
  interface:
    gui:
      build:
        value: y
        source:
          # MUIO (the OSeMOSYS organisation's GUI); clicSAND's Excel workbook.
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/user-guide/overview.rst
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/README.md
          - https://github.com/OSeMOSYS/clicSAND/blob/v3.0/README.md
      run:
        value: y
        source:
          # MUIO; clicSAND runs data extraction, solve and results conversion from one button;
          # OSeMOSYS Cloud queues and tracks runs in a web UI.
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/user-guide/overview.rst
          - https://github.com/OSeMOSYS/clicSAND/blob/v3.0/FormModelRunner.cs#L26-L90
          - https://github.com/OSeMOSYS/osemosys-cloud/blob/84527effa7b216bf7183d2a105fabcb074945c6b/README.md
      analyse:
        value: y
        source:
          # MUIO results views; OSeMOSYS Cloud results dashboard.
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/user-guide/overview.rst
          - https://github.com/OSeMOSYS/osemosys-cloud-visualization/blob/e28f8dde198240c3430c6b7a42d699209aa632c0/main.py#L60-L90
    api:
      build:
        # Tenuous: otoole's Python API reads/writes/converts model data; there is no API to the
        # model formulation itself.
        value: y
        source:
          - https://otoole.readthedocs.io/en/stable/convert.html
          - https://otoole.readthedocs.io/en/stable/api/otoole.html#otoole.convert.convert
      run:
        # Runs are launched by calling the solver on the model and data files; OSeMOSYS_PuLP
        # scripts must be edited to run. A callable OSeMOSYS_PuLP model is an open PR.
        value: dev
        source:
          - https://github.com/OSeMOSYS/OSeMOSYS_PuLP/pull/20
      analyse:
        # otoole's Python API reads solver results into pandas DataFrames.
        value: y
        source:
          - https://otoole.readthedocs.io/en/stable/convert.html
          - https://otoole.readthedocs.io/en/stable/api/otoole.html#otoole.convert.read_results
    cli:
      build:
        # otoole converts and sets up model data; clewsy builds CLEWs structures.
        value: y
        source:
          - https://otoole.readthedocs.io/en/stable/functionality.html#otoole-convert
          - https://github.com/OSeMOSYS/clewsy/blob/v0.2.3a/src/clewsy/cli.py#L53-L58
          - https://otoole.readthedocs.io/en/stable/functionality.html#otoole-setup
          - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#supporting-programmes-and-documentation
      run:
        value: y
        source:
          # `glpsol -m osemosys.txt -d data.txt -o results.txt`.
          - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#downloading-model-files-and-running-the-model
          - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/README.md
          # OSeMOSYS Global and OSeMOSYS_step run full workflows from the command line.
          - https://osemosys-global.readthedocs.io/en/latest/examples.html#example-1
          - https://github.com/KTH-dESA/OSeMOSYS_step/blob/v0.2.0/README.md#4-run-the-workflow
      analyse:
        # otoole results / viz; osemosys2iamc writes an IAMC report.
        value: y
        source:
          - https://otoole.readthedocs.io/en/stable/functionality.html#otoole-results
          - https://otoole.readthedocs.io/en/stable/functionality.html#otoole-viz
          - https://github.com/OSeMOSYS/osemosys2iamc/blob/v0.2.2/README.md#run-the-package
    solver_configuration:
      # Tenuous: OSeMOSYS has no solver-options layer; the model is solved by glpsol or exported as
      # LP to other solvers, whose options are then set natively.
      value: y
      source:
        - https://osemosys.readthedocs.io/en/latest/manual/Advanced%20functionalities.html#using-osemosys-with-the-solver-cplex
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/scripts/README.md
    remote_execution:
      value: y
      source:
        # OSeMOSYS Cloud solves uploaded runs on AWS EC2 instances, with stop and status controls.
        - https://github.com/OSeMOSYS/osemosys-cloud/blob/84527effa7b216bf7183d2a105fabcb074945c6b/README.md
        - https://github.com/OSeMOSYS/osemosys-cloud/blob/84527effa7b216bf7183d2a105fabcb074945c6b/app/models/ec2/create_instance.rb
        # SLURM batch scripts (kth_hpc_cplex_batchrun.sh, RunHPCNodes.py) are shipped in the
        # release.
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/scripts/README.md
    visualisation:
      charts:
        value: y
        source:
          # MUIO results charts; OSeMOSYS Global plotly capacity and generation charts.
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/user-guide/overview.rst
          - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/visualisation/visualise.py#L102-L260
      network_maps:
        value: y
        source:
          # Schematic RES diagrams (technology / fuel graph) via otoole viz res and MUIO.
          - https://otoole.readthedocs.io/en/stable/functionality.html#otoole-viz
          - https://github.com/OSeMOSYS/MUIO/blob/v5.6/docs/source/user-guide/overview.rst
          # OSeMOSYS Global maps transmission capacity and flows between nodes.
          - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/scripts/osemosys_global/visualisation/visualise.py#L265-L512
          - https://osemosys-global.readthedocs.io/en/latest/examples.html#example-7
      report_templates:
        value: y
        source:
          # clicSAND ships Excel dashboards filled from each run's results; OSeMOSYS Cloud builds
          # a fixed figure dashboard per run.
          - https://github.com/OSeMOSYS/clicSAND/blob/v3.0/Templates/Visualization%20dashboard%20Template%20V.3.xlsm
          - https://github.com/OSeMOSYS/clicSAND/blob/v3.0/converter/python_converter.py
          - https://github.com/OSeMOSYS/osemosys-cloud-visualization/blob/e28f8dde198240c3430c6b7a42d699209aa632c0/app/generate_figure_sets.py
  traceability:
    metadata:
      provenance:
        value: n
        source: []
      units:
        value: n
        source:
          # Units are the user's responsibility (only consistency guidance is given).
          - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#data-and-choices-of-units
      propagation:
        # Tenuous: OSeMOSYS Cloud keeps each run's model file, data file, log and results together.
        value: y
        source:
          - https://github.com/OSeMOSYS/osemosys-cloud/blob/84527effa7b216bf7183d2a105fabcb074945c6b/app/models/run.rb
    run_logs:
      value: y
      source:
        # glpsol logs translation/solve progress; the model prints each input check it performs.
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/src/osemosys.txt#L168-L208
        - https://osemosys.readthedocs.io/en/latest/manual/Create%20a%20model%20in%20OSeMOSYS.html#downloading-model-files-and-running-the-model
    intermediate_access:
      value: n
      source: []
    infeasibility_diagnosis:
      value: y
      source:
        # Documented manual procedure (dummy technologies, relaxing limits) and pre-solve data
        # checks; with Gurobi, OSeMOSYS Global requests an IIS file.
        - https://github.com/OSeMOSYS/osemosys_global/blob/v2.0.0a/workflow/rules/model.smk#L86-L110
        - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#adding-a-dummy-technology
        - https://osemosys.readthedocs.io/en/latest/manual/Debugging%20a%20model.html#upperlimit-and-maxlimit-increase
        - https://github.com/OSeMOSYS/OSeMOSYS_GNU_MathProg/blob/v1.0.1/docs/changelog.md#osemosys-checks-for-basic-errors-in-input-data
