    api:
      build:
        value: y
        source:
          - https://calliope.readthedocs.io/en/v0.7.0/basic/running-python/
          - https://calliope.readthedocs.io/en/v0.7.0/reference/api/model/
          - https://calliope.readthedocs.io/en/v0.7.0/advanced/backend_interface/
