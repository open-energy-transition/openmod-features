          source: []
        unserved_energy:
          value: n
          source: []
        capacity_credit:
          value: n
          source: []
    transformation:
      aggregation:
        value: y
        source:
          # System-wide/total aggregates built in; user-defined `postprocessed` math expressions
          # can aggregate over any dimension or group.
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#total_generation
          - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/components/#postprocessed-expressions
          - https://calliope.readthedocs.io/en/v0.7.0/migrating/#postprocessed-arrays
      disaggregation:
        value: n
        source: []
