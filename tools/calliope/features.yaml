# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against Calliope v0.7.0 (released 1st September 2026).
# Capabilities of the Calliope ecosystem tools Calliope Studio (v0.2.1), Calligraph
# (pre-release v0.1.1.dev7) and calliope-pathways (unreleased, commit 1d20d1f) are counted.
# `dev` entries link to open pull requests, unreleased changes on the default branch,
# or capabilities available only in an unreleased / pre-release ecosystem tool.

version: 'v0.7.0'
features:
  processes:
    boundary_exchange:
      value: y
      source:
        # `supply` techs draw on a costed, bounded `source_use`; `carrier_export` removes a
        # carrier from the system at a cost/revenue.
        - https://calliope.readthedocs.io/en/v0.7.0/basic/techs/#base-techs
        - https://calliope.readthedocs.io/en/v0.7.0/math/base/#source_use
        - https://calliope.readthedocs.io/en/v0.7.0/math/base/#source_availability_supply
        - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#revenues-and-carrier-export
        - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_export
    conversion:
      one_to_one:
        value: y
        source:
          - https://calliope.readthedocs.io/en/v0.7.0/basic/techs/#base-techs
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_conversion
      multi_carrier_io:
        # Tenuous: several carriers in/out of one `conversion` tech are built-in, but the
        # base math only balances their sums; fixing the ratio between co-products (e.g.
        # back-pressure CHP, nuclear waste) needs a short user-defined constraint, which
        # the urban-scale example model ships with.
        value: y
        source:
          - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#multiple-inputoutput-carriers
          - https://calliope.readthedocs.io/en/v0.7.0/examples/urban_scale/#interlude-user-defined-math
          - https://github.com/calliope-project/calliope/blob/v0.7.0/src/calliope/example_models/urban_scale/additional_math.yaml
      flexible_ratio:
        value: y
        source:
          # Built-in: several `carrier_out` with carrier-indexed `flow_out_eff` let the
          # optimiser choose the output split (e.g. a heat pump serving heat and cooling).
          - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#multiple-inputoutput-carriers
          - https://calliope.readthedocs.io/en/v0.7.0/migrating/#carrier_tiers-and-carrier_ratios
          # Extraction-condensing CHP operating regions as a gallery math example.
          - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/chp_htp/
    temporal_transfer:
      value: y
      source:
        - https://calliope.readthedocs.io/en/v0.7.0/basic/techs/#base-techs
        - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_storage
        - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#activating-storage-buffers-in-non-storage-technologies
    spatial_transfer:
      value: y
      source:
        # `transmission` techs between two nodes, bounded by `flow_cap`, with fixed or
        # per-distance efficiency; optionally `one_way`.
        - https://calliope.readthedocs.io/en/v0.7.0/basic/techs/#transmission-technologies
        - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_transmission
        - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#per-distance-transmission-constraints
        - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#one-way-transmission-links
    delayed_transfer:
      value: n
      source: []
    buffered_transfer:
      value: n
      source: []
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source: []
    explicit_demand:
      inelastic:
        value: y
        source:
          # `demand` techs consume a carrier via `flow_in`, fixed by `sink_use_equals` or
          # bounded by `sink_use_min`/`sink_use_max`, and take the same flow constraints as
          # any other tech.
          - https://calliope.readthedocs.io/en/v0.7.0/basic/techs/#base-techs
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_demand
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_demand_min_use
      price_responsive:
        value: n
        source: []
      mobile_storage:
        value: n
        source: []
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: n
          source:
            # Transmission is a transport model: only a flow balance and capacity limit per link.
            - https://calliope.readthedocs.io/en/v0.7.0/math/base/#balance_transmission
        ac_opf:
          value: n
          source: []
        unbalanced_flows:
          value: n
          source: []
      sensitivity_limits:
        ptdf:
          value: n
          source: []
        outage_factors:
          value: n
          source: []
        generic_constraints:
          value: n
          source: []
      network_limits:
        thermal:
          value: n
          source: []
        phase_angle:
          value: n
          source: []
      losses:
        value: n
        source:
          # Transmission losses are a fixed (optionally per-distance) efficiency only.
          - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#per-distance-transmission-constraints
      network_devices:
        transformers:
          value: n
          source: []
        facts_devices:
          value: n
          source: []
        hvdc_converters:
          value: n
          source: []
    hydraulic_flow:
      linearised_flow:
        value: n
        source: []
      composition_tracking:
        value: n
        source: []
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          # Capacities given as inputs in `operate` mode, or fixed via equal `_min`/`_max` bounds.
          - https://calliope.readthedocs.io/en/v0.7.0/basic/modes/#operate-mode
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/operate/
          - https://calliope.readthedocs.io/en/v0.7.0/migrating/#_equals-constraints
      continuous_capacity:
        value: y
        source:
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_cap
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_cap_max
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#storage_cap
      integer_investment_exogenous_capacity:
        value: y
        source:
          # `cap_method: integer` with `flow_cap_per_unit`: integer `purchased_units` of fixed size.
          - https://calliope.readthedocs.io/en/v0.7.0/examples/milp/#purchased-units
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#purchased_units
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#flow_capacity_units_milp
      integer_investment_continuous_capacity:
        value: y
        source:
          # `purchased_units_max: 1` gives a binary purchase decision alongside a continuous `flow_cap`.
          - https://calliope.readthedocs.io/en/v0.7.0/examples/milp/#purchase-cost
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#flow_capacity_max_purchase_milp
      multi_period:
        # Tenuous: only in calliope-pathways, an unreleased (no tagged release), stale
        # ecosystem package last updated 2024-10 (commit 1d20d1f) and written against
        # Calliope 0.7.0.dev3. It indexes capacity over `investsteps` with new capacity per
        # `vintagesteps`. Core Calliope v0.7.0 has a single investment period.
        value: dev
        source:
          - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/README.md#build-your-own-model
          - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/math/pathways.yaml#L143
          - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/math/pathways.yaml#L264
      retrofit:
        value: n
        source: []
      endogenous_retirement:
        value: n
        source: []
    operation:
      unit_commitment:
        value: y
        source:
          # `integer_dispatch: true` adds integer `operating_units` per timestep, bounding
          # flows by the committed units.
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#operating_units
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#unit_commitment_milp
          - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#flow_out_max_milp
          - https://calliope.readthedocs.io/en/v0.7.0/troubleshooting/#complex-technologies
      maintenance_scheduling:
        # Tenuous: only as a gallery math example, which lets a unit-committed tech choose a
        # number of offline timesteps; the downtime cannot be forced to be consecutive.
        value: y
        source:
          - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/uptime_downtime_limits/
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            value: y
            source:
              # Single investment period: `flow_cap_min`/`_max`, `storage_cap_min`/`_max` and
              # `purchased_units_min`/`_max` bound the capacity or number of units built.
              - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_cap_min
              - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_cap_max
              - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#purchased_units_min
              - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#purchased_units_max
              # Per-vintage `flow_cap_new_max` in unreleased calliope-pathways (commit 1d20d1f).
              - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/config/new_param_schema.yaml#L2
          operation:
            availability_derating:
              value: y
              source:
                # Time-varying `source_use_max`/`source_use_equals` (e.g. renewable capacity factors),
                # `flow_out_parasitic_eff`, and `storage_discharge_depth` on stored level; a gallery
                # example adds a time-varying fraction of `flow_cap`.
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#source_availability_supply
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_out_max
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#storage_discharge_depth_limit
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/max_time_varying/
            minimum_stable_level:
              value: y
              source:
                # `flow_out_min_relative` applied only to committed `operating_units`.
                - https://calliope.readthedocs.io/en/v0.7.0/examples/milp/#purchased-units
                - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#flow_out_min_milp
            forced_offline:
              # Tenuous: via the gallery `downtime_period` constraint (outflow forced to zero in
              # user-flagged timesteps), not built-in math.
              value: y
              source:
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/uptime_downtime_limits/
            forced_online:
              # Tenuous: no must-run flag; a time-varying `flow_out_min_relative` forces a tech to
              # operate at or above that fraction of its capacity in the chosen timesteps.
              value: y
              source:
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_out_min
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_out_min_relative
                - https://calliope.readthedocs.io/en/v0.7.0/migrating/#indexing-parameters-over-arbitrary-dimensions
        sequential:
          investment:
            availability_window:
              # Tenuous: only in unreleased, stale calliope-pathways (commit 1d20d1f, 2024-10),
              # where a zero per-vintage `flow_cap_new_max` stops build-out in chosen investment
              # steps; there is no dedicated lead-time / commissioning-date parameter.
              value: dev
              source:
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/config/new_param_schema.yaml#L2
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/math/pathways.yaml#L264
            relative_build_rate:
              # Tenuous: only in unreleased, stale calliope-pathways (commit 1d20d1f, 2024-10):
              # `flow_cap_new_max_rate` limits new capacity relative to the previous step's
              # installed capacity.
              value: dev
              source:
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/math/pathways.yaml#L201
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/config/new_param_schema.yaml#L94
            technical_lifetime:
              # Tenuous: only in unreleased, stale calliope-pathways (commit 1d20d1f, 2024-10):
              # user-supplied `available_vintages` fractions remove each vintage's capacity after
              # its lifetime. In core Calliope, `lifetime` only annualises investment costs.
              value: dev
              source:
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/README.md#build-your-own-model
                - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/math/pathways.yaml#L143
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#lifetime
          operation:
            ramping:
              value: y
              source:
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_ramping
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#ramping_up
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#ramping_down
            start_shut_trajectory:
              value: n
              source: []
            commitment_duration:
              value: n
              source:
                # Not in built-in or gallery math; a user-defined minimum up/down time formulation
                # is blocked by `sum_next_n`/`roll` not accepting parameter offsets.
                - https://github.com/calliope-project/calliope/issues/827
            start_consumption:
              value: n
              source: []
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # System-wide capacity and unit bounds at nameplate; no built-in de-rating /
                # capacity-credit (reserve margin) constraint in v0.7.
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_capacity_systemwide_max
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_capacity_systemwide_min
                - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#unit_capacity_max_systemwide_milp
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#area_use_capacity_per_loc
            expansion_budget:
              value: n
              source: []
            event_count:
              value: n
              source: []
            path_dependent:
              value: n
              source: []
          operation:
            flow_volume:
              # Tenuous: via gallery math examples (annual out-/in-flow and source-use limits,
              # minimum/maximum annual capacity factor), not built-in math.
              value: y
              source:
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/annual_energy_balance/
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/uptime_downtime_limits/
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/share_all_timesteps/
            impact_budget:
              # Tenuous: the migration guide shows defining an `emissions_limit` parameter over the
              # `costs` dimension "that you might use to limit the total emissions", but the
              # constraint itself is left for the user to write; it is not in the math gallery.
              value: n
              source:
                # Non-carrier quantities (e.g. CO2) are tracked as extra `costs` classes, which can
                # be weighted in the objective but have no built-in or gallery cap.
                - https://calliope.readthedocs.io/en/v0.7.0/math/base/#min_cost_optimisation-active
                - https://calliope.readthedocs.io/en/v0.7.0/migrating/#group-constraints
                - https://calliope.readthedocs.io/en/v0.7.0/migrating/#defining-parameters-outside-the-scope-of-nodes-and-techs
            event_count:
              value: n
              source: []
            state_duration:
              # Tenuous: gallery example `downtime_period_decision` caps the weighted sum of
              # `operating_units` over the horizon (an operating-hours limit) for unit-committed techs.
              value: y
              source:
                - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/uptime_downtime_limits/
            path_dependent:
              value: n
              source: []
        boundary_conditions:
          investment:
            # Tenuous: only in unreleased, stale calliope-pathways (commit 1d20d1f, 2024-10),
            # via `flow_cap_initial` (etc.) phased out by `available_initial_cap`. Core
            # Calliope has no existing stock distinct from new build: a `flow_cap_min` lower
            # bound is still charged investment cost.
            value: dev
            source:
              - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/README.md#build-your-own-model
              - https://github.com/calliope-project/calliope-pathways/blob/1d20d1f3d1f1937ad296fd910517f061e286e1a6/src/calliope_pathways/config/new_param_schema.yaml#L58
          operation:
            value: y
            source:
              # `storage_initial` sets the start (and, with cyclic storage, end) stored level.
              - https://calliope.readthedocs.io/en/v0.7.0/math/base/#storage_initial
              - https://calliope.readthedocs.io/en/v0.7.0/math/base/#set_storage_initial
              - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#cyclic-storage
      spatial:
        investment:
          value: y
          source:
            # `flow_cap_max_systemwide` / `purchased_units_max_systemwide` sum over all nodes.
            - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_capacity_systemwide_max
            - https://calliope.readthedocs.io/en/v0.7.0/math/built_in/milp/#unit_capacity_max_systemwide_milp
        operation:
          # Tenuous: via gallery math examples (system-wide annual flow limits, net import
          # share over a node group), not built-in math.
          value: y
          source:
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/annual_energy_balance/
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/net_import_share/
      assets:
        spanning:
          investment:
            value: y
            source:
              # `available_area` shared by all techs at a node (land-use competition); combined
              # capacity limits over tech groups via user-defined math.
              - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#area-use-constraints
              - https://calliope.readthedocs.io/en/v0.7.0/math/base/#area_use_capacity_per_loc
          operation:
            # Tenuous: via gallery math examples (combined multi-tech annual flow limits,
            # supply/demand share constraints), not built-in math.
            value: y
            source:
              - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/annual_energy_balance/
              - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/share_per_timestep/
              - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/demand_share_per_timestep_decision/
        dedicated_flow_routing:
          # Tenuous: no routing constraint as such, but carriers are user-named, so a carrier
          # produced by one tech and consumed only by named others is reserved for them;
          # `include_storage` adds an in-asset stockpile before conversion.
          value: y
          source:
            - https://calliope.readthedocs.io/en/v0.7.0/getting_started/concepts/#calliope-terminology-how-the-world-is-represented-in-calliope
            - https://calliope.readthedocs.io/en/v0.7.0/advanced/constraints/#activating-storage-buffers-in-non-storage-technologies
    functional_form:
      linear_multi_variable:
        investment:
          value: y
          source:
            # Storage energy-to-power ratio envelope (`flow_cap_per_storage_cap_min`/`_max`);
            # area use tied to capacity.
            - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_capacity_per_storage_capacity_min
            - https://calliope.readthedocs.io/en/v0.7.0/math/base/#flow_capacity_per_storage_capacity_max
            - https://calliope.readthedocs.io/en/v0.7.0/math/base/#area_use_per_flow_capacity
        operation:
          value: y
          source:
            # Arbitrary linear constraints via user-defined math, e.g. CHP operating regions.
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/examples/chp_htp/
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/components/#constraints
      quadratic:
        investment:
          value: n
          source:
            # "Calliope is a _linear_ modelling framework."
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/
        operation:
          value: n
          source:
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/
      nonlinear:
        investment:
          value: n
          source:
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/
        operation:
          value: n
          source:
            - https://calliope.readthedocs.io/en/v0.7.0/user_defined_math/
    reliability:
      unserved_demand:
        value: y
        source:
          # `ensure_feasibility` adds `unmet_demand` / `unused_supply` penalised at `bigM`,
          # which the docs frame as a debugging aid rather than a VOLL.
          - https://calliope.readthedocs.io/en/v0.7.0/basic/config/#configbuildensure_feasibility
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#unmet_demand
          - https://calliope.readthedocs.io/en/v0.7.0/math/base/#bigm
