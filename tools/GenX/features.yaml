# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against GenX v0.4.5 (released 11th July 2025), the latest tagged and registered release.
# (A v0.4.6 hotfix with no new features is on `main` but untagged, and has no versioned docs.)
# `dev` entries link to open pull requests or unreleased changes on the `develop` branch.

version: 'v0.4.5'
features:
  processes:
    boundary_exchange:
      value: y
      source:
        # Fuels enter the system at a time-varying price with unlimited availability.
        - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.1-Fuels_data.csv
        - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
    conversion:
      one_to_one:
        value: y
        source:
          # Thermal plants (fuel -> electricity via heat rate); electrolysers
          # (electricity -> hydrogen).
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal/
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/electrolyzers/
      multi_carrier_io:
        value: y
        source:
          # Multi-fuel thermal plants burn several fuels at once; Allam cycle plants
          # couple fuel, electricity and (liquid) oxygen flows.
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6a:-Additional-columns-in-the-Thermal.csv-file
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/allam_cycle/
      flexible_ratio:
        value: y
        source:
          # Multi-fuel blending: the share of each fuel is a decision variable bounded by
          # `Fuel*_Min_Cofire_Level` / `Fuel*_Max_Cofire_Level`.
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6a:-Additional-columns-in-the-Thermal.csv-file
    temporal_transfer:
      value: y
      source:
        - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/storage/
        - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/hydro_res/
        - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/long_duration_storage/
    spatial_transfer:
      value: y
      source:
        # Inter-zonal transport model bounded by `Line_Max_Flow_MW` (plus expansion).
        - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
        - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.2-Network.csv
    delayed_transfer:
      value: n
      source: []
    buffered_transfer:
      value: n
      source: []
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source: []
    explicit_demand:
      inelastic:
        # Tenuous: zonal demand is an exogenous profile in the power balance. Demand
        # processes with their own constraints exist as `Flex_demand` (deferrable demand
        # with delay/advance limits) and electrolysers (minimum annual production).
        value: y
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/flexible_demand/
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/electrolyzers/
      price_responsive:
        value: y
        source:
          # Demand curtailment segments with their own cost and maximum share form a
          # stepwise demand curve; electrolysers consume against a hydrogen price.
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.3-Demand_data.csv-(Load_data.csv)
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Non-served-Energy
          - https://genxproject.github.io/GenX.jl/v0.4.5/limitations_genx/#7.-Demand
      mobile_storage:
        value: n
        source: []
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: y
          source:
            # `DC_OPF: 1` adds B-theta flow constraints between zones.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
            - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_configuration/#4.-Network-related
            - https://github.com/GenXProject/GenX.jl/tree/v0.4.5/example_systems/10_IEEE_9_bus_DC_OPF
        ac_opf:
          value: n
          source: []
        unbalanced_flows:
          value: n
          source: []
      sensitivity_limits:
        ptdf:
          # A PTDF-based formulation is being tested alongside Benders decomposition but
          # has no open PR yet (issue #861).
          value: n
          source:
            - https://github.com/GenXProject/GenX.jl/issues/861
        outage_factors:
          value: n
          source: []
        generic_constraints:
          value: n
          source: []
      network_limits:
        thermal:
          value: y
          source:
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
            - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.2-Network.csv
        phase_angle:
          value: y
          source:
            # `Angle_Limit_Rad` per line in the DC-OPF formulation.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
            - https://github.com/GenXProject/GenX.jl/blob/v0.4.5/src/load_inputs/load_network_data.jl
      losses:
        value: y
        source:
          # `Trans_Loss_Segments >= 2` gives a piecewise-linear approximation of quadratic
          # (I^2R) losses from line resistance and voltage.
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_configuration/#4.-Network-related
      network_devices:
        transformers:
          value: n
          source: []
        facts_devices:
          value: n
          source: []
        hvdc_converters:
          value: n
          source: []
    hydraulic_flow:
      linearised_flow:
        value: n
        source: []
      composition_tracking:
        value: n
        source: []
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          # `New_Build = 0`, `Can_Retire = 0` with `Existing_Cap_MW`.
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-5a:-Columns-in-resource-.csv-files-that-are-common-to-all-resources
      continuous_capacity:
        value: y
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Discharge
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-5a:-Columns-in-resource-.csv-files-that-are-common-to-all-resources
      integer_investment_exogenous_capacity:
        value: y
        source:
          # With `UCommit = 1`, new, retired and retrofitted capacity of committed
          # resources is an integer number of `Cap_Size` units.
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Unit-Commitment
          - https://github.com/GenXProject/GenX.jl/blob/v0.4.5/src/model/core/ucommit.jl
      integer_investment_continuous_capacity:
        value: n
        source: []
      multi_period:
        value: y
        source:
          # Perfect-foresight multi-stage planning (solved by dual dynamic programming).
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/multi_stage_input/
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Multi_Stage/multi_stage_overview/
      retrofit:
        value: y
        source:
          # `Can_Retrofit` / `Retrofit_Id` / `Retrofit_Efficiency`: retired source capacity
          # is replaced by retrofit options (e.g. CCS, fuel switching).
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/retrofit/
          - https://github.com/GenXProject/GenX.jl/tree/v0.4.5/example_systems/9_three_zones_w_retrofit
      endogenous_retirement:
        value: y
        source:
          # `Can_Retire = 1` makes retirement of existing capacity a decision variable.
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-5a:-Columns-in-resource-.csv-files-that-are-common-to-all-resources
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Discharge
    operation:
      unit_commitment:
        value: y
        source:
          # Clustered integer (`UCommit = 1`) or linearised (`UCommit = 2`) commitment.
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_commit/
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Unit-Commitment
      maintenance_scheduling:
        value: y
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/maintenance/
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            value: y
            source:
              # Multi-stage: `Min_Retired_Cap_MW` forces retirements within a stage and
              # `Line_Max_Reinforcement_MW` caps line expansion per stage.
              - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/multi_stage_input/#Additional-inputs-needed-for-multi-stage-modeling
              - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.2-Network.csv
          operation:
            availability_derating:
              value: y
              source:
                # Time-varying capacity factors per resource in `Generators_variability.csv`.
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.5-Generator_variability.csv
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/curtailable_variable_renewable/
            minimum_stable_level:
              value: y
              source:
                # `Min_Power` applied to the commitment state.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_commit/
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6a:-Additional-columns-in-the-Thermal.csv-file
            forced_offline:
              value: y
              source:
                # Zero availability in `Generators_variability.csv`, or maintenance windows
                # (optimised, or pre-scheduled via the documented hint).
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/maintenance/#Hint:-pre-scheduling-maintenance
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.5-Generator_variability.csv
            forced_online:
              value: y
              source:
                # Must-run resources produce exactly availability x capacity.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/must_run/
        sequential:
          investment:
            availability_window:
              # Tenuous: no build-window parameter. Each multi-stage stage has its own input
              # folder, so `New_Build` can be switched off in chosen stages.
              value: y
              source:
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/multi_stage_input/#Input-data-files
            relative_build_rate:
              value: n
              source: []
            technical_lifetime:
              value: y
              source:
                # `Lifetime` enforces endogenous retirement of new builds in later stages.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Multi_Stage/endogenous_retirement/
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/multi_stage_input/#Additional-inputs-needed-for-multi-stage-modeling
          operation:
            ramping:
              value: y
              source:
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_commit/
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_no_commit/
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/hydro_res/
            start_shut_trajectory:
              # Units starting/shutting may move by max(`Min_Power`, ramp rate) in the
              # transition step; there is no separate start-up/shut-down trajectory input.
              value: n
              source:
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_commit/
            commitment_duration:
              value: y
              source:
                # `Up_Time` / `Down_Time`; fusion `max_up_time` caps pulse length.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/thermal_commit/
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/fusion/#Hourly-scale-pulsed-operational-behavior
            start_consumption:
              value: y
              source:
                # `Start_Fuel_MMBTU_per_MW` per start (single- or multi-fuel).
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6b:-Settings-specific-columns-in-the-Thermal.csv-file
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # Minimum/maximum capacity requirements over sets of resources and zones;
                # capacity reserve margin on de-rated capacity; per-resource Max/Min_Cap_MW.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Minimum-Capacity-Requirement
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Maximum-Capacity-Requirement
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Capacity-Reserve-Margin
            expansion_budget:
              value: n
              source: []
            event_count:
              value: n
              source: []
            path_dependent:
              value: n
              source: []
          operation:
            flow_volume:
              value: y
              source:
                # Annual minimum hydrogen production; energy share requirements; fusion
                # maximum full-power-years per year.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Hydrogen-Production-Demand-Requirement-(Electrolyzer)
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Energy-Share-Requirement
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/fusion/#Max-FPY-per-year-constraint
            impact_budget:
              value: y
              source:
                # Mass- or rate-based CO2 caps. CO2 is the only non-carrier quantity tracked.
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#CO_2-Constraint-Policy
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#2.3-CO2_cap.csv
            event_count:
              # Only for fusion plants: `max_starts` limits pulse starts per year.
              value: y
              source:
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/fusion/#Pulses-are-stressful
            state_duration:
              value: n
              source: []
            path_dependent:
              value: n
              source: []
        boundary_conditions:
          investment:
            value: y
            source:
              # Brownfield stock via `Existing_Cap_MW` (and energy/charge equivalents).
              - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-5a:-Columns-in-resource-.csv-files-that-are-common-to-all-resources
          operation:
            # Storage and commitment states wrap cyclically within each period; there are
            # no inputs for initial or final operating states.
            value: n
            source:
              - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/storage/
      spatial:
        investment:
          value: y
          source:
            # Min/max capacity requirements and capacity reserve margins span sets of zones.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Minimum-Capacity-Requirement
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Capacity-Reserve-Margin
        operation:
          value: y
          source:
            # CO2 caps and energy share requirements can span several zones with trading.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#CO_2-Constraint-Policy
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Energy-Share-Requirement
      assets:
        spanning:
          investment:
            value: y
            source:
              # Eligible resources are tagged per requirement in the `policy_assignments` files.
              - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Minimum-Capacity-Requirement
              - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Policy-related-columns-for-all-resources
          operation:
            value: y
            source:
              # Energy share requirements over qualifying resources; CO2 caps; hourly
              # clean-supply matching for electrolysers.
              - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Energy-Share-Requirement
              - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/policies/#Hourly-clean-supply-matching-constraint
        dedicated_flow_routing:
          # Hydro cascades linking reservoirs are an open PR. (Co-located VRE-storage
          # resources route DC output to on-site storage, but only within one resource.)
          value: dev
          source:
            - https://github.com/GenXProject/GenX.jl/pull/911
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/vre_stor/
    functional_form:
      linear_multi_variable:
        investment:
          value: y
          source:
            # Storage `Min_Duration` / `Max_Duration` energy-to-power envelopes; retrofit
            # capacity exchange rates; co-located VRE-storage component ratios.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/storage/
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Resources/retrofit/
        operation:
          value: y
          source:
            # Multi-fuel cofiring bounds link fuel-use and power variables.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
      quadratic:
        investment:
          value: n
          source: []
        operation:
          value: n
          source: []
      nonlinear:
        investment:
          value: n
          source: []
        operation:
          value: y
          source:
            # Piecewise-linear part-load heat rate (fuel use) curves; piecewise-linearised
            # quadratic transmission losses.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Transmission
    reliability:
      unserved_demand:
        value: y
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Non-served-Energy
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#1.3-Demand_data.csv-(Load_data.csv)
      operating_reserve:
        online_headroom:
          value: y
          source:
            # Regulation and upward spinning/contingency reserves, with a penalty for
            # unmet reserves.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Operational-Reserves
            - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#2.1-Operational_reserves.csv
        standby_capability:
          value: n
          source: []
        inertia:
          value: n
          source: []
      contingency_constrained:
        # The reserve requirement can be sized to the largest installed or committed unit,
        # but no post-contingency dispatch or network state is modelled.
        value: n
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Operational-Reserves
      probabilistic_reliability_limit:
        loss_of_load:
          value: n
          source: []
        unserved_energy:
          value: n
          source: []
    soft_constraints:
      # Slack variables with a price cap exist only for the five policy constraint types
      # (CRM, CO2, ESR, min/max capacity); there is no generic mechanism.
      value: n
      source:
        - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/slack_variables_overview/
  cost:
    scope:
      temporal:
        sequential:
          investment:
            value: n
            source: []
          operation:
            ramping:
              value: n
              source: []
            start_up:
              value: y
              source:
                - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Unit-Commitment
                - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6b:-Settings-specific-columns-in-the-Thermal.csv-file
            shut_down:
              value: n
              source: []
            start_state_dependent:
              value: n
              source: []
        cumulative:
          investment:
            value: n
            source: []
          operation:
            value: n
            source: []
      spatial:
        investment:
          value: n
          source: []
        operation:
          # Policy slack penalties price the violation of a multi-zone cap, but are not a
          # general cost term on aggregated quantities.
          value: n
          source:
            - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/slack_variables_overview/
      assets:
        investment:
          value: n
          source: []
        operation:
          value: n
          source: []
    functional_form:
      fixed_charge:
        investment:
          value: n
          source: []
        operation:
          # Tenuous: no explicit no-load cost parameter. With piecewise fuel usage and unit
          # commitment, the zero-load fuel intercept is multiplied by the commitment state,
          # giving a fuel cost per committed timestep irrespective of output.
          value: y
          source:
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
            - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/model_input/#Table-6a:-Additional-columns-in-the-Thermal.csv-file
      nonlinear:
        investment:
          value: n
          source: []
        operation:
          value: y
          source:
            # Piecewise-linear heat-rate curves make fuel cost per MWh vary with output.
            - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/core/#Fuel
            - https://github.com/GenXProject/GenX.jl/tree/v0.4.5/example_systems/5_three_zones_w_piecewise_fuel
      threshold_deviation:
        investment:
          value: n
          source: []
        operation:
          value: n
          source: []
    time_value:
      annuitisation:
        # Tenuous: single-stage runs take pre-annualised `Inv_Cost_per_MWyr` inputs. In
        # multi-stage runs `WACC` and `Capital_Recovery_Period` convert annuities into the
        # capital cost incurred within the horizon.
        value: y
        source:
          - https://genxproject.github.io/GenX.jl/v0.4.5/Model_Reference/Multi_Stage/configure_multi_stage_inputs/
          - https://genxproject.github.io/GenX.jl/v0.4.5/limitations_genx/#2.-Cost
      fiscal_treatment:
        # Investment and production incentive (tax credit) inputs are an open PR.
        value: dev
        source:
          - https://github.com/GenXProject/GenX.jl/pull/877
          - https://github.com/GenXProject/GenX.jl/issues/874
      period_discounting:
        value: y
        source:
          # Multi-stage `WACC` setting is the social discount rate between stages.
          - https://genxproject.github.io/GenX.jl/v0.4.5/User_Guide/multi_stage_input/#Settings-Files
