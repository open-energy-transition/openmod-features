          - https://github.com/assume-framework/assume/blob/v0.6.0/assume/scenario/loader_oeds.py
      output:
        # Results are written to SQLite or PostgreSQL/TimescaleDB.
        value: y
        source:
          - https://github.com/assume-framework/assume/blob/v0.6.0/docs/source/outputs.rst
    remote_storage:
      input:
        value: n
        source: []
      output:
        value: n
        source: []
    lazy_loading:
      input:
        value: n
        source: []
