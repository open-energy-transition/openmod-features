        # Results can be exported as CSV files (`-csv` / `csv_export_path`).
        value: y
        source:
          - https://github.com/assume-framework/assume/blob/v0.6.0/docs/source/outputs.rst
          - https://github.com/assume-framework/assume/blob/v0.6.0/assume/common/outputs.py
