  orchestration:
    scenario_runs:
      value: n
      source: []
    sampled_runs:
      value: n
      source: []
    coupled_models:
      limited_foresight:
        investment:
          value: n
          source: []
        operation:
          value: n
          source: []
      fidelity_sequence:
        value: n
        source: []
      market_sequence:
        # Several markets (e.g. capacity reserve then energy-only market, followed by redispatch) run in one simulation with dispatch results passed between stages.
        value: y
        source:
          - https://github.com/assume-framework/assume/blob/v0.6.0/docs/source/market_config.rst
          - https://github.com/assume-framework/assume/blob/v0.6.0/docs/source/redispatch_modeling.rst
      convergence_iteration:
        value: n
        source: []
  io:
    plain_text:
      input:
        # Scenarios are defined by a `config.yaml` plus CSV files for units and time series.
        value: y
        source:
          - https://github.com/assume-framework/assume/blob/v0.6.0/docs/source/scenario_loader.rst
          - https://github.com/assume-framework/assume/blob/v0.6.0/assume/scenario/loader_csv.py
