          # Node Congestion Charge: congestion component of the LMP.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Node.CongestionCharge.html
          # Node Marginal Loss Charge: marginal loss component of the LMP.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Node.MarginalLossCharge.html
        price_formation:
          value: y
          source:
          # Uplift: ex-post adder to marginal-cost prices so no generator makes a loss on start/no-load costs.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Article.Uplift.html
          # Uniform Pricing: single market price computed by re-solving with transmission limits and losses relaxed.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Article.UniformPricing.html
        water_value:
          value: y
          source:
          # Diagnostic Future Cost Function: writes the water value surface (cuts) from MT Schedule, readable as a Data File.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Diagnostic.FutureCostFunction.html
        asset_accounts:
          value: y
          source:
          # Generator Net Profit: net revenue minus fixed costs per generator.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Generator.NetProfit.html
        contract_settlement:
          value: y
          source:
          # Financial Contract: CfDs, forwards; key outcome is the Settlement flowing back to companies.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Main.FinancialContract.html
          # Transmission Right: FTRs as financial contracts on nodal price differentials.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Main.TransmissionRight.html
        levelised_cost:
          value: y
          source:
          # Generator Levelized Cost: average net present cost of generation over the facility lifetime.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Generator.LevelizedCost.html
        net_present_value:
          value: y
          source:
          # Diagnostic NPV: writes LT Plan optimal solution costs in NPV terms.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Diagnostic.NPV.html
      impact_assessment:
        emissions:
          value: y
          source:
          # Emission Production: production of the emission from modelled activity.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Emission.Production.html
        resource_use:
          value: y
          source:
          # Generator Water Consumption: water consumed by the generator (e.g. evaporative cooling losses).
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Generator.WaterConsumption.html
          # Generator Water Offtake: water recycled through the generator (e.g. for cooling).
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Generator.WaterOfftake.html
        socioeconomic:
          # No socioeconomic (e.g. employment) output properties found.
          value: n
          source: []
      network_transfer_metrics:
        transfer_capacity:
          value: y
          source:
          # Interface Available Transfer Capability: remaining transfer capability on the interface.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Interface.AvailableTransferCapability.html
          # Diagnostic ATC Reports: writes ATC min/max and most limiting elements.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Diagnostic.ATCReports.html
        flow_sensitivity:
          value: y
          source:
          # Diagnostic Shift Factors: writes all computed shift factors (PTDF) to text files.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Diagnostic.ShiftFactors.html
      probabilistic_reliability_assessment:
        loss_of_load:
          value: y
          source:
          # Region LOLP: loss of load probability.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Region.LOLP.html
          # LOLP Statistics, Reliability Indices: LOLP, LOLE and related indices.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Article.LOLP.html#2
        unserved_energy:
          value: y
          source:
          # Region EENS: expected energy not served.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Region.EENS.html
        capacity_credit:
          # FLAG: PLEXOS computes Effective Firm Capacity (EFC), an ELCC-equivalent measured on unserved energy or hours, via repeated full simulations.
          value: y
          source:
          # Reliability class: EFC is firm capacity that maintains the same level of unserved energy.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Main.Reliability.html
          # Reliability Firm Capacity Contribution: EFC result output.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Reliability.FirmCapacityContribution.html
    transformation:
