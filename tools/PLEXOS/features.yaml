          # Interface Hours Congested: number of hours the interface is congested.
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Interface.HoursCongested.html
        curtailment:
          value: y
          source:
          # Generator Capacity Curtailed: MAX(0, No Cost Capacity - Generation).
          - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Generator.CapacityCurtailed.html
          # Generator Curtailment Factor: proportion of non-positive-priced generation curtailed.
