        # Solution Comparison: two queries on the same or different solutions compared side by side.
        - https://web.archive.org/web/20260305004434/https://portal.energyexemplar.com/unified-help/plexos-desktop/Article.PLEXOS7UserInterfaceGuideChapter12.html#29
