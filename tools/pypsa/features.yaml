# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/0cd1a85/schema/tool-schema.yaml

# Assessed against PyPSA v1.3.0 (released 19th August 2026).
# `dev` entries link to the open pull request or to an unreleased `master` change.

features:
  processes:
    boundary_exchange:
      value: y
      source:
        # `Generator` as supply from outside the system boundary; `Load` with inverted
        # sign as an export. Volume/availability bounded by `e_sum_max` / `p_max_pu`.
        - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/loads/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#volume-limits
    conversion:
      one_to_one:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
          - https://docs.pypsa.org/v1.3.0/user-guide/components/processes/
      multi_carrier_io:
        value: y
        source:
          # `bus2`/`efficiency2`... on `Link` and `rate0`/`rate1`... on `Process` give
          # several in-/out-flows at fixed ratio to the reference flow.
          - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
          - https://docs.pypsa.org/v1.3.0/user-guide/components/processes/
          - https://docs.pypsa.org/v1.3.0/examples/chp-fixed-heat-power-ratio/
          - https://docs.pypsa.org/v1.3.0/examples/biomass-synthetic-fuels-carbon-management/
      flexible_ratio:
        value: y
        source:
          # Extraction-condensing CHP: the heat/power ratio is freed by custom linear
          # constraints describing the feasible operating region.
          - https://docs.pypsa.org/v1.3.0/examples/power-to-gas-boiler-chp/
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
    temporal_transfer:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/stores/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/storage-units/
    spatial_transfer:
      value: y
      source:
        # `Link` is a controllable transport-model flow between buses (NTCs, HVDC).
        - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
    delayed_transfer:
      value: y
      source:
        # `delay`/`cyclic_delay` on `Link` and `delay0`/`delay1`... on `Process`.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/energy-balance/
        - https://docs.pypsa.org/v1.3.0/examples/transport-delay/
        - https://docs.pypsa.org/v1.3.0/examples/chained-hydro-reservoirs/
    buffered_transfer:
      value: n
      source: []
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source:
        # FAQ: district heating is only represented "at a high level of abstraction ...
        # Detailed hydraulic or temperature-dependent physics are not represented".
        - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-pypsa-model-district-heating-networks
        - https://github.com/PyPSA/PyPSA/issues/577
    explicit_demand:
      inelastic:
        value: y
        source:
          # `Load` is balanced at its bus like any other component; shiftable demand is
          # built by pairing a `Load` with a `Store`/`StorageUnit`, or by a `Generator`
          # with `sign=-1` which carries the full set of dispatch constraints.
          - https://docs.pypsa.org/v1.3.0/user-guide/components/loads/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-you-model-market-clearing-in-pypsa
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/energy-balance/
      price_responsive:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/examples/demand-elasticity/
          - https://docs.pypsa.org/v1.3.0/examples/demand-supply-bids/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#how-is-demand-modelled
      mobile_storage:
        # Tenuous: PyPSA has no dedicated mobile-storage component. The documented
        # pattern is a `Store` on a dedicated bus with a charging `Link` whose
        # time-varying `p_max_pu` encodes when the vehicle is connected; the attachment
        # point itself is fixed rather than varying in space.
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/examples/battery-electric-vehicle-charging/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#is-electric-vehicle-charging-and-v2g-handled-endogenously
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
            - https://docs.pypsa.org/v1.3.0/examples/ac-dc-lopf/
        ac_opf:
          # Tenuous: PyPSA's LOPF is the linearised (DC) formulation applied to AC
          # networks, optionally extended with a piecewise-linearised quadratic loss
          # term. There is no linearised-AC formulation carrying voltage magnitudes or
          # reactive power in the optimisation - the FAQ states only linear power flow
          # constraints can enter `n.optimize()`.
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#linear-loss-approximation
            - https://docs.pypsa.org/v1.3.0/home/features/
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-pypsa-model-ac-power-flow
      sensitivity_limits:
        ptdf:
          # PTDF matrices can be computed (`sn.calculate_PTDF()`) but there is no
          # built-in mechanism to constrain flows with them; flow-based market coupling
          # is an open PR and a roadmap item.
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1897
            - https://github.com/PyPSA/PyPSA/pull/1932
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_PTDF
        outage_factors:
          value: y
          source:
            # SCLOPF constrains post-outage flows with the BODF/LODF matrix.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/contingencies/#n-1-security-constraints-for-sclopf
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_BODF
        generic_constraints:
          # No built-in generic transmission constraint component; user-supplied
          # sensitivity coefficients would have to be applied through custom math.
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1897
      network_limits:
        thermal:
          value: y
          source:
            # `s_nom` with static or time-varying `s_max_pu` (e.g. dynamic line rating).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
            - https://docs.pypsa.org/v1.3.0/user-guide/components/lines/
        phase_angle:
          # Tenuous: the cycle-based KVL formulation carries no bus voltage-angle
          # variables, so no angle-difference limit can be imposed. Angle differences
          # can only be checked after the fact with `n.lpf()`.
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
            - https://docs.pypsa.org/v1.3.0/user-guide/troubleshooting/#power-flow-convergence
      network_devices:
        transformers:
          value: y
          source:
            # Tap ratio and fixed or optimised phase shift (PSTs, new in v1.3.0).
            - https://docs.pypsa.org/v1.3.0/user-guide/components/transformers/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#phase-shifting-transformers-psts
            - https://docs.pypsa.org/v1.3.0/examples/transformer-example/
        facts_devices:
          value: n
          source: []
        hvdc_converters:
          value: y
          source:
            # `Link` represents point-to-point HVDC links and AC/DC converter stations.
            - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
            - https://docs.pypsa.org/v1.3.0/examples/ac-dc-lopf/
      unbalanced_flows:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1706
    hydraulic_flow:
      linearised_flow:
        value: n
        source:
          # Pipeline carriers are modelled as transport links with linear losses; there
          # is no nodal pressure state.
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-model-more-than-just-the-power-system-can-methane-hydrogen-carbon-dioxide-networks-be-included
          - https://github.com/PyPSA/PyPSA/issues/577
      composition_tracking:
        value: n
        source: []
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#fixed-capacity
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
      continuous_capacity:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
          - https://docs.pypsa.org/v1.3.0/examples/capacity-expansion-planning-single-node/
      integer_investment_exogenous_capacity:
        value: y
        source:
          # `{p,s,e}_nom_mod` forces capacity to an integer multiple of a fixed module.
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#modularity-constraints
          - https://docs.pypsa.org/v1.3.0/examples/modular-expansion/
      integer_investment_continuous_capacity:
        # `purchasable=True` adds a binary purchase decision alongside the continuous
        # capacity variable. Merged into the docs but not yet in a release.
        value: dev
        source:
          - https://github.com/PyPSA/PyPSA/pull/1900
      retrofit:
        value: n
        source:
          # The FAQ points at an external publication rather than built-in support.
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#how-do-i-model-retrofitting-of-coal-plants-with-ccs
      multi_period:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/
          - https://docs.pypsa.org/v1.3.0/examples/multi-investment-optimisation/
    operation:
      unit_commitment:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/
          - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
      maintenance_scheduling:
        value: y
        source:
          # `maintainable`, `maintenance_duration`, `maintenance_events`,
          # `maintenance_pu`; window timing co-optimised with dispatch (new in v1.3.0).
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/maintenance-scheduling/
          - https://docs.pypsa.org/v1.3.0/examples/maintenance-scheduling/
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            size_bounds:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
            discrete_increments:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#modularity-constraints
                - https://docs.pypsa.org/v1.3.0/examples/modular-expansion/
            unit_purchase:
              value: dev
              source:
                - https://github.com/PyPSA/PyPSA/pull/1900
          operation:
            availability_derating:
              value: y
              source:
                # Time-varying `p_max_pu` / `s_max_pu`.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
                - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
            minimum_stable_level:
              value: y
              source:
                # `p_min_pu` applied to the commitment status.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#start-up-and-shut-down
                - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
            forced_offline:
              value: y
              source:
                # `p_max_pu=0` for outage snapshots, or an endogenously placed
                # maintenance window with `maintenance_pu=1`.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/maintenance-scheduling/#effect-on-dispatch-limits
            forced_online:
              value: y
              source:
                # `p_min_pu>0` on a non-committable asset is a must-run condition;
                # `p_set` fixes the dispatch schedule outright.
                - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#fixed-dispatch
        sequential:
          investment:
            build_rate:
              value: y
              source:
                # `n.carriers.max_growth` / `max_relative_growth` per investment period.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#growth-limit-per-carrier
            retirement:
              # Retirement is scheduled exogenously through `build_year` + `lifetime`;
              # endogenous decommissioning is not available (issues #926, #1278).
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#dispatch-of-active-components
                - https://docs.pypsa.org/v1.3.0/examples/myopic-pathway/
            availability_window:
              value: y
              source:
                # Per-period components with `build_year`/`lifetime` restrict which
                # periods an asset may be built in.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#implementation
          operation:
            ramping:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#ramping
                - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
            start_shut_trajectory:
              value: y
              source:
                # `ramp_limit_start_up` / `ramp_limit_shut_down` bound the flow change on
                # the start-up and shut-down transitions separately.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#ramping
            commitment_duration:
              value: y
              source:
                # `min_up_time` / `min_down_time`, with `up_time_before` /
                # `down_time_before` carrying state across optimisation windows.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#start-up-and-shut-down
            start_consumption:
              value: n
              source:
                - https://github.com/PyPSA/PyPSA/issues/1738
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # `tech_capacity_expansion_limit` global constraint, optionally per bus
                # and per investment period; transmission expansion volume limit.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#volume-limit-on-transmission-expansion
            expansion_budget:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#cost-limit-on-transmission-expansion
            event_count:
              value: n
              source: []
            path_dependent:
              value: n
              source:
                # Endogenous learning is explicitly not implemented.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#storage-cyclicity-and-initial-energy-levels
                - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-technological-learning-be-modelled
                - https://github.com/PyPSA/PyPSA/issues/1599
          operation:
            flow_volume:
              value: y
              source:
                # `e_sum_min`/`e_sum_max` over the horizon; `operational_limit` global
                # constraint; arbitrary sub-periods via custom constraints.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#volume-limits
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#operational-limit
                - https://docs.pypsa.org/v1.3.0/examples/periodic-operational-limits/
            impact_budget:
              value: y
              source:
                # `primary_energy` global constraint over a user-chosen
                # `carrier_attribute`; also usable as a budget across all periods.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#emission-budgets
            event_count:
              # Storage cycle budgets are an open PR; no limit on start counts exists.
              value: dev
              source:
                - https://github.com/PyPSA/PyPSA/pull/1915
                - https://github.com/PyPSA/PyPSA/issues/1731
            state_duration:
              value: n
              source: []
            path_dependent:
              # Capacity fade with cumulative cycling is an open PR.
              value: dev
              source:
                - https://github.com/PyPSA/PyPSA/pull/1915
                - https://github.com/PyPSA/PyPSA/issues/1731
        boundary_conditions:
          investment:
            value: y
            source:
              # Brownfield stock via non-extendable components / `p_nom_min` and
              # `build_year` before the first investment period; an end-state can be set
              # with a capacity target in the final period.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#objective
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
              - https://docs.pypsa.org/v1.3.0/examples/myopic-pathway/
          operation:
            value: y
            source:
              # `e_initial`/`state_of_charge_initial`, `e_cyclic`, and the
              # `*_per_period` variants controlling hand-over between periods.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#storage-cyclicity-and-initial-energy-levels
      assets:
        spanning:
          investment:
            value: y
            source:
              # Global constraints sum investment variables across all components of a
              # carrier.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#growth-limit-per-carrier
          operation:
            value: y
            source:
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#operational-limit
        dedicated_flow_routing:
          value: y
          source:
            # Dedicated buses/carriers route a flow to a named subset of downstream
            # assets, e.g. water cascading between reservoirs.
            - https://docs.pypsa.org/v1.3.0/examples/chained-hydro-reservoirs/
            - https://docs.pypsa.org/v1.3.0/user-guide/design/#buses
      spatial:
        investment:
          value: y
          source:
            # Global constraints span all buses unless restricted with `bus`.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#volume-limit-on-transmission-expansion
        operation:
          value: y
          source:
            # A single `primary_energy` CO2 cap sums over every emitting asset at every
            # bus, so one constraint answers this leaf and
            # `constraints.scope.assets.spanning.operation` alike.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
    functional_form:
      linear_multi_variable:
        investment:
          value: y
          source:
            # `max_hours` ties storage energy to power capacity; custom constraints
            # link several capacity variables (e.g. charger/discharger ratios).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
            - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/#fix-the-ratio-between-incoming-and-outgoing-capacity-of-the-store
        operation:
          value: y
          source:
            # Extraction-condensing CHP feasible operating region built from linear
            # constraints over several dispatch variables.
            - https://docs.pypsa.org/v1.3.0/examples/power-to-gas-boiler-chp/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
      quadratic:
        investment:
          value: n
          source: []
        operation:
          value: n
          source:
            # Quadratic terms are only supported in the objective; linopy does not
            # support quadratic constraints.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/stochastic/#risk-preferences-with-conditional-value-at-risk-cvar
            - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/
      nonlinear:
        investment:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1730
        operation:
          value: y
          source:
            # Piecewise-linear part-load efficiency/rate curves on `Link`/`Process`;
            # piecewise-linearised quadratic transmission losses.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/
            - https://docs.pypsa.org/v1.3.0/examples/piecewise-constraints/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#linear-loss-approximation
    soft_constraints:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/1732
    reliability:
      operating_reserve:
        online_headroom:
          # Tenuous: there is no reserve component or attribute. The documented
          # approach is a user-added reserve variable plus custom constraints bounding
          # it by the headroom between dispatch and capacity.
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/examples/reserve-power/
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-do-ancillary-service-co-optimization-eg-frequency-control
        standby_capability:
          value: n
          source:
            # The reserve example is explicit that offline quick-start capability is
            # not covered by its formulation.
            - https://docs.pypsa.org/v1.3.0/examples/reserve-power/
            - https://github.com/PyPSA/PyPSA/issues/1729
        inertia:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1729
      probabilistic_reliability_limit:
        loss_of_load:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1490
        unserved_energy:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1490
      unserved_demand:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/api/networks/optimize/#pypsa.Network.optimize.add_load_shedding
          - https://docs.pypsa.org/v1.3.0/user-guide/troubleshooting/#optimisation-convergence-infeasibility
      contingency_constrained:
        value: y
        source:
          # N-1 SCLOPF over an enumerated set of branch outages. Post-contingency
          # corrective action is not co-optimised.
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/contingencies/
          - https://docs.pypsa.org/v1.3.0/examples/scigrid-sclopf/
  cost:
    scope:
      temporal:
        sequential:
          investment:
            value: n
            source: []
          operation:
            start_up:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#start-up-shut-down-stand-by-costs
            shut_down:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#start-up-shut-down-stand-by-costs
            ramping:
              value: n
              source:
                - https://github.com/PyPSA/PyPSA/issues/1733
            start_state_dependent:
              # Start-up cost can vary per snapshot on `master` (PR #1909) but never as a
              # function of how long the unit has been off, so hot/warm/cold starts
              # cannot be distinguished.
              value: n
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#start-up-shut-down-stand-by-costs
        cumulative:
          investment:
            value: n
            source:
              - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-technological-learning-be-modelled
              - https://github.com/PyPSA/PyPSA/issues/1599
          operation:
            value: n
            source:
              - https://github.com/PyPSA/PyPSA/issues/1731
      assets:
        investment:
          # All built-in cost attributes (`capital_cost`, `fom_cost`, `unit_cost`) are
          # per-component; a single term spanning several assets would require
          # rewriting the objective through `math.user_defined_math`.
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#investment-costs
        operation:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#marginal-costs
      spatial:
        investment:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#investment-costs
        operation:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#marginal-costs
    functional_form:
      fixed_charge:
        investment:
          # `unit_cost`/`unit_cost_overnight` charged on the binary purchase decision.
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1900
        operation:
          value: y
          source:
            # `stand_by_cost` is incurred per committed snapshot irrespective of flow.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#start-up-shut-down-stand-by-costs
      nonlinear:
        investment:
          value: y
          source:
            # Piecewise-linear `capital_cost` curves against nominal capacity.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/
            - https://docs.pypsa.org/v1.3.0/examples/piecewise-constraints/
        operation:
          flow_dependent:
            value: y
            source:
              # Piecewise-linear `marginal_cost` curves against the per-unit flow,
              # plus `marginal_cost_quadratic`.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#quadratic-marginal-costs
          bid_bands:
            value: y
            source:
              # Cumulative piecewise marginal-cost curves are price-quantity bands;
              # incr/decr offers around a reference dispatch are built in the
              # redispatch example.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/#cumulative-curves
              - https://docs.pypsa.org/v1.3.0/examples/demand-supply-bids/
              - https://docs.pypsa.org/v1.3.0/examples/scigrid-redispatch/
      threshold_deviation:
        investment:
          value: n
          source: []
        operation:
          # Tenuous: no dedicated deviation-cost attribute. The redispatch example
          # constructs the pattern by fixing a reference dispatch with
          # `p_min_pu`/`p_max_pu` and adding priced ramp-up / ramp-down components.
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/examples/scigrid-redispatch/
    annuitisation:
      discounting:
        value: y
        source:
          # `overnight_cost` + `discount_rate` + `lifetime` annuitisation, and a social
          # discount rate through investment period objective weightings.
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#specifying-capital-costs
          - https://docs.pypsa.org/v1.3.0/user-guide/design/#investment-periods
      fiscal_treatment:
        value: n
        source: []
  model_definition:
    dimension_groups:
      # Tenuous: `carrier` is the built-in grouping used by global constraints, and
      # arbitrary extra attributes passed to `n.add()` persist as component columns
      # which custom groupers and custom constraints can then filter on. There is no
      # first-class named-group object.
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#registering-custom-groupers
        - https://docs.pypsa.org/v1.3.0/examples/periodic-operational-limits/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
    component_templating:
      value: n
      source:
        # Vintaged expansion candidates must be written out per period by the user.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#implementation
        - https://github.com/PyPSA/PyPSA/issues/1789
    configurable_dimensions:
      value: y
      source:
        # Most attributes can be given as static values or as snapshot-indexed series,
        # and gain a scenario dimension once `n.set_scenarios()` is called.
        - https://docs.pypsa.org/v1.3.0/user-guide/design/#data-storage
        - https://docs.pypsa.org/v1.3.0/user-guide/design/#scenarios
    extensible_dimensions:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/856
  math:
    formulation_transparency:
      value: y
      source:
        # Every constraint is documented with its equations and its name in the built
        # linopy model, which can be inspected directly.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/overview/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
    problem_file_export:
      # Tenuous: PyPSA exposes linopy's `problem_fn` through `n.optimize()` and the
      # model object can be written out, but LP/MPS export is not documented as a
      # PyPSA feature in its own right.
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/api/networks/optimize/#pypsa.Network.optimize.solve_model
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
    dual_extraction:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/#analysing-constraints
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/energy-balance/
    piecewise_formulation:
      value: y
      source:
        # LP chord-line, incremental (delta), SOS2 and disjunctive formulations, with
        # per-attribute overrides via `piecewise_options`.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/#piecewise-formulations
    user_defined_math:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
        - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/#custom-constraints
  interface:
    gui:
      build:
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-have-a-gui
      run:
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-have-a-gui
      analyse:
        # No GUI ships with PyPSA; an "Interactive dashboard / local PyPSA App" is a
