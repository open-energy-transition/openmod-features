# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against PyPSA v1.3.0 (released 19th August 2026).
# `dev` entries link to open pull requests or unreleased changes on the default branch (`master`).

version: 'v1.3.0'
features:
  processes:
    boundary_exchange:
      value: y
      source:
        # `Generator` as supply from outside the system boundary; `Load` with inverted
        # sign as an export. Volume/availability bounded by `e_sum_max` / `p_max_pu`.
        - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/loads/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#volume-limits
    conversion:
      one_to_one:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
          - https://docs.pypsa.org/v1.3.0/user-guide/components/processes/
      multi_carrier_io:
        value: y
        source:
          # `bus2`/`efficiency2`... on `Link` and `rate0`/`rate1`... on `Process` give
          # several in-/out-flows at fixed ratio to the reference flow.
          - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
          - https://docs.pypsa.org/v1.3.0/user-guide/components/processes/
          - https://docs.pypsa.org/v1.3.0/examples/chp-fixed-heat-power-ratio/
          - https://docs.pypsa.org/v1.3.0/examples/biomass-synthetic-fuels-carbon-management/
      flexible_ratio:
        # Tenuous: no built-in flexible-ratio attribute. The documented
        # extraction-condensing CHP example frees the heat/power ratio with custom linear
        # constraints describing the feasible operating region.
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/examples/power-to-gas-boiler-chp/
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
    temporal_transfer:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/stores/
        - https://docs.pypsa.org/v1.3.0/user-guide/components/storage-units/
    spatial_transfer:
      value: y
      source:
        # `Link` is a controllable transport-model flow between buses (NTCs, HVDC).
        - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
    delayed_transfer:
      value: y
      source:
        # `delay`/`cyclic_delay` on `Link` and `delay0`/`delay1`... on `Process`.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/energy-balance/
        - https://docs.pypsa.org/v1.3.0/examples/transport-delay/
        - https://docs.pypsa.org/v1.3.0/examples/chained-hydro-reservoirs/
    buffered_transfer:
      # No linepack / in-transit inventory; pipelines are transport links with linear
      # losses (a `Store` on an intermediate bus is only a lumped approximation).
      value: n
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-model-more-than-just-the-power-system-can-methane-hydrogen-carbon-dioxide-networks-be-included
        - https://github.com/PyPSA/PyPSA/issues/577
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source:
        # FAQ: district heating is only represented "at a high level of abstraction ...
        # Detailed hydraulic or temperature-dependent physics are not represented".
        - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-pypsa-model-district-heating-networks
        - https://github.com/PyPSA/PyPSA/issues/577
    explicit_demand:
      inelastic:
        value: y
        source:
          # `Load` is balanced at its bus like any other component; shiftable demand is
          # built by pairing a `Load` with a `Store`/`StorageUnit`, or by a `Generator`
          # with `sign=-1` which carries the full set of dispatch constraints.
          - https://docs.pypsa.org/v1.3.0/user-guide/components/loads/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-you-model-market-clearing-in-pypsa
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/energy-balance/
      price_responsive:
        value: y
        source:
          # Negative-sign `Generator` with (piecewise or quadratic) marginal cost as a
          # demand bid curve. Dispatchable/committable `Load` is an open PR (#1917).
          - https://docs.pypsa.org/v1.3.0/examples/demand-elasticity/
          - https://docs.pypsa.org/v1.3.0/examples/demand-supply-bids/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#how-is-demand-modelled
      mobile_storage:
        # Tenuous: PyPSA has no dedicated mobile-storage component. The documented
        # pattern is a `Store` on a dedicated bus with a charging `Link` whose
        # time-varying `p_max_pu` encodes when the vehicle is connected; the attachment
        # point itself is fixed rather than varying in space.
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/examples/battery-electric-vehicle-charging/
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#is-electric-vehicle-charging-and-v2g-handled-endogenously
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
            - https://docs.pypsa.org/v1.3.0/examples/ac-dc-lopf/
        ac_opf:
          # LOPF is the linearised (DC) formulation applied to AC networks; there is no
          # linearised-AC formulation carrying voltage magnitudes or reactive power in
          # the optimisation - the FAQ states only linear power flow constraints can
          # enter `n.optimize()`, with AC flow only as a post-hoc `n.pf()`. LinDistFlow
          # is a requested feature (#1706).
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-pypsa-model-ac-power-flow
            - https://github.com/PyPSA/PyPSA/issues/1706
        unbalanced_flows:
          # All power flow is single-phase equivalent. The closest request (#1706) is for
          # balanced DistFlow; distribution-network solvers are discussed in #1573.
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1573
      sensitivity_limits:
        ptdf:
          # Tenuous: no built-in PTDF-constraint mechanism in v1.3.0. The flow-based
          # market coupling examples (merged after v1.3.0, so only on the `latest` docs)
          # add a supplied `PTDF . NP <= RAM` domain as a custom constraint using only
          # v1.3.0 functionality; zonal PTDFs from nodal `sn.calculate_PTDF()` and GSKs.
          # A native flow-based component / global constraint is in open PRs.
          value: y
          source:
            - https://docs.pypsa.org/latest/examples/fbmc-simple-example/
            - https://docs.pypsa.org/latest/examples/fbmc-building-domain/
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_PTDF
            - https://github.com/PyPSA/PyPSA/pull/1897
            - https://github.com/PyPSA/PyPSA/pull/1933
        outage_factors:
          value: y
          source:
            # SCLOPF constrains post-outage flows with the BODF/LODF matrix (computed by
            # PyPSA from the network); the FBMC domain example also folds LODFs into
            # user-supplied N-1 CNEC rows.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/contingencies/#n-1-security-constraints-for-sclopf
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_BODF
            - https://docs.pypsa.org/latest/examples/fbmc-building-domain/
        generic_constraints:
          # No built-in transmission constraint object with user-supplied coefficients;
          # a native `FlowBasedConstraint` component and a `flow_based` global
          # constraint type are open PRs.
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1897
            - https://github.com/PyPSA/PyPSA/pull/1933
      network_limits:
        thermal:
          value: y
          source:
            # `s_nom` with static or time-varying `s_max_pu` (e.g. dynamic line rating).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
            - https://docs.pypsa.org/v1.3.0/user-guide/components/lines/
        phase_angle:
          # The cycle-based KVL formulation in v1.3.0 carries no angle-difference limit.
          # Enforcing `v_ang_max` on lines and transformers (as an equivalent bound on the
          # flow) is merged to `master` but unreleased.
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1910
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
      losses:
        value: y
        source:
          # Piecewise-linear (tangent- or secant-based) approximation of the quadratic
          # loss parabola, enabled with `n.optimize(transmission_losses=...)`.
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#linear-loss-approximation
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#secant-based-linearization-with-error-control
      network_devices:
        transformers:
          value: y
          source:
            # Tap ratio and fixed phase shift on `Transformer`; `ShuntImpedance` component.
            - https://docs.pypsa.org/v1.3.0/user-guide/components/transformers/
            - https://docs.pypsa.org/v1.3.0/user-guide/components/shunt-impedances/
            - https://docs.pypsa.org/v1.3.0/examples/transformer-example/
        facts_devices:
          value: y
          source:
            # Phase-shifting transformers with `phase_shift_min < phase_shift_max` make the
            # phase shift a per-snapshot decision variable (new in v1.3.0).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#phase-shifting-transformers-psts
            - https://docs.pypsa.org/v1.3.0/user-guide/components/transformers/
        hvdc_converters:
          value: y
          source:
            # `Link` represents point-to-point HVDC links and AC/DC converter stations.
            - https://docs.pypsa.org/v1.3.0/user-guide/components/links/
            - https://docs.pypsa.org/v1.3.0/examples/ac-dc-lopf/
    hydraulic_flow:
      linearised_flow:
        value: n
        source:
          # Pipeline carriers are modelled as transport links with linear losses; there
          # is no nodal pressure state.
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-model-more-than-just-the-power-system-can-methane-hydrogen-carbon-dioxide-networks-be-included
          - https://github.com/PyPSA/PyPSA/issues/577
      composition_tracking:
        value: n
        source: []
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#fixed-capacity
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
      continuous_capacity:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
          - https://docs.pypsa.org/v1.3.0/examples/capacity-expansion-planning-single-node/
      integer_investment_exogenous_capacity:
        value: y
        source:
          # `{p,s,e}_nom_mod` forces capacity to an integer multiple of a fixed module.
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#modularity-constraints
          - https://docs.pypsa.org/v1.3.0/examples/modular-expansion/
      integer_investment_continuous_capacity:
        # `purchasable=True` adds a binary purchase decision alongside the continuous
        # capacity variable; open PR.
        value: dev
        source:
          - https://github.com/PyPSA/PyPSA/pull/1900
          - https://github.com/PyPSA/PyPSA/issues/1482
      multi_period:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/
          - https://docs.pypsa.org/v1.3.0/examples/multi-investment-optimisation/
      retrofit:
        value: n
        source:
          # The FAQ points at an external publication rather than built-in support.
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#how-do-i-model-retrofitting-of-coal-plants-with-ccs
      endogenous_retirement:
        # Retirement only happens exogenously at `build_year + lifetime`; endogenous
        # (early) decommissioning is requested but has no PR.
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/926
          - https://github.com/PyPSA/PyPSA/issues/1278
    operation:
      unit_commitment:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/
          - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
      maintenance_scheduling:
        value: y
        source:
          # `maintainable`, `maintenance_duration`, `maintenance_events`,
          # `maintenance_pu`; window timing co-optimised with dispatch (new in v1.3.0).
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/maintenance-scheduling/
          - https://docs.pypsa.org/v1.3.0/examples/maintenance-scheduling/
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            value: y
            source:
              # With investment periods, `{p,e,s}_nom_{min,max}` of a per-period component
              # bound the capacity added in its build year; `n.carriers.max_growth` caps
              # the absolute capacity added per carrier and period; `*_nom_mod` adds
              # capacity in whole modules.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#expansion-limits
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#growth-limit-per-carrier
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#modularity-constraints
          operation:
            availability_derating:
              value: y
              source:
                # Time-varying `p_max_pu` / `s_max_pu`, and `e_min_pu` / `e_max_pu` on
                # storage levels.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
                - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/#stores
            minimum_stable_level:
              value: y
              source:
                # `p_min_pu` applied to the commitment status.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#start-up-and-shut-down
                - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
            forced_offline:
              value: y
              source:
                # `p_max_pu=0` for outage snapshots, or an endogenously placed
                # maintenance window with `maintenance_pu=1`.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#non-extendable-components
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/maintenance-scheduling/#effect-on-dispatch-limits
            forced_online:
              value: y
              source:
                # `p_min_pu>0` on a non-committable asset is a must-run condition;
                # `p_set` fixes the dispatch schedule outright. Fixing the commitment
                # status itself (`status_set`) is requested in #1271.
                - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#fixed-dispatch
        sequential:
          investment:
            availability_window:
              value: y
              source:
                # Per-period components with `build_year`/`lifetime` restrict which
                # periods an asset may be built in.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#implementation
            relative_build_rate:
              value: y
              source:
                # `n.carriers.max_relative_growth` limits new capacity relative to the
                # capacity added in the previous investment period.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#growth-limit-per-carrier
            technical_lifetime:
              value: y
              source:
                # Dispatch is forced to zero from `build_year + lifetime` onwards.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#dispatch-of-active-components
                - https://docs.pypsa.org/v1.3.0/examples/myopic-pathway/
          operation:
            ramping:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#ramping
                - https://docs.pypsa.org/v1.3.0/examples/unit-commitment/
            start_shut_trajectory:
              value: y
              source:
                # `ramp_limit_start_up` / `ramp_limit_shut_down` bound the flow change on
                # the start-up and shut-down transitions separately. Multi-snapshot run-up
                # trajectories are requested in #1709.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#ramping
                - https://github.com/PyPSA/PyPSA/issues/1709
            commitment_duration:
              value: y
              source:
                # `min_up_time` / `min_down_time`, with `up_time_before` /
                # `down_time_before` carrying state across optimisation windows.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/#start-up-and-shut-down
            start_consumption:
              value: n
              source:
                - https://github.com/PyPSA/PyPSA/issues/1738
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # `tech_capacity_expansion_limit` global constraint, optionally per bus
                # and per investment period; transmission expansion volume limit.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#volume-limit-on-transmission-expansion
            expansion_budget:
              value: y
              source:
                # Built-in only for transmission expansion cost; other budgets via a
                # custom constraint on the `capex` expression.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#cost-limit-on-transmission-expansion
            event_count:
              value: n
              source: []
            path_dependent:
              value: n
              source:
                # Endogenous learning is explicitly not implemented.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#storage-cyclicity-and-initial-energy-levels
                - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-technological-learning-be-modelled
                - https://github.com/PyPSA/PyPSA/issues/1599
          operation:
            flow_volume:
              value: y
              source:
                # `e_sum_min`/`e_sum_max` over the horizon; `operational_limit` global
                # constraint; arbitrary sub-periods via custom constraints.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/dispatch-limits/#volume-limits
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#operational-limit
                - https://docs.pypsa.org/v1.3.0/examples/periodic-operational-limits/
            impact_budget:
              value: y
              source:
                # `primary_energy` global constraint over a user-chosen
                # `carrier_attribute`; also usable as a budget across all periods.
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#emission-budgets
            event_count:
              # No limit on the number of start-ups (or other discrete events) per period.
              # The storage `cycles_max` budget in PR #1915 counts equivalent full cycles
              # of throughput, which is a volume limit rather than an event count.
              value: n
              source: []
            state_duration:
              value: n
              source: []
            path_dependent:
              # Capacity fade with cumulative storage throughput is an open PR.
              value: dev
              source:
                - https://github.com/PyPSA/PyPSA/pull/1915
                - https://github.com/PyPSA/PyPSA/issues/1731
        boundary_conditions:
          investment:
            value: y
            source:
              # Brownfield stock via non-extendable components / `p_nom_min` and
              # `build_year` before the first investment period; an end-state can be set
              # with a capacity target in the final period.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#objective
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/capacity-limits/#upper-and-lower-bounds
              - https://docs.pypsa.org/v1.3.0/examples/myopic-pathway/
          operation:
            value: y
            source:
              # `e_initial`/`state_of_charge_initial`, `e_cyclic`, and the
              # `*_per_period` variants controlling hand-over between periods.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#storage-cyclicity-and-initial-energy-levels
      spatial:
        investment:
          value: y
          source:
            # Global constraints span all buses unless restricted with `bus`.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#volume-limit-on-transmission-expansion
        operation:
          value: y
          source:
            # A single `primary_energy` CO2 cap sums over every emitting asset at every
            # bus, so one constraint answers this leaf and
            # `constraints.scope.assets.spanning.operation` alike.
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
      assets:
        spanning:
          investment:
            value: y
            source:
              # Global constraints sum investment variables across all components of a
              # carrier.
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#expansion-limit
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#growth-limit-per-carrier
          operation:
            value: y
            source:
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
              - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#operational-limit
        dedicated_flow_routing:
          value: y
          source:
            # Dedicated buses/carriers route a flow to a named subset of downstream
            # assets, e.g. water cascading between reservoirs.
            - https://docs.pypsa.org/v1.3.0/examples/chained-hydro-reservoirs/
            - https://docs.pypsa.org/v1.3.0/user-guide/design/#buses
    functional_form:
      linear_multi_variable:
        investment:
          value: y
          source:
            # `max_hours` ties storage energy to power capacity; custom constraints
            # link several capacity variables (e.g. charger/discharger ratios).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
            - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/#fix-the-ratio-between-incoming-and-outgoing-capacity-of-the-store
        operation:
          value: y
          source:
            # Extraction-condensing CHP feasible operating region built from linear
            # constraints over several dispatch variables.
            - https://docs.pypsa.org/v1.3.0/examples/power-to-gas-boiler-chp/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
