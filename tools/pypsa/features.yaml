        - https://docs.pypsa.org/v1.3.0/user-guide/design/#scenarios
    near_optimal:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/modelling-to-generate-alternatives/
        - https://docs.pypsa.org/v1.3.0/examples/mga/
        - https://docs.pypsa.org/v1.3.0/examples/near-opt-space/
    robust_optimisation:
      # Tenuous: there is no dedicated robust formulation. Worst-case minimisation is
      # approximated by setting CVaR `omega=1` and `alpha = 1 - p(worst scenario)` over
