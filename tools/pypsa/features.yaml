          - https://docs.pypsa.org/v1.3.0/examples/uc-prices/
      nonlinear_handling:
        convex_relaxation:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1706
        function_conversion:
          value: n
          source:
            # The secant loss approximation auto-segments to an error tolerance, but
