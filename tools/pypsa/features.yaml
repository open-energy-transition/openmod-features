            # equivalent of an external network.
            - https://docs.pypsa.org/v1.3.0/api/networks/cluster/
        assets:
          value: n
          source: []
      filtering:
        temporal:
          value: y
          source:
            # `n.cluster.temporal.downsample()` keeps every Nth snapshot;
            # `n.set_snapshots()` / `n.optimize(snapshots=...)` select a subset.
