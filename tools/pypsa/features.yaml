        loss_of_load:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1490
        unserved_energy:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1490
    soft_constraints:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/1732
  cost:
    scope:
      temporal:
        sequential:
          investment:
            value: n
            source: []
          operation:
