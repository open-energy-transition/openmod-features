    heuristic_markup:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/1735
  objective:
    multi_objective_weighted:
      # Tenuous: the deterministic objective is always minimum system cost. Weighted
      # combinations of several user-named objectives are only available through the
      # MGA machinery, under a cost-slack constraint.
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/modelling-to-generate-alternatives/
        - https://docs.pypsa.org/v1.3.0/examples/near-opt-space/
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
    multi_objective_pareto:
      value: n
      source:
        # Near-optimal space exploration sweeps directions within a cost slack rather
        # than generating a Pareto frontier across objectives.
        - https://docs.pypsa.org/v1.3.0/examples/near-opt-space/
    quadratic:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#quadratic-marginal-costs
    tie_breaking:
      value: n
      source: []
  uncertainty:
    two_stage_stochastic:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/stochastic/
        - https://docs.pypsa.org/v1.3.0/examples/stochastic-optimization/
    multi_stage_stochastic:
      value: n
      source:
        # Investment is fixed as first stage and dispatch as recourse; further stages
