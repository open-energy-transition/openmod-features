          # tool-managed bidirectional exchange.
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-you-model-intra-day-as-well-as-day-ahead-markets
          - https://docs.pypsa.org/v1.3.0/examples/scigrid-redispatch/
      convergence_iteration:
        value: y
        source:
          # Iterating line capacities against their impedances until convergence.
          - https://docs.pypsa.org/v1.3.0/api/networks/optimize/#pypsa.Network.optimize.optimize_transmission_expansion_iteratively
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/power-flow/#kirchhoffs-voltage-law-kvl
  io:
    plain_text:
      input:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#csv-files
      output:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#csv-files
    binary:
      input:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#netcdf
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#hdf5
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#excel
      output:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#netcdf
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#hdf5
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#excel
    database:
      input:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1590
      output:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1590
    remote_storage:
      input:
        value: y
        source:
          # S3, Google Cloud Storage and Azure Blob Storage via `cloudpathlib`.
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#cloud-object-storage
      output:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#cloud-object-storage
    lazy_loading:
      input:
        value: n
        source:
          # netCDF as a format supports lazy loading, but PyPSA reads networks fully
          # into memory; lazy/streaming IO is an open issue and a roadmap item.
          - https://github.com/PyPSA/PyPSA/issues/1705
          - https://pypsa.org/roadmap
      output:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1705
          - https://pypsa.org/roadmap
    standardised:
      # Tenuous: the only community-format readers are for PYPOWER `ppc` dictionaries
      # (the Python port of the MATPOWER case format) and pandapower networks, both
      # partial. PSSE RAW / CIM are not supported (issue #24) and there is no
      # ontology-aligned or IAMC-style interchange.
      input:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#pypower
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#pandapower
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#is-there-an-automatic-conversion-from-matpower-to-pypsa
      output:
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#pypower
          - https://github.com/PyPSA/PyPSA/issues/24
  preprocessing:
    download:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/1480
    model_catalogue:
      value: y
      source:
        # `pypsa.examples` retrieves ready-made networks (ac_dc_meshed, scigrid_de,
        # model_energy, carbon_management, ...).
        - https://docs.pypsa.org/v1.3.0/api/other/api-examples/
    resource_conversion:
      value: n
      source:
        # Weather-to-profile conversion lives in the separate `atlite` package, not in
        # PyPSA itself.
        - https://github.com/PyPSA/PyPSA/issues/1695
    forecasting:
      value: n
      source:
        - https://github.com/PyPSA/PyPSA/issues/1483
    spatial_distribution:
      demand:
        value: n
        source: []
      network_geometry:
        value: y
        source:
          # `calculate_line_length()` derives line lengths from bus coordinates.
          - https://docs.pypsa.org/v1.3.0/api/components/types/lines/#pypsa.components.Lines.calculate_line_length
    scenario_generation:
      value: n
      source: []
    input_validation:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/troubleshooting/#consistency-check
        - https://docs.pypsa.org/v1.3.0/user-guide/options/#parameters-options
  postprocessing:
    metrics:
      operational:
        capacity_factor:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/api/networks/statistics/#pypsa.Network.statistics.capacity_factor
        operating_hours:
          # No statistic counts running or committed snapshots; the commitment status
          # (`n.generators_t.status`) has to be summed by the user.
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#metrics
        binding_hours:
          # No statistic counts snapshots at the upper bound (e.g. line congestion
          # hours); the open `congestion_rent` statistic PR reports rents, not hours.
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#metrics
            - https://github.com/PyPSA/PyPSA/pull/1924
        curtailment:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/api/networks/statistics/#pypsa.Network.statistics.curtailment
      financial:
        marginal_price:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/api/networks/statistics/#pypsa.Network.statistics.prices
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-i-do-nodal-pricing-lmp-calculations
        price_formation:
          value: n
          source:
            # Prices come straight from the duals; there is no uplift / re-solve rule.
            - https://docs.pypsa.org/v1.3.0/examples/uc-prices/
            - https://github.com/PyPSA/PyPSA/issues/1281
        water_value:
          value: y
          source:
            # Marginal storage values extracted from a perfect-foresight run and fed
            # back as a future cost function into rolling-horizon operation.
            - https://docs.pypsa.org/v1.3.0/examples/water-value/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/storage/
        asset_accounts:
          value: y
          source:
            # Per-component CAPEX, fixed O&M, OPEX, revenue and market value.
            - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#metrics
            - https://docs.pypsa.org/v1.3.0/api/networks/statistics/#pypsa.Network.statistics.revenue
        contract_settlement:
          # Tenuous: the settlement example is only published on `latest` (merged after
          # v1.3.0, so absent from every pinned docs build), so this link is
          # unversioned. Nothing in the workflow is version-specific: it uses only
          # `n.generators_t.p` and `n.buses_t.marginal_price` from a solved network.
          value: y
          source:
            # Two-sided CfDs, feed-in premiums, cap-and-floor, virtual and baseload
            # PPAs settled post-hoc against dispatch and prices.
            - https://docs.pypsa.org/latest/examples/cfd-ppa-settlement/
            - https://github.com/PyPSA/PyPSA/pull/1727
        levelised_cost:
          value: dev
          source:
            - https://github.com/PyPSA/PyPSA/pull/1926
        net_present_value:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#metrics
      impact_assessment:
        emissions:
          value: y
          source:
            # `n.carriers.co2_emissions` with the `primary_energy` global constraint
            # gives emissions and their shadow price; a dedicated `emissions`
            # statistic is in development (PR #1927).
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/global-constraints/#primary-energy
            - https://docs.pypsa.org/v1.3.0/user-guide/components/carriers/
        resource_use:
          # Tenuous: there is no resource-use metric. Non-carrier quantities such as
          # water or land have to be modelled as their own bus/carrier, after which
          # `n.statistics.energy_balance()` reports their consumption.
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-model-more-than-just-the-power-system-can-methane-hydrogen-carbon-dioxide-networks-be-included
            - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#metrics
        socioeconomic:
          value: n
          source: []
      network_transfer_metrics:
        transfer_capacity:
          value: n
          source:
            # `n.statistics.transmission()` reports realised flows, not NTC/GTC.
            - https://docs.pypsa.org/v1.3.0/api/networks/statistics/#pypsa.Network.statistics.transmission
        flow_sensitivity:
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_PTDF
            - https://docs.pypsa.org/v1.3.0/api/networks/subnetwork/#pypsa.SubNetwork.calculate_BODF
      probabilistic_reliability_assessment:
        loss_of_load:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-you-do-generation-adequacy-studies-with-monte-carlo-unplanned-outages
        unserved_energy:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/faq/#can-you-do-generation-adequacy-studies-with-monte-carlo-unplanned-outages
        capacity_credit:
          value: n
          source: []
    transformation:
      aggregation:
        value: y
        source:
          # `groupby` over carrier, bus, country, location, unit or custom groupers.
          - https://docs.pypsa.org/v1.3.0/user-guide/statistics/#grouping
      disaggregation:
        # Temporal clustering returns a `snapshot_map` and spatial clustering a
        # `busmap`, but mapping results back to full resolution is left to the user.
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/api/networks/cluster/
      scenario_comparison:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/collection/
  interface:
    gui:
      build:
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-have-a-gui
      run:
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-have-a-gui
      analyse:
        # No GUI ships with PyPSA. The separate `pypsa-app` web application for
        # analysing networks is an early alpha companion project (#1479).
        value: n
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/faq/#does-pypsa-have-a-gui
          - https://github.com/PyPSA/PyPSA/issues/1479
          - https://pypsa.org/roadmap
    api:
      build:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/import-export/#adding-removing-merging
          - https://docs.pypsa.org/v1.3.0/api/networks/network/
      run:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/api/networks/optimize/
      analyse:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/statistics/
          - https://docs.pypsa.org/v1.3.0/api/networks/statistics/
    cli:
      build:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1486
      run:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1486
      analyse:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1486
    solver_configuration:
      value: y
      source:
        # `solver_name` / `solver_options` per call or as global options.
        - https://docs.pypsa.org/v1.3.0/user-guide/troubleshooting/#optimisation-convergence-infeasibility
        - https://docs.pypsa.org/v1.3.0/user-guide/options/#parameters-options
    remote_execution:
      value: n
      source: []
    visualisation:
      charts:
        value: y
        source:
          # Static (matplotlib/seaborn) and interactive (plotly) area, bar, line,
          # scatter, box, violin and histogram plots of any statistics metric.
          - https://docs.pypsa.org/v1.3.0/user-guide/plotting/charts/
      network_maps:
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/plotting/static-map/
          - https://docs.pypsa.org/v1.3.0/user-guide/plotting/explore/
      report_templates:
        # No report or dashboard templates; automatic report creation is part of the
        # user-interface request.
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1479
  traceability:
    metadata:
      provenance:
        # Tenuous: `n.meta` is a free-form dictionary persisted with the network on
        # export, so sources, versions and licences can be recorded, but there is no
        # structured per-input provenance.
        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/api/networks/network/#pypsa.Network.meta
      units:
        value: n
        source:
          # `n.buses.unit` is "Only descriptive. Does not influence any PyPSA
          # functions"; conversions must be encoded in efficiencies by hand.
          - https://docs.pypsa.org/v1.3.0/user-guide/design/#unit-conventions
          - https://github.com/PyPSA/PyPSA/issues/1284
      propagation:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1622
    run_logs:
      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/logging/
    intermediate_access:
      value: y
      source:
        # `n.model` exposes the built variables, constraints and duals and can be
        # written to netCDF independently of the network.
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/custom-constraints/
        - https://docs.pypsa.org/v1.3.0/user-guide/network-optimization/#modify-model-re-optimize
    infeasibility_diagnosis:
      value: y
      source:
        # `n.optimize(compute_infeasibilities=True)` returns an IIS (Gurobi only).
        - https://docs.pypsa.org/v1.3.0/examples/tracing-infeasibilities/
        - https://docs.pypsa.org/v1.3.0/user-guide/troubleshooting/#optimisation-convergence-infeasibility
