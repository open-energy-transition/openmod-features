      value: y
      source:
        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/stochastic/#risk-preferences-with-conditional-value-at-risk-cvar
  tractability:
    dimension_reduction:
      adjacency_aggregation:
        temporal:
          value: y
          source:
            # `n.cluster.temporal.resample()` for contiguous averaging and
