        - https://docs.pypsa.org/v1.3.0/user-guide/optimization/stochastic/#risk-neutral-two-stage-stochastic-programming
        - https://github.com/PyPSA/PyPSA/issues/1477
    risk_aversion:
      value: y
      source:
        # CVaR with configurable confidence level `alpha` and tail weight `omega`.
