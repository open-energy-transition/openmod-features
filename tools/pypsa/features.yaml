              value: n
              source:
                - https://github.com/PyPSA/PyPSA/issues/1733
            start_up:
              value: y
              source:
                - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#start-up-shut-down-stand-by-costs
