            - https://docs.pypsa.org/v1.3.0/user-guide/components/generators/
            - https://docs.pypsa.org/v1.3.0/api/components/components/#pypsa.Components.active_assets
        scenarios:
          value: n
          source: []
      non_contiguity_handling:
        temporal:
          value: n
          source: []
        spatial:
          value: n
          source: []
