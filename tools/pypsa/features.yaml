        value: y
        source:
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/pathway-planning/#implementation
          - https://docs.pypsa.org/v1.3.0/user-guide/optimization/unit-commitment/
      resolution:
        temporal:
          # Snapshots may differ between investment periods, but not between buses or
          # carriers - non-uniform time resolution per bus is a roadmap item.
          value: y
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/design/#investment-periods
            - https://github.com/PyPSA/PyPSA/issues/1286
        spatial:
          value: n
          source: []
        assets:
          value: n
          source: []
        scenarios:
          value: n
          source: []
    reformulation:
      constraint_screening:
        value: n
        source:
          - https://github.com/PyPSA/PyPSA/issues/1589
      linearised_unit_commitment:
        value: y
        source:
          # `n.optimize(linearized_unit_commitment=True)` with tightening constraints.
