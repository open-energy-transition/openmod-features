            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/piecewise/#cumulative-curves
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#quadratic-marginal-costs
            - https://docs.pypsa.org/v1.3.0/examples/demand-supply-bids/
      threshold_deviation:
        investment:
          value: n
          source: []
        operation:
          # Tenuous: no dedicated deviation-cost attribute. The redispatch example
