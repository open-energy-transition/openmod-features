            - https://github.com/PyPSA/PyPSA/issues/1729
        inertia:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1729
      contingency_constrained:
        value: y
        source:
          # N-1 SCLOPF over an enumerated set of branch outages. Post-contingency
