            - https://docs.pypsa.org/v1.3.0/user-guide/design/#snapshots
        spatial:
          value: n
          source:
            - https://github.com/PyPSA/PyPSA/issues/1400
        assets:
          value: y
          source:
            # The `active` attribute excludes components from the built problem
