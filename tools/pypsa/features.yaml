          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#investment-costs
        operation:
          value: n
          source:
            - https://docs.pypsa.org/v1.3.0/user-guide/optimization/objective/#marginal-costs
    functional_form:
      fixed_charge:
        investment:
          # `unit_cost`/`unit_cost_overnight` charged on the binary purchase decision;
