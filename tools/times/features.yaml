          source: []
        binding_hours:
          value: n
          source: []
        curtailment:
          # No curtailment report; ETSAP's residual load curve note says curtailment cannot be reliably
          # accounted when variable renewables have upper-bound availability factors.
          value: n
          source:
            # Sec. 2.3.1 (Accounting Power Curtailment).
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Residual-load-curves.pdf
      financial:
        marginal_price:
          value: y
          source:
            # Commodity balance marginals (EQ_COMBAL) are reported as commodity prices by region, period
            # and timeslice.
            - https://times.readthedocs.io/en/latest/part-1/14-linear-programming.html#economic-interpretation-of-the-dual-variables
            - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#overview-of-report-parameters
        price_formation:
          value: n
          source: []
        water_value:
          value: n
          source: []
        asset_accounts:
          value: y
          source:
            # Cost components (CST_*) and present values (CST_PVP) by process; value flows by process
            # (RPT_OPT FLO 3).
            - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#acronyms-used-in-cost-reporting-parameters
            - https://times.readthedocs.io/en/latest/part-3/03-switches.html#reporting-options-activated-by-rpt-opt
        contract_settlement:
          value: n
          source: []
        levelised_cost:
          value: y
          source:
            - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#the-levelized-cost-reporting-option
        net_present_value:
          value: y
          source:
            # Discounted total system cost by region (REG_OBJ) and present value of costs by process
            # (CST_PVP).
            - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#times-objective-function-discounted-total-system-cost
            - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#overview-of-report-parameters
      impact_assessment:
        emissions:
          value: y
          source:
            # Emissions are commodities, reported by process and region; climate module reports
            # concentrations and forcing.
            - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#overview-of-report-parameters
            - https://times.readthedocs.io/en/latest/part-2/07-climate-module/03-parameters.html#reporting-parameters
        resource_use:
          # Tenuous: non-carrier resources (e.g. land, water, materials) are reported only if modelled as
          # commodities.
          value: y
          source:
            - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#the-components-of-a-reference-energy-system-res-processes-commodities-flows
        socioeconomic:
          # Tenuous: TIMES-MACRO and TIMES-MACRO-MSA report GDP and the GDP loss against the baseline;
          # there are no job or distributional metrics.
          value: y
          source:
            - https://times.readthedocs.io/en/latest/part-1/12-general-equilibrium.html#formulation-of-the-macro-model
            # MSA note sec. 3.2.2 (reporting parameters GDP-ACT, GDPLOS).
            - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Macro-MSA.pdf
      network_transfer_metrics:
        transfer_capacity:
          value: n
          source: []
        flow_sensitivity:
          # PTDFs are supplied as input (GR_PTDF, a precomputed matrix), not calculated by TIMES. The
          # `postprocessing.ptdf` claim in PR #105 is PTDF-limited flow, i.e.
          # `network.power_flow.sensitivity_limits.ptdf`.
          value: n
          source:
            # Design report sec. 2.1 and 2.2.2.
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES-Grid-Features-Report.pdf
      probabilistic_reliability_assessment:
        loss_of_load:
          value: n
          source: []
        unserved_energy:
          value: n
          source: []
        capacity_credit:
          value: n
          source: []
    transformation:
      aggregation:
        # Changed from the 0.2.0 list: aggregation of results into sectors/groups is done in VEDA-BE (a
        # separate product).
        value: n
        source: []
      disaggregation:
        value: n
        source: []
      scenario_comparison:
        # Results of several runs are compared in VEDA-BE, not in TIMES.
        value: n
        source: []
