# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against TIMES v4.9.7 (released 12th August 2026), the latest release of etsap-TIMES/TIMES_model.
# Documentation links point to the Read the Docs edition of the official TIMES documentation (Parts I-IV,
# (c) IEA-ETSAP, migrated from the PDFs in etsap-TIMES/TIMES_Documentation; only `latest` is published),
# to user notes in etsap-TIMES/TIMES_Documentation (pinned to a commit), to extension documents on the
# IEA-ETSAP website, and to the GAMS source pinned to the v4.9.7 tag.
# VEDA (KanORS, commercial), TIMES-MIRO (GAMS) and xl2times are treated as companion tools: capabilities
# provided only by them are `n`, with a comment.
# No open pull requests exist in etsap-TIMES/TIMES_model or etsap-TIMES/TIMES_Documentation, so there are no `dev` entries.

version: 'v4.9.7'
features:
  processes:
    boundary_exchange:
      value: y
      source:
        # Import/export and mining processes (exogenous trade), bounded by activity/cumulative bounds.
        - https://times.readthedocs.io/en/latest/part-1/01-introduction.html#the-supply-component-of-a-times-scenario
        - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#structure-and-types-of-endogenous-trade
    conversion:
      one_to_one:
        value: y
        source:
          - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#general-processes
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#eq-ptrans-r-v-t-p-cg1-cg2-s-efficiency-definition
      multi_carrier_io:
        value: y
        source:
          # Commodity groups on input/output, e.g. back-pressure CHP with fixed heat/power ratio.
          - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#back-pressure-turbine-systems
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#defining-flow-relationships-in-a-process
      flexible_ratio:
        value: y
        source:
          # Flexible processes with flow-share bounds (FLO_SHAR); pass-out CHP operating region.
          - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#pass-out-turbine-systems
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#limiting-flow-shares-in-flexible-processes
    temporal_transfer:
      value: y
      source:
        # Timeslice, day/night, inter-period and general (STS) storage processes.
        - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#storage-processes
        - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#storage-processes-class-stg
    spatial_transfer:
      value: y
      source:
        - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#inter-regional-exchange-processes-class-ire
        - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#inter-regional-exchange-processes
    delayed_transfer:
      value: n
      source: []
    buffered_transfer:
      value: y
      source:
        # Dynamic linepack in gas grids with Weymouth equations.
        - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
        - https://iea-etsap.org/wp-content/uploads/2026/06/Gas-pipelines-modelling.pdf
        - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/gasgrids.vda
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source: []
    explicit_demand:
      inelastic:
        value: y
        source:
          # Demand commodities with exogenous projections are balanced like any other commodity;
          # load-shifting storage processes represent shiftable demand.
          - https://times.readthedocs.io/en/latest/part-1/01-introduction.html#the-demand-component-of-a-times-scenario
          - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#load-shifting-storage-processes
      price_responsive:
        value: y
        source:
          # Elastic demands (partial equilibrium), stepwise-linearised demand curves.
          - https://times.readthedocs.io/en/latest/part-1/04-times-math.html#defining-demand-functions
          - https://times.readthedocs.io/en/latest/part-2/10-demand-functions/03-parameters.html#switches
      mobile_storage:
        value: n
        source: []
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: y
          source:
            # Linear DC power flow in phase-angle or PTDF formulation (grid modelling features).
            - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
            # Design report sec. 2 (PTDF-based formulation with transmission expansion planning).
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES-Grid-Features-Report.pdf
            - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#electricity-grid-modeling
            - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/powerflo.vda
        ac_opf:
          value: n
          source: []
        unbalanced_flows:
          value: n
          source: []
      sensitivity_limits:
        ptdf:
          value: y
          source:
            # `GR_PTDF(r,y,p,n,r2,n2)` lets the user supply PTDFs for the PTDF formulation.
            - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
            # Design report sec. 2.1-2.2: a precomputed PTDF matrix covering existing and candidate
            # lines, with virtual flows cancelling unbuilt lines.
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES-Grid-Features-Report.pdf
        outage_factors:
          value: n
          source: []
        generic_constraints:
          value: n
          source: []
      network_limits:
        thermal:
          value: y
          source:
            # Line capacities (and candidate line capacity bounds) limit DC flows.
            - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
        phase_angle:
          # Phase-angle variables (VAR_COMAUX) exist in the phase-angle formulation, but only the
          # reference node's angle is fixed; no parameter bounds angle differences. PR #105 claimed `y`
          # from the grid features note, which documents angle-based flow equations, not angle limits.
          value: n
          source:
            - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
            - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/powerflo.vda#L222-L224
      losses:
        # Grid line losses are fixed proportions (or allocated in proportion to demand), not flow-dependent.
        value: n
        source:
          - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
      network_devices:
        transformers:
          value: n
          source: []
        facts_devices:
          value: n
          source: []
        hvdc_converters:
          value: n
          source: []
    hydraulic_flow:
      linearised_flow:
        value: y
        source:
          # Linearised Weymouth equations with nodal pressure bounds (GG_PRBD) and compressor boosts
          # (GG_GAMMA).
          - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
          # Design report sec. 3.2.4.
          - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES-Grid-Features-Report.pdf
          - https://iea-etsap.org/wp-content/uploads/2026/06/Gas-pipelines-modelling.pdf
          - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/gasgrids.vda
      composition_tracking:
        # Tenuous: multi-carrier pipelines carry several commodities (e.g. natural gas and biogas), each
        # balanced separately; blend limits must be added with flow-share bounds or user constraints.
        value: y
        source:
          - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
  decisions:
    investment:
      exogenous_capacity:
        value: y
        source:
          # Existing capacity (NCAP_PASTI) and fixed capacity bounds.
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#capacity-transfer-conservation-of-investments
      continuous_capacity:
        value: y
        source:
          - https://times.readthedocs.io/en/latest/part-2/05-variables.html#var-ncap-r-v-p
      integer_investment_exogenous_capacity:
        value: y
        source:
          # Lumpy investments (NCAP_DISC) as a MIP.
          - https://times.readthedocs.io/en/latest/part-1/10-lumpy-investment.html#formulation-and-solution-of-the-mixed-integer-linear-program
          - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-dscncap
      integer_investment_continuous_capacity:
        value: y
        source:
          # Semi-continuous new capacity above a minimum size (NCAP_SEMI).
          - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-dscncap
          - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
      multi_period:
        value: y
        source:
          - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#time-horizon
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#decision-variables
      retrofit:
        value: y
        source:
          # Retrofits and lifetime extensions (PRC_REFIT).
          - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eql-refit
          - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Refits-Note.pdf
      endogenous_retirement:
        value: y
        source:
          - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#early-retirement-of-capacity
          - https://times.readthedocs.io/en/latest/part-1/10-lumpy-investment.html#discrete-early-retirement-of-capacity
    operation:
      unit_commitment:
        value: y
        source:
          # Dispatching and unit commitment extension; linearised by default, with a discrete (MIP)
          # option.
          - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
          - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eqe-actups
      maintenance_scheduling:
        value: y
        source:
          # Ancillary Balancing Services (ABS) extension: TIMES optimally decides when maintenance takes
          # place.
          - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Introducing-ancillary-services-markets.pdf
          - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/equ_ext.abs
  constraints:
    scope:
      temporal:
        pointwise:
          investment:
            value: y
            source:
              # Bounds on new capacity per period (NCAP_BND).
              - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#bounds
          operation:
            availability_derating:
              value: y
              source:
                # Timeslice-specific availability factors (NCAP_AF/NCAP_AFS), including for storage
                # levels.
                - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#eq-capact-r-v-t-p-s-use-of-capacity
                - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#availability-factors-for-storage-processes
            minimum_stable_level:
              value: y
              source:
                # ACT_MINLD on online capacity (dispatching extension).
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eqe-actups
            forced_offline:
              value: y
              source:
                # Zero timeslice availability factor or activity bound in given timeslices.
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-capact
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-actbnd
            forced_online:
              value: y
              source:
                # Lower availability-factor or activity bounds per timeslice (must-run).
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-capact
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-actbnd
        sequential:
          investment:
            availability_window:
              value: y
              source:
                # NCAP_START (earliest start year) and construction lead times (NCAP_ILED).
                - https://times.readthedocs.io/en/latest/part-2/03-parameters.html#overview-of-user-input-parameters
                - https://times.readthedocs.io/en/latest/part-1/13-history.html#investment-and-dismantling-lead-times-and-costs
            relative_build_rate:
              value: y
              source:
                # Growth constraints via user constraints with the GROWTH modifier.
                - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#growth-constraints
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#growth-modifier
            technical_lifetime:
              value: y
              source:
                - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#eq-cpt-r-t-p-capacity-transfer
          operation:
            ramping:
              value: y
              source:
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-actramp
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
            start_shut_trajectory:
              value: y
              source:
                # Start-up and shut-down phases by start-up type (ACT_SDTIME).
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
            commitment_duration:
              value: y
              source:
                # Minimum up/down times (ACT_TIME UP/LO).
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eql-actupc
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
            start_consumption:
              # Tenuous: represented as increased specific fuel consumption during the start-up phase
              # (ACT_LOSSD), not as a lump fuel requirement per start.
              value: y
              source:
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
        cumulative:
          investment:
            capacity_target:
              value: y
              source:
                # Installed capacity bounds (CAP_BND) and peaking reserve with capacity credit
                # (NCAP_PKCNT).
                - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#bounds
                - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#eq-peak-r-t-c-s-commodity-peak-requirement
            expansion_budget:
              value: y
              source:
                # Bounds on regional (cumulative) cost components, incl. investment costs
                # (REG_BNDCST).
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-bndcst
            event_count:
              value: n
              source: []
            path_dependent:
              # Endogenous learning (ETL) acts on investment cost, not on deployment bounds (see
              # `cost.scope.temporal.cumulative.investment`).
              value: n
              source:
                - https://times.readthedocs.io/en/latest/part-1/11-tech-learning.html#the-times-formulation-of-etl
          operation:
            flow_volume:
              value: y
              source:
                # Cumulative bounds on flows, activity and commodity production (FLO_CUM, ACT_CUM,
                # COM_CUMPRD).
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-cumflo
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-cumnet-prd
            impact_budget:
              value: y
              source:
                # Annual or cumulative bounds on emission commodities (COM_BNDNET / COM_CUMNET);
                # climate-module bounds.
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-cumnet-prd
                - https://times.readthedocs.io/en/latest/part-2/07-climate-module/03-parameters.html#upper-bounds-on-climate-variables
            event_count:
              value: y
              source:
                # Maximum number of start-up cycles within each process timeslice cycle (ACT_TIME
                # with bd=N).
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
            state_duration:
              value: n
              source: []
            path_dependent:
              # Storage lifetime cycle limits (STG_MAXCYC) can be exceeded by paying for replacement
              # capacity rather than lowering available capacity; recorded under
              # `cost.scope.temporal.cumulative.operation` instead.
              value: n
              source:
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-stgccl
        boundary_conditions:
          investment:
            value: y
            source:
              # Residual capacity stock (NCAP_PASTI); end-state targets via capacity bounds in the
              # final period.
              - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#capacity-transfer-conservation-of-investments
              - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#bounds
          operation:
            value: y
            source:
              # Initial storage levels and inter-period storage; FIXBOH fixes early periods to a
              # previous solution.
              - https://times.readthedocs.io/en/latest/part-2/06-equations.html#eq-stgips-storage-between-periods
              - https://times.readthedocs.io/en/latest/part-3/03-switches.html#fixing-initial-periods-fixboh
      spatial:
        investment:
          value: y
          source:
            # User constraints can sum over regions (EQ_UC / EQ_UCT).
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-uc-eqe-uc
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-uct-eqe-uct
        operation:
          value: y
          source:
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-l-uc-eqe-uc
            - https://times.readthedocs.io/en/latest/part-2/07-climate-module/03-parameters.html#mapping-of-regional-emissions-to-global-emissions
      assets:
        spanning:
          investment:
            value: y
            source:
              - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#user-constraints
              - https://times.readthedocs.io/en/latest/part-2/06-equations.html#lhs-user-constraints
          operation:
            value: y
            source:
              - https://times.readthedocs.io/en/latest/part-1/05-times-optimisation.html#user-constraints
              - https://times.readthedocs.io/en/latest/part-2/06-equations.html#lhs-user-constraints
        dedicated_flow_routing:
          # Tenuous: no dedicated construct; flows are routed to named processes by defining a dedicated
          # commodity between them, as the RES topology is fully user-defined.
          value: y
          source:
            - https://times.readthedocs.io/en/latest/part-1/02-basic-structure.html#the-res
    functional_form:
      linear_multi_variable:
        investment:
          value: y
          source:
            # User constraints on capacity/new-capacity terms, e.g. CAPFLO/CAPACT modifiers.
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#lhs-user-constraints
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#capflo-modifier
        operation:
          value: y
          source:
            # Flow-share bounds (EQ_INSHR/OUTSHR) and pass-out CHP operating regions.
            - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equations-eq-l-inshr-eq-l-outshr
            - https://times.readthedocs.io/en/latest/part-2/04-special-processes.html#pass-out-turbine-systems
      quadratic:
        investment:
          value: n
          source: []
        operation:
          value: n
          source: []
      nonlinear:
        investment:
          # The non-linear MACRO production function (TIMES-MACRO) couples energy-system cost to the
          # economy but does not constrain individual investment decisions non-linearly.
          value: n
          source:
            - https://times.readthedocs.io/en/latest/part-1/12-general-equilibrium.html#formulation-of-the-macro-model
        operation:
          value: n
          source: []
    reliability:
      unserved_demand:
        # Tenuous: via high-cost dummy import (backstop) processes for commodities and demands, which VEDA
        # adds by default; there is no dedicated load-shedding variable in TIMES.
        value: y
        source:
          - https://times.readthedocs.io/en/latest/part-4/02-intro-to-veda.html#transformation-insert-and-update-tables
      operating_reserve:
        online_headroom:
          value: y
          source:
            # ABS extension: spinning reserve provision from online capacity (FCR/aFRR/mFRR/RR).
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Introducing-ancillary-services-markets.pdf
            - https://github.com/etsap-TIMES/TIMES_model/blob/v4.9.7/equ_ext.abs
        standby_capability:
          value: y
          source:
            # ABS extension: mFRR/RR reserves can be supplied by offline (non-spinning) capacity.
            - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Introducing-ancillary-services-markets.pdf
        inertia:
          value: n
          source: []
      contingency_constrained:
        # Tenuous: simplified N-1 security constraints bound each region's net grid injection by a fraction
        # of its interconnection capacity (GR_XBND), rather than enforcing post-contingency feasibility per
        # outage.
        value: y
        source:
          - https://github.com/etsap-TIMES/TIMES_Documentation/blob/ae3b6eee0d785cbf30d20ec66c1d33b632693d10/User_Notes/TIMES-Grid-Features.pdf
          # Design report sec. 3.3.2.
          - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES-Grid-Features-Report.pdf
      probabilistic_reliability_limit:
        loss_of_load:
          value: n
          source: []
        unserved_energy:
          value: n
          source: []
    soft_constraints:
      value: n
      source: []
  cost:
    scope:
      temporal:
        sequential:
          investment:
            value: y
            source:
              # Decommissioning (dismantling) costs NCAP_DCOST.
              - https://times.readthedocs.io/en/latest/part-2/06-equations.html#decommissioning-dismantling-capital-costs-invdecom-y
          operation:
            ramping:
              value: y
              source:
                # Ramp-up/down costs (ACT_CSTRMP).
                - https://times.readthedocs.io/en/latest/part-2/06-equations.html#equation-eq-actrampc
            start_up:
              value: y
              source:
                # ACT_CSTUP / ACT_CSTSD(UP).
                - https://iea-etsap.org/wp-content/uploads/2025/10/TIMES_Dispatching-and-unit-commitment.pdf
            shut_down:
