        # Metadata sidecar only (the CSV results are not OEO-formatted): FAME-Io writes a `metadata.json` next to the results, by default following the Open Energy Ontology (OEO) metadata template.
        value: y
        source:
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/output/metadata_json.md
  preprocessing:
    download:
      # `amiris download` retrieves the AMIRIS jar and the example scenarios, not input data; the example repository has scripts to extract public price data but they are not part of the tool.
      value: n
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
        - https://gitlab.com/dlr-ve/esy/amiris/examples/-/blob/v8.0.0/backtest/scripts/README.md
    model_catalogue:
      # The AMIRIS-Examples repository (v8.0.0, built for AMIRIS 5.0.0) provides demo and backtest scenarios (Germany 2015-2019, Austria 2019); AMIRIS-Py v4.0.1 `amiris download -m examples` retrieves them.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/examples/-/blob/v8.0.0/README.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
    resource_conversion:
      value: n
      source: []
    forecasting:
      value: n
      source: []
    spatial_distribution:
      demand:
        value: n
        source: []
      network_geometry:
        value: n
        source: []
    scenario_generation:
      value: n
      source: []
    input_validation:
      # FAME-Io validates the scenario against the model `schema.yaml` (attribute types, mandatory attributes, contracts) when compiling.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Get-Started/FameioSetup.md
        - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/input/schema.rst
  postprocessing:
    metrics:
      operational:
        capacity_factor:
          value: n
          source: []
        operating_hours:
          value: n
          source: []
        binding_hours:
          value: n
          source: []
        curtailment:
          value: n
          source: []
      financial:
        marginal_price:
          # `DayAheadMarket` writes the clearing price (`ElectricityPriceInEURperMWH`) per market zone and time step; there is no nodal or component split.
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/DayAheadMarket.md
        price_formation:
          # Uniform-price merit-order clearing (`MeritOrderKernel`) with a documented scarcity rule (`ShortagePrice`: `ScarcityPrice` or `LastSupplyPrice`).
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Modules/MarketClearing.md
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Modules/MeritOrderKernel.md
        water_value:
          value: n
          source: []
        asset_accounts:
          # Plant operators report received money, variable costs, fixed costs and investment annuity, optionally per plant.
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/PowerPlantOperator.md
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/ConventionalPlantOperator.md
        contract_settlement:
          # `SupportPolicy` settles feed-in tariffs, market premia, capacity premia and (financial) contracts for difference against realised market values and generation.
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/SupportPolicy.md
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/HydrogenSupportPolicy.md
        levelised_cost:
          value: n
          source: []
        net_present_value:
          value: n
          source: []
      impact_assessment:
        emissions:
          # `ConventionalPlantOperator` reports CO2 emissions (`Co2EmissionsInT`) and `CarbonMarket` totals them (its documentation page still uses the pre-5.0.0 column name `Co2EmissionsInTons`).
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/ConventionalPlantOperator.md
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/CarbonMarket.md
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/src/main/java/agents/markets/CarbonMarket.java
        resource_use:
          value: n
          source: []
        socioeconomic:
          value: n
          source: []
      network_transfer_metrics:
        transfer_capacity:
          # `MarketCoupling` reports the available and the used transfer capacity between market zones.
          value: y
          source:
            - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/MarketCoupling.md
        flow_sensitivity:
          value: n
          source: []
      probabilistic_reliability_assessment:
        loss_of_load:
          value: n
          source: []
        unserved_energy:
          value: n
          source: []
        capacity_credit:
          value: n
          source: []
    transformation:
      aggregation:
        value: n
        source: []
      disaggregation:
        value: n
        source: []
      scenario_comparison:
        # `amiris batch` writes each scenario's results to a separate folder and `amiris compare` only checks two result sets for equivalence; results are not collated or compared.
        value: n
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
  interface:
    gui:
      build:
        value: n
        source: []
      run:
        value: n
        source: []
      analyse:
        value: n
        source: []
    api:
      build:
        # FAME-Io v4.0.2 compiles a scenario from Python (`fameio.scripts.compile.run`).
        value: y
        source:
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/compile.md
      run:
        # AMIRIS-Py v4.0.1 exposes the CLI as a Python function (`amirispy.scripts.amiris_cli`) to run scenarios from scripts.
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
      analyse:
        # FAME-Io only converts results to CSV/JSON (callable from Python); AMIRIS ships no analysis API.
        value: n
        source:
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/extract.md
    cli:
      build:
        # `fameio compile` builds the input file from the scenario YAML.
        value: y
        source:
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/compile.md
      run:
        # `amiris run` compiles, executes and extracts results in one command.
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Get-Started/QuickStart.md
      analyse:
        value: n
        source: []
    solver_configuration:
      value: n
      source: []
    remote_execution:
      value: n
      source: []
    visualisation:
      charts:
        value: n
        source: []
      network_maps:
        value: n
        source: []
      report_templates:
        value: n
        source: []
  traceability:
    metadata:
      provenance:
        # Scenarios carry a free-form `Metadata` section (the examples give run id, version, AMIRIS version, licences, publication date); FAME-Io writes run id, publication date, embargo period and licences to `metadata.json` next to the results.
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/examples/-/blob/v8.0.0/demo/Simple/scenario.yaml
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/input/scenario_metadata.md
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/output/metadata_json.md
      units:
        # The schema declares a unit and an OEO `isAbout` term per attribute and FAME-Io copies them to the metadata, but units are neither validated nor converted in the pipeline.
        value: n
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/input/schema.yaml
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/input/scenario_schema_metadata.md
      propagation:
        # `fameio extract --input-recovery` writes the inputs that produced a result alongside it, and `metadata.json` links results to the scenario.
        value: y
        source:
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/extract.md
          - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/output/metadata_json.md
    run_logs:
      # AMIRIS logs via logback (console); FAME-Io (`--logfile`) and AMIRIS-Py (`--logfile`) can write log files.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/src/main/resources/logback.xml
        - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/compile.md
        - https://gitlab.com/fame-framework/fame-io/-/blob/v4.0.2/docs/source/usage/extract.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris-py/-/blob/v4.0.1/README.md
    intermediate_access:
      value: n
      source: []
    infeasibility_diagnosis:
      value: n
      source: []
