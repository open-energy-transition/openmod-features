# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against AMIRIS v5.0.0 (released 10th September 2026). Documentation and source links are pinned to the `v5.0.0` git tag
# of https://gitlab.com/dlr-ve/esy/amiris/amiris. `n` entries have no corresponding implementation in v5.0.0, or one that depends on a non-open external service; where one has a comment or source, it explains why.
# AMIRIS is an agent-based simulation, not an optimisation model: there is no system-wide objective, solver, network or investment model,
# so most optimisation-oriented leaves are `n`. Flexibility agents optimise their own dispatch by dynamic programming against price forecasts.
# Companion tools (all open-source, referenced in the AMIRIS documentation) are cited with the version they were assessed at:
# FAME-Io v4.0.2 (compiles scenarios, extracts results; AMIRIS 5.0.0 requires FAME-Io >= 4.0), AMIRIS-Py v4.0.1 (CLI wrapper) and
# the AMIRIS-Examples v8.0.0 scenarios (built for AMIRIS 5.0.0).

version: 'v5.0.0'
features:
  processes:
    boundary_exchange:
      # `ImportTrader` offers exogenous imports as supply from a time series; `FuelsMarket` and `CarbonMarket` supply fuels and CO2 allowances at exogenous price time series.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/ImportTrader.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/FuelsMarket.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/CarbonMarket.md
    conversion:
      one_to_one:
        # Conventional `PowerPlant`s convert a fuel into electricity at an efficiency; the electrolyser converts electricity into hydrogen and the heat pump electricity into heat (via a COP).
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Modules/PowerPlant.md
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Modules/Electrolyzer.md
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/HeatPumpTrader.md
      multi_carrier_io:
        value: n
        source: []
      flexible_ratio:
        value: n
        source: []
    temporal_transfer:
      # Storage `Device` with a state of charge, charging/discharging efficiencies and self-discharge, operated by `StorageTrader`; load shifting and heat pump thermal storage also move energy in time.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Modules/Device.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/StorageTrader.md
    spatial_transfer:
      # `MarketCoupling` transfers demand between `DayAheadMarketMultiZone` market zones within transmission capacity limits, without network physics.
      value: y
      source:
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/MarketCoupling.md
        - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/DayAheadMarketMultiZone.md
    delayed_transfer:
      value: n
      source: []
    buffered_transfer:
      value: n
      source: []
    discrete_transport:
      value: n
      source: []
    state_changing_transfer:
      value: n
      source: []
    explicit_demand:
      inelastic:
        # `DemandTrader` buys demand time series; the non-sheddable baseline demand is bid at the technical price maximum.
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/DemandTrader.md
      price_responsive:
        # `DemandTrader` takes several load time series, each with its own `ValueOfLostLoad` as bid price, forming a stepwise willingness-to-pay curve; `LoadShiftingTrader` shifts demand against prices.
        value: y
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/DemandTrader.md
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/LoadShiftingTrader.md
      mobile_storage:
        # `EvTraderExternal` models EV fleets, but delegates the charging prediction to an external machine-learning service (`ServiceUrl`) for which no open-source implementation is referenced.
        value: n
        source:
          - https://gitlab.com/dlr-ve/esy/amiris/amiris/-/blob/v5.0.0/docs/Classes/Agents/EvTraderExternal.md
