    conversion:
      one_to_one:
        # Heat pump converts electric power to heat with a temperature-dependent COP.
        value: y
        source:
          - https://github.com/JakobHarz/NOSTES/blob/3534b8b56a646433379ac0377850f537aeb56190/systemmodels/systemModel.py#L84-88
      multi_carrier_io:
        value: n
        source: []
      flexible_ratio:
        value: n
        source: []
    temporal_transfer:
