# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/tool-schema.yaml

# Assessed against NOSTES commit 3534b8b (19th July 2025), the tip of the default branch (`main`); the repository has no tagged releases.
# All source links are pinned to that commit.
# NOSTES is a single-site research toolbox, so many network, market and uncertainty features are `n` by design.
# Leaves left as `?` were not assessable from the code or documentation.

version: '3534b8b'
features:
  processes:
    boundary_exchange:
      # Electricity can be bought from / sold to the grid at fixed prices (`P_Grid_buy`, `P_Grid_sell`); PV and wind enter as exogenous profiles.
      value: y
      source:
        - https://github.com/JakobHarz/NOSTES/blob/3534b8b56a646433379ac0377850f537aeb56190/systemmodels/systemModel.py#L96-105
