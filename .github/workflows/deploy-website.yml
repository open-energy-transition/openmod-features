name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - features.yaml
      - tools/**
      - use-cases/**
      - website/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: website
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install website dependencies
        run: pixi run -e website pnpm --dir website install --frozen-lockfile

      - name: Build website
        env:
          # e.g. `/openmod-features`, or empty when served from a custom domain.
          DEPLOY_BASE: ${{ steps.pages.outputs.base_path }}
        run: pixi run -e website pnpm --dir website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
