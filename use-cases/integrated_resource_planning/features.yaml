    discrete_transport:
      value: n
    state_changing_transfer:
      value: n
    explicit_demand:
      inelastic:
        value: y
      price_responsive:
        value: n
      mobile_storage:
        # EV smart charging / vehicle-to-grid is a major source of flexibility in sector-coupled 2050 scenarios.
        value: y
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          # Changed from the 0.2.0 list, which was inconsistent (DC OPF in the assumptions, transport model in the
          # values): regional transfer capacities suffice at IRP spatial resolution.
          value: n
        ac_opf:
          value: n
        unbalanced_flows:
          value: n
      sensitivity_limits:
        ptdf:
          value: n
        outage_factors:
