        # built continuously and rounded post hoc.
        value: y
      integer_investment_continuous_capacity:
        value: n
      multi_period:
        value: y
      retrofit:
        value: n
      endogenous_retirement:
        value: y
    operation:
      unit_commitment:
        # Linearised in the expansion run (`tractability.reformulation.linearised_unit_commitment`) and full in the
        # validation run.
        value: y
      maintenance_scheduling:
        value: n
