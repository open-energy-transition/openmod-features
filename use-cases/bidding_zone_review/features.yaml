# yaml-language-server: $schema=https://raw.githubusercontent.com/open-energy-transition/openmod-features/v0.3.0/schema/use-case-schema.yaml

assumptions:
- >-
  A single target year is modelled.
  Generation, storage, and transmission capacities are fixed by the integrated resource plan (IRP) and network development plan (NDP);
  no investment decisions are made.
- >-
  Several candidate bidding-zone configurations are compared,
  each formed by grouping the nodes of a detailed transmission grid model into zones.
- >-
  For each configuration, the day-ahead market is cleared zonally using flow-based market coupling.
  Zone-to-line power transfer distribution factors (PTDFs) and critical network elements and contingencies (CNECs) are supplied as
  inputs.
- >-
  The market schedule is redispatched on the nodal grid model (DC power flow, N-1 security).
  Deviations from the schedule is priced at redispatch offers, giving congestion and redispatch costs per configuration.
- >-
  Thermal and hydro units are resolved individually, with unit commitment and stepwise bid curves, to represent day-ahead scheduling realistically.
- >-
  The year is optimised in rolling windows of days to weeks (myopic foresight within the year), handing storage levels over between windows.
  Seasonal hydro storage is valued with water values from a longer-horizon run.
- >-
  Only the power system is modelled.
  Other sectors enter as exogenous demand profiles and price-responsive demand bids.
- >-
  Weather uncertainty is covered by running several historical climate years as separate deterministic scenarios rather than by stochastic optimisation.
- >-
  Load shedding is allowed at the value of lost load (VOLL).
  Adequacy is not a decision criterion, so no probabilistic reliability limits are applied.
- >-
  Configurations are assessed on socio-economic welfare,
  zonal price differences, cross-zonal capacities, congestion rents,
  redispatch volumes and costs, generator revenues, and CO2 emissions.
- >-
  Users require a GUI to navigate model preparation, optimisation, and analysis.
