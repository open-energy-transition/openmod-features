        value: y
      price_responsive:
        value: y
      mobile_storage:
        value: n
  network:
    power_flow:
      optimal_power_flow:
        dc_opf:
          value: y
        ac_opf:
          # Changed from the 0.2.0 list (security-constrained AC OPF): reactive power and voltage are not bidding-
          # zone criteria, so linearised DC power flow with N-1 security is sufficient.
          value: n
        unbalanced_flows:
          value: n
      sensitivity_limits:
        ptdf:
          value: y
        outage_factors:
          value: y
        generic_constraints:
          # CNECs enter the flow-based market model as constraints with supplied PTDF coefficients.
          value: y
      network_limits:
        thermal:
          value: y
        phase_angle:
          value: n
      losses:
        value: n
      network_devices:
        transformers:
          value: y
        facts_devices:
          # Tenuous: optimised phase-shifter set-points are a common remedial action in redispatch, but fixed settings may suffice.
          value: y
        hvdc_converters:
          value: y
    hydraulic_flow:
      linearised_flow:
        value: n
      composition_tracking:
        value: n
  decisions:
