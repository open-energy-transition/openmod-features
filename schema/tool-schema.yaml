$defs:
  ActorsModel:
    additionalProperties: false
    properties:
      distributed_objectives:
        $ref: '#/$defs/ToolFeatureModel'
        description: Per-actor objectives can be represented within the system-level
          optimisation (e.g. prosumer decisions).
      equilibrium:
        $ref: '#/$defs/ToolFeatureModel'
        description: Market equilibrium across actors with competing objectives can
          be computed (e.g. Cournot-Nash via complementarity or bi-level formulations).
      heuristic_markup:
        $ref: '#/$defs/ToolFeatureModel'
        description: Strategic price/offer markups can be applied by heuristic or
          index-based rules (e.g. Residual Supply Index <RSI>-driven markups).
      portfolio:
        $ref: '#/$defs/ToolFeatureModel'
        description: Actor asset portfolios with their own constraints and costs can
          be represented (e.g. capital limits per company).
    title: ActorsModel
    type: object
  ConstraintsFunctionalFormLinearMultiVariableModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A linear relationship can link several investment decision variables
          (e.g. storage energy-to-power ratio envelopes).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A linear relationship can link several operating decision variables
          (e.g. CHP heat-power operating regions).
    title: ConstraintsFunctionalFormLinearMultiVariableModel
    type: object
  ConstraintsFunctionalFormModel:
    additionalProperties: false
    properties:
      linear_multi_variable:
        $ref: '#/$defs/ConstraintsFunctionalFormLinearMultiVariableModel'
        description: Linear relationships can link several decision variables, beyond
          the built-in coupling of flow to capacity.
      nonlinear:
        $ref: '#/$defs/ConstraintsFunctionalFormNonlinearModel'
        description: Constraints can link decision variables in a general non-linear
          relationship.
      quadratic:
        $ref: '#/$defs/ConstraintsFunctionalFormQuadraticModel'
        description: Constraints can contain products of decision variables, passed
          natively to a QCP-capable solver.
    title: ConstraintsFunctionalFormModel
    type: object
  ConstraintsFunctionalFormNonlinearModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A non-linear constraint can involve an investment decision variable
          (e.g. pipeline throughput scaling with diameter).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A non-linear constraint can involve an operating decision variable
          (e.g. part-load efficiency, hydro head effects).
    title: ConstraintsFunctionalFormNonlinearModel
    type: object
  ConstraintsFunctionalFormQuadraticModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A quadratic constraint can involve an investment decision variable.
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A quadratic constraint can involve an operating decision variable
          (e.g. quadratic loss terms).
    title: ConstraintsFunctionalFormQuadraticModel
    type: object
  ConstraintsModel:
    additionalProperties: false
    properties:
      functional_form:
        $ref: '#/$defs/ConstraintsFunctionalFormModel'
        description: The mathematical form of relationships between decision variables
          in constraints, and hence the problem class handed to the solver.
      reliability:
        $ref: '#/$defs/ConstraintsReliabilityModel'
        description: Requirements against component failure or short-term imbalance
          can be imposed within the optimisation.
      scope:
        $ref: '#/$defs/ConstraintsScopeModel'
        description: Which model dimensions a limit engages. A limit engaging several
          dimensions is recorded under each of them (e.g. a fleet-wide annual cap
          is both `temporal` and `assets`).
      soft_constraints:
        $ref: '#/$defs/ToolFeatureModel'
        description: Any user-defined or built-in constraint can be made soft through
          a generic slack-plus-penalty mechanism.
    title: ConstraintsModel
    type: object
  ConstraintsReliabilityModel:
    additionalProperties: false
    properties:
      contingency_constrained:
        $ref: '#/$defs/ToolFeatureModel'
        description: The optimisation can be constrained to remain feasible after
          the loss of individual components (e.g. N-1 security-constrained optimal
          power flow, loss of a compressor station).
      operating_reserve:
        $ref: '#/$defs/ConstraintsReliabilityOperatingReserveModel'
        description: A short-term reserve requirement can be held and co-optimised
          with dispatch.
      probabilistic_reliability_limit:
        $ref: '#/$defs/ConstraintsReliabilityProbabilisticReliabilityLimitModel'
        description: Probabilistic reliability limits, approximated from outage statistics,
          can be applied within the optimisation.
      unserved_demand:
        $ref: '#/$defs/ToolFeatureModel'
        description: Demand can go unserved at a penalty cost (value of lost load
          <VOLL>).
    title: ConstraintsReliabilityModel
    type: object
  ConstraintsReliabilityOperatingReserveModel:
    additionalProperties: false
    properties:
      inertia:
        $ref: '#/$defs/ToolFeatureModel'
        description: A requirement can be held on synchronised rotational energy rather
          than on power headroom (e.g. minimum system inertia).
      online_headroom:
        $ref: '#/$defs/ToolFeatureModel'
        description: A requirement can be met from spare capability on running assets
          (e.g. spinning reserve, frequency regulation).
      standby_capability:
        $ref: '#/$defs/ToolFeatureModel'
        description: A requirement can be met from offline assets that can start within
          a defined response time (e.g. non-spinning reserve). Usually requires `decisions.operation.unit_commitment`.
    title: ConstraintsReliabilityOperatingReserveModel
    type: object
  ConstraintsReliabilityProbabilisticReliabilityLimitModel:
    additionalProperties: false
    properties:
      loss_of_load:
        $ref: '#/$defs/ToolFeatureModel'
        description: A loss-of-load-probability <LOLP> limit can be applied.
      unserved_energy:
        $ref: '#/$defs/ToolFeatureModel'
        description: An expected-energy-not-served <EENS> limit can be applied.
    title: ConstraintsReliabilityProbabilisticReliabilityLimitModel
    type: object
  ConstraintsScopeAssetsModel:
    additionalProperties: false
    properties:
      dedicated_flow_routing:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carrier out-flow from one asset can be reserved as in-flow to
          specific other assets, rather than pooled at the node (e.g. fuel stockpiling,
          hydro cascades).
      spanning:
        $ref: '#/$defs/ConstraintsScopeAssetsSpanningModel'
        description: A single limit can span several assets.
    title: ConstraintsScopeAssetsModel
    type: object
  ConstraintsScopeAssetsSpanningModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single investment limit can span several assets (e.g. a combined
          technology capacity target, land-use competition).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single operating limit can span several assets (e.g. a combined
          generation limit for a technology).
    title: ConstraintsScopeAssetsSpanningModel
    type: object
  ConstraintsScopeModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/ConstraintsScopeAssetsModel'
        description: Limits that engage the identity of individual assets, rather
          than applying to each asset alike.
      spatial:
        $ref: '#/$defs/ConstraintsScopeSpatialModel'
        description: A single limit can span several spatial units.
      temporal:
        $ref: '#/$defs/ConstraintsScopeTemporalModel'
        description: What a limit binds in time.
    title: ConstraintsScopeModel
    type: object
  ConstraintsScopeSpatialModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single investment limit can span several spatial units (e.g.
          a national deployment target).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single operating limit can span several spatial units (e.g.
          a system-wide emissions cap, a regional self-sufficiency requirement).
    title: ConstraintsScopeSpatialModel
    type: object
  ConstraintsScopeTemporalBoundaryConditionsModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Investment can start from an existing asset stock, or target
          a user-defined end-state (e.g. backcasting).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Initial or end-state operating values can be set, and their change
          between periods limited (e.g. start/end storage levels).
    title: ConstraintsScopeTemporalBoundaryConditionsModel
    type: object
  ConstraintsScopeTemporalCumulativeInvestmentModel:
    additionalProperties: false
    properties:
      capacity_target:
        $ref: '#/$defs/ToolFeatureModel'
        description: Installed capacity can be bounded above or below, counted at
          nameplate or at a de-rating / capacity-credit factor (e.g. deployment targets,
          technical potential, planning reserve margins).
      event_count:
        $ref: '#/$defs/ToolFeatureModel'
        description: The number of periods in which investment occurs can be limited,
          so that build-out is lumpy.
      expansion_budget:
        $ref: '#/$defs/ToolFeatureModel'
        description: Accumulated investment spend can be bounded (e.g. a portfolio
          capital budget).
      path_dependent:
        $ref: '#/$defs/ToolFeatureModel'
        description: An investment limit's bound can evolve endogenously with earlier
          investment (e.g. a learning curve raising deployable capacity in later periods).
    title: ConstraintsScopeTemporalCumulativeInvestmentModel
    type: object
  ConstraintsScopeTemporalCumulativeModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ConstraintsScopeTemporalCumulativeInvestmentModel'
        description: Accumulated investment can be limited.
      operation:
        $ref: '#/$defs/ConstraintsScopeTemporalCumulativeOperationModel'
        description: Accumulated operation can be limited.
    title: ConstraintsScopeTemporalCumulativeModel
    type: object
  ConstraintsScopeTemporalCumulativeOperationModel:
    additionalProperties: false
    properties:
      event_count:
        $ref: '#/$defs/ToolFeatureModel'
        description: The number of times a discrete event occurs can be limited over
          a period (e.g. maximum starts per year). Usually requires `decisions.operation.unit_commitment`.
      flow_volume:
        $ref: '#/$defs/ToolFeatureModel'
        description: Total carrier in-/out-flow can be bounded over a period (e.g.
          annual throughput limits, hydro/fuel budgets, minimum capacity factor).
      impact_budget:
        $ref: '#/$defs/ToolFeatureModel'
        description: Cumulative production or consumption of a user-definable non-carrier
          quantity can be bounded over a period (e.g. an annual CO2 cap, a water abstraction
          budget).
      path_dependent:
        $ref: '#/$defs/ToolFeatureModel'
        description: An operating limit's bound can evolve endogenously with earlier
          operation (e.g. battery degradation lowering available capacity).
      state_duration:
        $ref: '#/$defs/ToolFeatureModel'
        description: The cumulative number of timesteps an asset spends in a given
          state can be limited over a period (e.g. total operating hours). Usually
          requires `decisions.operation.unit_commitment`.
    title: ConstraintsScopeTemporalCumulativeOperationModel
    type: object
  ConstraintsScopeTemporalModel:
    additionalProperties: false
    properties:
      boundary_conditions:
        $ref: '#/$defs/ConstraintsScopeTemporalBoundaryConditionsModel'
        description: User-set conditions can be applied at the edges of a modelled
          period.
      cumulative:
        $ref: '#/$defs/ConstraintsScopeTemporalCumulativeModel'
        description: A limit can bind a quantity accumulated over part or all of the
          horizon, without fixing how it is distributed within that window.
      pointwise:
        $ref: '#/$defs/ConstraintsScopeTemporalPointwiseModel'
        description: A limit can bind each time period independently of any other.
      sequential:
        $ref: '#/$defs/ConstraintsScopeTemporalSequentialModel'
        description: A limit can bind the difference between time periods, or bind
          periods to one another, so that their order matters.
    title: ConstraintsScopeTemporalModel
    type: object
  ConstraintsScopeTemporalPointwiseModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: The capacity or number of units added or retired within an investment
          period can be bounded above and/or below (e.g. minimum viable project size,
          maximum units built per year).
      operation:
        $ref: '#/$defs/ConstraintsScopeTemporalPointwiseOperationModel'
        description: Operation can be limited within a timestep.
    title: ConstraintsScopeTemporalPointwiseModel
    type: object
  ConstraintsScopeTemporalPointwiseOperationModel:
    additionalProperties: false
    properties:
      availability_derating:
        $ref: '#/$defs/ToolFeatureModel'
        description: An asset's flow or stored level can be bounded within a timestep
          by a time-varying fraction of its capacity (e.g. renewable capacity factors,
          seasonal de-rating, storage level limits).
      forced_offline:
        $ref: '#/$defs/ToolFeatureModel'
        description: An asset can be required to be off in given timesteps (e.g. planned
          outage windows). Usually requires `decisions.operation.unit_commitment`.
      forced_online:
        $ref: '#/$defs/ToolFeatureModel'
        description: An asset can be required to be on in given timesteps (e.g. must-run
          units). Usually requires `decisions.operation.unit_commitment`.
      minimum_stable_level:
        $ref: '#/$defs/ToolFeatureModel'
        description: A committed asset's flow can be bounded below by a minimum stable
          level, so that it either operates at or above that level or is off. Usually
          requires `decisions.operation.unit_commitment`.
    title: ConstraintsScopeTemporalPointwiseOperationModel
    type: object
  ConstraintsScopeTemporalSequentialInvestmentModel:
    additionalProperties: false
    properties:
      availability_window:
        $ref: '#/$defs/ToolFeatureModel'
        description: The investment periods in which an asset may be built or retired
          can be restricted (e.g. lead times, earliest commissioning dates).
      relative_build_rate:
        $ref: '#/$defs/ToolFeatureModel'
        description: Capacity added in a period can be limited relative to earlier
          additions or installed capacity (e.g. technology growth limits).
      technical_lifetime:
        $ref: '#/$defs/ToolFeatureModel'
        description: Capacity built in one period can be forced out of service a fixed
          number of periods later (e.g. end of technical life).
    title: ConstraintsScopeTemporalSequentialInvestmentModel
    type: object
  ConstraintsScopeTemporalSequentialModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ConstraintsScopeTemporalSequentialInvestmentModel'
        description: Investment limits can link investment periods.
      operation:
        $ref: '#/$defs/ConstraintsScopeTemporalSequentialOperationModel'
        description: Operating limits can link timesteps.
    title: ConstraintsScopeTemporalSequentialModel
    type: object
  ConstraintsScopeTemporalSequentialOperationModel:
    additionalProperties: false
    properties:
      commitment_duration:
        $ref: '#/$defs/ToolFeatureModel'
        description: The number of consecutive timesteps an asset must or may remain
          in a commitment state can be limited (e.g. minimum up/down time). Usually
          requires `decisions.operation.unit_commitment`.
      ramping:
        $ref: '#/$defs/ToolFeatureModel'
        description: The change in an asset's flow between consecutive timesteps can
          be limited within its normal operating range.
      start_consumption:
        $ref: '#/$defs/ToolFeatureModel'
        description: A carrier in-flow can be required on a change of commitment state
          (e.g. start-up fuel). Usually requires `decisions.operation.unit_commitment`.
      start_shut_trajectory:
        $ref: '#/$defs/ToolFeatureModel'
        description: The flow trajectory while an asset starts up or shuts down can
          be limited separately from its normal operating range (e.g. run-up rates,
          start profiles). Usually requires `decisions.operation.unit_commitment`.
    title: ConstraintsScopeTemporalSequentialOperationModel
    type: object
  CostFunctionalFormFixedChargeModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A capital cost can be incurred per asset purchased, irrespective
          of capacity (e.g. land purchase). Usually requires `decisions.investment.integer_investment_...`.
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A cost can be incurred for each timestep an asset is committed,
          irrespective of its flow (e.g. no-load cost). Usually requires `decisions.operation.unit_commitment`.
    title: CostFunctionalFormFixedChargeModel
    type: object
  CostFunctionalFormModel:
    additionalProperties: false
    properties:
      fixed_charge:
        $ref: '#/$defs/CostFunctionalFormFixedChargeModel'
        description: Cost can be incurred as a lump sum irrespective of magnitude.
      nonlinear:
        $ref: '#/$defs/CostFunctionalFormNonlinearModel'
        description: Cost can vary non-linearly with the decision variable.
      threshold_deviation:
        $ref: '#/$defs/CostFunctionalFormThresholdDeviationModel'
        description: Costs can be applied to deviations above/below a contracted or
          reference level.
    title: CostFunctionalFormModel
    type: object
  CostFunctionalFormNonlinearModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Capital cost per unit of capacity can vary with capacity (e.g.
          economies of scale).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Operating cost per unit of flow can vary with the level of that
          flow (e.g. heat-rate curves, stepwise price-quantity offer bands).
    title: CostFunctionalFormNonlinearModel
    type: object
  CostFunctionalFormThresholdDeviationModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Costs can be applied to deviation from a reference investment
          level (e.g. a firm-capacity rebate).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Costs can be applied to deviation from a reference operating
          level (e.g. incr/decr offers around a day-ahead schedule, redispatch).
    title: CostFunctionalFormThresholdDeviationModel
    type: object
  CostModel:
    additionalProperties: false
    properties:
      functional_form:
        $ref: '#/$defs/CostFunctionalFormModel'
        description: How a cost can vary with the decision variable it attaches to,
          beyond the linear baseline.
      scope:
        $ref: '#/$defs/CostScopeModel'
        description: Which model dimensions a cost term engages. A cost engaging several
          dimensions is recorded under each of them (e.g. a charge on a fleet's combined
          running hours is both `temporal` and `assets`).
      time_value:
        $ref: '#/$defs/CostTimeValueModel'
        description: Costs can be adjusted for when they are incurred and how they
          are financed.
    title: CostModel
    type: object
  CostScopeAssetsModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single investment cost can span several assets (e.g. a shared
          site or grid connection charge).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single operating cost can span several assets (e.g. a contract
          priced on combined output).
    title: CostScopeAssetsModel
    type: object
  CostScopeModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/CostScopeAssetsModel'
        description: A single cost term can span several assets.
      spatial:
        $ref: '#/$defs/CostScopeSpatialModel'
        description: A single cost term can span several spatial units.
      temporal:
        $ref: '#/$defs/CostScopeTemporalModel'
        description: When a cost accrues in time, beyond accruing within a single
          period.
    title: CostScopeModel
    type: object
  CostScopeSpatialModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single investment cost can span several spatial units (e.g.
          a corridor reinforcement charge).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single operating cost can span several spatial units (e.g.
          a charge on a region's aggregate net imports).
    title: CostScopeSpatialModel
    type: object
  CostScopeTemporalCumulativeModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A capital cost coefficient can change with cumulative deployment
          (e.g. an endogenous learning curve).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: An operating cost coefficient can change with cumulative prior
          operation (e.g. maintenance cost rising with running hours).
    title: CostScopeTemporalCumulativeModel
    type: object
  CostScopeTemporalModel:
    additionalProperties: false
    properties:
      cumulative:
        $ref: '#/$defs/CostScopeTemporalCumulativeModel'
        description: A cost coefficient can depend on a quantity accumulated over
          the horizon.
      sequential:
        $ref: '#/$defs/CostScopeTemporalSequentialModel'
        description: Cost can be applied to a change in a decision variable between
          time periods.
    title: CostScopeTemporalModel
    type: object
  CostScopeTemporalSequentialModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: A cost can be incurred on a change in installed capacity between
          investment periods (e.g. a decommissioning charge).
      operation:
        $ref: '#/$defs/CostScopeTemporalSequentialOperationModel'
        description: Costs can be applied to changes between timesteps.
    title: CostScopeTemporalSequentialModel
    type: object
  CostScopeTemporalSequentialOperationModel:
    additionalProperties: false
    properties:
      ramping:
        $ref: '#/$defs/ToolFeatureModel'
        description: A cost can be incurred in proportion to the change in an asset's
          flow between timesteps.
      shut_down:
        $ref: '#/$defs/ToolFeatureModel'
        description: A cost can be incurred each time an asset shuts down. Usually
          requires `decisions.operation.unit_commitment`.
      start_state_dependent:
        $ref: '#/$defs/ToolFeatureModel'
        description: Start-up cost can vary with how long the asset has been offline
          (e.g. hot / warm / cold starts). Usually requires `decisions.operation.unit_commitment`.
      start_up:
        $ref: '#/$defs/ToolFeatureModel'
        description: A cost can be incurred each time an asset starts up. Usually
          requires `decisions.operation.unit_commitment`.
    title: CostScopeTemporalSequentialOperationModel
    type: object
  CostTimeValueModel:
    additionalProperties: false
    properties:
      annuitisation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Overnight capital cost can be spread across an asset's economic
          life using a discount rate (e.g. weighted average cost of capital <WACC>).
      fiscal_treatment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Tax and depreciation arrangements can adjust annuitised cost
          (e.g. investment tax credits, depreciation schedules).
      period_discounting:
        $ref: '#/$defs/ToolFeatureModel'
        description: Costs in later investment periods can be discounted to present
          value in the objective.
    title: CostTimeValueModel
    type: object
  DecisionsInvestmentModel:
    additionalProperties: false
    properties:
      continuous_capacity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset capacity can be a continuous decision variable, optionally
          bounded by a maximum (e.g. PV capacity up to a land-use limit).
      endogenous_retirement:
        $ref: '#/$defs/ToolFeatureModel'
        description: Existing capacity can be retired early as a decision variable,
          rather than only at the end of a fixed lifetime.
      exogenous_capacity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset capacity can be fixed in the input data (e.g. for dispatch-only
          modelling).
      integer_investment_continuous_capacity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset capacity can be a continuous decision variable, with the
          decision to invest a binary or integer decision variable (e.g. individually
          tracked gas turbines of variable size).
      integer_investment_exogenous_capacity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset capacity can be built as a whole number of fixed-size units
          or blocks, with the number of units as an integer decision variable (e.g.
          nuclear units of fixed size).
      multi_period:
        $ref: '#/$defs/ToolFeatureModel'
        description: Capacity can be decided over several investment periods rather
          than once for the whole horizon.
      retrofit:
        $ref: '#/$defs/ToolFeatureModel'
        description: Modifications to an existing asset can be invested in endogenously,
          changing its technical parameters or costs rather than adding standalone
          capacity (e.g. CO2 capture, efficiency upgrades, fuel switching).
    title: DecisionsInvestmentModel
    type: object
  DecisionsModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/DecisionsInvestmentModel'
        description: 'How investment in asset capacity can be decided: the variable
          type of the capacity decision and the kinds of investment decision available.'
      operation:
        $ref: '#/$defs/DecisionsOperationModel'
        description: The resolution at which asset operation can be represented.
    title: DecisionsModel
    type: object
  DecisionsOperationModel:
    additionalProperties: false
    properties:
      maintenance_scheduling:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset maintenance / outage schedules can be derived endogenously,
          co-optimised with operation.
      unit_commitment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Assets can be committed as discrete units and then economically
          dispatched.
    title: DecisionsOperationModel
    type: object
  EdgeEffectsModel:
    additionalProperties: false
    properties:
      energy_balance:
        $ref: '#/$defs/ToolFeatureModel'
        description: Spurious energy destruction from simultaneous in- and out-flow
          of a lossy transfer/storage asset can be prevented.
      time_financial:
        $ref: '#/$defs/ToolFeatureModel'
        description: End-of-horizon financial effects can be mitigated (e.g. residual
          value of assets outliving the horizon).
      time_operational:
        $ref: '#/$defs/ToolFeatureModel'
        description: End-of-horizon operational effects can be mitigated (e.g. cyclic
          storage levels, terminal value of stored energy).
    title: EdgeEffectsModel
    type: object
  FeatureSetModel:
    additionalProperties: false
    properties:
      actors:
        $ref: '#/$defs/ActorsModel'
        description: Heterogeneous decision-making actors can be represented, beyond
          a single central planner.
      constraints:
        $ref: '#/$defs/ConstraintsModel'
        description: Limits on investment and operating decisions, split by the model
          dimension a limit engages, its functional form, and specific use-cases.
      cost:
        $ref: '#/$defs/CostModel'
        description: Costs attached to investment and operating decisions as objective
          terms, beyond cost varying linearly with a decision variable.
      decisions:
        $ref: '#/$defs/DecisionsModel'
        description: Fidelity of the decisions made in the optimisation problem.
      edge_effects:
        $ref: '#/$defs/EdgeEffectsModel'
        description: Distortions caused by model boundaries and linearisation can
          be mitigated endogenously.
      interface:
        $ref: '#/$defs/InterfaceModel'
        description: Options for users and machines to drive the tool, by access mode
          (build / run / analyse), plus solver, execution, and visualisation options.
      io:
        $ref: '#/$defs/IoModel'
        description: Data formats, conventions, and mechanisms for moving model input/output
          data.
      math:
        $ref: '#/$defs/MathModel'
        description: Access to, and user extension of, the underlying mathematical
          formulation.
      model_definition:
        $ref: '#/$defs/ModelDefinitionModel'
        description: How the model's parameter space and dimensions can be shaped,
          grouped, and reused.
      network:
        $ref: '#/$defs/NetworkModel'
        description: Flows can be coupled by the physics of the transporting medium,
          beyond the capacity limits of `processes.spatial_transfer`.
      objective:
        $ref: '#/$defs/ObjectiveModel'
        description: The objective function can extend beyond minimising a single
          linear cost.
      orchestration:
        $ref: '#/$defs/OrchestrationModel'
        description: Multiple complete runs can be coordinated by tool-managed workflows.
      postprocessing:
        $ref: '#/$defs/PostprocessingModel'
        description: Analyses of model outputs that can be triggered by the tool.
      preprocessing:
        $ref: '#/$defs/PreprocessingModel'
        description: Parameters can be derived from user-defined input data before
          running the model.
      processes:
        $ref: '#/$defs/ProcessesModel'
        description: Fundamental carrier-flow capabilities the tool can represent,
          defined by their mathematical role rather than by named technologies. `Carriers`
          are the energy or non-energy commodities that flow between processes (e.g.
          electricity, heat, hydrogen, CO2, water, materials).
      traceability:
        $ref: '#/$defs/TraceabilityModel'
        description: Information can be traced through the modelling pipeline for
          debugging, diagnostics, and transparency.
      tractability:
        $ref: '#/$defs/TractabilityModel'
        description: The computational cost of building and solving the problem can
          be reduced, trading exactness for speed.
      uncertainty:
        $ref: '#/$defs/UncertaintyModel'
        description: The decision problem can be restructured to account for parametric
          or structural uncertainty.
    title: FeatureSetModel
    type: object
  InterfaceApiModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/ToolFeatureModel'
        description: Results can be analysed programmatically.
      build:
        $ref: '#/$defs/ToolFeatureModel'
        description: A model can be built programmatically.
      run:
        $ref: '#/$defs/ToolFeatureModel'
        description: Runs can be launched and managed programmatically.
    title: InterfaceApiModel
    type: object
  InterfaceCliModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/ToolFeatureModel'
        description: Reports can be created via CLI commands.
      build:
        $ref: '#/$defs/ToolFeatureModel'
        description: A model can be built or converted via CLI commands.
      run:
        $ref: '#/$defs/ToolFeatureModel'
        description: A model run can be launched and managed via CLI commands.
    title: InterfaceCliModel
    type: object
  InterfaceGuiModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/ToolFeatureModel'
        description: Model outputs can be interacted with via a GUI.
      build:
        $ref: '#/$defs/ToolFeatureModel'
        description: A model can be defined via a GUI.
      run:
        $ref: '#/$defs/ToolFeatureModel'
        description: A model run can be executed via a GUI.
    title: InterfaceGuiModel
    type: object
  InterfaceModel:
    additionalProperties: false
    properties:
      api:
        $ref: '#/$defs/InterfaceApiModel'
        description: The tool can be driven via a programmatic interface (e.g. language
          API, web API).
      cli:
        $ref: '#/$defs/InterfaceCliModel'
        description: The tool can be driven via a command line interface.
      gui:
        $ref: '#/$defs/InterfaceGuiModel'
        description: The tool can be driven via a graphical user interface.
      remote_execution:
        $ref: '#/$defs/ToolFeatureModel'
        description: Runs can be dispatched to and managed on remote compute (e.g.
          cloud, HPC) from the tool.
      solver_configuration:
        $ref: '#/$defs/ToolFeatureModel'
        description: Solver parameters can be configured directly (e.g. tolerances,
          warm starts).
      visualisation:
        $ref: '#/$defs/InterfaceVisualisationModel'
        description: Model inputs or outputs can be rendered as visual artefacts by
          the tool.
    title: InterfaceModel
    type: object
  InterfaceVisualisationModel:
    additionalProperties: false
    properties:
      charts:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input or result data can be plotted (e.g. dispatch stacks, duration
          curves).
      network_maps:
        $ref: '#/$defs/ToolFeatureModel'
        description: Network topology can be rendered schematically or geographically.
      report_templates:
        $ref: '#/$defs/ToolFeatureModel'
        description: Templates can generate consistent reports or dashboards from
          model outputs.
    title: InterfaceVisualisationModel
    type: object
  IoBinaryModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be provided in this format.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Output data can be written in this format.
    title: IoBinaryModel
    type: object
  IoDatabaseModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be read from a database.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Output data can be written to a database.
    title: IoDatabaseModel
    type: object
  IoLazyLoadingModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be loaded lazily.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Output data can be streamed rather than held fully in memory.
    title: IoLazyLoadingModel
    type: object
  IoModel:
    additionalProperties: false
    properties:
      binary:
        $ref: '#/$defs/IoBinaryModel'
        description: Data can be handled in binary formats (e.g. Excel, NetCDF, HDF5,
          Parquet).
      database:
        $ref: '#/$defs/IoDatabaseModel'
        description: Data can be handled in databases.
      lazy_loading:
        $ref: '#/$defs/IoLazyLoadingModel'
        description: Data larger than memory can be handled out-of-core.
      plain_text:
        $ref: '#/$defs/IoPlainTextModel'
        description: Data can be handled in human-readable, version-control-friendly
          text formats (e.g. CSV, JSON, YAML).
      remote_storage:
        $ref: '#/$defs/IoRemoteStorageModel'
        description: Data can be read from / written to remote storage (e.g. object
          stores).
      standardised:
        $ref: '#/$defs/IoStandardisedModel'
        description: Data can follow a community-recognised convention, ontology,
          or network-data format (e.g. Open Energy Ontology <OEO>, IAMC template,
          Common Information Model <CIM>, PSSE RAW).
    title: IoModel
    type: object
  IoPlainTextModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be provided in this format.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Output data can be written in this format.
    title: IoPlainTextModel
    type: object
  IoRemoteStorageModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be read from remote storage.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Output data can be written to remote storage.
    title: IoRemoteStorageModel
    type: object
  IoStandardisedModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/ToolFeatureModel'
        description: Standardised input data can be accepted.
      output:
        $ref: '#/$defs/ToolFeatureModel'
        description: Outputs can follow a standard.
    title: IoStandardisedModel
    type: object
  MathModel:
    additionalProperties: false
    properties:
      dual_extraction:
        $ref: '#/$defs/ToolFeatureModel'
        description: Constraint duals can be extracted from the solved problem.
      formulation_transparency:
        $ref: '#/$defs/ToolFeatureModel'
        description: The tool's mathematical formulation can be inspected (e.g. rendered
          equations traceable to the built problem).
      piecewise_formulation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Piecewise constructs are available to build non-linear relationships
          in the math (e.g. SOS2 constraints).
      problem_file_export:
        $ref: '#/$defs/ToolFeatureModel'
        description: The built optimisation problem can be exported in standard formats
          (e.g. LP/MPS).
      user_defined_math:
        $ref: '#/$defs/ToolFeatureModel'
        description: Users can define their own constraints, variables, and objective
          expression.
    title: MathModel
    type: object
  ModelDefinitionModel:
    additionalProperties: false
    properties:
      component_templating:
        $ref: '#/$defs/ToolFeatureModel'
        description: Components can inherit parameters from a shared template, including
          programmatic generation of components from a template (e.g. an abstract
          technology definition, auto-cloned vintages).
      configurable_dimensions:
        $ref: '#/$defs/ToolFeatureModel'
        description: The dimensionality of an asset parameter or cost can be configured
          by the user from a set of tool-defined dimensions.
      dimension_groups:
        $ref: '#/$defs/ToolFeatureModel'
        description: Dimension members can be tagged into named, potentially overlapping
          groups, for use in constraints, aggregation, and analysis (e.g. "coastal
          assets" spanning several technologies and nodes).
      extensible_dimensions:
        $ref: '#/$defs/ToolFeatureModel'
        description: A dimension not natively defined by the tool can be introduced
          by the user, and parameters and math indexed over it (e.g. a custom cohort
          axis).
    title: ModelDefinitionModel
    type: object
  NetworkHydraulicFlowModel:
    additionalProperties: false
    properties:
      composition_tracking:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single transfer asset can carry a mixture whose constituents
          are balanced individually, with limits on the resulting blend (e.g. hydrogen
          blend fraction, Wobbe index).
      linearised_flow:
        $ref: '#/$defs/ToolFeatureModel'
        description: Nodal pressure/head can be a decision variable that couples flows
          through a linearised pressure-drop relationship, with limits on that state
          (e.g. minimum/maximum nodal pressure).
    title: NetworkHydraulicFlowModel
    type: object
  NetworkModel:
    additionalProperties: false
    properties:
      hydraulic_flow:
        $ref: '#/$defs/NetworkHydraulicFlowModel'
        description: Pressure-driven networks can be represented for carriers transported
          through pipes (e.g. methane, hydrogen, CO2, district heat, water).
      power_flow:
        $ref: '#/$defs/NetworkPowerFlowModel'
        description: Electrical network physics can be represented.
    title: NetworkModel
    type: object
  NetworkPowerFlowModel:
    additionalProperties: false
    properties:
      losses:
        $ref: '#/$defs/ToolFeatureModel'
        description: Branch losses can vary with flow, rather than being a fixed transfer
          efficiency (e.g. piecewise-linear or quadratic loss approximations).
      network_devices:
        $ref: '#/$defs/NetworkPowerFlowNetworkDevicesModel'
        description: Network components beyond simple lines and buses can be represented.
      network_limits:
        $ref: '#/$defs/NetworkPowerFlowNetworkLimitsModel'
        description: Network operating limits can be represented in the power-flow
          formulation.
      optimal_power_flow:
        $ref: '#/$defs/NetworkPowerFlowOptimalPowerFlowModel'
        description: Optimal power flow can be modelled.
      sensitivity_limits:
        $ref: '#/$defs/NetworkPowerFlowSensitivityLimitsModel'
        description: Flows can be limited using supplied linear sensitivities, as
          an alternative to physical network limits.
    title: NetworkPowerFlowModel
    type: object
  NetworkPowerFlowNetworkDevicesModel:
    additionalProperties: false
    properties:
      facts_devices:
        $ref: '#/$defs/ToolFeatureModel'
        description: Controllable flow devices whose setting is a decision variable
          can be represented (e.g. optimised phase-shifting transformers, Flexible
          AC Transmission System <FACTS> devices).
      hvdc_converters:
        $ref: '#/$defs/ToolFeatureModel'
        description: Rectifiers, inverters, and HVDC converter stations can be represented.
      transformers:
        $ref: '#/$defs/ToolFeatureModel'
        description: Transformers (tap ratio, fixed phase shift) and shunt elements
          can be represented.
    title: NetworkPowerFlowNetworkDevicesModel
    type: object
  NetworkPowerFlowNetworkLimitsModel:
    additionalProperties: false
    properties:
      phase_angle:
        $ref: '#/$defs/ToolFeatureModel'
        description: Phase-angle difference limits between connected buses can be
          applied.
      thermal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Thermal (branch flow magnitude) limits can be applied.
    title: NetworkPowerFlowNetworkLimitsModel
    type: object
  NetworkPowerFlowOptimalPowerFlowModel:
    additionalProperties: false
    properties:
      ac_opf:
        $ref: '#/$defs/ToolFeatureModel'
        description: Linearised AC optimal power flow can be modelled.
      dc_opf:
        $ref: '#/$defs/ToolFeatureModel'
        description: DC optimal power flow can be modelled.
      unbalanced_flows:
        $ref: '#/$defs/ToolFeatureModel'
        description: Unbalanced (asymmetric phase) flows can be modelled (e.g. linearised
          DistFlow).
    title: NetworkPowerFlowOptimalPowerFlowModel
    type: object
  NetworkPowerFlowSensitivityLimitsModel:
    additionalProperties: false
    properties:
      generic_constraints:
        $ref: '#/$defs/ToolFeatureModel'
        description: Built-in transmission constraint objects can be defined with
          user-supplied coefficients (e.g. flowgates, interfaces).
      outage_factors:
        $ref: '#/$defs/ToolFeatureModel'
        description: Supplied Line/Branch Outage Distribution Factor <LODF/BODF> limits
          can be applied, relating branch flows to the outage of another branch.
      ptdf:
        $ref: '#/$defs/ToolFeatureModel'
        description: Supplied Power Transfer Distribution Factor <PTDF> limits can
          be applied, relating branch flows to nodal injections (e.g. with single
          or distributed slack).
    title: NetworkPowerFlowSensitivityLimitsModel
    type: object
  ObjectiveModel:
    additionalProperties: false
    properties:
      multi_objective_pareto:
        $ref: '#/$defs/ToolFeatureModel'
        description: Pareto-optimal solution sets can be generated across objectives
          (e.g. epsilon-constraint).
      multi_objective_weighted:
        $ref: '#/$defs/ToolFeatureModel'
        description: Multiple objective terms can be combined via user-set weights.
      quadratic:
        $ref: '#/$defs/ToolFeatureModel'
        description: Quadratic objective terms can be passed natively to the solver
          (e.g. welfare maximisation with linear demand curves).
      tie_breaking:
        $ref: '#/$defs/ToolFeatureModel'
        description: Degenerate solutions can be resolved by a documented rule rather
          than solver arbitrariness (e.g. small penalties on zero-cost variables).
    title: ObjectiveModel
    type: object
  OrchestrationCoupledModelsLimitedForesightModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Investment can be optimised sequentially per period or set of
          periods (e.g. myopic foresight).
      operation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Dispatch can be optimised sequentially per set of timesteps (e.g.
          rolling horizon).
    title: OrchestrationCoupledModelsLimitedForesightModel
    type: object
  OrchestrationCoupledModelsModel:
    additionalProperties: false
    properties:
      convergence_iteration:
        $ref: '#/$defs/ToolFeatureModel'
        description: Runs can be repeated, exchanging data, until relationships not
          representable in a single problem converge (e.g. iterating on line reactances).
      fidelity_sequence:
        $ref: '#/$defs/ToolFeatureModel'
        description: Models of the same system at different fidelity can be run in
          sequence, passing data between them (e.g. capacity expansion followed by
          unit-commitment dispatch).
      limited_foresight:
        $ref: '#/$defs/OrchestrationCoupledModelsLimitedForesightModel'
        description: Sequential optimisation windows can emulate limited knowledge
          of later periods, passing end-state data between runs.
      market_sequence:
        $ref: '#/$defs/ToolFeatureModel'
        description: Models of successive market stages can be run with bidirectional
          data exchange (e.g. interleaved day-ahead / real-time runs).
    title: OrchestrationCoupledModelsModel
    type: object
  OrchestrationModel:
    additionalProperties: false
    properties:
      coupled_models:
        $ref: '#/$defs/OrchestrationCoupledModelsModel'
        description: Two or more model runs can be executed with tool-managed data
          exchange between them.
      sampled_runs:
        $ref: '#/$defs/ToolFeatureModel'
        description: Run ensembles can be executed over a sampled uncertainty space
          with collated outputs (e.g. Monte Carlo).
      scenario_runs:
        $ref: '#/$defs/ToolFeatureModel'
        description: Discrete, named scenarios can be executed in batch with collated
          outputs.
    title: OrchestrationModel
    type: object
  PostprocessingMetricsFinancialModel:
    additionalProperties: false
    properties:
      asset_accounts:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset-level revenue / cost accounts can be produced.
      contract_settlement:
        $ref: '#/$defs/ToolFeatureModel'
        description: Contracts can be settled post-hoc against realised dispatch and
          prices (e.g. Contracts-for-Difference <CfD>, Financial Transmission Rights
          <FTR>).
      levelised_cost:
        $ref: '#/$defs/ToolFeatureModel'
        description: Levelised cost of electricity or other carriers can be calculated.
      marginal_price:
        $ref: '#/$defs/ToolFeatureModel'
        description: Locational marginal prices can be reported per node and carrier,
          optionally split into energy, congestion, and loss components.
      net_present_value:
        $ref: '#/$defs/ToolFeatureModel'
        description: Net present value of the system or a subset of assets can be
          calculated.
      price_formation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Prices can be constructed by a documented market rule rather
          than taken directly from duals (e.g. uplift adders, uniform pricing via
          a relaxed re-solve).
      water_value:
        $ref: '#/$defs/ToolFeatureModel'
        description: A reusable future cost function (water value) for seasonal storage
          can be constructed and exported.
    title: PostprocessingMetricsFinancialModel
    type: object
  PostprocessingMetricsImpactAssessmentModel:
    additionalProperties: false
    properties:
      emissions:
        $ref: '#/$defs/ToolFeatureModel'
        description: GHG or other pollutant emissions can be calculated.
      resource_use:
        $ref: '#/$defs/ToolFeatureModel'
        description: Non-carrier resource consumption (e.g. water, land, materials)
          can be calculated.
      socioeconomic:
        $ref: '#/$defs/ToolFeatureModel'
        description: Socioeconomic impacts (e.g. job creation) can be calculated.
    title: PostprocessingMetricsImpactAssessmentModel
    type: object
  PostprocessingMetricsModel:
    additionalProperties: false
    properties:
      financial:
        $ref: '#/$defs/PostprocessingMetricsFinancialModel'
        description: Financial analyses can be derived.
      impact_assessment:
        $ref: '#/$defs/PostprocessingMetricsImpactAssessmentModel'
        description: Auxiliary impacts can be calculated.
      network_transfer_metrics:
        $ref: '#/$defs/PostprocessingMetricsNetworkTransferMetricsModel'
        description: Network transfer metrics can be derived.
      operational:
        $ref: '#/$defs/PostprocessingMetricsOperationalModel'
        description: Operational analyses can be derived.
      probabilistic_reliability_assessment:
        $ref: '#/$defs/PostprocessingMetricsProbabilisticReliabilityAssessmentModel'
        description: Probabilistic resource-adequacy metrics can be calculated post-hoc.
    title: PostprocessingMetricsModel
    type: object
  PostprocessingMetricsNetworkTransferMetricsModel:
    additionalProperties: false
    properties:
      flow_sensitivity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Flow-sensitivity factors (e.g. PTDF, LODF) can be calculated.
      transfer_capacity:
        $ref: '#/$defs/ToolFeatureModel'
        description: Transfer capacities between regions or zones can be calculated.
    title: PostprocessingMetricsNetworkTransferMetricsModel
    type: object
  PostprocessingMetricsOperationalModel:
    additionalProperties: false
    properties:
      binding_hours:
        $ref: '#/$defs/ToolFeatureModel'
        description: The number of timesteps an asset's flow is at its upper bound
          can be calculated (e.g. line congestion hours).
      capacity_factor:
        $ref: '#/$defs/ToolFeatureModel'
        description: Average output relative to capacity can be calculated.
      curtailment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Curtailment can be calculated.
      operating_hours:
        $ref: '#/$defs/ToolFeatureModel'
        description: The number of timesteps an asset is running can be calculated.
    title: PostprocessingMetricsOperationalModel
    type: object
  PostprocessingMetricsProbabilisticReliabilityAssessmentModel:
    additionalProperties: false
    properties:
      capacity_credit:
        $ref: '#/$defs/ToolFeatureModel'
        description: Effective load carrying capability <ELCC> can be calculated.
      loss_of_load:
        $ref: '#/$defs/ToolFeatureModel'
        description: Loss of load probability/expectation <LOLP/LOLE> can be calculated.
      unserved_energy:
        $ref: '#/$defs/ToolFeatureModel'
        description: Expected energy not served <EENS> can be calculated.
    title: PostprocessingMetricsProbabilisticReliabilityAssessmentModel
    type: object
  PostprocessingModel:
    additionalProperties: false
    properties:
      metrics:
        $ref: '#/$defs/PostprocessingMetricsModel'
        description: Quantities can be computed from model outputs, per asset or system-wide.
      transformation:
        $ref: '#/$defs/PostprocessingTransformationModel'
        description: Model outputs can be reshaped and collated, without deriving
          new quantities.
    title: PostprocessingModel
    type: object
  PostprocessingTransformationModel:
    additionalProperties: false
    properties:
      aggregation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Outputs can be aggregated into broader groups.
      disaggregation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Outputs can be redistributed back to the resolution before dimension
          reduction.
      scenario_comparison:
        $ref: '#/$defs/ToolFeatureModel'
        description: Outputs of multiple runs can be collated and compared.
    title: PostprocessingTransformationModel
    type: object
  PreprocessingModel:
    additionalProperties: false
    properties:
      download:
        $ref: '#/$defs/ToolFeatureModel'
        description: Data can be downloaded within the tool from an external source.
      forecasting:
        $ref: '#/$defs/ToolFeatureModel'
        description: A profile can be scaled or reshaped to meet forecast targets
          (e.g. annual total or peak).
      input_validation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Input data can be validated against expected structure and value
          ranges before a run.
      model_catalogue:
        $ref: '#/$defs/ToolFeatureModel'
        description: Pre-built models can be retrieved from a catalogue as starting
          points.
      resource_conversion:
        $ref: '#/$defs/ToolFeatureModel'
        description: Profiles can be derived from weather or resource data via physical
          response models (e.g. wind speed to capacity factor, temperature to heat
          demand).
      scenario_generation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Scenario ensembles can be generated from parameters or sampling
          rules.
      spatial_distribution:
        $ref: '#/$defs/PreprocessingSpatialDistributionModel'
        description: A parameter can be distributed spatially using other spatial
          parameters.
    title: PreprocessingModel
    type: object
  PreprocessingSpatialDistributionModel:
    additionalProperties: false
    properties:
      demand:
        $ref: '#/$defs/ToolFeatureModel'
        description: Nodal demand can be distributed from an aggregate total.
      network_geometry:
        $ref: '#/$defs/ToolFeatureModel'
        description: Line or pipeline lengths or routes can be derived from node coordinates.
    title: PreprocessingSpatialDistributionModel
    type: object
  ProcessesConversionModel:
    additionalProperties: false
    properties:
      flexible_ratio:
        $ref: '#/$defs/ToolFeatureModel'
        description: The ratio between a conversion process's flows can be a decision
          variable within a feasible operating region (e.g. extraction-condensing
          CHP, heat pumps serving heat and cooling).
      multi_carrier_io:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single conversion process can have several in-flowing and/or
          out-flowing carriers at fixed ratios (e.g. back-pressure CHP, fixed heat-recovery
          fractions).
      one_to_one:
        $ref: '#/$defs/ToolFeatureModel'
        description: A single in-flowing carrier can be converted to a single out-flowing
          carrier (e.g. power plants, electrolysers without heat recovery).
    title: ProcessesConversionModel
    type: object
  ProcessesExplicitDemandModel:
    additionalProperties: false
    properties:
      inelastic:
        $ref: '#/$defs/ToolFeatureModel'
        description: A fixed quantity of a carrier can be consumed by a demand process
          whose in-flow can be constrained like any other process flow.
      mobile_storage:
        $ref: '#/$defs/ToolFeatureModel'
        description: A consuming process can have embedded storage whose network attachment
          and availability vary in space and time (e.g. electric vehicles).
      price_responsive:
        $ref: '#/$defs/ToolFeatureModel'
        description: The consumed quantity can be decided against willingness-to-pay
          (e.g. demand bids, stepwise/linear demand curves).
    title: ProcessesExplicitDemandModel
    type: object
  ProcessesModel:
    additionalProperties: false
    properties:
      boundary_exchange:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can enter or leave the system across its boundary at
          a defined cost and availability (e.g. fuel supply, primary resource extraction,
          imports/exports to unmodelled regions).
      buffered_transfer:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can flow in space with an endogenous in-transit inventory
          that accumulates over time (e.g. pipeline linepack).
      conversion:
        $ref: '#/$defs/ProcessesConversionModel'
        description: Carriers can be transformed into other carriers within the system
          boundary (e.g. power plants, electrolysers, heat pumps, CO2 capture).
      delayed_transfer:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can flow in space with a time delay between injection
          and withdrawal (e.g. river flows, district-heating transit).
      discrete_transport:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can be moved in space in discrete packets with loading/unloading
          decisions (e.g. shipping, trucking, rail).
      explicit_demand:
        $ref: '#/$defs/ProcessesExplicitDemandModel'
        description: Carriers can be consumed by explicit processes with their own
          balances and constraints, rather than by a fixed exogenous profile.
      spatial_transfer:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can be moved between regions as continuous flow subject
          to transfer-capacity limits, without network physics.
      state_changing_transfer:
        $ref: '#/$defs/ToolFeatureModel'
        description: A carrier can be moved at discrete physical state levels, with
          conversion between levels en route (e.g. heat-network temperature levels).
      temporal_transfer:
        $ref: '#/$defs/ToolFeatureModel'
        description: Carriers can be moved in time, linking system states across timesteps
          (e.g. storage).
    title: ProcessesModel
    type: object
  ToolFeatureModel:
    additionalProperties: false
    description: Feature-level fields.
    properties:
      source:
        description: 'Link(s) to source to validate the given value.

          This is usually used to validate a `y` (documentation link) or `dev` (issue
          or pull request link) but can feasibly be used to validate an `n`.'
        items:
          format: uri
          maxLength: 2083
          minLength: 1
          type: string
        title: Source
        type: array
      value:
        default: '?'
        description: 'Whether a feature exists (`y`) or not (`n`), or is in development
          (`dev`) in the tool.

          Defaults to unknown (`?`).'
        enum:
        - y
        - n
        - dev
        - '?'
        title: Value
        type: string
    title: ToolFeatureModel
    type: object
  TraceabilityMetadataModel:
    additionalProperties: false
    properties:
      propagation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Outputs can be linked back to the inputs and settings that produced
          them.
      provenance:
        $ref: '#/$defs/ToolFeatureModel'
        description: Data sources, versions, and licences can be recorded for inputs.
      units:
        $ref: '#/$defs/ToolFeatureModel'
        description: Physical units can be tracked and validated through the pipeline.
    title: TraceabilityMetadataModel
    type: object
  TraceabilityModel:
    additionalProperties: false
    properties:
      infeasibility_diagnosis:
        $ref: '#/$defs/ToolFeatureModel'
        description: Infeasible problems can be diagnosed (e.g. irreducible infeasible
          subset <IIS>).
      intermediate_access:
        $ref: '#/$defs/ToolFeatureModel'
        description: Intermediate pipeline artefacts (e.g. built problem data, solver
          state) can be accessed in memory via the API.
      metadata:
        $ref: '#/$defs/TraceabilityMetadataModel'
        description: Metadata can be defined for modelling inputs and outputs.
      run_logs:
        $ref: '#/$defs/ToolFeatureModel'
        description: Run logs can be made available.
    title: TraceabilityModel
    type: object
  TractabilityDimensionReductionAdjacencyAggregationModel:
    additionalProperties: false
    properties:
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Bordering spatial units can be merged into contiguous zones (e.g.
          buses to bidding zones).
      temporal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Timesteps or investment periods can be merged contiguously (e.g.
          hourly to daily).
    title: TractabilityDimensionReductionAdjacencyAggregationModel
    type: object
  TractabilityDimensionReductionEquivalencingModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/ToolFeatureModel'
        description: A chain of interconnected assets can be collapsed into a single
          component.
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Network elements can be equivalenced (e.g. Ward or Kron reduction).
    title: TractabilityDimensionReductionEquivalencingModel
    type: object
  TractabilityDimensionReductionFilteringModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/ToolFeatureModel'
        description: Assets can be filtered out (e.g. by node or carrier).
      scenarios:
        $ref: '#/$defs/ToolFeatureModel'
        description: Scenarios can be filtered out.
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Spatial units can be filtered out (e.g. below a voltage level).
      temporal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Timesteps or investment periods can be filtered out (e.g. to
          a user-selected study window).
    title: TractabilityDimensionReductionFilteringModel
    type: object
  TractabilityDimensionReductionModel:
    additionalProperties: false
    properties:
      adjacency_aggregation:
        $ref: '#/$defs/TractabilityDimensionReductionAdjacencyAggregationModel'
        description: Neighbouring dimension members can be merged, preserving ordering
          / adjacency.
      equivalencing:
        $ref: '#/$defs/TractabilityDimensionReductionEquivalencingModel'
        description: A sub-system can be replaced by a reduced representation that
          preserves its boundary behaviour.
      filtering:
        $ref: '#/$defs/TractabilityDimensionReductionFilteringModel'
        description: Dimension members can be removed from the built problem rather
          than represented by a proxy.
      non_contiguity_handling:
        $ref: '#/$defs/TractabilityDimensionReductionNonContiguityHandlingModel'
        description: Features spanning dimension members can be linked across non-contiguous
          aggregated members.
      similarity_aggregation:
        $ref: '#/$defs/TractabilityDimensionReductionSimilarityAggregationModel'
        description: Dimension members can be grouped by likeness and each group represented
          by a proxy member.
    title: TractabilityDimensionReductionModel
    type: object
  TractabilityDimensionReductionNonContiguityHandlingModel:
    additionalProperties: false
    properties:
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Inter-spatial features can be linked across discontiguous zones.
      temporal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Inter-temporal features can be linked across typical periods
          (e.g. storage levels).
    title: TractabilityDimensionReductionNonContiguityHandlingModel
    type: object
  TractabilityDimensionReductionSimilarityAggregationModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/ToolFeatureModel'
        description: Individual assets can be aggregated into asset groups.
      scenarios:
        $ref: '#/$defs/ToolFeatureModel'
        description: A scenario ensemble can be reduced to a weighted representative
          set.
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Spatial units can be clustered by likeness rather than adjacency
          (e.g. by resource quality).
      temporal:
        $ref: '#/$defs/ToolFeatureModel'
        description: A full timeseries can be represented by non-contiguous typical
          periods or duration curves.
    title: TractabilityDimensionReductionSimilarityAggregationModel
    type: object
  TractabilityModel:
    additionalProperties: false
    properties:
      dimension_reduction:
        $ref: '#/$defs/TractabilityDimensionReductionModel'
        description: The number of members along a dimension can be reduced automatically,
          uniformly across all other dimensions.
      reformulation:
        $ref: '#/$defs/TractabilityReformulationModel'
        description: The built problem or its solution algorithm can be reformulated
          to reduce solve cost.
      variable_fidelity:
        $ref: '#/$defs/TractabilityVariableFidelityModel'
        description: The fidelity of the same attribute/dimension can differ across
          the model's scope.
    title: TractabilityModel
    type: object
  TractabilityReformulationModel:
    additionalProperties: false
    properties:
      constraint_screening:
        $ref: '#/$defs/ToolFeatureModel'
        description: Constraints unlikely to bind can be omitted or lazily added.
      decomposition:
        $ref: '#/$defs/ToolFeatureModel'
        description: The problem can be split into coordinated sub-problems solved
          iteratively or in parallel (e.g. Benders, progressive hedging, Stochastic
          Dual Dynamic Programming <SDDP>).
      linearised_unit_commitment:
        $ref: '#/$defs/ToolFeatureModel'
        description: Unit commitment can be approximated with continuous commitment
          variables.
      nonlinear_handling:
        $ref: '#/$defs/TractabilityReformulationNonlinearHandlingModel'
        description: Non-linear relationships can be treated automatically so that
          the built problem remains solvable.
      numeric_scaling:
        $ref: '#/$defs/ToolFeatureModel'
        description: Data can be scaled to reduce numerical instability in the solver.
    title: TractabilityReformulationModel
    type: object
  TractabilityReformulationNonlinearHandlingModel:
    additionalProperties: false
    properties:
      convex_relaxation:
        $ref: '#/$defs/ToolFeatureModel'
        description: A non-convex relationship in the tool's own formulation can be
          convexified (e.g. second-order-cone relaxation of AC power flow).
      function_conversion:
        $ref: '#/$defs/ToolFeatureModel'
        description: User-supplied non-linear functions can be converted automatically
          into valid model inputs (e.g. piecewise segments).
    title: TractabilityReformulationNonlinearHandlingModel
    type: object
  TractabilityVariableFidelityModel:
    additionalProperties: false
    properties:
      formulation:
        $ref: '#/$defs/ToolFeatureModel'
        description: The mathematical fidelity of the same attribute can differ across
          the model's scope (e.g. unit commitment near-term, continuous dispatch beyond).
      resolution:
        $ref: '#/$defs/TractabilityVariableFidelityResolutionModel'
        description: The resolution of one dimension can differ across the members
          of another.
    title: TractabilityVariableFidelityModel
    type: object
  TractabilityVariableFidelityResolutionModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/ToolFeatureModel'
        description: Asset resolution can vary across another dimension (e.g. individual
          assets in a focus region, groups elsewhere).
      scenarios:
        $ref: '#/$defs/ToolFeatureModel'
        description: Scenario resolution can vary across another dimension (e.g. a
          scenario tree branching more finely near-term).
      spatial:
        $ref: '#/$defs/ToolFeatureModel'
        description: Spatial resolution can vary across another dimension (e.g. nodal
          near-term, zonal beyond).
      temporal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Temporal resolution can vary across another dimension (e.g. hourly
          in a focus region, daily elsewhere).
    title: TractabilityVariableFidelityResolutionModel
    type: object
  UncertaintyModel:
    additionalProperties: false
    properties:
      multi_stage_stochastic:
        $ref: '#/$defs/ToolFeatureModel'
        description: Multi-stage stochastic optimisation can be performed, with decisions
          revised as uncertainty resolves (e.g. hydro scheduling under uncertain inflows).
      near_optimal:
        $ref: '#/$defs/ToolFeatureModel'
        description: Alternative near-optimal solutions can be generated (e.g. Modelling
          to Generate Alternatives <MGA>).
      risk_aversion:
        $ref: '#/$defs/ToolFeatureModel'
        description: Risk measures can be applied in the objective or constraints
          of a stochastic optimisation (e.g. Conditional Value at Risk <CVaR>).
      robust_optimisation:
        $ref: '#/$defs/ToolFeatureModel'
        description: Worst-case cost can be minimised over an uncertainty set.
      two_stage_stochastic:
        $ref: '#/$defs/ToolFeatureModel'
        description: Two-stage stochastic optimisation can be performed (e.g. investment
          under uncertainty).
    title: UncertaintyModel
    type: object
