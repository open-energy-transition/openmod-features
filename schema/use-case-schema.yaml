$defs:
  ActorsModel:
    additionalProperties: false
    properties:
      distributed_objectives:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Per-agent profit maximising / risk minimising objectives can
          be represented within the larger system-level optimisation (e.g. bidding
          in day-ahead / intra-day markets, behind-the-meter prosumer decisions)
      equilibrium:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Market equilibrium found across actors with competing objectives.
          This could be applied via complementarity/MCP/bi-level formulations or a
          quadratic-markup reformulation of the cost-minimisation objective (e.g.
          Cournot-Nash oligopoly modelling).
      portfolio:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Agent asset portfolios and associated constraints and cost considerations
          (e.g. limited cross-portfolio capital investment, risk appetite).
    title: ActorsModel
    type: object
  AssetCapacityRepresentationModel:
    additionalProperties: false
    properties:
      continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity is fully endogenous and modeled as a continuous
          (linear) decision variable. An optional maximum capacity can be specified
          in the input data (e.g. PV capacity that can be installed at any capacity
          from zero to a maximum defined by land-use constraints).
      exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity is fixed and fully defined in the input data (e.g.
          for modelling dispatch only).
      integer_investment_continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity magnitude is endogenous and modeled as a continuous
          (linear) decision variable. Investment is also endogenous and represented
          by a binary decision variable. An optional maximum capacity can be specified
          in the input data (e.g. gas turbines that you want to track as individual
          units and whose capacity is not fixed by the manufacturer).
      integer_investment_exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity magnitude is fixed in the input data. Investment
          is modeled as a discrete (i.e., integer) decision variable (e.g. nuclear
          power plants whose capacity is fixed & indivisible due to external constraints
          but the decision to invest in this capacity is as-yet undecided).
    title: AssetCapacityRepresentationModel
    type: object
  AssetCharacteristicsConfigurableDimensionsFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsConfigurableDimensionsValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsConfigurableDimensionsFeatureModel
    type: object
  AssetCharacteristicsConfigurableDimensionsValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Applies to investment characteristics (e.g. capital cost, maximum
          buildable capacity).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Applies to operating characteristics (e.g. efficiency, resource
          availability).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsConfigurableDimensionsValueModel
    type: object
  AssetCharacteristicsExtensibleDimensionsFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsExtensibleDimensionsValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsExtensibleDimensionsFeatureModel
    type: object
  AssetCharacteristicsExtensibleDimensionsValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Applies to investment characteristics.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Applies to operating characteristics.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsExtensibleDimensionsValueModel
    type: object
  AssetCharacteristicsLinearFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsLinearValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsLinearFeatureModel
    type: object
  AssetCharacteristicsLinearValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Varies linearly with an investment decision variable (e.g. resource
          availability increasing with asset capacity).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Varies linearly with an operating decision variable.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsLinearValueModel
    type: object
  AssetCharacteristicsModel:
    additionalProperties: false
    properties:
      configurable_dimensions:
        $ref: '#/$defs/AssetCharacteristicsConfigurableDimensionsFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: A characteristic's dimensionality can be chosen by the user per
          characteristic, rather than being fixed by the tool for each named parameter
          (Full user choice on whether e.g. parameters vary by time, space, both,
          or neither).
      extensible_dimensions:
        $ref: '#/$defs/AssetCharacteristicsExtensibleDimensionsFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: A dimension not natively defined by the tool (e.g. a custom vintage,
          cohort, or scenario axis) can be introduced by the user. The tool's mathematical
          formulation can either handle this automatically or requires custom math
          (see `interface__math.user_defined_math`).
      linear:
        $ref: '#/$defs/AssetCharacteristicsLinearFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Asset characteristics vary linearly with a single decision variable.
      nonlinear:
        $ref: '#/$defs/AssetCharacteristicsNonlinearFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Asset characteristics link together several decision variables.
          This creates a non-linear relationship that can be described by e.g. a piecewise
          linear curve or through iterative solving.
      path_dependent:
        $ref: '#/$defs/AssetCharacteristicsPathDependentFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Asset characteristics evolve based on cumulative historical conditions.
      quadratic:
        $ref: '#/$defs/AssetCharacteristicsQuadraticFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Asset characteristics vary quadratically with a decision variable,
          passed natively to a QP/QCP-capable solver.
    title: AssetCharacteristicsModel
    type: object
  AssetCharacteristicsNonlinearFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsNonlinearValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsNonlinearFeatureModel
    type: object
  AssetCharacteristicsNonlinearValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Varies with an investment decision variable (e.g. storage head
          effects, pressurisation energy curves linked to capacity).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Varies with an operating decision variable (e.g., part-load efficiency,
          line losses).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsNonlinearValueModel
    type: object
  AssetCharacteristicsPathDependentFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsPathDependentValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsPathDependentFeatureModel
    type: object
  AssetCharacteristicsPathDependentValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment characteristics evolve based on investments made in
          previous periods (e.g. learning curves).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operational characteristics evolve based on operation in previous
          timesteps (e.g. battery cycling/calendar degradation, filter fouling).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsPathDependentValueModel
    type: object
  AssetCharacteristicsQuadraticFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCharacteristicsQuadraticValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCharacteristicsQuadraticFeatureModel
    type: object
  AssetCharacteristicsQuadraticValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Varies quadratically with an investment decision variable.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Varies quadratically with an operating decision variable (e.g.
          quadratic fuel curves, loss approximations).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCharacteristicsQuadraticValueModel
    type: object
  AssetConstraintsBoundaryConditionsFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsBoundaryConditionsValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsBoundaryConditionsFeatureModel
    type: object
  AssetConstraintsBoundaryConditionsValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment optimisation can start from an existing asset stock
          rather than from an empty (greenfield) system or can define a desired end-state.
          This allows pre-existing capacities to be represented (initial) and for
          backcasting system design (end-state).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Initial or end-state operational conditions can be set (e.g.
          start or end storage level requirements).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsBoundaryConditionsValueModel
    type: object
  AssetConstraintsCommitmentFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsCommitmentValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsCommitmentFeatureModel
    type: object
  AssetConstraintsCommitmentValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Limits on investment unit purchase within investment periods.
          Usually requires `asset__capacity_representation.integer_investment_...`.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Limits on operational unit commit within timesteps (e.g., forced/planned
          outage windows). Usually requires `asset__operating_representation.unit_commitment`.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsCommitmentValueModel
    type: object
  AssetConstraintsInterAssetFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsInterAssetValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsInterAssetFeatureModel
    type: object
  AssetConstraintsInterAssetValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment limits that link assets (e.g., land-use competition,
          system-wide embodied emissions limits).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating limits that link assets (e.g., regional emissions limits
          applied across all emitting assets).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsInterAssetValueModel
    type: object
  AssetConstraintsInterSpatialFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsInterSpatialValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsInterSpatialFeatureModel
    type: object
  AssetConstraintsInterSpatialValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment limits that link geographic regions.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating limits that link geographic regions.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsInterSpatialValueModel
    type: object
  AssetConstraintsInterTemporalFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsInterTemporalValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsInterTemporalFeatureModel
    type: object
  AssetConstraintsInterTemporalValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment limits linking investment periods (e.g. build-rate
          limits, phased retirement, availability windows).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating limits that link time periods (e.g., ramping, run up,
          load shifting).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsInterTemporalValueModel
    type: object
  AssetConstraintsIntraTemporalFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsIntraTemporalValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsIntraTemporalFeatureModel
    type: object
  AssetConstraintsIntraTemporalValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Limits on investment within investment periods (e.g. minimum/maximum
          size).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Limits on operation within timesteps (e.g. capacity de-rating
          profiles, minimum/maximum load levels, renewables capacity factors).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsIntraTemporalValueModel
    type: object
  AssetConstraintsModel:
    additionalProperties: false
    properties:
      boundary_conditions:
        $ref: '#/$defs/AssetConstraintsBoundaryConditionsFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Initial and end-state conditions can be set.
      commitment:
        $ref: '#/$defs/AssetConstraintsCommitmentFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limits on commitment to investing in or operating an asset in
          a given time period.
      dedicated_flow_routing:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carrier out-flow from one asset can be reserved as in-flow to
          a specific subset of other assets (e.g. fuel stockpiling ahead of conversion,
          hydropower cascades, CHP internal steam flows).
      inter_asset:
        $ref: '#/$defs/AssetConstraintsInterAssetFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limits that link assets, within or across regions and time.
      inter_spatial:
        $ref: '#/$defs/AssetConstraintsInterSpatialFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limits that link geographic regions (e.g. to ensure regional
          equity).
      inter_temporal:
        $ref: '#/$defs/AssetConstraintsInterTemporalFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limits that link across time periods.
      intra_temporal:
        $ref: '#/$defs/AssetConstraintsIntraTemporalFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limits on how much assets can output in a given time period
      total:
        $ref: '#/$defs/AssetConstraintsTotalFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Limit on an aggregate quantity over a subset or the entire time
          horizon / spatial scope. This can represent real contract arrangements /
          regulation.
    title: AssetConstraintsModel
    type: object
  AssetConstraintsTotalFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetConstraintsTotalValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetConstraintsTotalFeatureModel
    type: object
  AssetConstraintsTotalValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Limit on aggregate investment (e.g. policy targets).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Limit on total asset carrier in-/out-flow (e.g. limits on storage
          cycling, annual throughput limits, uptime).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetConstraintsTotalValueModel
    type: object
  AssetCostInterTemporalFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCostInterTemporalValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCostInterTemporalFeatureModel
    type: object
  AssetCostInterTemporalValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Costs applied between investment periods (e.g. learning rate
          penalty).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Costs applied between timesteps (e.g. ramping wear cost).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCostInterTemporalValueModel
    type: object
  AssetCostLinearFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCostLinearValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCostLinearFeatureModel
    type: object
  AssetCostLinearValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Capital cost which varies linearly with asset nameplate capacity
          (e.g. EUR/MW).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating cost which varies linearly with unit in-/out-flow (e.g.
          EUR/MWh).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCostLinearValueModel
    type: object
  AssetCostModel:
    additionalProperties: false
    properties:
      annuitisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: An asset's capital investment can be annuitised to account for
          factors linked to its expected economic life and financing arrangements.
          (e.g., weighted cost of capital, inflation and tax rates).
      inter_temporal:
        $ref: '#/$defs/AssetCostInterTemporalFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Costs applied to the magnitude of change in a decision variable
          between time periods.
      linear:
        $ref: '#/$defs/AssetCostLinearFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Cost which varies linearly with a decision variable.
      nonlinear:
        $ref: '#/$defs/AssetCostNonlinearFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Cost which varies non-linearly, usually described in the objective
          using piecewise linear curves.
      threshold_deviation:
        $ref: '#/$defs/AssetCostThresholdDeviationFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Costs on deviations above/below a contracted or reference level.
          This is applied as a soft constraint requiring a reference level plus deviation
          variables.
      unit:
        $ref: '#/$defs/AssetCostUnitFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Cost which is incurred as a fixed lump sum, irrespective of magnitude.
    title: AssetCostModel
    type: object
  AssetCostNonlinearFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCostNonlinearValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCostNonlinearFeatureModel
    type: object
  AssetCostNonlinearValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Capital cost economies of scale, where cost per capacity decreases
          with increasing capacity. In some cases, it is possible to describe this
          without an explicit piecewise constraint. Instead, it may be approximated
          by multiple assets of the same class (e.g. "wind turbine") that each have
          different costs and maximum capacities.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating cost generation bid increment / decrement levels.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCostNonlinearValueModel
    type: object
  AssetCostThresholdDeviationFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCostThresholdDeviationValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCostThresholdDeviationFeatureModel
    type: object
  AssetCostThresholdDeviationValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Deviation from a contracted or reference investment level (e.g.
          rebate for providing firm capacity, penalty for exceeding land-use limits).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Deviation from a contracted or reference operating level (e.g.
          feed-in tariffs, redispatch cost relative to contracted dispatch).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCostThresholdDeviationValueModel
    type: object
  AssetCostUnitFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/AssetCostUnitValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: AssetCostUnitFeatureModel
    type: object
  AssetCostUnitValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Initial capital cost incurred on asset purchase, irrespective
          of capacity (e.g. land purchase, design phase).
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Operating cost incurred on unit commitment (e.g. start-up costs).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: AssetCostUnitValueModel
    type: object
  AssetOperatingRepresentationModel:
    additionalProperties: false
    properties:
      maintenance_scheduling:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset maintenance / outage schedules are derived endogenously,
          co-optimised with operation. Exogenously fixed maintenance windows are instead
          `asset__constraints.commitment`.
      unit_commitment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Assets can be committed as units and _then_ economically dispatched.
          This generally requires assets to be modelled as discrete units which reflect
          assets 1-to-1.
    title: AssetOperatingRepresentationModel
    type: object
  AssumptionsModel:
    description: Feature-level fields.
    items:
      type: string
    title: AssumptionsModel
    type: array
  DataIoBinaryFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/DataIoBinaryValueModel'
        default:
          input: '?'
          output: '?'
        description: Per-slice feature value.
    title: DataIoBinaryFeatureModel
    type: object
  DataIoBinaryValueModel:
    additionalProperties: false
    properties:
      input:
        default: '?'
        description: Input data can be provided in this format.
        enum:
        - y
        - n
        - '?'
        title: Input
        type: string
      output:
        default: '?'
        description: Output data is written in this format.
        enum:
        - y
        - n
        - '?'
        title: Output
        type: string
    title: DataIoBinaryValueModel
    type: object
  DataIoDatabaseFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/DataIoDatabaseValueModel'
        default:
          input: '?'
          output: '?'
        description: Per-slice feature value.
    title: DataIoDatabaseFeatureModel
    type: object
  DataIoDatabaseValueModel:
    additionalProperties: false
    properties:
      input:
        default: '?'
        description: Input data can be read from a database.
