$defs:
  ActorsModel:
    additionalProperties: false
    properties:
      distributed_objectives:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Per-agent profit maximising / risk minimising objectives can
          be represented within the larger system-level optimisation (e.g. bidding
          in day-ahead / intra-day markets, behind-the-meter prosumer decisions)
      equilibrium:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Market equilibrium computed across actors with competing objectives
          (e.g. Cournot-Nash oligopoly or Bertrand competition), via complementarity/MCP/bi-level
          formulations or a quadratic-markup reformulation of the cost-minimisation
          objective.
      heuristic_markup:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Strategic-behaviour price/offer markups applied by heuristic
          or index-based rules rather than computed equilibrium (e.g. Residual Supply
          Index <RSI>-driven markups, fixed bid adders).
      portfolio:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Agent asset portfolios and associated constraints and cost considerations
          (e.g. limited cross-portfolio capital investment, risk appetite).
    title: ActorsModel
    type: object
  AssetCapacityRepresentationModel:
    additionalProperties: false
    properties:
      continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset capacity is fully endogenous and modeled as a continuous
          (linear) decision variable. An optional maximum capacity can be specified
          in the input data (e.g. PV capacity that can be installed at any capacity
          from zero to a maximum defined by land-use constraints).
      exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset capacity is fixed and fully defined in the input data (e.g.
          for modelling dispatch only).
      integer_investment_continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset capacity magnitude is endogenous and modeled as a continuous
          (linear) decision variable. Investment is also endogenous and represented
          by a binary decision variable. An optional maximum capacity can be specified
          in the input data (e.g. gas turbines that you want to track as individual
          units and whose capacity is not fixed by the manufacturer).
      integer_investment_exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset capacity magnitude is fixed in the input data. Investment
          is modeled as a discrete (i.e., integer) decision variable (e.g. nuclear
          power plants whose capacity is fixed & indivisible due to external constraints
          but the decision to invest in this capacity is as-yet undecided).
      retrofit:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Endogenous investment in modifications to an existing asset,
          with their own build economics, that change the asset's technical parameters
          or costs rather than adding standalone capacity (e.g. emissions-abatement
          retrofits such as flue-gas desulphurisation or CO2 capture, efficiency upgrades,
          fuel-switching conversions).
    title: AssetCapacityRepresentationModel
    type: object
  AssetCostInterTemporalModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Costs applied between investment periods (e.g. learning rate
          penalty).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Costs applied between timesteps (e.g. ramping wear cost).
    title: AssetCostInterTemporalModel
    type: object
  AssetCostModel:
    additionalProperties: false
    properties:
      annuitisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: An asset's capital investment can be annuitised to account for
          factors linked to its expected economic life and financing arrangements.
          (e.g., weighted cost of capital, inflation and tax rates).
      inter_temporal:
        $ref: '#/$defs/AssetCostInterTemporalModel'
        description: Costs applied to the magnitude of change in a decision variable
          between time periods.
      nonlinear:
        $ref: '#/$defs/AssetCostNonlinearModel'
        description: Cost which varies non-linearly, usually described in the objective
          using piecewise linear curves. Non-linear relationships in constraints rather
          than the objective are `constraints.functional_form.nonlinear`.
      threshold_deviation:
        $ref: '#/$defs/AssetCostThresholdDeviationModel'
        description: Costs on deviations above/below a contracted or reference level.
          This is applied as a soft constraint requiring a reference level plus deviation
          variables.
      unit:
        $ref: '#/$defs/AssetCostUnitModel'
        description: Cost which is incurred as a fixed lump sum, irrespective of magnitude.
    title: AssetCostModel
    type: object
  AssetCostNonlinearModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Capital cost economies of scale, where cost per capacity decreases
          with increasing capacity. In some cases, it is possible to describe this
          without an explicit piecewise constraint. Instead, it may be approximated
          by multiple assets of the same class (e.g. "wind turbine") that each have
          different costs and maximum capacities.
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating cost generation bid increment / decrement levels.
    title: AssetCostNonlinearModel
    type: object
  AssetCostThresholdDeviationModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Deviation from a contracted or reference investment level (e.g.
          rebate for providing firm capacity, penalty for exceeding land-use limits).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Deviation from a contracted or reference operating level (e.g.
          feed-in tariffs, redispatch cost relative to contracted dispatch).
    title: AssetCostThresholdDeviationModel
    type: object
  AssetCostUnitModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Initial capital cost incurred on asset purchase, irrespective
          of capacity (e.g. land purchase, design phase).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating cost incurred on unit commitment (e.g. start-up costs).
    title: AssetCostUnitModel
    type: object
  AssetModel:
    additionalProperties: false
    properties:
      capacity_representation:
        $ref: '#/$defs/AssetCapacityRepresentationModel'
        description: How asset capacities can be represented in the model and optimisation
          problem.
      cost:
        $ref: '#/$defs/AssetCostModel'
        description: Asset investment and operating cost representation. Cost which
          varies linearly with a decision variable (e.g. EUR/MW capital cost on nameplate
          capacity, EUR/MWh operating cost on flow) is the baseline; we do not track
          it explicitly here.
      operating_representation:
        $ref: '#/$defs/AssetOperatingRepresentationModel'
        description: The resolution of asset operation representation in the model.
          A linearised approximation of unit commitment is `tractability.reformulation.linearised_unit_commitment`.
    title: AssetModel
    type: object
  AssetOperatingRepresentationModel:
    additionalProperties: false
    properties:
      maintenance_scheduling:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset maintenance / outage schedules are derived endogenously,
          co-optimised with operation. Exogenously fixed maintenance windows are instead
          `constraints.scope.commitment`. Resource-constrained maintenance limits
          are instead `constraints.scope.total`.
      unit_commitment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Assets can be committed as units and _then_ economically dispatched.
          This generally requires assets to be modelled as discrete units which reflect
          assets 1-to-1.
    title: AssetOperatingRepresentationModel
    type: object
  AssumptionsModel:
    description: Feature-level fields.
    items:
      type: string
    title: AssumptionsModel
    type: array
  ConstraintsFunctionalFormLinearMultiVariableModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A linear relationship linking several investment decision variables
          (e.g. energy-to-power ratio envelopes on storage capacity).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A linear relationship linking several operating decision variables,
          defining a feasible operating envelope (e.g. CHP heat-power operating regions,
          combined active/reactive power limits).
    title: ConstraintsFunctionalFormLinearMultiVariableModel
    type: object
  ConstraintsFunctionalFormModel:
    additionalProperties: false
    properties:
      linear_multi_variable:
        $ref: '#/$defs/ConstraintsFunctionalFormLinearMultiVariableModel'
        description: Linear relationships linking several decision variables, defining
          a polyhedral feasible region beyond simple upper/lower bounds on individual
          variables.
      nonlinear:
        $ref: '#/$defs/ConstraintsFunctionalFormNonlinearModel'
        description: Constraints linking together several decision variables in a
          general non-linear relationship, which can be described by e.g. a piecewise
          linear curve (`math.piecewise_formulation`) or through iterative solving.
      quadratic:
        $ref: '#/$defs/ConstraintsFunctionalFormQuadraticModel'
        description: Constraints requiring the product of decision variables, creating
          a quadratic constraint which is passed natively to a QP/QCP-capable solver.
    title: ConstraintsFunctionalFormModel
    type: object
  ConstraintsFunctionalFormNonlinearModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A non-linear relationship involving an investment decision variable
          (e.g. storage head effects, pressurisation energy curves linked to capacity).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A non-linear relationship involving an operating decision variable
          (e.g., part-load efficiency, line losses).
    title: ConstraintsFunctionalFormNonlinearModel
    type: object
  ConstraintsFunctionalFormQuadraticModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A quadratic relationship involving an investment decision variable.
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A quadratic relationship involving an operating decision variable
          (e.g. quadratic fuel curves, loss approximations).
    title: ConstraintsFunctionalFormQuadraticModel
    type: object
  ConstraintsModel:
    additionalProperties: false
    properties:
      dedicated_flow_routing:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carrier out-flow from one asset can be reserved as in-flow to
          a specific subset of other assets (e.g. fuel stockpiling ahead of conversion,
          hydropower cascades, CHP internal steam flows).
      functional_form:
        $ref: '#/$defs/ConstraintsFunctionalFormModel'
        description: The mathematical form of the relationships the tool can impose
          between decision variables, and hence the problem class handed to the solver.
          A linear relationship between an input parameter and a single decision variable
          (e.g. a fixed efficiency applied to a flow, resource availability scaled
          by capacity) is the baseline; we do not track it explicitly here. Non-linear
          and quadratic terms in the objective are instead `asset.cost.nonlinear`
          / `objective.quadratic`.
      path_dependent:
        $ref: '#/$defs/ConstraintsPathDependentModel'
        description: Constraints in which a quantity evolves endogenously based on
          cumulative historical decisions, rather than from input parameters alone.
          Approximating this by pre-generating vintaged components is instead `model_definition.component_templating`.
      reliability:
        $ref: '#/$defs/ConstraintsReliabilityModel'
        description: Reliability requirements imposed as constraints or penalty costs
          within the optimisation, under deterministic inputs. Post-hoc adequacy assessment
          is `postprocessing.probabilistic_reliability_assessment`; probabilistic
          decision methods are `uncertainty`.
      scope:
        $ref: '#/$defs/ConstraintsScopeModel'
        description: 'What a limit spans: the regions, assets, or time periods that
          a constraint links or applies within.'
    title: ConstraintsModel
    type: object
  ConstraintsPathDependentModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Evolves based on investments made in previous periods (e.g. learning
          curves).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Evolves based on operation in previous timesteps (e.g. battery
          cycling/calendar degradation, filter fouling).
    title: ConstraintsPathDependentModel
    type: object
  ConstraintsReliabilityMarginRequirementModel:
    additionalProperties: false
    properties:
      capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Firm capacity requirement, held against peak demand or a resource-adequacy
          target.
      operating_reserve:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating reserve requirement, held against short-term contingencies
          (e.g. spinning reserve, ramping reserve).
    title: ConstraintsReliabilityMarginRequirementModel
    type: object
  ConstraintsReliabilityModel:
    additionalProperties: false
    properties:
      contingency_constrained:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The optimisation is constrained to remain feasible following
          the loss of individual components, over an enumerated set of discrete failure
          states (e.g. N-1 security-constrained optimal power flow, loss of a compressor
          station or pipeline segment). Post-contingency corrective action can be
          co-optimised where the tool supports it.
      margin_requirement:
        $ref: '#/$defs/ConstraintsReliabilityMarginRequirementModel'
        description: Minimum requirement on firm capacity/margin held in reserve.
          This could be applied at the system level or on single / subsets of assets,
          if `model_definition.dimension_groups` is available.
      probabilistic_reliability_limit:
        $ref: '#/$defs/ConstraintsReliabilityProbabilisticReliabilityLimitModel'
        description: Probabilistic reliability constraints within the optimisation.
      unserved_demand:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Demand can go unserved at a penalty cost (value of lost load
          <VOLL>), placing a soft constraint on load shedding within the optimisation.
    title: ConstraintsReliabilityModel
    type: object
  ConstraintsReliabilityProbabilisticReliabilityLimitModel:
    additionalProperties: false
    properties:
      loss_of_load:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Loss-of-load-probability <LOLP> limit.
      unserved_energy:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Expected-energy-not-served <EENS> limit.
    title: ConstraintsReliabilityProbabilisticReliabilityLimitModel
    type: object
  ConstraintsScopeBoundaryConditionsModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Investment optimisation can start from an existing asset stock
          rather than from an empty (greenfield) system or can define a desired end-state.
          This allows pre-existing capacities to be represented (initial) and for
          backcasting system design (end-state).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Initial or end-state operational conditions can be set (e.g.
          start or end storage level requirements).
    title: ConstraintsScopeBoundaryConditionsModel
    type: object
  ConstraintsScopeCommitmentModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limits on investment unit purchase within investment periods.
          Usually requires `asset.capacity_representation.integer_investment_...`.
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limits on operational unit commit within timesteps (e.g., forced/planned
          outage windows). Usually requires `asset.operating_representation.unit_commitment`.
    title: ConstraintsScopeCommitmentModel
    type: object
  ConstraintsScopeInterAssetModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Investment limits that link assets (e.g., land-use competition,
          system-wide embodied emissions limits).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating limits that link assets (e.g., regional emissions limits
          applied across all emitting assets).
    title: ConstraintsScopeInterAssetModel
    type: object
  ConstraintsScopeInterSpatialModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Investment limits that link geographic regions (e.g. a minimum
          share of new capacity built in each region).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating limits that link geographic regions (e.g. a regional
          self-sufficiency requirement on generation relative to demand).
    title: ConstraintsScopeInterSpatialModel
    type: object
  ConstraintsScopeInterTemporalModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Investment limits linking investment periods (e.g. build-rate
          limits, phased retirement, availability windows).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Operating limits that link time periods (e.g., ramping, run up,
          load shifting).
    title: ConstraintsScopeInterTemporalModel
    type: object
  ConstraintsScopeIntraTemporalModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limits on investment within investment periods (e.g. minimum/maximum
          size).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limits on operation within timesteps (e.g. capacity de-rating
          profiles, minimum/maximum load levels, renewables capacity factors).
    title: ConstraintsScopeIntraTemporalModel
    type: object
  ConstraintsScopeModel:
    additionalProperties: false
    properties:
      boundary_conditions:
        $ref: '#/$defs/ConstraintsScopeBoundaryConditionsModel'
        description: Initial and end-state conditions can be set.
      commitment:
        $ref: '#/$defs/ConstraintsScopeCommitmentModel'
        description: Limits on commitment to investing in or operating an asset in
          a given time period.
      inter_asset:
        $ref: '#/$defs/ConstraintsScopeInterAssetModel'
        description: Limits that link assets, within or across regions and time.
      inter_spatial:
        $ref: '#/$defs/ConstraintsScopeInterSpatialModel'
        description: Limits that link geographic regions (e.g. to ensure regional
          equity).
      inter_temporal:
        $ref: '#/$defs/ConstraintsScopeInterTemporalModel'
        description: Limits that link across time periods.
      intra_temporal:
        $ref: '#/$defs/ConstraintsScopeIntraTemporalModel'
        description: Limits on how much assets can output in a given time period
      total:
        $ref: '#/$defs/ConstraintsScopeTotalModel'
        description: Limit on an aggregate quantity over a subset or the entire time
          horizon / spatial scope. This can represent real contract arrangements /
          regulation.
    title: ConstraintsScopeModel
    type: object
  ConstraintsScopeTotalModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limit on aggregate investment (e.g. policy targets).
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Limit on total asset carrier in-/out-flow (e.g. limits on storage
          cycling, annual throughput limits, uptime, maintenance events limited by
          available spare-parts/crew resources).
    title: ConstraintsScopeTotalModel
    type: object
  EdgeEffectsModel:
    additionalProperties: false
    properties:
      energy_balance:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Energy 'destruction' caused by simultaneous in- & out-flow from
          a lossy transmission/storage asset.
      time_financial:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Start- / End-of-horizon financial effects (e.g. asset investment
          annuitisation).
      time_operational:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Start- / End-of-horizon operational effects (e.g. storage level
          wrapping).
    title: EdgeEffectsModel
    type: object
  FeatureSetModel:
    additionalProperties: false
    properties:
      actors:
        $ref: '#/$defs/ActorsModel'
        description: Representation of heterogeneous decision-making actors, deviating
          from the single, central-planner baseline.
      asset:
        $ref: '#/$defs/AssetModel'
        description: 'Representation of the individual assets that make up the system:
          how their capacities are represented, how their operation is resolved, and
          the costs they incur. Limits on asset investment and operation, and the
          mathematical form those limits take, are `constraints`.'
      constraints:
        $ref: '#/$defs/ConstraintsModel'
        description: Limits on asset investment and operating decisions, and reliability
          requirements imposed on the system as a whole, whether enforced as hard
          constraints or as penalty costs. `scope` describes what a limit spans; `functional_form`
          describes the mathematical form of the relationships between decision variables
          that the tool can express.
      edge_effects:
        $ref: '#/$defs/EdgeEffectsModel'
        description: Distortive effects of system boundaries and linearising model
          components can be mitigated against. Flows across the spatial boundary are
          `processes.boundary_exchange`.
      interface:
        $ref: '#/$defs/InterfaceModel'
        description: 'Available options for users and machines to drive the tool:
          defining, configuring, and structuring a model (`build`); executing a model
          run (`run`); interacting with model outputs (`analyse`); plus tool-level
          execution and solver configuration.'
      io:
        $ref: '#/$defs/IoModel'
        description: Data formats, conventions, and mechanisms for moving model input/output
          data. Computing new parameters is `preprocessing`.
      math:
        $ref: '#/$defs/MathModel'
        description: Access to, and user extension of, the underlying mathematical
          formulation.
      model_definition:
        $ref: '#/$defs/ModelDefinitionModel'
        description: How the model's parameter space and dimensions can be shaped,
          grouped, and reused, independent of any single parameter, constraint, or
          cost.
      network:
        $ref: '#/$defs/NetworkModel'
        description: Network physics representation beyond the `processes.spatial_transfer`
          baseline, where flows are coupled by the physics of the transporting medium
          rather than by capacity limits alone.
      objective:
        $ref: '#/$defs/ObjectiveModel'
        description: Objective-function options beyond minimisation of a single linear
          cost term.
      orchestration:
        $ref: '#/$defs/OrchestrationModel'
        description: Tool-managed workflows coordinating multiple complete runs in
          series/parallel, where the result emerges from the ensemble or its convergence.
      pathway:
        $ref: '#/$defs/PathwayModel'
        description: "Foresight extent and planning direction across operational (intra-annual)\
          \ or investment (inter-annual) time periods. A single-snapshot run \u2014\
          \ \"overnight\" capacity expansion, or dispatch without a time dimension\
          \ - is the baseline; we do not track it explicitly here."
      postprocessing:
        $ref: '#/$defs/PostprocessingModel'
        description: Postprocessing analyses that can be triggered by the tool based
          on model outputs, on a per-asset or system-wide basis.
      preprocessing:
        $ref: '#/$defs/PreprocessingModel'
        description: Options to generate parameters derived from user-defined input
          data before running the model. Moving/storing data is `io`.
      processes:
        $ref: '#/$defs/ProcessesModel'
        description: Fundamental carrier-flow capabilities the tool can represent,
          defined by their mathematical role rather than by named technologies. `Carriers`
          are the energy or non-energy commodities that flow between processes (e.g.
          electricity, heat, hydrogen, CO2, water, materials). Only physical processes
          are in scope; decision-making agents are `actors`.
      tractability:
        $ref: '#/$defs/TractabilityModel'
        description: Approaches to reduce the computational cost of building and solving
          the problem, trading exactness for speed.
      transparency:
        $ref: '#/$defs/TransparencyModel'
        description: 'Transparency of the modelling pipeline: logs, diagnostics, and
          traceability of data as it moves through the workflow.'
      uncertainty:
        $ref: '#/$defs/UncertaintyModel'
        description: Methods that restructure the decision problem to account for
          parametric or structural uncertainty.
    title: FeatureSetModel
    type: object
  InterfaceApiModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Programmatic interface to analyse results.
      build:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Can be configured using scripting specific to the tool programming
          language or another programming language for which an API is provided (e.g.
          a Python API for a package written in C).
      run:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Programmatic interface to launch and manage runs.
    title: InterfaceApiModel
    type: object
  InterfaceCliModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: CLI commands to create reports to enable result analysis.
      build:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: CLI commands that enable model building. This is usually used
          to convert between data formats for a given model definition, but may also
          be used to redefine a model (e.g. reduce dimensions).
      run:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: CLI commands that launch and manage a model run.
    title: InterfaceCliModel
    type: object
  InterfaceGuiModel:
    additionalProperties: false
    properties:
      analyse:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A GUI is available for interacting with model outputs.
      build:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A GUI is available for defining, configuring, and structuring
          a model.
      run:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A GUI is available for executing a model run.
    title: InterfaceGuiModel
    type: object
  InterfaceModel:
    additionalProperties: false
    properties:
      analysis_templates:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Templates can be used to generate consistent reports or dashboards
          to consolidate model outputs for dissemination.
      api:
        $ref: '#/$defs/InterfaceApiModel'
        description: Programmatic interface (e.g. language API, web API).
      cli:
        $ref: '#/$defs/InterfaceCliModel'
        description: Command line interface.
      gui:
        $ref: '#/$defs/InterfaceGuiModel'
        description: Graphical user interface.
      remote_execution:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Runs can be dispatched to and managed on remote compute (cloud,
          HPC, hosted service) from the tool.
      solver_configuration:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Optimiser parameters can be directly configured, including convergence
          parameters & warm-starting options.
      visualisation:
        $ref: '#/$defs/InterfaceVisualisationModel'
        description: Built-in rendering of model inputs or outputs as visual artefacts,
          independent of whether a `gui` is available to interact with them.
    title: InterfaceModel
    type: object
  InterfaceVisualisationModel:
    additionalProperties: false
    properties:
      charts:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Plots of input or result data (e.g. dispatch stacks, time series,
          duration curves).
      network_maps:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Rendering of network topology, schematically (auto-layout diagrams)
          or geographically (coordinate-based maps, exports to geographic formats
          such as KML/GML).
    title: InterfaceVisualisationModel
    type: object
  IoBinaryModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data can be provided in this format.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Output data is written in this format.
    title: IoBinaryModel
    type: object
  IoDatabaseModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data can be read from a database.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Output data can be written to a database.
    title: IoDatabaseModel
    type: object
  IoLazyLoadingModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data can be loaded lazily.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Output data can be written lazily / streamed rather than held
          fully in memory.
    title: IoLazyLoadingModel
    type: object
  IoModel:
    additionalProperties: false
    properties:
      binary:
        $ref: '#/$defs/IoBinaryModel'
        description: Data in compact / compressible, non-human-readable binary formats
          (e.g. Excel, NetCDF, HDF5, Parquet).
      database:
        $ref: '#/$defs/IoDatabaseModel'
        description: Data in databases (relational or otherwise).
      lazy_loading:
        $ref: '#/$defs/IoLazyLoadingModel'
        description: Data can be loaded lazily / out-of-core, allowing datasets larger
          than memory.
      plain_text:
        $ref: '#/$defs/IoPlainTextModel'
        description: Data in human-readable, diff- and version-control-friendly text
          formats (e.g. CSV, JSON, YAML).
      remote_storage:
        $ref: '#/$defs/IoRemoteStorageModel'
        description: Data can be read from / written to remote storage (e.g. object
          stores, cloud drives).
      standardised:
        $ref: '#/$defs/IoStandardisedModel'
        description: Accepts or emits data following a community-recognised convention
          or ontology (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy
          System Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas),
          including standardised network-data formats (e.g. PSSE RAW, matpower case
          files, Common Information Model <CIM>).
    title: IoModel
    type: object
  IoPlainTextModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data can be provided in this format.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Output data is written in this format.
    title: IoPlainTextModel
    type: object
  IoRemoteStorageModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data can be read from remote storage.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Output data can be written to remote storage.
    title: IoRemoteStorageModel
    type: object
  IoStandardisedModel:
    additionalProperties: false
    properties:
      input:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Accepts input data following a community-recognised convention
          or ontology.
      output:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Outputs follow a community-recognised convention or ontology.
          This is useful for regulatory reporting or frictionless data transfer with
          a downstream process.
    title: IoStandardisedModel
    type: object
  MathModel:
    additionalProperties: false
    properties:
      dual_extraction:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The built optimisation problem's constraint duals can be extracted
          (e.g. to approximate wholesale market prices via `postprocessing.financial.marginal_price`,
          or to construct a future cost function via `postprocessing.financial.water_value`).
      formulation_transparency:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The tool's mathematical formulation is accessible and inspectable.
          (e.g. as rendered equations or a math specification traceable to the built
          problem).
      piecewise_formulation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Piecewise formulations of nonlinear relationships (`constraints.functional_form.nonlinear`)
          can be defined in the math (e.g. using LP chord-line or MIP SOS2 constraints).
      problem_file_export:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The built optimisation problem can be exported in standard formats
          (e.g. LP/MPS).
      soft_constraints:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: User-defined or built-in constraints can be reformulated as soft
          constraints without bespoke implementation per constraint. This is usually
          via a generic slack-variable-plus-penalty mechanism. Built-in economic threshold
          costs are instead `asset.cost.threshold_deviation.investment` / `asset.cost.threshold_deviation.operation`.
      user_defined_math:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Users can define their own constraints on the optimisation problem,
          applied to existing or new decision variables, and write their own objective
          expression.
    title: MathModel
    type: object
  ModelDefinitionModel:
    additionalProperties: false
    properties:
      component_templating:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Components can inherit parameterisation from a shared template
          (e.g. an abstract technology definition), with edits to the template cascading
          to every inheriting component, rather than requiring per-component data
          entry. Includes programmatic, model-side generation of components from a
          template (e.g. auto-cloned vintaged expansion candidates approximating `constraints.path_dependent`
          relationships).
      configurable_dimensions:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The dimensionality of an asset parameter (e.g. efficiency, availability)
          or cost can be configured by the user, limited to a set of tool-defined
          dimensions.
      dimension_groups:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Dimension members can be tagged into named, potentially overlapping
          groups independent of the model's built-in structural dimensions (e.g. a
          "coastal assets" or "2030-vintage" tag spanning multiple asset types/nodes).
          These can be used for dimension aggregation to achieve tractability (e.g.
          spatial nodes to zones), for filtering on dimensions when applying constraints
          (e.g. total capacity across group X; seasonal limits), and for analysis/visualisation
          (`postprocessing.aggregation`/`postprocessing.disaggregation`).
      extensible_dimensions:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A dimension not natively defined by the tool (e.g. a custom vintage,
          cohort, or scenario axis) can be introduced by the user. Asset parameters/costs
          and math variables and constraints can be indexed over this new dimension
          (usually requires custom math - `math.user_defined_math`).
    title: ModelDefinitionModel
    type: object
  NetworkHydraulicFlowModel:
    additionalProperties: false
    properties:
      composition_tracking:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A single transfer asset carries a mixture whose constituents
          are balanced individually, allowing limits on the resulting blend (e.g.
          hydrogen blend-fraction limits, minimum gross calorific value <GCV>, Wobbe
          index bounds). Composition-dependent hydraulics (e.g. a density-dependent
          pressure-drop coefficient) are out of scope.
      linearised_flow:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Nodal pressure/head is a decision variable which couples flows
          using a linearised pressure-drop relationship. Operating limits on that
          state are representable in the same formulation (e.g. minimum/maximum nodal
          pressure, maximum allowable operating pressure <MAOP>, contracted delivery
          pressure).
    title: NetworkHydraulicFlowModel
    type: object
  NetworkModel:
    additionalProperties: false
    properties:
      hydraulic_flow:
        $ref: '#/$defs/NetworkHydraulicFlowModel'
        description: Pressure-driven network representation for carriers transported
          through pipes, beyond the `processes.spatial_transfer` baseline (e.g. methane,
          hydrogen, CO2, district heat/cooling, water).
      power_flow:
        $ref: '#/$defs/NetworkPowerFlowModel'
        description: Electrical network representation beyond the `processes.spatial_transfer`
          baseline.
    title: NetworkModel
    type: object
  NetworkPowerFlowModel:
    additionalProperties: false
    properties:
      network_devices:
        $ref: '#/$defs/NetworkPowerFlowNetworkDevicesModel'
        description: Network components beyond simple lines and buses, carrying their
          own mathematical formulations.
      network_limits:
        $ref: '#/$defs/NetworkPowerFlowNetworkLimitsModel'
        description: Network operating limits representable in the power-flow formulation.
      optimal_power_flow:
        $ref: '#/$defs/NetworkPowerFlowOptimalPowerFlowModel'
        description: Linearised optimal power flow can be modelled.
      sensitivity_limits:
        $ref: '#/$defs/NetworkPowerFlowSensitivityLimitsModel'
        description: Flows can be limited using supplied linear sensitivities, as
          an alternative to physical network limits.
      unbalanced_flows:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Unbalanced flows (asymmetric phases) can be handled in optimal
          power flow, usually using linearised DistFlow branch equations.
    title: NetworkPowerFlowModel
    type: object
  NetworkPowerFlowNetworkDevicesModel:
    additionalProperties: false
    properties:
      facts_devices:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Flexible AC Transmission System <FACTS> devices.
      hvdc_converters:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Rectifiers, inverters, and HVDC converter stations.
      transformers:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Shunt and phase-shifting transformers.
    title: NetworkPowerFlowNetworkDevicesModel
    type: object
  NetworkPowerFlowNetworkLimitsModel:
    additionalProperties: false
    properties:
      phase_angle:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Phase-angle difference limits between connected buses.
      thermal:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Thermal (branch flow magnitude) limits.
    title: NetworkPowerFlowNetworkLimitsModel
    type: object
  NetworkPowerFlowOptimalPowerFlowModel:
    additionalProperties: false
    properties:
      ac_opf:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Linearised AC optimal power flow
      dc_opf:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: DC optimal power flow
    title: NetworkPowerFlowOptimalPowerFlowModel
    type: object
  NetworkPowerFlowSensitivityLimitsModel:
    additionalProperties: false
    properties:
      generic_constraints:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Generic transmission Constraints defined by user-supplied sensitivity
          coefficients not tied to a named physical factor.
      outage_factors:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Line/Branch Outage Distribution Factor <LODF/BODF> limits, describing
          the sensitivity of a branch flow to the outage of another branch.
      ptdf:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Power Transfer Distribution Factor <PTDF> limits, describing
          the sensitivity of a branch flow to a nodal injection.
    title: NetworkPowerFlowSensitivityLimitsModel
    type: object
  ObjectiveModel:
    additionalProperties: false
    properties:
      multi_objective_pareto:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Built-in generation of Pareto-optimal solution sets across objectives
          (e.g. epsilon-constraint, evolutionary methods).
      multi_objective_weighted:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Multiple objective terms combined via user-set weights into a
          single objectives. Trade-offs explored by manual weight variation.
      quadratic:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Quadratic objective terms passed natively to the solver (e.g.
          quadratic generation cost curves, welfare maximisation with linear demand
          curves). Quadratic terms in constraints rather than the objective are `constraints.functional_form.quadratic`.
    title: ObjectiveModel
    type: object
  OrchestrationModel:
    additionalProperties: false
    properties:
      coupled_models:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Two or more model instances of different temporal or market fidelity
          executed together, with bidirectional data exchange between them (e.g. interleaved
          day-ahead/real-time runs passing offers and dispatch baselines forward and
          initial conditions back).
      rolling_horizon:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Myopic foresight pathway optimisation windows are optimised sequentially,
          with automatic handling of data pass-through between runs.
      sampled_runs:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Execution of run ensembles over a sampled uncertainty space (e.g.
          Monte Carlo), with collated outputs. Used e.g. for post-hoc resource adequacy
          assessment (`postprocessing.probabilistic_reliability_assessment`) or portfolio
          price-risk quantification. Distinct from `scenario_runs` (discrete, named
          scenarios).
      scenario_runs:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Batch execution of discrete, named scenario ensembles in series/parallel
          with collated outputs.
      simulation_optimisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Iterate between a simulation and optimisation phase until convergence
          with respect to (often nonlinear) constraints (e.g. competitive market simulation,
          optimal power flow).
    title: OrchestrationModel
    type: object
  PathwayModel:
    additionalProperties: false
    properties:
      myopic_foresight:
        $ref: '#/$defs/PathwayMyopicForesightModel'
        description: Time periods are optimised sequentially, with each decision made
          without knowledge / with limited knowledge of later periods.
      perfect_foresight:
        $ref: '#/$defs/PathwayPerfectForesightModel'
        description: Perfect foresight capacity expansion / dispatch.
    title: PathwayModel
    type: object
  PathwayMyopicForesightModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Investment decisions are optimised sequentially per period /
          set of periods.
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Dispatch decisions are optimised sequentially per set of timesteps
          (e.g. days).
    title: PathwayMyopicForesightModel
    type: object
  PathwayPerfectForesightModel:
    additionalProperties: false
    properties:
      investment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: All investment periods are optimised simultaneously with perfect
          foresight of future periods.
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: All dispatch periods are optimised simultaneously with perfect
          foresight of future timesteps in the investment period(s).
    title: PathwayPerfectForesightModel
    type: object
  PostprocessingFinancialModel:
    additionalProperties: false
    properties:
      asset_accounts:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset-level revenue / cost accounting.
      contract_settlement:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Post-hoc settlement of contracts against realised dispatch and
          prices, without altering the underlying optimisation. (e.g. Contracts-for-Difference
          <CfD>, Power/energy Purchase Agreements <PPA>, swaps, caps/floors, Financial
          Transmission Rights <FTR>, Settlement Residue Auctions <SRA>).
      levelised_cost:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Levelised cost of electricity or other carriers.
      marginal_price:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Shadow prices extracted via `math.dual_extraction`, used to approximate
          wholesale market prices or as an input to `price_formation`, `contract_settlement`
          and soft-constraint interpretation.
      net_present_value:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Net present value of the modelled system or a subset of assets.
      price_formation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Prices constructed by a documented market rule rather than taken
          directly from optimisation duals (e.g. uniform pricing via a relaxed re-solve,
          uplift / fixed-cost-recovery adders, iterative markup calibration to recover
          long-run marginal cost, marginal-loss-factor settlement).
      water_value:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A future cost function (water value) constructed as a reusable,
          exportable artefact from shadow prices extracted via `math.dual_extraction`
          (e.g. from Benders / SDDP cuts), forecasting the marginal cost of hydro
          and other seasonal storage devices for use in shorter-term scheduling under
          uncertain input parameters.
    title: PostprocessingFinancialModel
    type: object
  PostprocessingImpactAssessmentModel:
    additionalProperties: false
    properties:
      emissions:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: GHG or other pollutant emissions.
      resource_use:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Non-carrier resource consumption (e.g. water, land, materials).
      socioeconomic:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Socioeconomic impacts (e.g. job creation).
    title: PostprocessingImpactAssessmentModel
    type: object
  PostprocessingModel:
    additionalProperties: false
    properties:
      aggregation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Method to aggregate across dimensions into broader groups for
          analysis and dissemination. This usually requires `model_definition.dimension_groups`
          to define aggregation membership.
      disaggregation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Method to redistribute outputs back to an initial, pre-`tractability.dimension_reduction`
          resolution. (e.g. so that capacity-expansion results can be handed off to
          a full-resolution power-flow model).
      financial:
        $ref: '#/$defs/PostprocessingFinancialModel'
        description: Financial analyses for business cases, derived from model outputs.
      impact_assessment:
        $ref: '#/$defs/PostprocessingImpactAssessmentModel'
        description: Auxiliary impacts calculated from model outputs.
      network_transfer_metrics:
        $ref: '#/$defs/PostprocessingNetworkTransferMetricsModel'
        description: Network transfer capability and flow-sensitivity metrics derived
          from model outputs.
      operational:
        $ref: '#/$defs/PostprocessingOperationalModel'
        description: Operational analyses derived from model outputs.
      probabilistic_reliability_assessment:
        $ref: '#/$defs/PostprocessingProbabilisticReliabilityAssessmentModel'
        description: Probabilistic resource-adequacy metrics calculated post-hoc.
          Sampling-based run orchestration to produce them is `orchestration.sampled_runs`.
      scenario_comparison:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Outputs of multiple scenario/ensemble runs are collated and compared.
    title: PostprocessingModel
    type: object
  PostprocessingNetworkTransferMetricsModel:
    additionalProperties: false
    properties:
      flow_sensitivity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Flow-sensitivity metrics (e.g. power transfer distribution factors,
          line outage distribution factors).
      transfer_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Grid transfer capacities between regions or zones.
    title: PostprocessingNetworkTransferMetricsModel
    type: object
  PostprocessingOperationalModel:
    additionalProperties: false
    properties:
      capacity_factor:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset generation relative to full-load generation, averaged over
          the model horizon.
      curtailment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Asset generation curtailment.
      full_load_hours:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Number or fraction of timesteps in the model horizon that assets
          are operating at or close to their full load. Distinct from `capacity_factor`
          as the same average output can arise from very different duty cycles, affecting
          e.g. asset lifetime.
    title: PostprocessingOperationalModel
    type: object
  PostprocessingProbabilisticReliabilityAssessmentModel:
    additionalProperties: false
    properties:
      capacity_credit:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Effective load carrying capacity <ELCC>.
      loss_of_load:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Loss of load probability/expectation <LOLP>.
      unserved_energy:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Expected energy not served <EENS>.
    title: PostprocessingProbabilisticReliabilityAssessmentModel
    type: object
  PreprocessingModel:
    additionalProperties: false
    properties:
      download:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Data can be downloaded directly within the tool from an open
          or proprietary source rather than being specified by the user.
      forecasting:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A user-defined generation / load profile can be automatically
          scaled or reshaped to meet user-defined forecast targets (e.g. change in
          annual total or peak).
      input_validation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Input data is validated against the tool's expected structure
          and value ranges before a run, with informative failures.
      model_catalogue:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Pre-built model datasets/examples can be retrieved from a catalogue
          as starting points for new models.
      numeric_scaling:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Data can be scaled (e.g. by converting base units) to reduce
          numeric instability and constraint violations in the downstream solver.
      resource_conversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Model profiles are derived within the tool from primary resource
          or weather data via physical response models. This may be technology models
          converting resource to availability or efficiency (e.g. wind speed to turbine
          capacity factor, temperature to heat pump COP). It may also be weather-response
          demand functions (e.g. temperature-driven gas or heating demand).
      scenario_generation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Scenario ensembles can be generated from user-defined parameters
          or sampling rules, for execution as `orchestration.scenario_runs` or `orchestration.sampled_runs`.
      spatial_distribution:
        $ref: '#/$defs/PreprocessingSpatialDistributionModel'
        description: A user-defined parameter can be automatically distributed spatially
          using other spatial parameters.
    title: PreprocessingModel
    type: object
  PreprocessingSpatialDistributionModel:
    additionalProperties: false
    properties:
      demand:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Nodal demand distribution from an aggregate total.
      network_geometry:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Transmission/pipeline line distances or routing derived from
          node coordinates.
      slack:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Distributed slack allocation across nodes.
    title: PreprocessingSpatialDistributionModel
    type: object
  ProcessesConversionModel:
    additionalProperties: false
    properties:
      flexible_ratio:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The ratio between a conversion process's flows is a decision
          variable, freely allocated or constrained within a feasible operating region
          (e.g. heat pumps serving heat and cooling, extraction-condensing CHP).
      multi_carrier_io:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A single conversion process has several in-flowing and/or out-flowing
          carriers, each balanced individually, with fixed ratios between them (e.g.
          back-pressure CHP, fixed heat-recovery fractions).
      one_to_one:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A single in-flowing carrier is converted to a single out-flowing
          carrier (e.g. power plants, electrolysers without heat recovery).
    title: ProcessesConversionModel
    type: object
  ProcessesExplicitDemandModel:
    additionalProperties: false
    properties:
      inelastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A fixed quantity of a carrier is consumed by a process whose
          in-flow is balanced like any other process flow. The process can therefore
          be parameterised and constrained (e.g., to shift consumption in space and
          time to reflect demand-side management).
      mobile_storage:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A consuming process with embedded storage whose network attachment
          and availability vary in space and time, according to user-defined patterns.
      price_responsive:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The consumed quantity is decided in the optimisation against
          price / willingness-to-pay, via demand bids or stepwise/linear demand curves.
    title: ProcessesExplicitDemandModel
    type: object
  ProcessesModel:
    additionalProperties: false
    properties:
      boundary_exchange:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carriers enter or leave the system across its boundary at a defined
          cost and availability (e.g. fuel supply, primary resource extraction, imports/exports
          to unmodelled regions).
      buffered_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: 'Flow in space with an endogenous in-transit inventory, to enable
          the flow to accumulate in time (e.g. pipeline linepack).

          '
      conversion:
        $ref: '#/$defs/ProcessesConversionModel'
        description: Carriers are transformed into other carriers within the system
          boundary (e.g. power plants, electrolysers, heat pumps, CO2 capture). This
          enables coupled multi-carrier optimisation.
      delayed_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Continuous flow in space with a time delay between injection
          and withdrawal (e.g., river flows, district-heating transit).
      discrete_transport:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carriers are moved in space or exchanged across the system boundary
          in discrete packets with loading/unloading decisions (e.g. shipping, trucking,
          rail).
      explicit_demand:
        $ref: '#/$defs/ProcessesExplicitDemandModel'
        description: Carriers are consumed within the system boundary by explicit
          processes with their own balances and constraints, rather than by a fixed
          exogenous profile parameter.
      spatial_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carriers are moved between regions as continuous flow subject
          to transfer-capacity limits, without network physics. See `network.power_flow`
          / `network.hydraulic_flow` for network physics features.
      state_changing_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carrier movement requiring the carrier's physical state to be
          tracked or converted en route (e.g. gas pressure levels with compressors,
          heat-network temperature levels).
      temporal_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Carriers are moved in time (e.g. storage, demand shifting), linking
          system states across timesteps.
    title: ProcessesModel
    type: object
  TractabilityDimensionReductionAssetsModel:
    additionalProperties: false
    properties:
      black_boxing:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A chain of interconnected assets is collapsed into a single component
          with an in/out interface. This usually requires `constraints.dedicated_flow_routing`
          between interconnected components.
      clustering:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Individually defined assets are automatically aggregated into
          asset groups for optimisation. This usually requires `model_definition.dimension_groups`
          to define aggregation membership.
      component_removal:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Individual or groups of assets (e.g. sharing a node or a carrier)
          can be systematically filtered out of the built problem.
    title: TractabilityDimensionReductionAssetsModel
    type: object
  TractabilityDimensionReductionModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/TractabilityDimensionReductionAssetsModel'
        description: Asset resolution adjustment options.
      spatial:
        $ref: '#/$defs/TractabilityDimensionReductionSpatialModel'
        description: Spatial resolution adjustment options.
      temporal:
        $ref: '#/$defs/TractabilityDimensionReductionTemporalModel'
        description: Temporal resolution adjustment options (may apply to within-year
          timesteps or between-year investment periods).
    title: TractabilityDimensionReductionModel
    type: object
  TractabilityDimensionReductionSpatialModel:
    additionalProperties: false
    properties:
      clustering:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Automatic spatial zone aggregation/disaggregation. Usually from
          nodal (bus) level to regional/bidding zone level. This usually requires
          `model_definition.dimension_groups` to define aggregation membership.
      network_reduction:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Network element equivalencing (e.g., reducing to a single voltage
          level).
    title: TractabilityDimensionReductionSpatialModel
    type: object
  TractabilityDimensionReductionTemporalModel:
    additionalProperties: false
    properties:
      dimension_non_contiguity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Mathematical constraints to manage inter-temporal model features
          when using non-contiguous temporal aggregation (e.g., linking storage levels
          across typical periods).
      load_duration_curves:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Full timeseries is represented by load duration curves.
      resampling:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Temporal resolution of the input timeseries is coarsened while
          remaining contiguous (e.g. hourly to daily) before the model is built.
      typical_periods:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Full timeseries is represented by non-contiguous typical periods
          (days, weeks, months).
    title: TractabilityDimensionReductionTemporalModel
    type: object
  TractabilityModel:
    additionalProperties: false
    properties:
      dimension_reduction:
        $ref: '#/$defs/TractabilityDimensionReductionModel'
        description: Options to reduce the size of a given dimension of the problem.
      reformulation:
        $ref: '#/$defs/TractabilityReformulationModel'
        description: Approximations of discrete or non-linear formulations that preserve
          (mixed-integer) linear tractability.
    title: TractabilityModel
    type: object
  TractabilityReformulationModel:
    additionalProperties: false
    properties:
      approximation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The solution algorithm is reformulated to reach a near-optimal
          answer within tolerance at reduced cost (e.g. progressive hedging, Stochastic
          Dual Dynamic Programming <SDDP>-style cut selection).
      constraint_screening:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Constraints unlikely to bind are omitted or lazily added.
      convex_relaxation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: A non-convex relationship (`constraints.functional_form.nonlinear`)
          is approximated by a convex relaxation, retaining solver tractability (e.g.
          second-order-cone relaxation of AC power flow).
      decomposition:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The problem is split into coordinated sub-problems solved iteratively
          or in parallel until convergence (e.g. Benders decomposition; Stochastic
          Dual Dynamic Programming <SDDP> for multi-stage stochastic hydropower scheduling).
      function_conversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: User-defined arbitrary non-linear functions (`constraints.functional_form.nonlinear`)
          are automatically converted into valid model inputs (e.g. piecewise segments)
          without manual discretisation.
      linearised_unit_commitment:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Unit commitment approximated with continuous (linearised) commitment
          variables, avoiding integer decision variables.
      variable_fidelity:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: The mathematical fidelity of the same physical attribute can
          differ across the model's scope within one model definition (e.g. discrete
          units in some investment periods and aggregated capacity in others; unit
          commitment over the near-term horizon, continuous economic dispatch beyond).
    title: TractabilityReformulationModel
    type: object
  TransparencyMetadataPropagationModel:
    additionalProperties: false
    properties:
      provenance:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Data sources, versions, and licences are propagated from inputs
          through to outputs.
      units:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Physical units attached to data are tracked and validated through
          the pipeline (to enable e.g., unit-consistency checking, automatic conversion,
          auto-scaling).
    title: TransparencyMetadataPropagationModel
    type: object
  TransparencyModel:
    additionalProperties: false
    properties:
      infeasibility_diagnosis:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Infeasible problems can be diagnosed (e.g. irreducible infeasible
          subset (IIS) generation, named constraint violations).
      intermediate_access:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Intermediate pipeline artefacts (e.g. built problem data, solver
          state) can be exposed to the user.
      metadata_propagation:
        $ref: '#/$defs/TransparencyMetadataPropagationModel'
        description: Metadata is propagated from inputs through to outputs.
      run_logs:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Run logs available (e.g. in text files), for use in debugging
          failing model runs.
    title: TransparencyModel
    type: object
  UncertaintyModel:
    additionalProperties: false
    properties:
      multi_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Multi-stage stochastic optimisation, in which decisions are revised
          as uncertainty resolves stage by stage. Primarily used for scheduling seasonal
          storage (e.g. hydropower water values) under uncertain inflows.
      near_optimal:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Generate a near-optimal solution set by relaxing constraints
          / objectives in the optimisation problem. (e.g., Modelling to Generate Alternatives
          <MGA>).
      risk_aversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Risk measures (e.g. Conditional Value at Risk <CVaR>) applied
          to a stochastic optimisation as chance constraints. It weights tail-end
          outcomes according to a configurable risk tolerance.
      robust_optimisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Worst-case cost minimisation over an uncertainty set.
      two_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        description: Two-stage stochastic optimisation; used in investment decision
          making under uncertainty.
    title: UncertaintyModel
    type: object
  UseCaseFeatureModel:
    additionalProperties: false
    description: Feature-level fields.
    properties:
      value:
        default: '?'
        description: 'Whether a feature is required (`y`) or not (`n`) in the use-case.

          Defaults to unknown (`?`).'
        enum:
        - y
        - n
        - '?'
        title: Value
        type: string
    title: UseCaseFeatureModel
    type: object
