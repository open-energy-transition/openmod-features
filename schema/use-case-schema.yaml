$defs:
  ActorsModel:
    additionalProperties: false
    properties:
      aggregated_prosumers:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Small-scale consumers/prosumers represented as aggregated actor
          classes with their own objectives and response behaviour, rather than as
          individuals.
      distributed_objectives:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Per-agent profit maximising / risk minimising bidding in day-ahead
          / intra-day markets
      equilibrium:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Market equilibrium found across actors with competing objectives.
          This could be applied via complementarity/MCP/bi-level formulations or a
          quadratic-markup reformulation of the cost-minimisation objective (e.g.
          Cournot-Nash oligopoly modelling).
      portfolio:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Agent asset portfolios and associated constraints and cost considerations
          (e.g. limited cross-portfolio capital investment, risk appetite)
    title: ActorsModel
    type: object
  AssetCapacityRepresentationModel:
    additionalProperties: false
    properties:
      continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity is fully endogenous and modeled as a continuous
          (linear) decision variable. An optional maximum capacity can be specified
          in the input data (e.g. PV capacity that can be installed at any capacity
          from zero to a maximum defined by land-use constraints)
      exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity is fixed and fully defined in the input data (e.g.
          for modelling dispatch only)
      integer_investment_continuous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity magnitude is endogenous and modeled as a continuous
          (linear) decision variable. Investment is also endogenous and represented
          by a binary decision variable. An optional maximum capacity can be specified
          in the input data (e.g. gas turbines that you want to track as individual
          units and whose capacity is not fixed by the manufacturer)
      integer_investment_exogenous_capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset capacity magnitude is fixed in the input data. Investment
          is modeled as a discrete (i.e., integer) decision variable (e.g. nuclear
          power plants whose capacity is fixed & indivisible due to external constraints
          but the decision to invest in this capacity is as-yet undecided)
    title: AssetCapacityRepresentationModel
    type: object
  AssetCostInvestmentModel:
    additionalProperties: false
    properties:
      annuitisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: An asset's capital investment can be annuitised to account for
          factors linked to its expected economic life and financing arrangements.
          (e.g., weighted cost of capital, inflation and tax rates, and other sources
          of depreciation)
      linear:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Initial asset capital cost which varies linearly with asset nameplate
          capacity (e.g. EUR/MW).
      piecewise:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Initial asset capital cost which varies non-linearly, represented
          by a piecewise linear curve (e.g. economies of scale, where cost per capacity
          decreases with increasing capacity). This may be approximated by multiple
          assets of the same class (e.g. "wind turbine") that each have different
          costs and maximum capacities.
      threshold_deviation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Costs on deviations above/below a contracted or reference investment
          level. This is applied as a soft constraint requiring a reference level
          plus deviation variables (e.g. rebate for providing firm capacity, penalty
          for exceeding land-use limits).
      unit:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Initial asset capital cost which is incurred on asset purchase,
          irrespective of capacity (e.g. land purchase).
    title: AssetCostInvestmentModel
    type: object
  AssetCostOperationModel:
    additionalProperties: false
    properties:
      inter_temporal:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Costs applied to the magnitude of change in an operating decision
          variable between timesteps (e.g. ramping wear cost).
      linear:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Operating costs which vary linearly with unit in-/out-flow (e.g.
          EUR/MWh)
      piecewise:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Operating costs which vary non-linearly, represented by a piecewise
          linear curve (e.g. generation bid increment / decrement levels)
      threshold_deviation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Costs on deviations above/below a contracted or reference operating
          level. This is applied as a soft constraint requiring a reference level
          plus deviation variables (e.g. feed-in tariffs, redispatch cost relative
          to contracted dispatch).
      unit:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Operating costs which are incurred on unit commitment (e.g. start-up
          costs)
    title: AssetCostOperationModel
    type: object
  AssetInvestmentConstraintsModel:
    additionalProperties: false
    properties:
      brownfield:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Investment optimisation can start from an existing asset stock
          rather than from an empty (greenfield) system. This allows pre-existing
          capacities to be represented, which may be extendable and / or retirable.
      inter_period:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Investment limits linking investment periods (e.g. build-rate
          limits, phased retirement, availability windows).
      minimum_size:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A minimum implementable capacity if an asset is built at all
          (requires integer investment).
      total:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limits on aggregate investment in an asset across a spatial/temporal
          subset.
    title: AssetInvestmentConstraintsModel
    type: object
  AssetOperatingCharacteristicsModel:
    additionalProperties: false
    properties:
      configurable_dimensions:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A characteristic's dimensionality can be chosen by the user per
          characteristic, rather than being fixed by the tool for each named parameter
          (Full user choice on whether e.g. parameters vary by time, space, both,
          or neither)
      extensible_dimensions:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A dimension not natively defined by the tool (e.g. a custom vintage,
          cohort, or scenario axis) can be introduced by the user. The tool's mathematical
          formulation can either handle this automatically or requires custom math
          (see `interface__math.user_defined_math`).
      iterative:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset characteristics vary depending on operating decision variables.
          This creates a non-linear relationship that can only be converged upon iteratively
          (e.g. transmission line losses).
      linear:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset characteristics vary linearly with a single decision variable
          (e.g. resource availability increasing with asset capacity)
      path_dependent:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset characteristics evolve based on cumulative historical operation
          rather than snapshot decisions alone (e.g. battery cycling/calendar degradation,
          filter fouling). This is distinct from `iterative`, which converges non-linearity
          within a single snapshot.
      piecewise:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset characteristics vary depending on operating decision variables.
          This creates a non-linear relationship that can be described by a piecewise
          linear curve (e.g., part-load efficiency, linked to capacity, storage head
          effects).
      quadratic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset characteristics vary quadratically with decision variables,
          passed natively to a QP/QCP-capable solver (e.g. quadratic fuel curves,
          loss approximations)
    title: AssetOperatingCharacteristicsModel
    type: object
  AssetOperatingConstraintsModel:
    additionalProperties: false
    properties:
      inter_spatial:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: limits that link geographic regions
      inter_temporal:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limits that link time periods (e.g., ramping, run up, load shifting)
      operating:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limits on _when_ or _how_ assets can operate (e.g. including
          exogenous outage windows, maintenance schedules, and capacity-derating profiles,
          minimum/maximum load levels).
      reserved_flows:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carrier out-flow from one asset can be reserved as in-flow to
          a specific subset of other assets (e.g. fuel stockpiling ahead of conversion,
          hydropower cascades, CHP internal steam flows).
      total:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limit on total asset carrier in-/out-flow over a subset or the
          entire time horizon / spatial scope (e.g. storage cycling / annual throughput
          limits). This can represent real contract arrangements / regulation.
    title: AssetOperatingConstraintsModel
    type: object
  AssetOperatingRepresentationModel:
    additionalProperties: false
    properties:
      ed:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Assets can only be economically dispatched. This is possible
          with unit-level or grouped asset capacity representation (see `asset__resolution`).
      maintenance_scheduling:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset maintenance / outage schedules are derived endogenously,
          co-optimised with operation. Exogenously fixed maintenance windows are instead
          `asset__operating_constraints.operating`.
      uced:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Assets can be committed as units and then economically dispatched.
          This generally requires unit-level asset capacity representation (see `asset__resolution`).
    title: AssetOperatingRepresentationModel
    type: object
  AssetResolutionModel:
    additionalProperties: false
    properties:
      grouped:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Physical assets are aggregated into asset groups when modelled.
      units:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Assets are modelled as discrete units which reflect physical
          assets 1-to-1 (asset subsystems, e.g. individual CCGT turbines, are out
          of scope)
    title: AssetResolutionModel
    type: object
  AssumptionsModel:
    description: Feature-level fields.
    items:
      type: string
    title: AssumptionsModel
    type: array
  DataIoModel:
    additionalProperties: false
    properties:
      binary:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Input / Output data in compact / compressible, non-human-readable
          binary formats (e.g. Excel, NetCDF, HDF5, Parquet).
      database:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Input / Output data in databases (relational or otherwise).
      lazy_loading:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Data can be loaded lazily / out-of-core, allowing datasets larger
          than memory.
      plain_text:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Input / Output data in human-readable, diff- and version-control-friendly
          text formats (e.g. CSV, JSON, YAML).
      remote_storage:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Data can be read from / written to remote storage (e.g. object
          stores, cloud drives).
    title: DataIoModel
    type: object
  EdgeEffectsModel:
    additionalProperties: false
    properties:
      energy_balance:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Energy 'destruction' caused by simultaneous in- & out-flow from
          a lossy transmission/storage asset
      time_financial:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Start- / End-of-horizon financial effects (e.g. asset investment
          annuitisation)
      time_operational:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Start- / End-of-horizon operational effects (e.g. storage level
          wrapping)
    title: EdgeEffectsModel
    type: object
  FeatureSetModel:
    properties:
      actors:
        $ref: '#/$defs/ActorsModel'
        default:
          aggregated_prosumers:
            value: '?'
          distributed_objectives:
            value: '?'
          equilibrium:
            value: '?'
          portfolio:
            value: '?'
        description: Representation of heterogeneous decision-making actors, deviating
          from the single, central-planner baseline.
      asset__capacity_representation:
        $ref: '#/$defs/AssetCapacityRepresentationModel'
        default:
          continuous_capacity:
            value: '?'
          exogenous_capacity:
            value: '?'
          integer_investment_continuous_capacity:
            value: '?'
          integer_investment_exogenous_capacity:
            value: '?'
        description: How asset capacities can be represented in the model and optimisation
          problem.
      asset__cost__investment:
        $ref: '#/$defs/AssetCostInvestmentModel'
        default:
          annuitisation:
            value: '?'
          linear:
            value: '?'
          piecewise:
            value: '?'
          threshold_deviation:
            value: '?'
          unit:
            value: '?'
        description: Asset investment cost representation
      asset__cost__operation:
        $ref: '#/$defs/AssetCostOperationModel'
        default:
          inter_temporal:
            value: '?'
          linear:
            value: '?'
          piecewise:
            value: '?'
          threshold_deviation:
            value: '?'
          unit:
            value: '?'
        description: Asset operating cost representation
      asset__investment_constraints:
        $ref: '#/$defs/AssetInvestmentConstraintsModel'
        default:
          brownfield:
            value: '?'
          inter_period:
            value: '?'
          minimum_size:
            value: '?'
          total:
            value: '?'
        description: Upper/lower limits on asset investment decisions, as distinct
          from operating decisions.
      asset__operating_characteristics:
        $ref: '#/$defs/AssetOperatingCharacteristicsModel'
        default:
          configurable_dimensions:
            value: '?'
          extensible_dimensions:
            value: '?'
          iterative:
            value: '?'
          linear:
            value: '?'
          path_dependent:
            value: '?'
          piecewise:
            value: '?'
          quadratic:
            value: '?'
        description: Representation of asset operating characteristics (e.g. efficiency,
          resource availability).
      asset__operating_constraints:
        $ref: '#/$defs/AssetOperatingConstraintsModel'
        default:
          inter_spatial:
            value: '?'
          inter_temporal:
            value: '?'
          operating:
            value: '?'
          reserved_flows:
            value: '?'
          total:
            value: '?'
        description: Upper/lower limits on asset operation (dispatch / unit-commitment).
      asset__operating_representation:
        $ref: '#/$defs/AssetOperatingRepresentationModel'
        default:
          ed:
            value: '?'
          maintenance_scheduling:
            value: '?'
          uced:
            value: '?'
        description: The resolution of asset operation representation in the model.
          A linearised approximation of unit commitment is `tractability__reformulation.linearised_unit_commitment`.
      asset__resolution:
        $ref: '#/$defs/AssetResolutionModel'
        default:
          grouped:
            value: '?'
          units:
            value: '?'
        description: The level of physical detail at which assets are represented.
          Automated conversion between these representations is `tractability__structural.clustering`.
      data__io:
        $ref: '#/$defs/DataIoModel'
        default:
          binary:
            value: '?'
          database:
            value: '?'
          lazy_loading:
            value: '?'
          plain_text:
            value: '?'
          remote_storage:
            value: '?'
        description: Data formats and mechanisms for moving model input/output data.
          Computing new parameters is `preprocessing`.
      edge_effects:
        $ref: '#/$defs/EdgeEffectsModel'
        default:
          energy_balance:
            value: '?'
          time_financial:
            value: '?'
          time_operational:
            value: '?'
        description: Distortive effects of system boundaries and linearising model
          components can be mitigated against. Flows across the spatial boundary are
          `system__processes.boundary_exchange`.
      interface__analysis:
        $ref: '#/$defs/InterfaceAnalysisModel'
        default:
          gui:
            value: '?'
          reports:
            value: '?'
          standardised_data:
            value: '?'
          tables:
            value: '?'
        description: Available options for interacting with model outputs.
      interface__build:
        $ref: '#/$defs/InterfaceBuildModel'
        default:
          api:
            value: '?'
          component_groups:
            value: '?'
          component_templating:
            value: '?'
          config_files:
            value: '?'
          gui:
            value: '?'
          standardised_data:
            value: '?'
        description: Available options for defining, configuring, and structuring
          a model. Model definition happens via configuration/data files or code,
          not the command line (CLI commands that scaffold or build a model are `interface__run.cli`).
      interface__math:
        $ref: '#/$defs/InterfaceMathModel'
        default:
          formulation_transparency:
            value: '?'
          problem_file_export:
            value: '?'
          soft_constraints:
            value: '?'
          user_defined_math:
            value: '?'
          user_defined_objective:
            value: '?'
        description: Access to, and user extension of, the underlying mathematical
          formulation.w
      interface__run:
        $ref: '#/$defs/InterfaceRunModel'
        default:
          api:
            value: '?'
          cli:
            value: '?'
          gui:
            value: '?'
          remote_execution:
            value: '?'
          solver_configuration:
            value: '?'
        description: Available options for executing a model run, beyond the local-execution
          baseline.
      network__electricity:
        $ref: '#/$defs/NetworkElectricityModel'
        default:
          ac_opf:
            value: '?'
          dc_opf:
            value: '?'
          network_devices:
            value: '?'
          network_limits:
            value: '?'
          ptdf:
            value: '?'
          security_constrained:
            value: '?'
        description: Electrical network representation beyond the `system__processes.spatial_transfer`
          baseline.
      optimisation__objective:
        $ref: '#/$defs/OptimisationObjectiveModel'
        default:
          multi_objective_pareto:
            value: '?'
          multi_objective_weighted:
            value: '?'
          quadratic:
            value: '?'
        description: Objective-function options beyond minimisation of a single linear
          cost term.
      orchestration:
        $ref: '#/$defs/OrchestrationModel'
        default:
          rolling_horizon:
            value: '?'
          sampled_runs:
            value: '?'
          scenario_runs:
            value: '?'
          simulation_optimisation:
            value: '?'
        description: Tool-managed workflows coordinating multiple complete runs in
          series/parallel, where the result emerges from the ensemble or its convergence.
          Restructuring the solution algorithm of a single problem is `tractability__algorithm`.
      postprocessing:
        $ref: '#/$defs/PostprocessingModel'
        default:
          aggregation:
            value: '?'
          contract_settlement:
            value: '?'
          curtailment:
            value: '?'
          disaggregation:
            value: '?'
          elcc:
            value: '?'
          financial:
            value: '?'
          future_cost_function:
            value: '?'
          impact_assessment:
            value: '?'
          network_transfer_metrics:
            value: '?'
          probabilistic_reliability_assessment:
            value: '?'
          scenario_comparison:
            value: '?'
          shadow_prices:
            value: '?'
        description: Postprocessing analyses that can be triggered by the tool based
          on model outputs, on a per-asset or system-wide basis.
      preprocessing:
        $ref: '#/$defs/PreprocessingModel'
        default:
          download:
            value: '?'
          forecasting:
            value: '?'
          input_validation:
            value: '?'
          model_catalogue:
            value: '?'
          scenario_generation:
            value: '?'
          spatial_distribution:
            value: '?'
        description: Options to generate parameters derived from user-defined input
          data before running the model. Moving/storing data is `data__io`.
      system__limits:
        $ref: '#/$defs/SystemLimitsModel'
        default:
          capacity:
            value: '?'
          operation:
            value: '?'
        description: System-wide limits to represent physical or policy constraints
      system__processes:
        $ref: '#/$defs/SystemProcessesModel'
        default:
          boundary_exchange:
            value: '?'
          conversion:
            value: '?'
          delayed_transfer:
            value: '?'
          discrete_transport:
            value: '?'
          explicit_demand:
            value: '?'
          spatial_transfer:
            value: '?'
          state_changing_transfer:
            value: '?'
          temporal_transfer:
            value: '?'
        description: Fundamental carrier-flow capabilities the tool can represent,
          defined by their mathematical role rather than by named technologies. `Carriers`
          are the energy or non-energy commodities that flow between processes (e.g.
          electricity, heat, hydrogen, CO2, water, materials). Only physical processes
          are in scope; decision-making agents are `actors`.
      system__reliability:
        $ref: '#/$defs/SystemReliabilityModel'
        default:
          margin_requirement:
            value: '?'
          probabilistic_reliability_limit:
            value: '?'
          unserved_demand:
            value: '?'
        description: Reliability requirements imposed as constraints or penalty costs
          within the optimisation, under deterministic inputs. Post-hoc adequacy assessment
          is `postprocessing.probabilistic_reliability_assessment`; probabilistic
          decision methods are `uncertainty`.
      time__pathway:
        $ref: '#/$defs/TimePathwayModel'
        default:
          backcasting:
            value: '?'
          myopic_foresight:
            value: '?'
          perfect_foresight:
            value: '?'
        description: Foresight extent and planning direction across investment periods
          in multi-year pathway planning, beyond the single-investment-period (overnight
          / end-state) baseline.
      tractability__algorithm:
        $ref: '#/$defs/TractabilityAlgorithmModel'
        default:
          approximation:
            value: '?'
          decomposition:
            value: '?'
        description: Restructuring of the solution algorithm of a single optimisation
          problem to reduce computational burden. Coordinating multiple complete runs
          is `orchestration`.
      tractability__reformulation:
        $ref: '#/$defs/TractabilityReformulationModel'
        default:
          convex_relaxation:
            value: '?'
          function_conversion:
            value: '?'
          linearised_unit_commitment:
            value: '?'
          variable_fidelity:
            value: '?'
        description: Approximations of discrete or non-linear formulations that preserve
          (mixed-integer) linear tractability.
      tractability__spatial:
        $ref: '#/$defs/TractabilitySpatialModel'
        default:
          network_reduction:
            value: '?'
          zone_aggregation:
            value: '?'
        description: Spatial resolution adjustment options
      tractability__structural:
        $ref: '#/$defs/TractabilityStructuralModel'
        default:
          black_boxing:
            value: '?'
          clustering:
            value: '?'
          component_removal:
            value: '?'
          constraint_screening:
            value: '?'
        description: Reduction of problem size by removing or collapsing model structure
          - components or constraints - as opposed to reducing resolution or reformulating
          math.
      tractability__temporal:
        $ref: '#/$defs/TractabilityTemporalModel'
        default:
          distortion_mitigation:
            value: '?'
          load_duration_curves:
            value: '?'
          resampling:
            value: '?'
          typical_periods:
            value: '?'
        description: Temporal resolution adjustment options
      uncertainty:
        $ref: '#/$defs/UncertaintyModel'
        default:
          multi_stage_stochastic:
            value: '?'
          near_optimal:
            value: '?'
          risk_aversion:
            value: '?'
          robust_optimisation:
            value: '?'
          two_stage_stochastic:
            value: '?'
        description: Methods that restructure the decision problem to account for
          parametric or structural uncertainty.
      workflow__transparency:
        $ref: '#/$defs/WorkflowTransparencyModel'
        default:
          infeasibility_diagnosis:
            value: '?'
          intermediate_access:
            value: '?'
          metadata_propagation:
            value: '?'
          run_logs:
            value: '?'
          unit_tracking:
            value: '?'
        description: 'Transparency of the modelling pipeline: logs, diagnostics, and
          traceability of data as it moves through the workflow.'
    title: FeatureSetModel
    type: object
  InterfaceAnalysisModel:
    additionalProperties: false
    properties:
      gui:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Graphical user interface
      reports:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Static reports consolidating model outputs
      standardised_data:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Outputs follow a community-recognised convention or ontology,
          for regulatory reporting or frictionless data transfer with a downstream
          process (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy System
          Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas).
      tables:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: pre-prepared tables that can be analysed in a spreadsheet application
          such as Excel.
    title: InterfaceAnalysisModel
    type: object
  InterfaceBuildModel:
    additionalProperties: false
    properties:
      api:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Can be configured using scripting specific to the tool programming
          language or another programming language for which an API is provided (e.g.
          a Python API for a package written in C).
      component_groups:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Components (assets, nodes, carriers) can be tagged into named,
          potentially overlapping groups independent of the model's built-in structural
          dimensions (e.g. a "coastal assets" or "2030-vintage" tag spanning multiple
          asset types/nodes), and referenced by name as the scope of a constraint
          or limit (e.g. total capacity or emissions across group X). Distinct from
          whole-system limits from single-asset-type constraints; the same grouping
          is what `postprocessing.aggregation` classifies for dissemination.
      component_templating:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Components can inherit parameterisation from a shared template
          (e.g. an abstract technology definition), with edits to the template cascading
          to every inheriting component, rather than requiring per-component data
          entry.
      config_files:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Configurable via structured configuration/data files, without
          knowledge of the programming language in which the tool has been written.
      gui:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Graphical user interface
      standardised_data:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Accepts input data following a community-recognised convention
          or ontology (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy
          System Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas).
    title: InterfaceBuildModel
    type: object
  InterfaceMathModel:
    additionalProperties: false
    properties:
      formulation_transparency:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The tool's mathematical formulation is accessible and inspectable
          (e.g. as rendered equations or a math specification traceable to the built
          problem).
      problem_file_export:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The built optimisation problem can be exported in standard formats
          (e.g. LP/MPS).
      soft_constraints:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: User-defined or built-in constraints can be reformulated as soft
          constraints without bespoke implementation per constraint. This is usually
          via a generic slack-variable-plus-penalty mechanism. Built-in economic threshold
          costs are instead `asset__cost__investment.threshold_deviation` / `asset__cost__operation.threshold_deviation`.
      user_defined_math:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Users can define their own decision variables and constraints
          on the optimisation problem, applied to existing or new decision variables.
      user_defined_objective:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Users can define or modify the objective function
    title: InterfaceMathModel
    type: object
  InterfaceRunModel:
    additionalProperties: false
    properties:
      api:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Programmatic interface (e.g. language API, web API) to launch
          and manage runs.
      cli:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Command line interface.
      gui:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Graphical user interface.
      remote_execution:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Runs can be dispatched to and managed on remote compute (cloud,
          HPC, hosted service) from the tool.
      solver_configuration:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Optimiser parameters can be directly configured, including convergence
          parameters & warm-starting options.
    title: InterfaceRunModel
    type: object
  NetworkElectricityModel:
    additionalProperties: false
    properties:
      ac_opf:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Linearised AC optimal power flow
      dc_opf:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Linearised DC optimal power flow
      network_devices:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Network components beyond simple lines and buses, carrying their
          own mathematical formulations (e.g. shunt and phase-shifting transformers,
          FACTS devices, HVDC converter stations).
      network_limits:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Network operating limits representable in the power-flow formulation
          (e.g. thermal limits, phase-angle limits).
      ptdf:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: PTDF-based (flow-based) linear power-flow formulation, in which
          flows are expressed as linear sensitivities to nodal/zonal injections (e.g.
          flow-based market coupling), as an alternative to the angle-based `dc_opf`
          formulation. Post-hoc PTDF computation from model outputs is `postprocessing.network_transfer_metrics`.
      security_constrained:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Security-constrained optimal power flow (contingency constraints)
    title: NetworkElectricityModel
    type: object
  OptimisationObjectiveModel:
    additionalProperties: false
    properties:
      multi_objective_pareto:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Built-in generation of Pareto-optimal solution sets across objectives
          (e.g. epsilon-constraint, evolutionary methods),
      multi_objective_weighted:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Multiple objective terms combined via user-set weights into a
          single objectives. Trade-offs explored by manual weight variation.
      quadratic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Quadratic objective terms passed natively to the solver (e.g.
          quadratic generation cost curves, welfare maximisation with linear demand
          curves).
    title: OptimisationObjectiveModel
    type: object
  OrchestrationModel:
    additionalProperties: false
    properties:
      rolling_horizon:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The operational timescale is optimised in sequential (possibly
          overlapping) windows, each with limited foresight.
      sampled_runs:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Execution of run ensembles over a sampled uncertainty space (e.g.
          Monte Carlo), with collated outputs. Used e.g. for post-hoc resource adequacy
          assessment (`postprocessing.probabilistic_reliability_assessment`) or portfolio
          price-risk quantification. Distinct from `scenario_runs` (discrete, named
          scenarios).
      scenario_runs:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Batch execution of discrete, named scenario ensembles in series/parallel
          with collated outputs.
      simulation_optimisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Iterate between a simulation and optimisation phase until convergence
          with respect to operational constraints (e.g. competitive market simulation,
          optimal power flow).
    title: OrchestrationModel
    type: object
  PostprocessingModel:
    additionalProperties: false
    properties:
      aggregation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Method to aggregate modelled components into broader classifications
          for analysis and dissemination (e.g., separately costed "wind turbine" assets
          aggregated back to "wind turbine"). This usually requires `interface__build.component_groups`
          to define aggregation membership.
      contract_settlement:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Post-hoc settlement of financial contracts against realised dispatch
          and prices, without altering the underlying optimisation. (e.g. CfDs, PPAs,cap-and-floor
          schemes).
      curtailment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Asset generation curtailment.
      disaggregation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Model outputs are redistributed back to pre-simplification resolution
          (e.g. capacity-expansion results handed off to a full-resolution power-flow
          model).
      elcc:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Effective load carrying capability calculated post-hoc. In-optimisation
          capacity-credit requirements are instead `system__reliability.margin_requirement`.
      financial:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Financial analyses for business cases (e.g. levelised cost of
          electricity or other carriers, net present value, asset-level revenue /
          costs).
      future_cost_function:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A future cost function (water value) is constructed as a reusable,
          exportable artefact (e.g. from Benders / SDDP cuts) that forecasts the marginal
          cost of hydro and other seasonal storage devices. Used in shorter-term scheduling
          under uncertain input parameters. Distinct from `shadow_prices`, which is
          the dual-extraction mechanism it can build upon.
      impact_assessment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Auxiliary impacts (e.g., GHG emissions, water consumption, job
          creation).
      network_transfer_metrics:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Network transfer capability and flow-sensitivity metrics derived
          from model outputs (e.g. grid transfer capacities, power transfer distribution
          factors, line outage distribution factors).
      probabilistic_reliability_assessment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Probabilistic resource-adequacy metrics calculated post-hoc (e.g.
          loss of load probability/expectation, expected energy not served). Sampling-based
          run orchestration to produce them is `orchestration.sampled_runs`.
      scenario_comparison:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Outputs of multiple scenario/ensemble runs are collated and compared.
      shadow_prices:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Optimisation problem shadow prices, utilising a constraint dual-extraction
          mechanism (e.g. to approximate wholesale market prices; water values / `future_cost_function`,
          `contract_settlement`, and soft-constraint interpretation).
    title: PostprocessingModel
    type: object
  PreprocessingModel:
    additionalProperties: false
    properties:
      download:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Data can be downloaded directly within the tool from an open
          or proprietary source rather than being specified by the user.
      forecasting:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A user-defined generation / load profile can be automatically
          updated given user-defined forecasting parameters (e.g. change in total
          or peak).
      input_validation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Input data is validated against the tool's expected structure
          and value ranges before a run, with informative failures.
      model_catalogue:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Pre-built model datasets/examples can be retrieved from a catalogue
          as starting points for new models.
      scenario_generation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Scenario ensembles can be generated from user-defined parameters
          or sampling rules, for execution as `orchestration.scenario_runs` or `orchestration.sampled_runs`.
      spatial_distribution:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A user-defined parameter can be automatically distributed spatially
          using other spatial parameters (e.g. nodal demand distribution, transmission
          line distances, distributed slack).
    title: PreprocessingModel
    type: object
  SystemLimitsModel:
    additionalProperties: false
    properties:
      capacity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limit multi-asset capacity decisions (e.g. land availability,
          procurement plans)
      operation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Limit multi-asset operational factors (e.g. max emissions, fuel
          availability, capacity factor)
    title: SystemLimitsModel
    type: object
  SystemProcessesModel:
    additionalProperties: false
    properties:
      boundary_exchange:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carriers enter or leave the system across its boundary at a defined
          cost and availability (e.g. fuel supply, primary resource extraction, imports/exports
          to unmodelled regions).
      conversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carriers are transformed into other carriers within the system
          boundary (e.g. power plants, electrolysers, heat pumps, CO2 capture). This
          enables coupled multi-carrier optimisation.
      delayed_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Continuous flow in space with a time delay or in-transit buffering
          between injection and withdrawal (e.g., river flows, pipeline linepack,
          district-heating transit).
      discrete_transport:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carriers are moved in discrete packets by mobile units with loading/unloading
          decisions (e.g. shipping, trucking, rail).
      explicit_demand:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Demand is represented by explicit consuming processes with their
          own constraints, enabling demand-side management. Demanded carriers may
          be non-energy commodities with their own balances.
      spatial_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carriers are moved between regions as continuous flow subject
          to transfer-capacity limits, without network physics. See `network__electricity`
          for electrical network physics features.
      state_changing_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carrier movement requiring the carrier's physical state to be
          tracked or converted en route (e.g. gas pressure levels with compressors,
          heat-network temperature levels).
      temporal_transfer:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Carriers are moved in time (e.g. storage, demand shifting), linking
          system states across timesteps.
    title: SystemProcessesModel
    type: object
  SystemReliabilityModel:
    additionalProperties: false
    properties:
      margin_requirement:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Minimum requirement on firm capacity/margin held in reserve.
          This could be applied at the system level or on single / subsets of assets
          (e.g. reserve requirements, remaining available margins (RAM)).
      probabilistic_reliability_limit:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Probabilistic reliability constraints within the optimisation
          (e.g. loss-of-load-probability <LOLP> limit, expected-energy-not-served
          <EENS> limit).
      unserved_demand:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Demand can go unserved at a penalty cost (value of lost load
          <VOLL>), placing a soft constraint on load shedding within the optimisation.
    title: SystemReliabilityModel
    type: object
  TimePathwayModel:
    additionalProperties: false
    properties:
      backcasting:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: a desirable end-state is fixed and the model works backwards
          to find the connecting pathway
      myopic_foresight:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Investment periods are optimised sequentially, with each decision
          made without knowledge of later periods
      perfect_foresight:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: All investment periods are optimised simultaneously with perfect
          foresight of future periods
    title: TimePathwayModel
    type: object
  TractabilityAlgorithmModel:
    additionalProperties: false
    properties:
      approximation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The solution algorithm is reformulated to reach a near-optimal
          answer within tolerance at reduced cost (e.g. progressive hedging, Stochastic
          Dual Dynamic Programming <SDDP>-style cut selection)
      decomposition:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The problem is split into coordinated sub-problems solved iteratively
          or in parallel until convergence (e.g. Benders decomposition; Stochastic
          Dual Dynamic Programming <SDDP> for multi-stage stochastic hydropower scheduling)
    title: TractabilityAlgorithmModel
    type: object
  TractabilityReformulationModel:
    additionalProperties: false
    properties:
      convex_relaxation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A non-convex relationship is approximated by a convex relaxation,
          retaining solver tractability (e.g. second-order-cone relaxation of AC power
          flow).
      function_conversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: User-defined arbitrary non-linear functions are automatically
          converted into valid model inputs (e.g. piecewise segments) without manual
          discretisation.
      linearised_unit_commitment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Unit commitment approximated with continuous (linearised) commitment
          variables, avoiding integer decision variables.
      variable_fidelity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The mathematical fidelity of the same physical attribute can
          differ across the model's scope within one model definition (e.g. discrete
          units in some investment periods and aggregated capacity in others; unit
          commitment over the near-term horizon, continuous economic dispatch beyond)
    title: TractabilityReformulationModel
    type: object
  TractabilitySpatialModel:
    additionalProperties: false
    properties:
      network_reduction:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Network element equivalencing (e.g., reducing to a single voltage
          level).
      zone_aggregation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Automatic spatial zone aggregation/disaggregation. Usually from
          nodal (bus) level to regional/bidding zone level. This usually requires
          `interface__build.component_groups` to define aggregation membership.
    title: TractabilitySpatialModel
    type: object
  TractabilityStructuralModel:
    additionalProperties: false
    properties:
      black_boxing:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A chain of interconnected components is collapsed into a single
          component with an in/out interface. This usually requires `reserved_flows`
          between interconnected components.
      clustering:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Individually defined assets are automatically aggregated into
          asset groups for optimisation. This usually requires `interface__build.component_groups`
          to define aggregation membership.
      component_removal:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Nodes, assets, or carriers can be systematically excluded from
          the built problem.
      constraint_screening:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Constraints unlikely to bind are omitted or lazily added
    title: TractabilityStructuralModel
    type: object
  TractabilityTemporalModel:
    additionalProperties: false
    properties:
      distortion_mitigation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Mathematical constraints to manage inter-temporal model features
          in a temporally simplified model (e.g., linking storage levels across typical
          periods)
      load_duration_curves:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Full timeseries is represented by load duration curves
      resampling:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Temporal up/down-sampling
      typical_periods:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Full timeseries is represented by typical periods (days, weeks,
          months)
    title: TractabilityTemporalModel
    type: object
  UncertaintyModel:
    additionalProperties: false
    properties:
      multi_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Multi-stage stochastic optimisation, in which decisions are revised
          as uncertainty resolves stage by stage. Primarily used for scheduling seasonal
          storage (e.g. hydropower water values) under uncertain inflows.
      near_optimal:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Generate a near-optimal solution set by relaxing constraints
          / objectives in the optimisation problem. (e.g., Modelling to Generate Alternatives
          <MGA>).
      risk_aversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Risk measures (e.g. Conditional Value at Risk <CVaR>) applied
          to a stochastic optimisation. It weights tail-end outcomes according to
          a configurable risk tolerance.
      robust_optimisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Worst-case cost minimisation over an uncertainty set.
      two_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Two-stage stochastic optimisation; used in investment decision
          making under uncertainty.
    title: UncertaintyModel
    type: object
  UseCaseFeatureModel:
    additionalProperties: false
    description: Feature-level fields.
    properties:
      value:
        default: '?'
        description: 'Whether a feature is required (`y`) or not (`n`) in the use-case.

          Defaults to unknown (`?`).'
        enum:
        - y
        - n
        - '?'
        title: Value
        type: string
    title: UseCaseFeatureModel
    type: object
  WorkflowTransparencyModel:
    additionalProperties: false
    properties:
      infeasibility_diagnosis:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Infeasible problems can be diagnosed (e.g. irreducible infeasible
          subset (IIS) generation, named constraint violations).
      intermediate_access:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Intermediate pipeline artefacts (e.g. built problem data, solver
          state) can be exposed to the user.
      metadata_propagation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Metadata is propagated from inputs through to outputs (e.g. data
          sources, versions, licences).
      run_logs:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Run logs available (e.g. in text files), for use in debugging
          failing model runs.
      unit_tracking:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Physical units attached to data are tracked and validated through
          the pipeline (to enable e.g., unit-consistency checking, automatic conversion,
          auto-scaling).
    title: WorkflowTransparencyModel
    type: object
additionalProperties: false
properties:
  assumptions:
    $ref: '#/$defs/AssumptionsModel'
    default: []
    description: Use-case assumptions.
  features:
    $ref: '#/$defs/FeatureSetModel'
    default:
      actors:
        aggregated_prosumers:
          value: '?'
        distributed_objectives:
          value: '?'
        equilibrium:
          value: '?'
        portfolio:
          value: '?'
      asset__capacity_representation:
        continuous_capacity:
          value: '?'
        exogenous_capacity:
          value: '?'
        integer_investment_continuous_capacity:
          value: '?'
        integer_investment_exogenous_capacity:
          value: '?'
      asset__cost__investment:
        annuitisation:
          value: '?'
        linear:
          value: '?'
        piecewise:
          value: '?'
        threshold_deviation:
          value: '?'
        unit:
          value: '?'
      asset__cost__operation:
        inter_temporal:
          value: '?'
        linear:
          value: '?'
        piecewise:
          value: '?'
        threshold_deviation:
          value: '?'
        unit:
          value: '?'
      asset__investment_constraints:
        brownfield:
          value: '?'
        inter_period:
          value: '?'
        minimum_size:
          value: '?'
        total:
          value: '?'
      asset__operating_characteristics:
        configurable_dimensions:
          value: '?'
        extensible_dimensions:
          value: '?'
        iterative:
          value: '?'
        linear:
          value: '?'
        path_dependent:
          value: '?'
