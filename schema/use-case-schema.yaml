        description: Operating reserve requirement, held against short-term contingencies
          (e.g. spinning reserve, ramping reserve).
        enum:
        - y
        - n
        - '?'
        title: Operating Reserve
        type: string
    title: SystemReliabilityMarginRequirementValueModel
    type: object
  SystemReliabilityModel:
    additionalProperties: false
    properties:
      contingency_constrained:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The optimisation is constrained to remain feasible following
          the loss of individual components, over an enumerated set of discrete failure
          states (e.g. N-1 security-constrained optimal power flow, loss of a compressor
          station or pipeline segment). Post-contingency corrective action can be
          co-optimised where the tool supports it.
      margin_requirement:
        $ref: '#/$defs/SystemReliabilityMarginRequirementFeatureModel'
        default:
          value:
            capacity: '?'
            operating_reserve: '?'
        description: Minimum requirement on firm capacity/margin held in reserve.
          This could be applied at the system level or on single / subsets of assets,
          if `interface.dimension_groups` is available.
      probabilistic_reliability_limit:
        $ref: '#/$defs/SystemReliabilityProbabilisticReliabilityLimitFeatureModel'
        default:
          value:
            loss_of_load: '?'
            unserved_energy: '?'
        description: Probabilistic reliability constraints within the optimisation.
      unserved_demand:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Demand can go unserved at a penalty cost (value of lost load
          <VOLL>), placing a soft constraint on load shedding within the optimisation.
    title: SystemReliabilityModel
    type: object
  SystemReliabilityProbabilisticReliabilityLimitFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/SystemReliabilityProbabilisticReliabilityLimitValueModel'
        default:
          loss_of_load: '?'
          unserved_energy: '?'
        description: Per-slice feature value.
    title: SystemReliabilityProbabilisticReliabilityLimitFeatureModel
    type: object
  SystemReliabilityProbabilisticReliabilityLimitValueModel:
    additionalProperties: false
    properties:
      loss_of_load:
        default: '?'
        description: Loss-of-load-probability <LOLP> limit.
        enum:
        - y
        - n
        - '?'
        title: Loss Of Load
        type: string
      unserved_energy:
        default: '?'
        description: Expected-energy-not-served <EENS> limit.
        enum:
        - y
        - n
        - '?'
        title: Unserved Energy
        type: string
    title: SystemReliabilityProbabilisticReliabilityLimitValueModel
    type: object
  TimePathwayModel:
    additionalProperties: false
    properties:
      myopic_foresight:
        $ref: '#/$defs/TimePathwayMyopicForesightFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Time periods are optimised sequentially, with each decision made
          without knowledge / with limited knowledge of later periods.
      perfect_foresight:
        $ref: '#/$defs/TimePathwayPerfectForesightFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: Perfect foresight capacity expansion / dispatch.
      singular:
        $ref: '#/$defs/TimePathwaySingularFeatureModel'
        default:
          value:
            investment: '?'
            operation: '?'
        description: A single snapshot of a future system can be analysed.
    title: TimePathwayModel
    type: object
  TimePathwayMyopicForesightFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TimePathwayMyopicForesightValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: TimePathwayMyopicForesightFeatureModel
    type: object
  TimePathwayMyopicForesightValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: Investment decisions are optimised sequentially per period /
          set of periods.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Dispatch decisions are optimised sequentially per set of timesteps
          (e.g. days).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: TimePathwayMyopicForesightValueModel
    type: object
  TimePathwayPerfectForesightFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TimePathwayPerfectForesightValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: TimePathwayPerfectForesightFeatureModel
    type: object
  TimePathwayPerfectForesightValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: All investment periods are optimised simultaneously with perfect
          foresight of future periods.
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: All dispatch periods are optimised simultaneously with perfect
          foresight of future timesteps in the investment period(s).
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: TimePathwayPerfectForesightValueModel
    type: object
  TimePathwaySingularFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TimePathwaySingularValueModel'
        default:
          investment: '?'
          operation: '?'
        description: Per-slice feature value.
    title: TimePathwaySingularFeatureModel
    type: object
  TimePathwaySingularValueModel:
    additionalProperties: false
    properties:
      investment:
        default: '?'
        description: '"Overnight" capacity expansion, focussing on the end-state design
          of a system without considering how that design is reached.'
        enum:
        - y
        - n
        - '?'
        title: Investment
        type: string
      operation:
        default: '?'
        description: Single snapshot operation dispatch, i.e. allowing optimisation
          without a time dimension.
        enum:
        - y
        - n
        - '?'
        title: Operation
        type: string
    title: TimePathwaySingularValueModel
    type: object
  TractabilityDimensionReductionAssetsFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TractabilityDimensionReductionAssetsValueModel'
        default:
          black_boxing: '?'
          clustering: '?'
          component_removal: '?'
        description: Per-slice feature value.
    title: TractabilityDimensionReductionAssetsFeatureModel
    type: object
  TractabilityDimensionReductionAssetsValueModel:
    additionalProperties: false
    properties:
      black_boxing:
        default: '?'
        description: A chain of interconnected assets is collapsed into a single component
          with an in/out interface. This usually requires `asset__constraints.dedicated_flow_routing`
          between interconnected components.
        enum:
        - y
        - n
        - '?'
        title: Black Boxing
        type: string
      clustering:
        default: '?'
        description: Individually defined assets are automatically aggregated into
          asset groups for optimisation. This usually requires `interface.dimension_groups`
          to define aggregation membership.
        enum:
        - y
        - n
        - '?'
        title: Clustering
        type: string
      component_removal:
        default: '?'
        description: Individual or groups of assets (e.g. sharing a node or a carrier)
          can be systematically filtered out of the built problem.
        enum:
        - y
        - n
        - '?'
        title: Component Removal
        type: string
    title: TractabilityDimensionReductionAssetsValueModel
    type: object
  TractabilityDimensionReductionModel:
    additionalProperties: false
    properties:
      assets:
        $ref: '#/$defs/TractabilityDimensionReductionAssetsFeatureModel'
        default:
          value:
            black_boxing: '?'
            clustering: '?'
            component_removal: '?'
        description: Asset resolution adjustment options.
      spatial:
        $ref: '#/$defs/TractabilityDimensionReductionSpatialFeatureModel'
        default:
          value:
            clustering: '?'
            network_reduction: '?'
        description: Spatial resolution adjustment options.
      temporal:
        $ref: '#/$defs/TractabilityDimensionReductionTemporalFeatureModel'
        default:
          value:
            dimension_non_contiguity: '?'
            load_duration_curves: '?'
            resampling: '?'
            typical_periods: '?'
        description: Temporal resolution adjustment options (may apply to within-year
          timesteps or between-year investment periods).
    title: TractabilityDimensionReductionModel
    type: object
  TractabilityDimensionReductionSpatialFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TractabilityDimensionReductionSpatialValueModel'
        default:
          clustering: '?'
          network_reduction: '?'
        description: Per-slice feature value.
    title: TractabilityDimensionReductionSpatialFeatureModel
    type: object
  TractabilityDimensionReductionSpatialValueModel:
    additionalProperties: false
    properties:
      clustering:
        default: '?'
        description: Automatic spatial zone aggregation/disaggregation. Usually from
          nodal (bus) level to regional/bidding zone level. This usually requires
          `interface.dimension_groups` to define aggregation membership.
        enum:
        - y
        - n
        - '?'
        title: Clustering
        type: string
      network_reduction:
        default: '?'
        description: Network element equivalencing (e.g., reducing to a single voltage
          level).
        enum:
        - y
        - n
        - '?'
        title: Network Reduction
        type: string
    title: TractabilityDimensionReductionSpatialValueModel
    type: object
  TractabilityDimensionReductionTemporalFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/TractabilityDimensionReductionTemporalValueModel'
        default:
          dimension_non_contiguity: '?'
          load_duration_curves: '?'
          resampling: '?'
          typical_periods: '?'
        description: Per-slice feature value.
    title: TractabilityDimensionReductionTemporalFeatureModel
    type: object
  TractabilityDimensionReductionTemporalValueModel:
    additionalProperties: false
    properties:
      dimension_non_contiguity:
        default: '?'
        description: Mathematical constraints to manage inter-temporal model features
          when using non-contiguous temporal aggregation (e.g., linking storage levels
          across typical periods).
        enum:
        - y
        - n
        - '?'
        title: Dimension Non Contiguity
        type: string
      load_duration_curves:
        default: '?'
        description: Full timeseries is represented by load duration curves.
        enum:
        - y
        - n
        - '?'
        title: Load Duration Curves
        type: string
      resampling:
        default: '?'
        description: Temporal resolution of the input timeseries is coarsened while
          remaining contiguous (e.g. hourly to daily) before the model is built.
        enum:
        - y
        - n
        - '?'
        title: Resampling
        type: string
      typical_periods:
        default: '?'
        description: Full timeseries is represented by non-contiguous typical periods
          (days, weeks, months).
        enum:
        - y
        - n
        - '?'
        title: Typical Periods
        type: string
    title: TractabilityDimensionReductionTemporalValueModel
    type: object
  TractabilityReformulationModel:
    additionalProperties: false
    properties:
      approximation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The solution algorithm is reformulated to reach a near-optimal
          answer within tolerance at reduced cost (e.g. progressive hedging, Stochastic
          Dual Dynamic Programming <SDDP>-style cut selection).
      constraint_screening:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Constraints unlikely to bind are omitted or lazily added.
      convex_relaxation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: A non-convex relationship is approximated by a convex relaxation,
          retaining solver tractability (e.g. second-order-cone relaxation of AC power
          flow).
      decomposition:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The problem is split into coordinated sub-problems solved iteratively
          or in parallel until convergence (e.g. Benders decomposition; Stochastic
          Dual Dynamic Programming <SDDP> for multi-stage stochastic hydropower scheduling).
      function_conversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: User-defined arbitrary non-linear functions are automatically
          converted into valid model inputs (e.g. piecewise segments) without manual
          discretisation.
      linearised_unit_commitment:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Unit commitment approximated with continuous (linearised) commitment
          variables, avoiding integer decision variables.
      variable_fidelity:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: The mathematical fidelity of the same physical attribute can
          differ across the model's scope within one model definition (e.g. discrete
          units in some investment periods and aggregated capacity in others; unit
          commitment over the near-term horizon, continuous economic dispatch beyond).
    title: TractabilityReformulationModel
    type: object
  UncertaintyModel:
    additionalProperties: false
    properties:
      multi_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Multi-stage stochastic optimisation, in which decisions are revised
          as uncertainty resolves stage by stage. Primarily used for scheduling seasonal
          storage (e.g. hydropower water values) under uncertain inflows.
      near_optimal:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Generate a near-optimal solution set by relaxing constraints
          / objectives in the optimisation problem. (e.g., Modelling to Generate Alternatives
          <MGA>).
      risk_aversion:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Risk measures (e.g. Conditional Value at Risk <CVaR>) applied
          to a stochastic optimisation as chance constraints. It weights tail-end
          outcomes according to a configurable risk tolerance.
      robust_optimisation:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Worst-case cost minimisation over an uncertainty set.
      two_stage_stochastic:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Two-stage stochastic optimisation; used in investment decision
          making under uncertainty.
    title: UncertaintyModel
    type: object
  UseCaseFeatureModel:
    additionalProperties: false
    description: Feature-level fields.
    properties:
      value:
        default: '?'
        description: 'Whether a feature is required (`y`) or not (`n`) in the use-case.

          Defaults to unknown (`?`).'
        enum:
        - y
        - n
        - '?'
        title: Value
        type: string
    title: UseCaseFeatureModel
    type: object
  WorkflowTransparencyMetadataPropagationFeatureModel:
    additionalProperties: false
    properties:
      value:
        $ref: '#/$defs/WorkflowTransparencyMetadataPropagationValueModel'
        default:
          provenance: '?'
          units: '?'
        description: Per-slice feature value.
    title: WorkflowTransparencyMetadataPropagationFeatureModel
    type: object
  WorkflowTransparencyMetadataPropagationValueModel:
    additionalProperties: false
    properties:
      provenance:
        default: '?'
        description: Data sources, versions, and licences are propagated from inputs
          through to outputs.
        enum:
        - y
        - n
        - '?'
        title: Provenance
        type: string
      units:
        default: '?'
        description: Physical units attached to data are tracked and validated through
          the pipeline (to enable e.g., unit-consistency checking, automatic conversion,
          auto-scaling).
        enum:
        - y
        - n
        - '?'
        title: Units
        type: string
    title: WorkflowTransparencyMetadataPropagationValueModel
    type: object
  WorkflowTransparencyModel:
    additionalProperties: false
    properties:
      infeasibility_diagnosis:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Infeasible problems can be diagnosed (e.g. irreducible infeasible
          subset (IIS) generation, named constraint violations).
      intermediate_access:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Intermediate pipeline artefacts (e.g. built problem data, solver
          state) can be exposed to the user.
      metadata_propagation:
        $ref: '#/$defs/WorkflowTransparencyMetadataPropagationFeatureModel'
        default:
          value:
            provenance: '?'
            units: '?'
        description: Metadata is propagated from inputs through to outputs.
      run_logs:
        $ref: '#/$defs/UseCaseFeatureModel'
        default:
          value: '?'
        description: Run logs available (e.g. in text files), for use in debugging
          failing model runs.
    title: WorkflowTransparencyModel
    type: object
