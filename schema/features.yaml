system__processes:
  description: >-
    Fundamental carrier-flow capabilities the tool can represent,
    defined by their mathematical role rather than by named technologies.
    `Carriers` are the energy or non-energy commodities that flow between processes
    (e.g. electricity, heat, hydrogen, CO2, water, materials).
    Only physical processes are in scope; decision-making agents are `actors`.
  members:
    boundary_exchange: >-
      Carriers enter or leave the system across its boundary at a defined cost and availability
      (e.g. fuel supply, primary resource extraction, imports/exports to unmodelled regions).
    conversion: >-
      Carriers are transformed into other carriers within the system boundary
      (e.g. power plants, electrolysers, heat pumps, CO2 capture).
      This enables coupled multi-carrier optimisation.
    temporal_transfer: >-
      Carriers are moved in time (e.g. storage, demand shifting), linking system states across timesteps.
    spatial_transfer: >-
      Carriers are moved between regions as continuous flow subject to transfer-capacity limits, without network physics.
      See `network__electricity` for electrical network physics features.
    delayed_transfer: >-
      Continuous flow in space with a time delay or in-transit buffering between injection and withdrawal
      (e.g., river flows, pipeline linepack, district-heating transit).
    discrete_transport: >-
      Carriers are moved in discrete packets by mobile units with loading/unloading decisions
      (e.g. shipping, trucking, rail).
    state_changing_transfer: >-
      Carrier movement requiring the carrier's physical state to be tracked or converted en route
      (e.g. gas pressure levels with compressors, heat-network temperature levels).
    explicit_demand: >-
      Demand is represented by explicit consuming processes with their own constraints, enabling demand-side management.
      Demanded carriers may be non-energy commodities with their own balances.

network__electricity:
  description: >-
    Electrical network representation beyond the `system__processes.spatial_transfer` baseline.
  members:
    dc_opf: >-
      Linearised DC optimal power flow
    ac_opf: >-
      Linearised AC optimal power flow
    security_constrained: >-
      Security-constrained optimal power flow (contingency constraints)
    ptdf: >-
      PTDF-based (flow-based) linear power-flow formulation, in which flows are expressed as
      linear sensitivities to nodal/zonal injections (e.g. flow-based market coupling),
      as an alternative to the angle-based `dc_opf` formulation.
      Post-hoc PTDF computation from model outputs is `postprocessing.network_transfer_metrics`.
    network_limits: >-
      Network operating limits representable in the power-flow formulation
      (e.g. thermal limits, phase-angle limits).
    network_devices: >-
      Network components beyond simple lines and buses, carrying their own mathematical formulations
      (e.g. shunt and phase-shifting transformers, FACTS devices, HVDC converter stations).

asset__capacity_representation:
  description: How asset capacities can be represented in the model and optimisation problem.
  members:
    exogenous_capacity: >-
      Asset capacity is fixed and fully defined in the input data (e.g. for modelling dispatch only).
    continuous_capacity: >-
      Asset capacity is fully endogenous and modeled as a continuous (linear) decision variable.
      An optional maximum capacity can be specified in the input data
      (e.g. PV capacity that can be installed at any capacity from zero to a maximum defined by land-use constraints).
    integer_investment_exogenous_capacity: >-
      Asset capacity magnitude is fixed in the input data.
      Investment is modeled as a discrete (i.e., integer) decision variable
      (e.g. nuclear power plants whose capacity is fixed & indivisible due to external constraints but the decision to invest in this capacity is as-yet undecided).
    integer_investment_continuous_capacity: >-
      Asset capacity magnitude is endogenous and modeled as a continuous (linear) decision variable.
      Investment is also endogenous and represented by a binary decision variable.
      An optional maximum capacity can be specified in the input data
      (e.g. gas turbines that you want to track as individual units and whose capacity is not fixed by the manufacturer).

asset__resolution:
  description: >-
    The level of physical detail at which assets are represented.
    Automated conversion between these representations is `tractability__structural.clustering`.
  members:
    units: >-
      Assets are modelled as discrete units which reflect physical assets 1-to-1
      (asset subsystems, e.g. individual CCGT turbines, are out of scope).
    grouped: >-
      Physical assets are aggregated into asset groups when modelled.

asset__operating_representation:
  description: >-
    The resolution of asset operation representation in the model.
    A linearised approximation of unit commitment is
    `tractability__reformulation.linearised_unit_commitment`.
  members:
    uced: >-
      Assets can be committed as units and then economically dispatched.
      This generally requires unit-level asset capacity representation (see `asset__resolution`).
    ed: >-
      Assets can only be economically dispatched.
      This is possible with unit-level or grouped asset capacity representation (see `asset__resolution`).
    maintenance_scheduling: >-
      Asset maintenance / outage schedules are derived endogenously, co-optimised with operation.
      Exogenously fixed maintenance windows are instead `asset__operating_constraints.operating`.

asset__operating_constraints:
  description: >-
    Upper/lower limits on asset operation (dispatch / unit-commitment).
  members:
    inter_temporal: >-
      Limits that link time periods (e.g., ramping, run up, load shifting).
    inter_spatial: >-
      limits that link geographic regions.
    operating: >-
      Limits on _when_ or _how_ assets can operate (e.g. including exogenous outage windows,
      maintenance schedules, and capacity-derating profiles, minimum/maximum load levels).
    total: >-
      Limit on total asset carrier in-/out-flow over a subset or the entire time horizon / spatial scope
      (e.g. storage cycling / annual throughput limits).
      This can represent real contract arrangements / regulation.
    reserved_flows: >-
      Carrier out-flow from one asset can be reserved as in-flow to a specific subset of other assets
      (e.g. fuel stockpiling ahead of conversion, hydropower cascades, CHP internal steam flows).

asset__investment_constraints:
  description: >-
    Upper/lower limits on asset investment decisions, as distinct from operating decisions.
  members:
    minimum_size: >-
      A minimum implementable capacity if an asset is built at all (requires integer investment).
    inter_period: >-
      Investment limits linking investment periods (e.g. build-rate limits, phased retirement, availability windows).
    total: >-
      Limits on aggregate investment in an asset across a spatial/temporal subset.
    brownfield: >-
      Investment optimisation can start from an existing asset stock rather than from an empty (greenfield) system.
      This allows pre-existing capacities to be represented, which may be extendable and / or retirable.

asset__operating_characteristics:
  description: >-
    Representation of asset operating characteristics (e.g. efficiency, resource availability).
  members:
    configurable_dimensions: >-
      A characteristic's dimensionality can be chosen by the user per characteristic,
      rather than being fixed by the tool for each named parameter
      (Full user choice on whether e.g. parameters vary by time, space, both, or neither).
    extensible_dimensions: >-
      A dimension not natively defined by the tool (e.g. a custom vintage, cohort, or scenario axis) can be introduced by the user.
      The tool's mathematical formulation can either handle this automatically or requires custom math (see `interface__math.user_defined_math`).
    linear: >-
      Asset characteristics vary linearly with a single decision variable
      (e.g. resource availability increasing with asset capacity).
    piecewise: >-
      Asset characteristics vary depending on operating decision variables.
      This creates a non-linear relationship that can be described by a piecewise linear curve
      (e.g., part-load efficiency, linked to capacity, storage head effects).
    quadratic: >-
      Asset characteristics vary quadratically with decision variables, passed natively to a QP/QCP-capable solver
      (e.g. quadratic fuel curves, loss approximations).
    iterative: >-
      Asset characteristics vary depending on operating decision variables.
      This creates a non-linear relationship that can only be converged upon iteratively (e.g. transmission line losses).
    path_dependent: >-
      Asset characteristics evolve based on cumulative historical operation rather than snapshot decisions alone
      (e.g. battery cycling/calendar degradation, filter fouling).
      This is distinct from `iterative`, which converges non-linearity within a single snapshot.

asset__cost__investment:
  description: Asset investment cost representation
  members:
    linear: >-
      Initial asset capital cost which varies linearly with asset nameplate capacity (e.g. EUR/MW).
    unit: >-
      Initial asset capital cost which is incurred on asset purchase, irrespective of capacity (e.g. land purchase).
    piecewise: >-
      Initial asset capital cost which varies non-linearly, represented by a piecewise linear curve
      (e.g. economies of scale, where cost per capacity decreases with increasing capacity).
      This may be approximated by multiple assets of the same class (e.g. "wind turbine") that each have different costs and maximum capacities.
    annuitisation: >-
      An asset's capital investment can be annuitised to account for factors linked to its expected economic life and financing arrangements.
      (e.g., weighted cost of capital, inflation and tax rates, and other sources of depreciation).
    threshold_deviation: >-
      Costs on deviations above/below a contracted or reference investment level.
      This is applied as a soft constraint requiring a reference level plus deviation variables
      (e.g. rebate for providing firm capacity, penalty for exceeding land-use limits).

asset__cost__operation:
  description: Asset operating cost representation.
  members:
    linear: >-
      Operating costs which vary linearly with unit in-/out-flow (e.g. EUR/MWh).
    unit: >-
      Operating costs which are incurred on unit commitment (e.g. start-up costs).
    piecewise: >-
      Operating costs which vary non-linearly, represented by a piecewise linear curve
      (e.g. generation bid increment / decrement levels).
    threshold_deviation: >-
      Costs on deviations above/below a contracted or reference operating level.
      This is applied as a soft constraint requiring a reference level plus deviation variables
      (e.g. feed-in tariffs, redispatch cost relative to contracted dispatch).
    inter_temporal: >-
      Costs applied to the magnitude of change in an operating decision variable between timesteps (e.g. ramping wear cost).

system__limits:
  description: System-wide limits to represent physical or policy constraints.
  members:
    capacity: >-
      Limit multi-asset capacity decisions (e.g. land availability, procurement plans).
    operation: >-
      Limit multi-asset operational factors (e.g. max emissions, fuel availability, capacity factor).

system__reliability:
  description: >-
    Reliability requirements imposed as constraints or penalty costs within the optimisation, under deterministic inputs.
    Post-hoc adequacy assessment is `postprocessing.probabilistic_reliability_assessment`; probabilistic decision methods are `uncertainty`.
  members:
    margin_requirement: >-
      Minimum requirement on firm capacity/margin held in reserve.
      This could be applied at the system level or on single / subsets of assets
      (e.g. reserve requirements, remaining available margins (RAM)).
    probabilistic_reliability_limit: >-
      Probabilistic reliability constraints within the optimisation
      (e.g. loss-of-load-probability <LOLP> limit, expected-energy-not-served <EENS> limit).
    unserved_demand: >-
      Demand can go unserved at a penalty cost (value of lost load <VOLL>), placing a soft constraint on load shedding within the optimisation.

edge_effects:
  description: >-
    Distortive effects of system boundaries and linearising model components can be mitigated against.
    Flows across the spatial boundary are `system__processes.boundary_exchange`.
  members:
    time_operational: >-
      Start- / End-of-horizon operational effects (e.g. storage level wrapping).
    time_financial: >-
      Start- / End-of-horizon financial effects (e.g. asset investment annuitisation).
    energy_balance: >-
      Energy 'destruction' caused by simultaneous in- & out-flow from a lossy transmission/storage asset.

actors:
  description: >-
    Representation of heterogeneous decision-making actors, deviating from the single, central-planner baseline.
  members:
    portfolio: >-
      Agent asset portfolios and associated constraints and cost considerations
      (e.g. limited cross-portfolio capital investment, risk appetite).
    distributed_objectives: >-
      Per-agent profit maximising / risk minimising bidding in day-ahead / intra-day markets.
    equilibrium: >-
      Market equilibrium found across actors with competing objectives.
      This could be applied via complementarity/MCP/bi-level formulations or a quadratic-markup reformulation of the cost-minimisation objective
      (e.g. Cournot-Nash oligopoly modelling).
    aggregated_prosumers: >-
      Small-scale consumers/prosumers represented as aggregated actor classes with their own objectives and response behaviour, rather than as individuals.

time__pathway:
  description: >-
    Foresight extent and planning direction across investment periods in multi-year pathway planning,
    beyond the single-investment-period (overnight / end-state) baseline.
  members:
    perfect_foresight: >-
      All investment periods are optimised simultaneously with perfect foresight of future periods.
    myopic_foresight: >-
      Investment periods are optimised sequentially, with each decision made without knowledge of later periods.
    backcasting: >-
      a desirable end-state is fixed and the model works backwards to find the connecting pathway.

optimisation__objective:
  description: >-
    Objective-function options beyond minimisation of a single linear cost term.
  members:
    multi_objective_weighted: >-
      Multiple objective terms combined via user-set weights into a single objectives.
      Trade-offs explored by manual weight variation.
    multi_objective_pareto: >-
      Built-in generation of Pareto-optimal solution sets across objectives
      (e.g. epsilon-constraint, evolutionary methods).
    quadratic: >-
      Quadratic objective terms passed natively to the solver
      (e.g. quadratic generation cost curves, welfare maximisation with linear demand curves).

uncertainty:
  description: >-
    Methods that restructure the decision problem to account for parametric or structural uncertainty.
  members:
    two_stage_stochastic: >-
      Two-stage stochastic optimisation; used in investment decision making under uncertainty.
    multi_stage_stochastic: >-
      Multi-stage stochastic optimisation, in which decisions are revised as uncertainty resolves stage by stage.
      Primarily used for scheduling seasonal storage (e.g. hydropower water values) under uncertain inflows.
    risk_aversion: >-
      Risk measures (e.g. Conditional Value at Risk <CVaR>) applied to a stochastic optimisation as chance constraints.
      It weights tail-end outcomes according to a configurable risk tolerance.
    near_optimal: >-
      Generate a near-optimal solution set by relaxing constraints / objectives in the optimisation problem.
      (e.g., Modelling to Generate Alternatives <MGA>).
    robust_optimisation: >-
      Worst-case cost minimisation over an uncertainty set.

tractability__temporal:
  description: Temporal resolution adjustment options.
  members:
    resampling: >-
      Temporal up/down-sampling.
    typical_periods: >-
      Full timeseries is represented by typical periods (days, weeks, months).
    load_duration_curves: >-
      Full timeseries is represented by load duration curves.
    distortion_mitigation: >-
      Mathematical constraints to manage inter-temporal model features in a temporally simplified model
      (e.g., linking storage levels across typical periods).

tractability__spatial:
  description: Spatial resolution adjustment options.
  members:
    zone_aggregation: >-
      Automatic spatial zone aggregation/disaggregation.
      Usually from nodal (bus) level to regional/bidding zone level.
      This usually requires `interface__build.component_groups` to define aggregation membership.
    network_reduction: >-
      Network element equivalencing (e.g., reducing to a single voltage level).

tractability__structural:
  description: >-
    Reduction of problem size by removing or collapsing model structure - components or constraints -
    as opposed to reducing resolution or reformulating math.
  members:
    clustering: >-
      Individually defined assets are automatically aggregated into asset groups for optimisation.
      This usually requires `interface__build.component_groups` to define aggregation membership.
    black_boxing: >-
      A chain of interconnected components is collapsed into a single component with an in/out interface.
      This usually requires `reserved_flows` between interconnected components.
    component_removal: >-
      Nodes, assets, or carriers can be systematically excluded from the built problem.
    constraint_screening: >-
      Constraints unlikely to bind are omitted or lazily added.

tractability__reformulation:
  description: >-
    Approximations of discrete or non-linear formulations that preserve (mixed-integer) linear tractability.
  members:
    linearised_unit_commitment: >-
      Unit commitment approximated with continuous (linearised) commitment variables, avoiding integer decision variables.
    convex_relaxation: >-
      A non-convex relationship is approximated by a convex relaxation, retaining solver tractability
      (e.g. second-order-cone relaxation of AC power flow).
    function_conversion: >-
      User-defined arbitrary non-linear functions are automatically converted into valid model inputs (e.g. piecewise segments) without manual discretisation.
    variable_fidelity: >-
      The mathematical fidelity of the same physical attribute can differ across the model's scope within one model definition
      (e.g. discrete units in some investment periods and aggregated capacity in others;
      unit commitment over the near-term horizon, continuous economic dispatch beyond).

tractability__algorithm:
  description: >-
    Restructuring of the solution algorithm of a single optimisation problem to reduce computational burden.
    Coordinating multiple complete runs is `orchestration`.
  members:
    decomposition: >-
      The problem is split into coordinated sub-problems solved iteratively or in parallel until convergence
      (e.g. Benders decomposition; Stochastic Dual Dynamic Programming <SDDP> for multi-stage stochastic hydropower scheduling).
    approximation: >-
      The solution algorithm is reformulated to reach a near-optimal answer within tolerance at reduced cost
      (e.g. progressive hedging, Stochastic Dual Dynamic Programming <SDDP>-style cut selection).

orchestration:
  description: >-
    Tool-managed workflows coordinating multiple complete runs in series/parallel,
    where the result emerges from the ensemble or its convergence.
    Restructuring the solution algorithm of a single problem is `tractability__algorithm`.
  members:
    rolling_horizon: >-
      The operational timescale is optimised in sequential (possibly overlapping) windows, each with limited foresight.
    simulation_optimisation: >-
      Iterate between a simulation and optimisation phase until convergence with respect to operational constraints
      (e.g. competitive market simulation, optimal power flow).
    scenario_runs: >-
      Batch execution of discrete, named scenario ensembles in series/parallel with collated outputs.
    sampled_runs: >-
      Execution of run ensembles over a sampled uncertainty space (e.g. Monte Carlo), with collated outputs.
      Used e.g. for post-hoc resource adequacy assessment (`postprocessing.probabilistic_reliability_assessment`)
      or portfolio price-risk quantification.
      Distinct from `scenario_runs` (discrete, named scenarios).

preprocessing:
  description: >-
    Options to generate parameters derived from user-defined input data before running the model.
    Moving/storing data is `data__io`.
  members:
    forecasting: >-
      A user-defined generation / load profile can be automatically updated given user-defined forecasting parameters
      (e.g. change in total or peak).
    spatial_distribution: >-
      A user-defined parameter can be automatically distributed spatially using other spatial parameters
      (e.g. nodal demand distribution, transmission line distances, distributed slack).
    download: >-
      Data can be downloaded directly within the tool from an open or proprietary source rather than being specified by the user.
    model_catalogue: >-
      Pre-built model datasets/examples can be retrieved from a catalogue as starting points for new models.
    scenario_generation: >-
      Scenario ensembles can be generated from user-defined parameters or sampling rules, for execution as `orchestration.scenario_runs` or `orchestration.sampled_runs`.
    input_validation: >-
      Input data is validated against the tool's expected structure and value ranges before a run, with informative failures.

postprocessing:
  description: >-
    Postprocessing analyses that can be triggered by the tool based on model outputs, on a per-asset or system-wide basis.
  members:
    impact_assessment: >-
      Auxiliary impacts (e.g., GHG emissions, water consumption, job creation).
    curtailment: >-
      Asset generation curtailment.
    shadow_prices: >-
      Optimisation problem shadow prices, utilising a constraint dual-extraction mechanism
      (e.g. to approximate wholesale market prices; water values / `future_cost_function`, `contract_settlement`, and soft-constraint
      interpretation).
    financial: >-
      Financial analyses for business cases
      (e.g. levelised cost of electricity or other carriers, net present value, asset-level revenue / costs).
    network_transfer_metrics: >-
      Network transfer capability and flow-sensitivity metrics derived from model outputs
      (e.g. grid transfer capacities, power transfer distribution factors, line outage distribution factors).
    future_cost_function: >-
      A future cost function (water value) is constructed as a reusable, exportable artefact
      (e.g. from Benders / SDDP cuts) that forecasts the marginal cost of hydro and other seasonal storage devices.
      Used in shorter-term scheduling under uncertain input parameters.
      Distinct from `shadow_prices`, which is the dual-extraction mechanism it can build upon.
    aggregation: >-
      Method to aggregate modelled components into broader classifications for analysis and dissemination
      (e.g., separately costed "wind turbine" assets aggregated back to "wind turbine").
      This usually requires `interface__build.component_groups` to define aggregation membership.
    scenario_comparison: >-
      Outputs of multiple scenario/ensemble runs are collated and compared.
    contract_settlement: >-
      Post-hoc settlement of financial contracts against realised dispatch and prices, without altering the underlying optimisation.
      (e.g. CfDs, PPAs,cap-and-floor schemes).
    disaggregation: >-
      Model outputs are redistributed back to pre-simplification resolution
      (e.g. capacity-expansion results handed off to a full-resolution power-flow model).
    probabilistic_reliability_assessment: >-
      Probabilistic resource-adequacy metrics calculated post-hoc
      (e.g. loss of load probability/expectation <LOLP>, expected energy not served <EENS>, effectively load carrying capacity <ELCC>).
      Sampling-based run orchestration to produce them is `orchestration.sampled_runs`.

workflow__transparency:
  description: >-
    Transparency of the modelling pipeline: logs, diagnostics, and traceability of data as it moves through the workflow.
  members:
    run_logs: >-
      Run logs available (e.g. in text files), for use in debugging failing model runs.
    infeasibility_diagnosis: >-
      Infeasible problems can be diagnosed
      (e.g. irreducible infeasible subset (IIS) generation, named constraint violations).
    metadata_propagation: >-
      Metadata is propagated from inputs through to outputs
      (e.g. data sources, versions, licences).
    intermediate_access: >-
      Intermediate pipeline artefacts (e.g. built problem data, solver state) can be exposed to the user.
    unit_tracking: >-
      Physical units attached to data are tracked and validated through the pipeline
      (to enable e.g., unit-consistency checking, automatic conversion, auto-scaling).

data__io:
  description: >-
    Data formats and mechanisms for moving model input/output data.
    Computing new parameters is `preprocessing`.
  members:
    plain_text:
      Input / Output data in human-readable, diff- and version-control-friendly text formats (e.g. CSV, JSON, YAML).
    binary:
      Input / Output data in compact / compressible, non-human-readable binary formats (e.g. Excel, NetCDF, HDF5, Parquet).
    database:
      Input / Output data in databases (relational or otherwise).
    remote_storage:
      Data can be read from / written to remote storage (e.g. object stores, cloud drives).
    lazy_loading:
      Data can be loaded lazily / out-of-core, allowing datasets larger than memory.

interface__build:
  description: >-
    Available options for defining, configuring, and structuring a model.
    Model definition happens via configuration/data files or code, not the command line
    (CLI commands that scaffold or build a model are `interface__run.cli`).
  members:
    gui: >-
      Graphical user interface
    config_files: >-
      Configurable via structured configuration/data files, without knowledge of the programming language in which the tool has been written.
    api: >-
      Can be configured using scripting specific to the tool programming language or another programming language for which an API is provided
      (e.g. a Python API for a package written in C).
    standardised_data: >-
      Accepts input data following a community-recognised convention or ontology
      (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy System Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas).
    component_groups: >-
      Components (assets, nodes, carriers) can be tagged into named, potentially overlapping groups independent of the model's built-in structural dimensions
      (e.g. a "coastal assets" or "2030-vintage" tag spanning multiple asset types/nodes),
      and referenced by name as the scope of a constraint or limit (e.g. total capacity or emissions across group X).
      Distinct from whole-system limits from single-asset-type constraints;
      the same grouping is what `postprocessing.aggregation` classifies for dissemination.
    component_templating: >-
      Components can inherit parameterisation from a shared template (e.g. an abstract technology definition),
      with edits to the template cascading to every inheriting component, rather than requiring per-component data entry.

interface__run:
  description: >-
    Available options for executing a model run, beyond the local-execution baseline.
  members:
    gui: >-
      Graphical user interface.
    cli: >-
      Command line interface.
    api: >-
      Programmatic interface (e.g. language API, web API) to launch and manage runs.
    remote_execution: >-
      Runs can be dispatched to and managed on remote compute (cloud, HPC, hosted service) from the tool.
    solver_configuration: >-
      Optimiser parameters can be directly configured, including convergence parameters & warm-starting options.

interface__analysis:
  description: Available options for interacting with model outputs.
  members:
    gui: >-
      Graphical user interface.
    reports: >-
      Static reports consolidating model outputs.
    tables: >-
      pre-prepared tables that can be analysed in a spreadsheet application such as Excel.
    standardised_data: >-
      Outputs follow a community-recognised convention or ontology, for regulatory reporting or frictionless data transfer with a downstream process
      (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy System Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas).

interface__math:
  description: >-
    Access to, and user extension of, the underlying mathematical formulation.
  members:
    formulation_transparency: >-
      The tool's mathematical formulation is accessible and inspectable.
      (e.g. as rendered equations or a math specification traceable to the built problem).
    problem_file_export: >-
      The built optimisation problem can be exported in standard formats (e.g. LP/MPS).
    user_defined_math: >-
      Users can define their own decision variables and constraints on the optimisation problem, applied to existing or new decision variables.
    user_defined_objective:
      Users can define or modify the objective function.
    soft_constraints: >-
      User-defined or built-in constraints can be reformulated as soft constraints without bespoke implementation per constraint.
      This is usually via a generic slack-variable-plus-penalty mechanism.
      Built-in economic threshold costs are instead `asset__cost__investment.threshold_deviation` / `asset__cost__operation.threshold_deviation`.
