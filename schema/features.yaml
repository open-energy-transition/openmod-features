processes:
  description: >-
    Fundamental carrier-flow capabilities the tool can represent,
    defined by their mathematical role rather than by named technologies.
    `Carriers` are the energy or non-energy commodities that flow between processes
    (e.g. electricity, heat, hydrogen, CO2, water, materials).
    Only physical processes are in scope; decision-making agents are `actors`.
  members:
    boundary_exchange: >-
      Carriers can enter or leave the system across its boundary at a defined cost and availability
      (e.g. fuel supply, primary resource extraction, imports/exports to unmodelled regions).
    conversion:
      description: >-
        Carriers can be transformed into other carriers within the system boundary
        (e.g. power plants, electrolysers, heat pumps, CO2 capture).
        This enables coupled multi-carrier optimisation.
      members:
        one_to_one: >-
          A single in-flowing carrier can be converted to a single out-flowing carrier
          (e.g. power plants, electrolysers without heat recovery).
        multi_carrier_io: >-
          A single conversion process can have several in-flowing and/or out-flowing carriers,
          each balanced individually, with fixed ratios between them
          (e.g. back-pressure CHP, fixed heat-recovery fractions).
        flexible_ratio: >-
          The ratio between a conversion process's flows can be a decision variable,
          freely allocated or constrained within a feasible operating region
          (e.g. heat pumps serving heat and cooling, extraction-condensing CHP).
    temporal_transfer: >-
      Carriers can be moved in time (e.g. storage, demand shifting), linking system states across timesteps.
    spatial_transfer: >-
      Carriers can be moved between regions as continuous flow subject to transfer-capacity limits, without network physics.
      See `network.power_flow` / `network.hydraulic_flow` for network physics features.
    delayed_transfer: >-
      Carriers can flow continuously in space with a time delay between injection and withdrawal
      (e.g., river flows, district-heating transit).
    buffered_transfer: >
      Carriers can flow in space with an endogenous in-transit inventory, enabling the flow to accumulate in time
      (e.g. pipeline linepack).
    discrete_transport: >-
      Carriers can be moved in space or exchanged across the system boundary in discrete packets with loading/unloading decisions
      (e.g. shipping, trucking, rail).
    state_changing_transfer: >-
      A carrier's physical state can be tracked or converted en route during carrier movement
      (e.g. gas pressure levels with compressors, heat-network temperature levels).
    explicit_demand:
      description: >-
        Carriers can be consumed within the system boundary by explicit processes with their own balances and constraints,
        rather than by a fixed exogenous profile parameter.
      members:
        inelastic: >-
          A fixed quantity of a carrier can be consumed by a process whose in-flow is balanced like any other process flow.
          The process can therefore be parameterised and constrained (e.g., to shift consumption in space and time to reflect demand-side management).
        price_responsive: >-
          The consumed quantity can be decided in the optimisation against price / willingness-to-pay, via demand bids or stepwise/linear demand curves.
        mobile_storage: >-
          A consuming process can have embedded storage whose network attachment and availability vary in space and time, according to user-defined patterns.

network:
  description: >-
    Network physics can be represented beyond the `processes.spatial_transfer` baseline,
    where flows are coupled by the physics of the transporting medium rather than by capacity limits alone.
  members:
    power_flow:
      description: >-
        Electrical networks can be represented beyond the `processes.spatial_transfer` baseline.
      members:
        optimal_power_flow:
          description: >-
            Linearised optimal power flow can be modelled.
          members:
            dc_opf: >-
              DC optimal power flow can be modelled.
            ac_opf: >-
              Linearised AC optimal power flow can be modelled.
        sensitivity_limits:
          description: >-
            Flows can be limited using supplied linear sensitivities, as an alternative to physical network limits.
          members:
            ptdf: >-
              Power Transfer Distribution Factor <PTDF> limits can be applied, describing the sensitivity of a branch flow to a nodal injection.
            outage_factors: >-
              Line/Branch Outage Distribution Factor <LODF/BODF> limits can be applied, describing the sensitivity of a branch flow to the outage of another branch.
            generic_constraints: >-
              Generic transmission constraints can be defined by user-supplied sensitivity coefficients not tied to a named physical factor.
        network_limits:
          description: >-
            Network operating limits can be represented in the power-flow formulation.
          members:
            thermal: >-
              Thermal (branch flow magnitude) limits can be applied.
            phase_angle: >-
              Phase-angle difference limits between connected buses can be applied.
        network_devices:
          description: >-
            Network components beyond simple lines and buses can be represented, carrying their own mathematical formulations.
          members:
            transformers: >-
              Shunt and phase-shifting transformers can be represented.
            facts_devices: >-
              Flexible AC Transmission System <FACTS> devices can be represented.
            hvdc_converters: >-
              Rectifiers, inverters, and HVDC converter stations can be represented.
        unbalanced_flows: >-
          Unbalanced flows (asymmetric phases) can be handled in optimal power flow, usually using linearised DistFlow branch equations.

    hydraulic_flow:
      description: >-
        Pressure-driven networks can be represented for carriers transported through pipes,
        beyond the `processes.spatial_transfer` baseline
        (e.g. methane, hydrogen, CO2, district heat/cooling, water).
      members:
        linearised_flow: >-
          Nodal pressure/head can be a decision variable which couples flows using a linearised pressure-drop relationship.
          Operating limits on that state can be represented in the same formulation
          (e.g. minimum/maximum nodal pressure, maximum allowable operating pressure <MAOP>, contracted delivery pressure).
        composition_tracking: >-
          A single transfer asset can carry a mixture whose constituents are balanced individually,
          allowing limits on the resulting blend
          (e.g. hydrogen blend-fraction limits, minimum gross calorific value <GCV>, Wobbe index bounds).
          Composition-dependent hydraulics (e.g. a density-dependent pressure-drop coefficient) are out of scope.

asset:
  description: >-
    Representation of the individual assets that make up the system:
    how their capacities can be represented, how their operation can be resolved, and the costs they can incur.
    Limits on asset investment and operation, and the mathematical form those limits take, are `constraints`.
  members:
    capacity_representation:
      description: How asset capacities can be represented in the model and optimisation problem.
      members:
        exogenous_capacity: >-
          Asset capacity can be fixed and fully defined in the input data (e.g. for modelling dispatch only).
        continuous_capacity: >-
          Asset capacity can be fully endogenous and modelled as a continuous (linear) decision variable.
          An optional maximum capacity can be specified in the input data
          (e.g. PV capacity that can be installed at any capacity from zero to a maximum defined by land-use constraints).
        integer_investment_exogenous_capacity: >-
          Asset capacity magnitude can be fixed in the input data,
          with investment modelled as a discrete (i.e., integer) decision variable
          (e.g. nuclear power plants whose capacity is fixed & indivisible due to external constraints but the decision to invest in this capacity is as-yet undecided).
        integer_investment_continuous_capacity: >-
          Asset capacity magnitude can be endogenous and modelled as a continuous (linear) decision variable,
          with investment also endogenous and represented by a binary decision variable.
          An optional maximum capacity can be specified in the input data
          (e.g. gas turbines that you want to track as individual units and whose capacity is not fixed by the manufacturer).
        retrofit: >-
          Investment in modifications to an existing asset can be made endogenously, with their own build economics,
          changing the asset's technical parameters or costs rather than adding standalone capacity
          (e.g. emissions-abatement retrofits such as flue-gas desulphurisation or CO2 capture,
          efficiency upgrades, fuel-switching conversions).
        multi_period: >-
          Asset capacities can be defined across multiple investment periods.
          These may be endogenous and decided per investment period with perfect foresight or using a limited foresight method (see `orchestration.coupled_models.limited_foresight`).


    operating_representation:
      description: >-
        The resolution at which asset operation can be represented in the model.
        A linearised approximation of unit commitment is
        `tractability.reformulation.linearised_unit_commitment`.
      members:
        unit_commitment: >-
          Assets can be committed as units and _then_ economically dispatched.
          This generally requires assets to be modelled as discrete units which reflect assets 1-to-1.
        maintenance_scheduling: >-
          Asset maintenance / outage schedules can be derived endogenously, co-optimised with operation.
          Exogenously fixed maintenance windows are instead `constraints.scope.commitment`.
          Resource-constrained maintenance limits are instead `constraints.scope.total`.

    cost:
      description: >-
        How asset investment and operating costs can be represented.
        Cost which varies linearly with a decision variable
        (e.g. EUR/MW capital cost on nameplate capacity, EUR/MWh operating cost on flow)
        is the baseline; we do not track it explicitly here.
      members:
        unit:
          description: >-
            Cost can be incurred as a fixed lump sum, irrespective of magnitude.
          members:
            investment: >-
              Initial capital cost can be incurred on asset purchase, irrespective of capacity (e.g. land purchase, design phase).
            operation: >-
              Operating cost can be incurred on unit commitment (e.g. start-up costs).
        nonlinear:
          description: >-
            Cost can vary non-linearly, usually described in the objective using piecewise linear curves.
            Non-linear relationships in constraints rather than the objective are `constraints.functional_form.nonlinear`.
          members:
            investment: >-
              Capital cost economies of scale can be represented, where cost per capacity decreases with increasing capacity.
              In some cases, it is possible to describe this without an explicit piecewise constraint.
              Instead, it may be approximated by multiple assets of the same class (e.g. "wind turbine") that each have different costs and maximum capacities.
            operation: >-
              Operating cost can be represented as generation bid increment / decrement levels.
        threshold_deviation:
          description: >-
            Costs can be applied to deviations above/below a contracted or reference level.
            This is applied as a soft constraint requiring a reference level plus deviation variables.
          members:
            investment: >-
              Costs can be applied to deviation from a contracted or reference investment level
              (e.g. rebate for providing firm capacity, penalty for exceeding land-use limits).
            operation: >-
              Costs can be applied to deviation from a contracted or reference operating level
              (e.g. feed-in tariffs, redispatch cost relative to contracted dispatch).
        annuitisation: >-
          An asset's capital investment can be annuitised to account for factors linked to its expected economic life and financing arrangements.
          (e.g., weighted cost of capital, inflation and tax rates).
        inter_temporal:
          description: >-
            Costs can be applied to the magnitude of change in a decision variable between time periods.
          members:
            investment: >-
              Costs can be applied between investment periods (e.g. learning rate penalty).
            operation: >-
              Costs can be applied between timesteps (e.g. ramping wear cost).

constraints:
  description: >-
    Limits on asset investment and operating decisions,
    and reliability requirements imposed on the system as a whole,
    whether enforced as hard constraints or as penalty costs.
    `scope` describes what a limit can span;
    `functional_form` describes the mathematical form of the relationships between decision variables that the tool can express.
  members:
    scope:
      description: >-
        What a limit can span: the regions, assets, or time periods that a constraint links or applies within.
      members:
        inter_spatial:
          description: >-
            Limits can link geographic regions (e.g. to ensure regional equity).
          members:
            investment: >-
              Investment limits can link geographic regions
              (e.g. a minimum share of new capacity built in each region).
            operation: >-
              Operating limits can link geographic regions
              (e.g. a regional self-sufficiency requirement on generation relative to demand).
        inter_asset:
          description: >-
            Limits can link assets, within or across regions and time.
          members:
            investment: >-
              Investment limits can link assets (e.g., land-use competition, system-wide embodied emissions limits).
            operation: >-
              Operating limits can link assets (e.g., regional emissions limits applied across all emitting assets).
        total:
          description: >-
            A limit can be placed on an aggregate quantity over a subset or the entire time horizon / spatial scope.
            This can represent real contract arrangements / regulation.
          members:
            investment: >-
              Aggregate investment can be limited (e.g. policy targets).
            operation: >-
              Total asset carrier in-/out-flow can be limited
              (e.g. limits on storage cycling, annual throughput limits, uptime, maintenance events limited by available spare-parts/crew resources).
        inter_temporal:
          description: >-
            Limits can link across time periods.
          members:
            investment: >-
              Investment limits can link investment periods (e.g. build-rate limits, phased retirement, availability windows).
            operation: >-
              Operating limits can link time periods (e.g., ramping, run up, load shifting).
        intra_temporal:
          description: >-
            Limits can be placed on how much assets output in a given time period.
          members:
            investment: >-
              Investment can be limited within investment periods (e.g. minimum/maximum size).
            operation: >-
              Operation can be limited within timesteps
              (e.g. capacity de-rating profiles, minimum/maximum load levels, renewables capacity factors).
        commitment:
          description: >-
            Limits can be placed on commitment to investing in or operating an asset in a given time period.
          members:
            investment: >-
              Investment unit purchase can be limited within investment periods.
              Usually requires `asset.capacity_representation.integer_investment_...`.
            operation: >-
              Operational unit commitment can be limited within timesteps (e.g., forced/planned outage windows).
              Usually requires `asset.operating_representation.unit_commitment`.
        boundary_conditions:
          description: >-
            Initial and end-state conditions can be set.
          members:
            investment: >-
              Investment optimisation can start from an existing asset stock rather than from an empty (greenfield) system or can define a desired end-state.
              This allows pre-existing capacities to be represented (initial) and for backcasting system design (end-state).
            operation: >-
              Initial or end-state operational conditions can be set (e.g. start or end storage level requirements).
    functional_form:
      description: >-
        The mathematical form of the relationships the tool can impose between decision variables,
        and hence the problem class handed to the solver.
        A linear relationship between an input parameter and a single decision variable
        (e.g. a fixed efficiency applied to a flow, resource availability scaled by capacity)
        is the baseline; we do not track it explicitly here.
        Non-linear and quadratic terms in the objective are instead
        `asset.cost.nonlinear` / `objective.quadratic`.
      members:
        linear_multi_variable:
          description: >-
            Linear relationships can link several decision variables,
            defining a polyhedral feasible region beyond simple upper/lower bounds on individual variables.
          members:
            investment: >-
              A linear relationship can link several investment decision variables
              (e.g. energy-to-power ratio envelopes on storage capacity).
            operation: >-
              A linear relationship can link several operating decision variables, defining a feasible operating envelope
              (e.g. CHP heat-power operating regions, combined active/reactive power limits).
        quadratic:
          description: >-
            Constraints can require the product of decision variables, creating a quadratic constraint which is passed natively to a QP/QCP-capable solver.
          members:
            investment: >-
              A quadratic relationship can involve an investment decision variable.
            operation: >-
              A quadratic relationship can involve an operating decision variable
              (e.g. quadratic fuel curves, loss approximations).
        nonlinear:
          description: >-
            Constraints can link together several decision variables in a general non-linear relationship,
            which can be described by e.g. a piecewise linear curve (`math.piecewise_formulation`) or through iterative solving.
          members:
            investment: >-
              A non-linear relationship can involve an investment decision variable (e.g. storage head effects, pressurisation energy curves linked to capacity).
            operation: >-
              A non-linear relationship can involve an operating decision variable (e.g., part-load efficiency, line losses).
    path_dependent:
      description: >-
        Constraints can be defined in which a quantity evolves endogenously based on cumulative historical decisions,
        rather than from input parameters alone.
        Approximating this by pre-generating vintaged components is instead `model_definition.component_templating`.
      members:
        investment: >-
          A quantity can evolve based on investments made in previous periods
          (e.g. learning curves).
        operation: >-
          A quantity can evolve based on operation in previous timesteps
          (e.g. battery cycling/calendar degradation, filter fouling).
    dedicated_flow_routing: >-
      Carrier out-flow from one asset can be reserved as in-flow to a specific subset of other assets
      (e.g. fuel stockpiling ahead of conversion, hydropower cascades, CHP internal steam flows).
    reliability:
      description: >-
        Reliability requirements can be imposed as constraints or penalty costs within the optimisation, under deterministic inputs.
        Post-hoc adequacy assessment is `postprocessing.metrics.probabilistic_reliability_assessment`; probabilistic decision methods are `uncertainty`.
      members:
        margin_requirement:
          description: >-
            A minimum requirement can be placed on firm capacity/margin held in reserve.
            This could be applied at the system level or on single / subsets of assets, if `model_definition.dimension_groups` is available.
          members:
            capacity: >-
              A firm capacity requirement can be held against peak demand or a resource-adequacy target.
            operating_reserve: >-
              An operating reserve requirement can be held against short-term contingencies (e.g. spinning reserve, ramping reserve).
        probabilistic_reliability_limit:
          description: >-
            Probabilistic reliability constraints can be applied within the optimisation.
          members:
            loss_of_load: >-
              A loss-of-load-probability <LOLP> limit can be applied.
            unserved_energy: >-
              An expected-energy-not-served <EENS> limit can be applied.
        unserved_demand: >-
          Demand can go unserved at a penalty cost (value of lost load <VOLL>), placing a soft constraint on load shedding within the optimisation.
        contingency_constrained: >-
          The optimisation can be constrained to remain feasible following the loss of individual components, over an enumerated set of discrete failure states
          (e.g. N-1 security-constrained optimal power flow, loss of a compressor station or pipeline segment).
          Post-contingency corrective action can be co-optimised where the tool supports it.

model_definition:
  description: >-
    How the model's parameter space and dimensions can be shaped, grouped, and reused,
    independent of any single parameter, constraint, or cost.
  members:
    dimension_groups: >-
      Dimension members can be tagged into named, potentially overlapping groups independent of the model's built-in structural dimensions
      (e.g. a "coastal assets" or "2030-vintage" tag spanning multiple asset types/nodes).
      These can be used for dimension aggregation to achieve tractability (e.g. spatial nodes to zones), for filtering on dimensions when applying constraints (e.g. total capacity across group X; seasonal limits), and for analysis/visualisation (`postprocessing.transformation.aggregation`/`postprocessing.transformation.disaggregation`).
    component_templating: >-
      Components can inherit parameterisation from a shared template (e.g. an abstract technology definition),
      with edits to the template cascading to every inheriting component, rather than requiring per-component data entry.
      Includes programmatic, model-side generation of components from a template
      (e.g. auto-cloned vintaged expansion candidates approximating `constraints.path_dependent` relationships).
    configurable_dimensions: >-
      The dimensionality of an asset parameter (e.g. efficiency, availability) or cost can be configured by the user, limited to a set of tool-defined dimensions.
    extensible_dimensions: >-
      A dimension not natively defined by the tool (e.g. a custom vintage, cohort, or scenario axis) can be introduced by the user.
      Asset parameters/costs and math variables and constraints can be indexed over this new dimension
      (usually requires custom math - `math.user_defined_math`).

math:
  description: >-
    Access to, and user extension of, the underlying mathematical formulation.
  members:
    formulation_transparency: >-
      The tool's mathematical formulation can be accessed and inspected
      (e.g. as rendered equations or a math specification traceable to the built problem).
    problem_file_export: >-
      The built optimisation problem can be exported in standard formats (e.g. LP/MPS).
    dual_extraction: >-
      The built optimisation problem's constraint duals can be extracted
      (e.g. to approximate wholesale market prices via `postprocessing.metrics.financial.marginal_price`,
      or to construct a future cost function via `postprocessing.metrics.financial.water_value`).
    piecewise_formulation: >-
      Piecewise formulations of nonlinear relationships (`constraints.functional_form.nonlinear`) can be defined in the math (e.g. using LP chord-line or MIP SOS2 constraints).
    user_defined_math: >-
      Users can define their own constraints on the optimisation problem, applied to existing or new decision variables, and write their own objective expression.
    soft_constraints: >-
      User-defined or built-in constraints can be reformulated as soft constraints without bespoke implementation per constraint.
      This is usually via a generic slack-variable-plus-penalty mechanism.
      Built-in economic threshold costs are instead `asset.cost.threshold_deviation.investment` / `asset.cost.threshold_deviation.operation`.

interface:
  description: >-
    Available options for users and machines to drive the tool:
    defining, configuring, and structuring a model (`build`);
    executing a model run (`run`); interacting with model outputs (`analyse`);
    plus tool-level execution and solver configuration.
  members:
    gui:
      description: >-
        The tool can be driven via a graphical user interface.
      members:
        build: >-
          A model can be defined, configured, and structured via a GUI.
        run: >-
          A model run can be executed via a GUI.
        analyse: >-
          Model outputs can be interacted with via a GUI.
    api:
      description: >-
        The tool can be driven via a programmatic interface (e.g. language API, web API).
      members:
        build: >-
          A model can be built using scripting specific to the tool programming language or another programming language for which an API is provided
          (e.g. a Python API for a package written in C).
        run: >-
          Runs can be launched and managed programmatically.
        analyse: >-
          Results can be analysed programmatically.
    cli:
      description: >-
        The tool can be driven via a command line interface.
      members:
        build: >-
          A model can be built via CLI commands.
          This is usually used to convert between data formats for a given model definition, but may also be used to redefine a model (e.g. reduce dimensions).
        run: >-
          A model run can be launched and managed via CLI commands.
        analyse: >-
          Reports can be created via CLI commands to enable result analysis.
    remote_execution: >-
      Runs can be dispatched to and managed on remote compute (cloud, HPC, hosted service) from the tool.
    solver_configuration: >-
      Optimiser parameters can be directly configured, including convergence parameters & warm-starting options.
    analysis_templates: >-
      Templates can be used to generate consistent reports or dashboards to consolidate model outputs for dissemination.
    visualisation:
      description: >-
        Model inputs or outputs can be rendered as visual artefacts by the tool,
        independent of whether a `gui` is available to interact with them.
      members:
        charts: >-
          Input or result data can be plotted (e.g. dispatch stacks, time series, duration curves).
        network_maps: >-
          Network topology can be rendered, schematically (auto-layout diagrams) or geographically
          (coordinate-based maps, exports to geographic formats such as KML/GML).

io:
  description: >-
    Data formats, conventions, and mechanisms for moving model input/output data.
    Computing new parameters is `preprocessing`.
  members:
    plain_text:
      description: >-
        Data can be handled in human-readable, diff- and version-control-friendly text formats (e.g. CSV, JSON, YAML).
      members:
        input: >-
          Input data can be provided in this format.
        output: >-
          Output data can be written in this format.
    binary:
      description: >-
        Data can be handled in compact / compressible, non-human-readable binary formats (e.g. Excel, NetCDF, HDF5, Parquet).
      members:
        input: >-
          Input data can be provided in this format.
        output: >-
          Output data can be written in this format.
    database:
      description: >-
        Data can be handled in databases (relational or otherwise).
      members:
        input: >-
          Input data can be read from a database.
        output: >-
          Output data can be written to a database.
    remote_storage:
      description: >-
        Data can be read from / written to remote storage (e.g. object stores, cloud drives).
      members:
        input: >-
          Input data can be read from remote storage.
        output: >-
          Output data can be written to remote storage.
    lazy_loading:
      description: >-
        Data can be loaded lazily / out-of-core, allowing datasets larger than memory.
      members:
        input: >-
          Input data can be loaded lazily.
        output: >-
          Output data can be written lazily / streamed rather than held fully in memory.
    standardised:
      description: >-
        Data can be accepted or emitted following a community-recognised convention or ontology
        (e.g. Open Energy Ontology <OEO>, IAMC template, the Energy System Description Language <ESDL>, Common Energy System Model <CESM>, SiennaSchemas),
        including standardised network-data formats (e.g. PSSE RAW, matpower case files, Common Information Model <CIM>).
      members:
        input: >-
          Input data following a community-recognised convention or ontology can be accepted.
        output: >-
          Outputs can follow a community-recognised convention or ontology.
          This is useful for regulatory reporting or frictionless data transfer with a downstream process.

edge_effects:
  description: >-
    Distortive effects of system boundaries and linearising model components can be mitigated against.
    Flows across the spatial boundary are `processes.boundary_exchange`.
  members:
    time_operational: >-
      Start- / End-of-horizon operational effects can be mitigated (e.g. storage level wrapping).
    time_financial: >-
      Start- / End-of-horizon financial effects can be mitigated (e.g. asset investment annuitisation).
    energy_balance: >-
      Energy 'destruction' caused by simultaneous in- & out-flow from a lossy transmission/storage asset can be mitigated.

actors:
  description: >-
    Heterogeneous decision-making actors can be represented, deviating from the single, central-planner baseline.
  members:
    portfolio: >-
      Agent asset portfolios and associated constraints and cost considerations can be represented
      (e.g. limited cross-portfolio capital investment, risk appetite).
    distributed_objectives: >-
      Per-agent profit maximising / risk minimising objectives can be represented within the larger system-level optimisation
      (e.g. bidding in day-ahead / intra-day markets, behind-the-meter prosumer decisions)
    equilibrium: >-
      Market equilibrium can be computed across actors with competing objectives
      (e.g. Cournot-Nash oligopoly or Bertrand competition),
      via complementarity/MCP/bi-level formulations or a quadratic-markup reformulation of the cost-minimisation objective.
    heuristic_markup: >-
      Strategic-behaviour price/offer markups can be applied by heuristic or index-based rules rather than computed equilibrium
      (e.g. Residual Supply Index <RSI>-driven markups, fixed bid adders).

objective:
  description: >-
    The objective function can extend beyond minimisation of a single linear cost term.
  members:
    multi_objective_weighted: >-
      Multiple objective terms can be combined via user-set weights into a single objective.
      Trade-offs can be explored by manual weight variation.
    multi_objective_pareto: >-
      Pareto-optimal solution sets can be generated across objectives
      (e.g. epsilon-constraint, evolutionary methods).
    quadratic: >-
      Quadratic objective terms can be passed natively to the solver
      (e.g. quadratic generation cost curves, welfare maximisation with linear demand curves).
      Quadratic terms in constraints rather than the objective are `constraints.functional_form.quadratic`.
    tie_breaking: >-
      Degenerate solutions (many distinct solutions sharing the same objective value, within tolerance)
      can be resolved by a documented rule rather than left to solver arbitrariness
      (e.g. small penalty coefficients applied to otherwise zero-cost decision variables so that they enter the objective explicitly,
      or a lexicographic secondary objective).

uncertainty:
  description: >-
    The decision problem can be restructured to account for parametric or structural uncertainty.
  members:
    two_stage_stochastic: >-
      Two-stage stochastic optimisation can be performed; used in investment decision making under uncertainty.
    multi_stage_stochastic: >-
      Multi-stage stochastic optimisation can be performed, in which decisions are revised as uncertainty resolves stage by stage.
      Primarily used for scheduling seasonal storage (e.g. hydropower water values) under uncertain inflows.
    risk_aversion: >-
      Risk measures (e.g. Conditional Value at Risk <CVaR>) can be applied to a stochastic optimisation as chance constraints.
      This weights tail-end outcomes according to a configurable risk tolerance.
    near_optimal: >-
      A near-optimal solution set can be generated by relaxing constraints / objectives in the optimisation problem
      (e.g., Modelling to Generate Alternatives <MGA>).
    robust_optimisation: >-
      Worst-case cost can be minimised over an uncertainty set.

tractability:
  description: >-
    The computational cost of building and solving the problem can be reduced,
    trading exactness for speed.
  members:
    dimension_reduction:
      description: >-
        The number of members along a dimension of the problem can be reduced automatically,
        grouped by the method used rather than by the dimension it acts on.
        Each method names the dimensions it can be applied to.
      members:
        adjacency_aggregation:
          description: >-
            Neighbouring dimension members can be merged, preserving the dimension's ordering / adjacency.
            Only applicable to dimensions whose members have a natural adjacency.
          members:
            temporal: >-
              Temporal resolution can be coarsened while remaining contiguous (e.g. hourly to daily) before the model is built.
              May apply to within-year timesteps or between-year investment periods.
            spatial: >-
              Bordering spatial units can be merged into contiguous zones (e.g. nodal/bus level to regional/bidding zone level).
              This usually requires `model_definition.dimension_groups` to define aggregation membership.
        similarity_aggregation:
          description: >-
            Dimension members can be grouped by likeness and each group represented by a proxy member.
            The resulting groups need not be contiguous, which is what creates the need for `non_contiguity_handling`.
          members:
            temporal: >-
              A full timeseries can be represented by non-contiguous typical periods (days, weeks, months) or by load duration curves.
            spatial: >-
              Spatial units can be clustered by likeness rather than adjacency (e.g. by resource quality or demand profile),
              so a zone may be geographically discontiguous.
              This usually requires `model_definition.dimension_groups` to define aggregation membership.
            assets: >-
              Individually defined assets can be automatically aggregated into asset groups for optimisation.
              This usually requires `model_definition.dimension_groups` to define aggregation membership.
            scenarios: >-
              An ensemble of scenarios / uncertainty samples can be reduced to a smaller representative set with associated weights
              (e.g. scenario reduction ahead of `uncertainty.multi_stage_stochastic`).
        equivalencing:
          description: >-
            A sub-system's internal detail can be discarded and replaced by a reduced representation
            that preserves the behaviour observed at its boundary.
          members:
            spatial: >-
              Network elements can be equivalenced, also called network reduction
              (e.g. reducing to a single voltage level; Ward, Radial Equivalent Independent <REI>, or Kron-reduced equivalents of an external network).
            assets: >-
              A chain of interconnected assets can be collapsed into a single component with an in/out interface,
              also called black boxing or lumping.
              This usually requires `constraints.dedicated_flow_routing` between interconnected components.
        filtering:
          description: >-
            Dimension members can be systematically removed from the built problem rather than represented by a proxy.
          members:
            temporal: >-
              Timesteps or investment periods (e.g. a user-selected subset of representative weeks) can be systematically filtered out of the built problem.
            spatial: >-
              Spatial units (e.g. below a voltage level, or outside a study region) can be systematically filtered out of the built problem.
            assets: >-
              Individual or groups of assets (e.g. sharing a node or a carrier) can be systematically filtered out of the built problem.
            scenarios: >-
              Scenarios / uncertainty samples can be systematically filtered out of the built problem.
        non_contiguity_handling:
          description: >-
            Mathematical constraints can be applied to manage model features that span dimension members,
            when `similarity_aggregation` has left the retained members non-contiguous.
          members:
            temporal: >-
              Inter-temporal features can be linked across non-contiguous aggregated periods
              (e.g. linking storage levels across typical periods).
            spatial: >-
              Inter-spatial features can be linked across geographically discontiguous aggregated zones
              (e.g. representing transfer capacity between the disjoint parts of a zone).

    variable_fidelity:
      description: >-
        The fidelity with which the same attribute/dimension is represented can differ across the model's scope.
      members:
        formulation: >-
          The mathematical fidelity of the same physical attribute can differ across the model's scope
          (e.g. discrete units in some investment periods and aggregated capacity in others;
          unit commitment over the near-term horizon, continuous economic dispatch beyond).
        resolution: >-
          The resolution of a dimension can differ with respect to other dimensions
          (e.g. hourly timesteps within a focus region and daily elsewhere;
          nodal spatial detail in near-term investment periods and zonal detail beyond;
          individually resolved assets in some regions and aggregated groups in others).

    reformulation:
      description: >-
        Discrete or non-linear formulations can be approximated in ways that preserve (mixed-integer) linear tractability.
      members:
        constraint_screening: >-
          Constraints unlikely to bind can be omitted or lazily added.
        linearised_unit_commitment: >-
          Unit commitment can be approximated with continuous (linearised) commitment variables, avoiding integer decision variables.
        nonlinear_handling:
          description: >-
            Non-linear relationships (`constraints.functional_form.nonlinear`) can be treated automatically
            so that the built problem remains solvable.
          members:
            convex_relaxation: >-
              A non-convex relationship in the model's own formulation can be approximated by a convex relaxation, retaining solver tractability
              (e.g. second-order-cone relaxation of AC power flow).
            function_conversion: >-
              User-defined arbitrary non-linear functions can be automatically converted into valid model inputs (e.g. piecewise segments) without manual discretisation.
        decomposition: >-
          The problem can be split into coordinated sub-problems solved iteratively or in parallel until convergence
          (e.g. Benders decomposition; Stochastic Dual Dynamic Programming <SDDP> for multi-stage stochastic hydropower scheduling).
        approximation: >-
          The solution algorithm can be reformulated to reach a near-optimal answer within tolerance at reduced cost
          (e.g. progressive hedging, Stochastic Dual Dynamic Programming <SDDP>-style cut selection).
        numeric_scaling: >-
          Data can be scaled (e.g. by converting base units) to reduce numeric instability and constraint violations in the downstream solver.

orchestration:
  description: >-
    Multiple complete runs can be coordinated in series/parallel by tool-managed workflows,
    where the result emerges from the ensemble or its convergence.
  members:
    coupled_models:
      description: >-
        Two or more model runs can be executed together with tool-managed data exchange between them.
      members:
        limited_foresight:
          description: >-
            Sequential optimisation windows can emulate absent information about later periods,
            with automatic pass-through of end-state data between runs.
          members:
            investment: >-
              Investment decisions can be optimised sequentially per period / set of periods,
              each made without knowledge / with limited knowledge of later periods.
              Also known as myopic foresight optimisation.
            operation: >-
              Dispatch decisions can be optimised sequentially per set of timesteps (e.g. days),
              each made without knowledge / with limited knowledge of later timesteps.
              Also known as rolling horizon optimisation.
        fidelity_sequence: >-
          Model instances representing the same system at different fidelity can be run in sequence, with data passed between instances.
          E.g., a long-term capacity expansion run with linearised dispatch,
          passing data to a short-term, unit-commitment dispatch run to stress test the capacities chosen by the lower fidelity long-term run.
        market_sequence: >-
          Model instances representing successive market stages can be executed together with bidirectional data exchange
          (e.g. interleaved day-ahead/real-time runs passing offers and dispatch baselines forward and initial conditions back).
        convergence_iteration: >-
          Runs can be repeated, exchanging data each time, until convergence with respect to (often nonlinear) relationships
          that cannot be represented directly in a single problem
          (e.g. competitive market simulation, iterating on line reactances, simulation-optimisation loops).

    scenario_runs: >-
      Discrete, named scenario ensembles can be executed in batch in series/parallel with collated outputs.
    sampled_runs: >-
      Run ensembles can be executed over a sampled uncertainty space (e.g. Monte Carlo), with collated outputs.
      Used e.g. for post-hoc resource adequacy assessment (`postprocessing.metrics.probabilistic_reliability_assessment`) or portfolio price-risk quantification.
      Distinct from `scenario_runs` (discrete, named scenarios).

preprocessing:
  description: >-
    Parameters can be derived from user-defined input data before running the model.
    Moving/storing data is `io`.
  members:
    forecasting: >-
      A user-defined generation / load profile can be automatically scaled or reshaped to meet user-defined forecast targets
      (e.g. change in annual total or peak).
    resource_conversion: >-
      Model profiles can be derived within the tool from primary resource or weather data via physical response models.
      This may be technology models converting resource to availability or efficiency (e.g. wind speed to turbine capacity factor, temperature to heat pump COP).
      It may also be weather-response demand functions (e.g. temperature-driven gas or heating demand).
    spatial_distribution:
      description: >-
        A user-defined parameter can be automatically distributed spatially using other spatial parameters.
      members:
        demand: >-
          Nodal demand can be distributed from an aggregate total.
        network_geometry: >-
          Transmission/pipeline line distances or routing can be derived from node coordinates.
        slack: >-
          Slack can be allocated in a distributed manner across nodes.
    download: >-
      Data can be downloaded directly within the tool from an open or proprietary source rather than being specified by the user.
    model_catalogue: >-
      Pre-built model datasets/examples can be retrieved from a catalogue as starting points for new models.
    scenario_generation: >-
      Scenario ensembles can be generated from user-defined parameters or sampling rules, for execution as `orchestration.scenario_runs` or `orchestration.sampled_runs`.
    input_validation: >-
      Input data can be validated against the tool's expected structure and value ranges before a run, with informative failures.

postprocessing:
  description: >-
    Postprocessing analyses that can be triggered by the tool based on model outputs, on a per-asset or system-wide basis.
  members:
    metrics:
      description: >-
        Quantities can be computed from model outputs and reported per-asset or system-wide.
      members:
        impact_assessment:
          description: >-
            Auxiliary impacts can be calculated from model outputs.
          members:
            emissions: >-
              GHG or other pollutant emissions can be calculated.
            resource_use: >-
              Non-carrier resource consumption (e.g. water, land, materials) can be calculated.
            socioeconomic: >-
              Socioeconomic impacts (e.g. job creation) can be calculated.
        operational:
          description: >-
            Operational analyses can be derived from model outputs.
          members:
            curtailment: >-
              Asset generation curtailment can be calculated.
            capacity_factor: >-
              Asset generation relative to full-load generation, averaged over the model horizon, can be calculated.
            full_load_hours: >-
              The number or fraction of timesteps in the model horizon that assets are operating at or close to their full load can be calculated.
              Distinct from `capacity_factor` as the same average output can arise from very different duty cycles, affecting e.g. asset lifetime.
        financial:
          description: >-
            Financial analyses for business cases can be derived from model outputs.
          members:
            levelised_cost: >-
              Levelised cost of electricity or other carriers can be calculated.
            net_present_value: >-
              Net present value of the modelled system or a subset of assets can be calculated.
            asset_accounts: >-
              Asset-level revenue / cost accounting can be performed.
            marginal_price: >-
              Shadow prices can be extracted via `math.dual_extraction`, used to approximate wholesale market prices or as an input to
              `price_formation`, `contract_settlement` and soft-constraint interpretation.
            price_formation: >-
              Prices can be constructed by a documented market rule rather than taken directly from optimisation duals
              (e.g. uniform pricing via a relaxed re-solve, uplift / fixed-cost-recovery adders,
              iterative markup calibration to recover long-run marginal cost, marginal-loss-factor settlement).
            water_value: >-
              A future cost function (water value) can be constructed as a reusable, exportable artefact from shadow prices extracted via
              `math.dual_extraction` (e.g. from Benders / SDDP cuts), forecasting the marginal cost of hydro and other seasonal
              storage devices for use in shorter-term scheduling under uncertain input parameters.
            contract_settlement: >-
              Contracts can be settled post-hoc against realised dispatch and prices, without altering the underlying optimisation
              (e.g. Contracts-for-Difference <CfD>, Power/energy Purchase Agreements <PPA>, swaps, caps/floors, Financial Transmission Rights <FTR>, Settlement Residue Auctions <SRA>).

        network_transfer_metrics:
          description: >-
            Network transfer capability and flow-sensitivity metrics can be derived from model outputs.
          members:
            transfer_capacity: >-
              Grid transfer capacities between regions or zones can be calculated.
            flow_sensitivity: >-
              Flow-sensitivity metrics (e.g. power transfer distribution factors, line outage distribution factors) can be calculated.
        probabilistic_reliability_assessment:
          description: >-
            Probabilistic resource-adequacy metrics can be calculated post-hoc.
            Sampling-based run orchestration to produce them is `orchestration.sampled_runs`.
          members:
            loss_of_load: >-
              Loss of load probability/expectation <LOLP> can be calculated.
            unserved_energy: >-
              Expected energy not served <EENS> can be calculated.
            capacity_credit: >-
              Effective load carrying capacity <ELCC> can be calculated.

    transformation:
      description: >-
        Model outputs can be reshaped and collated, without deriving new quantities from them.
      members:
        aggregation: >-
          Outputs can be aggregated across dimensions into broader groups for analysis and dissemination.
          This usually requires `model_definition.dimension_groups` to define aggregation membership.
        disaggregation: >-
          Outputs can be redistributed back to an initial, pre-`tractability.dimension_reduction` resolution
          (e.g. so that capacity-expansion results can be handed off to a full-resolution power-flow model).
        scenario_comparison: >-
          Outputs of multiple scenario/ensemble runs can be collated and compared.

traceability:
  description: >-
    Information can be traced throughout the modelling pipeline, including for debugging, diagnostics, and transparency.
  members:
    run_logs: >-
      Run logs can be made available (e.g. in text files), for use in debugging failing model runs.
    infeasibility_diagnosis: >-
      Infeasible problems can be diagnosed
      (e.g. irreducible infeasible subset (IIS) generation, named constraint violations).
    metadata:
      description: >-
        Metadata can be defined for modelling inputs and outputs.
      members:
        provenance: >-
          Data sources, versions, and licences can be defined for inputs.
        units: >-
          Physical units attached to data can be tracked and validated through the pipeline
          (to enable e.g., unit-consistency checking, automatic conversion, auto-scaling).
        propagation: >-
          Outputs can be linked back to the inputs and settings used to create them.
    intermediate_access: >-
      Intermediate pipeline artefacts (e.g. built problem data, solver state) can be exposed to the user.
