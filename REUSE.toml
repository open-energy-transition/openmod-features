version = 1
SPDX-PackageName = "openmod-features"
SPDX-PackageSupplier = "Open Energy Transition gGmbH <info@openenergytransition.org>"
SPDX-PackageDownloadLocation = "https://github.com/open-energy-transition/openmod-features"

[[annotations]]
path = [
    ".github/pull_request_template.md",
    "schema/*schema.yaml",
    "website/**/*.json"
]
SPDX-FileCopyrightText = "openmod-features contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "website/src/routeTree.gen.ts",
    "website/public/_headers",
    "website/pnpm-lock.yaml",
    "pixi.lock",
]
SPDX-FileCopyrightText = "openmod-features contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["website/public/favicon-32.png", "website/public/apple-touch-icon.png"]
SPDX-FileCopyrightText = ["2026 openmod-features contributors", "Fonticons, Inc. (Font Awesome Free \"chart-column\" glyph)"]
SPDX-License-Identifier = "CC-BY-4.0"
