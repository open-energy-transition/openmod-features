processes:
  description: >-
    Fundamental carrier-flow capabilities the tool can represent, defined by their mathematical role rather than by named technologies.
    `Carriers` are the energy or non-energy commodities that flow between processes (e.g. electricity, heat, hydrogen, CO2, water, materials).
  members:
    boundary_exchange: >-
      Carriers can enter or leave the system across its boundary at a defined cost and availability
      (e.g. fuel supply, primary resource extraction, imports/exports to unmodelled regions).
    conversion:
      description: >-
        Carriers can be transformed into other carriers within the system boundary
        (e.g. power plants, electrolysers, heat pumps, CO2 capture).
      members:
        one_to_one: >-
          A single in-flowing carrier can be converted to a single out-flowing carrier
          (e.g. power plants, electrolysers without heat recovery).
        multi_carrier_io: >-
          A single conversion process can have several in-flowing and/or out-flowing carriers at fixed ratios
          (e.g. back-pressure CHP, fixed heat-recovery fractions).
        flexible_ratio: >-
          The ratio between a conversion process's flows can be a decision variable within a feasible operating region
          (e.g. extraction-condensing CHP, heat pumps serving heat and cooling).
    temporal_transfer: >-
      Carriers can be moved in time, linking system states across timesteps (e.g. storage).
    spatial_transfer: >-
      Carriers can be moved between regions as continuous flow subject to transfer-capacity limits, without network physics.
    delayed_transfer: >-
      Carriers can flow in space with a time delay between injection and withdrawal
      (e.g. river flows, district-heating transit).
    buffered_transfer: >-
      Carriers can flow in space with an endogenous in-transit inventory that accumulates over time
      (e.g. pipeline linepack).
    discrete_transport: >-
      Carriers can be moved in space in discrete packets with loading/unloading decisions
      (e.g. shipping, trucking, rail).
    state_changing_transfer: >-
      A carrier can be moved at discrete physical state levels, with conversion between levels en route
      (e.g. heat-network temperature levels).
    explicit_demand:
      description: >-
        Carriers can be consumed by explicit processes with their own balances and constraints,
        rather than by a fixed exogenous profile.
      members:
        inelastic: >-
          A fixed quantity of a carrier can be consumed by a demand process whose in-flow can be constrained like any other process flow.
        price_responsive: >-
          The consumed quantity can be decided against willingness-to-pay
          (e.g. demand bids, stepwise/linear demand curves).
        mobile_storage: >-
          A consuming process can have embedded storage whose network attachment and availability vary in space and time
          (e.g. electric vehicles).

network:
  description: >-
    Flows can be coupled by the physics of the transporting medium,
    beyond the capacity limits of `processes.spatial_transfer`.
  members:
    power_flow:
      description: >-
        Electrical network physics can be represented.
      members:
        optimal_power_flow:
          description: >-
            Optimal power flow can be modelled.
          members:
            dc_opf: >-
              DC optimal power flow can be modelled.
            ac_opf: >-
              Linearised AC optimal power flow can be modelled.
            unbalanced_flows: >-
              Unbalanced (asymmetric phase) flows can be modelled (e.g. linearised DistFlow).
        sensitivity_limits:
          description: >-
            Flows can be limited using supplied linear sensitivities, as an alternative to physical network limits.
          members:
            ptdf: >-
              Supplied Power Transfer Distribution Factor <PTDF> limits can be applied, relating branch flows to nodal injections
              (e.g. with single or distributed slack).
            outage_factors: >-
              Supplied Line/Branch Outage Distribution Factor <LODF/BODF> limits can be applied, relating branch flows to the outage of another branch.
            generic_constraints: >-
              Built-in transmission constraint objects can be defined with user-supplied coefficients (e.g. flowgates, interfaces).
        network_limits:
          description: >-
            Network operating limits can be represented in the power-flow formulation.
          members:
            thermal: >-
              Thermal (branch flow magnitude) limits can be applied.
            phase_angle: >-
              Phase-angle difference limits between connected buses can be applied.
        losses: >-
          Branch losses can vary with flow, rather than being a fixed transfer efficiency
          (e.g. piecewise-linear or quadratic loss approximations).
        network_devices:
          description: >-
            Network components beyond simple lines and buses can be represented.
          members:
            transformers: >-
              Transformers (tap ratio, fixed phase shift) and shunt elements can be represented.
            facts_devices: >-
              Controllable flow devices whose setting is a decision variable can be represented
              (e.g. optimised phase-shifting transformers, Flexible AC Transmission System <FACTS> devices).
            hvdc_converters: >-
              Rectifiers, inverters, and HVDC converter stations can be represented.
    hydraulic_flow:
      description: >-
        Pressure-driven networks can be represented for carriers transported through pipes
        (e.g. methane, hydrogen, CO2, district heat, water).
      members:
        linearised_flow: >-
          Nodal pressure/head can be a decision variable that couples flows through a linearised pressure-drop relationship, with limits on that state
          (e.g. minimum/maximum nodal pressure).
        composition_tracking: >-
          A single transfer asset can carry a mixture whose constituents are balanced individually, with limits on the resulting blend
          (e.g. hydrogen blend fraction, Wobbe index).

decisions:
  description: >-
    Fidelity of the decisions made in the optimisation problem.
  members:
    investment:
      description: >-
        How investment in asset capacity can be decided: the variable type of the capacity decision and the kinds of investment decision available.
      members:
        exogenous_capacity: >-
          Asset capacity can be fixed in the input data (e.g. for dispatch-only modelling).
        continuous_capacity: >-
          Asset capacity can be a continuous decision variable, optionally bounded by a maximum
          (e.g. PV capacity up to a land-use limit).
        integer_investment_exogenous_capacity: >-
          Asset capacity can be built as a whole number of fixed-size units or blocks, with the number of units as an integer decision variable
          (e.g. nuclear units of fixed size).
        integer_investment_continuous_capacity: >-
          Asset capacity can be a continuous decision variable, with the decision to invest a binary or integer decision variable
          (e.g. individually tracked gas turbines of variable size).
        multi_period: >-
          Capacity can be decided over several investment periods rather than once for the whole horizon.
        retrofit: >-
          Modifications to an existing asset can be invested in endogenously, changing its technical parameters or costs rather than adding standalone capacity
          (e.g. CO2 capture, efficiency upgrades, fuel switching).
        endogenous_retirement: >-
          Existing capacity can be retired early as a decision variable, rather than only at the end of a fixed lifetime.
    operation:
      description: >-
        The resolution at which asset operation can be represented.
      members:
        unit_commitment: >-
          Assets can be committed as discrete units and then economically dispatched.
        maintenance_scheduling: >-
          Asset maintenance / outage schedules can be derived endogenously, co-optimised with operation.

constraints:
  description: >-
    Limits on investment and operating decisions, split by the model dimension a limit engages, its functional form, and specific use-cases.
  members:
    scope:
      description: >-
        Which model dimensions a limit engages.
        A limit engaging several dimensions is recorded under each of them
        (e.g. a fleet-wide annual cap is both `temporal` and `assets`).
      members:
        temporal:
          description: >-
            What a limit binds in time.
          members:
            pointwise:
              description: >-
                A limit can bind each time period independently of any other.
              members:
                investment: >-
                  The capacity or number of units added or retired within an investment period can be bounded above and/or below
                  (e.g. minimum viable project size, maximum units built per year).
                operation:
                  description: >-
                    Operation can be limited within a timestep.
                  members:
                    availability_derating: >-
                      An asset's flow or stored level can be bounded within a timestep by a time-varying fraction of its capacity
                      (e.g. renewable capacity factors, seasonal de-rating, storage level limits).
                    minimum_stable_level: >-
                      A committed asset's flow can be bounded below by a minimum stable level, so that it either operates at or above that level or is off.
                      Usually requires `decisions.operation.unit_commitment`.
                    forced_offline: >-
                      An asset can be required to be off in given timesteps (e.g. planned outage windows).
                      Usually requires `decisions.operation.unit_commitment`.
                    forced_online: >-
                      An asset can be required to be on in given timesteps (e.g. must-run units).
                      Usually requires `decisions.operation.unit_commitment`.
            sequential:
              description: >-
                A limit can bind the difference between time periods, or bind periods to one another, so that their order matters.
              members:
                investment:
                  description: >-
                    Investment limits can link investment periods.
                  members:
                    availability_window: >-
                      The investment periods in which an asset may be built or retired can be restricted
                      (e.g. lead times, earliest commissioning dates).
                    relative_build_rate: >-
                      Capacity added in a period can be limited relative to earlier additions or installed capacity
                      (e.g. technology growth limits).
                    technical_lifetime: >-
                      Capacity built in one period can be forced out of service a fixed number of periods later (e.g. end of technical life).
                operation:
                  description: >-
                    Operating limits can link timesteps.
                  members:
                    ramping: >-
                      The change in an asset's flow between consecutive timesteps can be limited within its normal operating range.
                    start_shut_trajectory: >-
                      The flow trajectory while an asset starts up or shuts down can be limited separately from its normal operating range
                      (e.g. run-up rates, start profiles).
                      Usually requires `decisions.operation.unit_commitment`.
                    commitment_duration: >-
                      The number of consecutive timesteps an asset must or may remain in a commitment state can be limited
                      (e.g. minimum up/down time).
                      Usually requires `decisions.operation.unit_commitment`.
                    start_consumption: >-
                      A carrier in-flow can be required on a change of commitment state (e.g. start-up fuel).
                      Usually requires `decisions.operation.unit_commitment`.
            cumulative:
              description: >-
                A limit can bind a quantity accumulated over part or all of the horizon, without fixing how it is distributed within that window.
              members:
                investment:
                  description: >-
                    Accumulated investment can be limited.
                  members:
                    capacity_target: >-
                      Installed capacity can be bounded above or below, counted at nameplate or at a de-rating / capacity-credit factor
                      (e.g. deployment targets, technical potential, planning reserve margins).
                    expansion_budget: >-
                      Accumulated investment spend can be bounded (e.g. a portfolio capital budget).
                    event_count: >-
                      The number of periods in which investment occurs can be limited, so that build-out is lumpy.
                    path_dependent: >-
                      An investment limit's bound can evolve endogenously with earlier investment
                      (e.g. a learning curve raising deployable capacity in later periods).
                operation:
                  description: >-
                    Accumulated operation can be limited.
                  members:
                    flow_volume: >-
                      Total carrier in-/out-flow can be bounded over a period
                      (e.g. annual throughput limits, hydro/fuel budgets, minimum capacity factor).
                    impact_budget: >-
                      Cumulative production or consumption of a user-definable non-carrier quantity can be bounded over a period
                      (e.g. an annual CO2 cap, a water abstraction budget).
                    event_count: >-
                      The number of times a discrete event occurs can be limited over a period
                      (e.g. maximum starts per year).
                      Usually requires `decisions.operation.unit_commitment`.
                    state_duration: >-
                      The cumulative number of timesteps an asset spends in a given state can be limited over a period
                      (e.g. total operating hours).
                      Usually requires `decisions.operation.unit_commitment`.
                    path_dependent: >-
                      An operating limit's bound can evolve endogenously with earlier operation
                      (e.g. battery degradation lowering available capacity).
            boundary_conditions:
              description: >-
                User-set conditions can be applied at the edges of a modelled period.
              members:
                investment: >-
                  Investment can start from an existing asset stock, or target a user-defined end-state (e.g. backcasting).
                operation: >-
                  Initial or end-state operating values can be set, and their change between periods limited
                  (e.g. start/end storage levels).
        spatial:
          description: >-
            A single limit can span several spatial units.
          members:
            investment: >-
              A single investment limit can span several spatial units (e.g. a national deployment target).
            operation: >-
              A single operating limit can span several spatial units
              (e.g. a system-wide emissions cap, a regional self-sufficiency requirement).
        assets:
          description: >-
            Limits that engage the identity of individual assets, rather than applying to each asset alike.
          members:
            spanning:
              description: >-
                A single limit can span several assets.
              members:
                investment: >-
                  A single investment limit can span several assets
                  (e.g. a combined technology capacity target, land-use competition).
                operation: >-
                  A single operating limit can span several assets
                  (e.g. a combined generation limit for a technology).
            dedicated_flow_routing: >-
              Carrier out-flow from one asset can be reserved as in-flow to specific other assets, rather than pooled at the node
              (e.g. fuel stockpiling, hydro cascades).
    functional_form:
      description: >-
        The mathematical form of relationships between decision variables in constraints, and hence the problem class handed to the solver.
      members:
        linear_multi_variable:
          description: >-
            Linear relationships can link several decision variables, beyond the built-in coupling of flow to capacity.
          members:
            investment: >-
              A linear relationship can link several investment decision variables
              (e.g. storage energy-to-power ratio envelopes).
            operation: >-
              A linear relationship can link several operating decision variables
              (e.g. CHP heat-power operating regions).
        quadratic:
          description: >-
            Constraints can contain products of decision variables, passed natively to a QCP-capable solver.
          members:
            investment: >-
              A quadratic constraint can involve an investment decision variable.
            operation: >-
              A quadratic constraint can involve an operating decision variable (e.g. quadratic loss terms).
        nonlinear:
          description: >-
            Constraints can link decision variables in a general non-linear relationship.
          members:
            investment: >-
              A non-linear constraint can involve an investment decision variable
              (e.g. pipeline throughput scaling with diameter).
            operation: >-
              A non-linear constraint can involve an operating decision variable
              (e.g. part-load efficiency, hydro head effects).
    reliability:
      description: >-
        Requirements against component failure or short-term imbalance can be imposed within the optimisation.
      members:
        unserved_demand: >-
          Demand can go unserved at a penalty cost (value of lost load <VOLL>).
        operating_reserve:
          description: >-
            A short-term reserve requirement can be held and co-optimised with dispatch.
          members:
            online_headroom: >-
              A requirement can be met from spare capability on running assets
              (e.g. spinning reserve, frequency regulation).
            standby_capability: >-
              A requirement can be met from offline assets that can start within a defined response time
              (e.g. non-spinning reserve).
              Usually requires `decisions.operation.unit_commitment`.
            inertia: >-
              A requirement can be held on synchronised rotational energy rather than on power headroom
              (e.g. minimum system inertia).
        contingency_constrained: >-
          The optimisation can be constrained to remain feasible after the loss of individual components
          (e.g. N-1 security-constrained optimal power flow, loss of a compressor station).
        probabilistic_reliability_limit:
          description: >-
            Probabilistic reliability limits, approximated from outage statistics, can be applied within the optimisation.
          members:
            loss_of_load: >-
              A loss-of-load-probability <LOLP> limit can be applied.
            unserved_energy: >-
              An expected-energy-not-served <EENS> limit can be applied.
    soft_constraints: >-
      Any user-defined or built-in constraint can be made soft through a generic slack-plus-penalty mechanism.

cost:
  description: >-
    Costs attached to investment and operating decisions as objective terms, beyond cost varying linearly with a decision variable.
  members:
    scope:
      description: >-
        Which model dimensions a cost term engages.
        A cost engaging several dimensions is recorded under each of them
        (e.g. a charge on a fleet's combined running hours is both `temporal` and `assets`).
      members:
        temporal:
          description: >-
            When a cost accrues in time, beyond accruing within a single period.
          members:
            sequential:
              description: >-
                Cost can be applied to a change in a decision variable between time periods.
              members:
                investment: >-
                  A cost can be incurred on a change in installed capacity between investment periods (e.g. a decommissioning charge).
                operation:
                  description: >-
                    Costs can be applied to changes between timesteps.
                  members:
                    ramping: >-
                      A cost can be incurred in proportion to the change in an asset's flow between timesteps.
                    start_up: >-
                      A cost can be incurred each time an asset starts up.
                      Usually requires `decisions.operation.unit_commitment`.
                    shut_down: >-
                      A cost can be incurred each time an asset shuts down.
                      Usually requires `decisions.operation.unit_commitment`.
                    start_state_dependent: >-
                      Start-up cost can vary with how long the asset has been offline (e.g. hot / warm / cold starts).
                      Usually requires `decisions.operation.unit_commitment`.
            cumulative:
              description: >-
                A cost coefficient can depend on a quantity accumulated over the horizon.
              members:
                investment: >-
                  A capital cost coefficient can change with cumulative deployment (e.g. an endogenous learning curve).
                operation: >-
                  An operating cost coefficient can change with cumulative prior operation
                  (e.g. maintenance cost rising with running hours).
        spatial:
          description: >-
            A single cost term can span several spatial units.
          members:
            investment: >-
              A single investment cost can span several spatial units (e.g. a corridor reinforcement charge).
            operation: >-
              A single operating cost can span several spatial units (e.g. a charge on a region's aggregate net imports).
        assets:
          description: >-
            A single cost term can span several assets.
          members:
            investment: >-
              A single investment cost can span several assets (e.g. a shared site or grid connection charge).
            operation: >-
              A single operating cost can span several assets (e.g. a contract priced on combined output).
    functional_form:
      description: >-
        How a cost can vary with the decision variable it attaches to, beyond the linear baseline.
      members:
        fixed_charge:
          description: >-
            Cost can be incurred as a lump sum irrespective of magnitude.
          members:
            investment: >-
              A capital cost can be incurred per asset purchased, irrespective of capacity (e.g. land purchase).
              Usually requires `decisions.investment.integer_investment_...`.
            operation: >-
              A cost can be incurred for each timestep an asset is committed, irrespective of its flow (e.g. no-load cost).
              Usually requires `decisions.operation.unit_commitment`.
        nonlinear:
          description: >-
            Cost can vary non-linearly with the decision variable.
          members:
            investment: >-
              Capital cost per unit of capacity can vary with capacity (e.g. economies of scale).
            operation: >-
              Operating cost per unit of flow can vary with the level of that flow
              (e.g. heat-rate curves, stepwise price-quantity offer bands).
        threshold_deviation:
          description: >-
            Costs can be applied to deviations above/below a contracted or reference level.
          members:
            investment: >-
              Costs can be applied to deviation from a reference investment level (e.g. a firm-capacity rebate).
            operation: >-
              Costs can be applied to deviation from a reference operating level
              (e.g. incr/decr offers around a day-ahead schedule, redispatch).
    time_value:
      description: >-
        Costs can be adjusted for when they are incurred and how they are financed.
      members:
        annuitisation: >-
          Overnight capital cost can be spread across an asset's economic life using a discount rate
          (e.g. weighted average cost of capital <WACC>).
        fiscal_treatment: >-
          Tax and depreciation arrangements can adjust annuitised cost (e.g. investment tax credits, depreciation schedules).
        period_discounting: >-
          Costs in later investment periods can be discounted to present value in the objective.

objective:
  description: >-
    The objective function can extend beyond minimising a single linear cost.
  members:
    quadratic: >-
      Quadratic objective terms can be passed natively to the solver (e.g. welfare maximisation with linear demand curves).
    multi_objective_weighted: >-
      Multiple objective terms can be combined via user-set weights.
    multi_objective_pareto: >-
      Pareto-optimal solution sets can be generated across objectives (e.g. epsilon-constraint).
    tie_breaking: >-
      Degenerate solutions can be resolved by a documented rule rather than solver arbitrariness
      (e.g. small penalties on zero-cost variables).

edge_effects:
  description: >-
    Distortions caused by model boundaries and linearisation can be mitigated endogenously.
  members:
    time_operational: >-
      End-of-horizon operational effects can be mitigated (e.g. cyclic storage levels, terminal value of stored energy).
    time_financial: >-
      End-of-horizon financial effects can be mitigated (e.g. residual value of assets outliving the horizon).
    energy_balance: >-
      Spurious energy destruction from simultaneous in- and out-flow of a lossy transfer/storage asset can be prevented.

actors:
  description: >-
    Heterogeneous decision-making actors can be represented, beyond a single central planner.
  members:
    portfolio: >-
      Actor asset portfolios with their own constraints and costs can be represented (e.g. capital limits per company).
    heuristic_markup: >-
      Strategic price/offer markups can be applied by heuristic or index-based rules
      (e.g. Residual Supply Index <RSI>-driven markups).
    distributed_objectives: >-
      Per-actor objectives can be represented within the system-level optimisation (e.g. prosumer decisions).
    equilibrium: >-
      Market equilibrium across actors with competing objectives can be computed
      (e.g. Cournot-Nash via complementarity or bi-level formulations).

uncertainty:
  description: >-
    The decision problem can be restructured to account for parametric or structural uncertainty.
  members:
    two_stage_stochastic: >-
      Two-stage stochastic optimisation can be performed (e.g. investment under uncertainty).
    multi_stage_stochastic: >-
      Multi-stage stochastic optimisation can be performed, with decisions revised as uncertainty resolves
      (e.g. hydro scheduling under uncertain inflows).
    risk_aversion: >-
      Risk measures can be applied in the objective or constraints of a stochastic optimisation
      (e.g. Conditional Value at Risk <CVaR>).
    robust_optimisation: >-
      Worst-case cost can be minimised over an uncertainty set.
    near_optimal: >-
      Alternative near-optimal solutions can be generated (e.g. Modelling to Generate Alternatives <MGA>).

model_definition:
  description: >-
    How the model's parameter space and dimensions can be shaped, grouped, and reused.
  members:
    configurable_dimensions: >-
      The dimensionality of an asset parameter or cost can be configured by the user from a set of tool-defined dimensions.
    extensible_dimensions: >-
      A dimension not natively defined by the tool can be introduced by the user, and parameters and math indexed over it
      (e.g. a custom cohort axis).
    dimension_groups: >-
      Dimension members can be tagged into named, potentially overlapping groups, for use in constraints, aggregation, and analysis
      (e.g. "coastal assets" spanning several technologies and nodes).
    component_templating: >-
      Components can inherit parameters from a shared template, including programmatic generation of components from a template
      (e.g. an abstract technology definition, auto-cloned vintages).

math:
  description: >-
    Access to, and user extension of, the underlying mathematical formulation.
  members:
    formulation_transparency: >-
      The tool's mathematical formulation can be inspected (e.g. rendered equations traceable to the built problem).
    problem_file_export: >-
      The built optimisation problem can be exported in standard formats (e.g. LP/MPS).
    dual_extraction: >-
      Constraint duals can be extracted from the solved problem.
    piecewise_formulation: >-
      Piecewise constructs are available to build non-linear relationships in the math (e.g. SOS2 constraints).
    user_defined_math: >-
      Users can define their own constraints, variables, and objective expression.

tractability:
  description: >-
    The computational cost of building and solving the problem can be reduced, trading exactness for speed.
  members:
    dimension_reduction:
      description: >-
        The number of members along a dimension can be reduced automatically, uniformly across all other dimensions.
      members:
        adjacency_aggregation:
          description: >-
            Neighbouring dimension members can be merged, preserving ordering / adjacency.
          members:
            temporal: >-
              Timesteps or investment periods can be merged contiguously (e.g. hourly to daily).
            spatial: >-
              Bordering spatial units can be merged into contiguous zones (e.g. buses to bidding zones).
        similarity_aggregation:
          description: >-
            Dimension members can be grouped by likeness and each group represented by a proxy member.
          members:
            temporal: >-
              A full timeseries can be represented by non-contiguous typical periods or duration curves.
            spatial: >-
              Spatial units can be clustered by likeness rather than adjacency (e.g. by resource quality).
            assets: >-
              Individual assets can be aggregated into asset groups.
            scenarios: >-
              A scenario ensemble can be reduced to a weighted representative set.
        non_contiguity_handling:
          description: >-
            Features spanning dimension members can be linked across non-contiguous aggregated members.
          members:
            temporal: >-
              Inter-temporal features can be linked across typical periods (e.g. storage levels).
            spatial: >-
              Inter-spatial features can be linked across discontiguous zones.
        equivalencing:
          description: >-
            A sub-system can be replaced by a reduced representation that preserves its boundary behaviour.
          members:
            spatial: >-
              Network elements can be equivalenced (e.g. Ward or Kron reduction).
            assets: >-
              A chain of interconnected assets can be collapsed into a single component.
        filtering:
          description: >-
            Dimension members can be removed from the built problem rather than represented by a proxy.
          members:
            temporal: >-
              Timesteps or investment periods can be filtered out (e.g. to a user-selected study window).
            spatial: >-
              Spatial units can be filtered out (e.g. below a voltage level).
            assets: >-
              Assets can be filtered out (e.g. by node or carrier).
            scenarios: >-
              Scenarios can be filtered out.
    variable_fidelity:
      description: >-
        The fidelity of the same attribute/dimension can differ across the model's scope.
      members:
        formulation: >-
          The mathematical fidelity of the same attribute can differ across the model's scope
          (e.g. unit commitment near-term, continuous dispatch beyond).
        resolution:
          description: >-
            The resolution of one dimension can differ across the members of another.
          members:
            temporal: >-
              Temporal resolution can vary across another dimension (e.g. hourly in a focus region, daily elsewhere).
            spatial: >-
              Spatial resolution can vary across another dimension (e.g. nodal near-term, zonal beyond).
            assets: >-
              Asset resolution can vary across another dimension (e.g. individual assets in a focus region, groups elsewhere).
            scenarios: >-
              Scenario resolution can vary across another dimension (e.g. a scenario tree branching more finely near-term).
    reformulation:
      description: >-
        The built problem or its solution algorithm can be reformulated to reduce solve cost.
      members:
        linearised_unit_commitment: >-
          Unit commitment can be approximated with continuous commitment variables.
        nonlinear_handling:
          description: >-
            Non-linear relationships can be treated automatically so that the built problem remains solvable.
          members:
            convex_relaxation: >-
              A non-convex relationship in the tool's own formulation can be convexified
              (e.g. second-order-cone relaxation of AC power flow).
            function_conversion: >-
              User-supplied non-linear functions can be converted automatically into valid model inputs (e.g. piecewise segments).
        constraint_screening: >-
          Constraints unlikely to bind can be omitted or lazily added.
        decomposition: >-
          The problem can be split into coordinated sub-problems solved iteratively or in parallel
          (e.g. Benders, progressive hedging, Stochastic Dual Dynamic Programming <SDDP>).
        numeric_scaling: >-
          Data can be scaled to reduce numerical instability in the solver.

orchestration:
  description: >-
    Multiple complete runs can be coordinated by tool-managed workflows.
  members:
    scenario_runs: >-
      Discrete, named scenarios can be executed in batch with collated outputs.
    sampled_runs: >-
      Run ensembles can be executed over a sampled uncertainty space with collated outputs (e.g. Monte Carlo).
    coupled_models:
      description: >-
        Two or more model runs can be executed with tool-managed data exchange between them.
      members:
        limited_foresight:
          description: >-
            Sequential optimisation windows can emulate limited knowledge of later periods, passing end-state data between runs.
          members:
            investment: >-
              Investment can be optimised sequentially per period or set of periods (e.g. myopic foresight).
            operation: >-
              Dispatch can be optimised sequentially per set of timesteps (e.g. rolling horizon).
        fidelity_sequence: >-
          Models of the same system at different fidelity can be run in sequence, passing data between them
          (e.g. capacity expansion followed by unit-commitment dispatch).
        market_sequence: >-
          Models of successive market stages can be run with bidirectional data exchange
          (e.g. interleaved day-ahead / real-time runs).
        convergence_iteration: >-
          Runs can be repeated, exchanging data, until relationships not representable in a single problem converge
          (e.g. iterating on line reactances).

io:
  description: >-
    Data formats, conventions, and mechanisms for moving model input/output data.
  members:
    plain_text:
      description: >-
        Data can be handled in human-readable, version-control-friendly text formats (e.g. CSV, JSON, YAML).
      members:
        input: >-
          Input data can be provided in this format.
        output: >-
          Output data can be written in this format.
    binary:
      description: >-
        Data can be handled in binary formats (e.g. Excel, NetCDF, HDF5, Parquet).
      members:
        input: >-
          Input data can be provided in this format.
        output: >-
          Output data can be written in this format.
    database:
      description: >-
        Data can be handled in databases.
      members:
        input: >-
          Input data can be read from a database.
        output: >-
          Output data can be written to a database.
    remote_storage:
      description: >-
        Data can be read from / written to remote storage (e.g. object stores).
      members:
        input: >-
          Input data can be read from remote storage.
        output: >-
          Output data can be written to remote storage.
    lazy_loading:
      description: >-
        Data larger than memory can be handled out-of-core.
      members:
        input: >-
          Input data can be loaded lazily.
        output: >-
          Output data can be streamed rather than held fully in memory.
    standardised:
      description: >-
        Data can follow a community-recognised convention, ontology, or network-data format
        (e.g. Open Energy Ontology <OEO>, IAMC template, Common Information Model <CIM>, PSSE RAW).
      members:
        input: >-
          Standardised input data can be accepted.
        output: >-
          Outputs can follow a standard.

preprocessing:
  description: >-
    Parameters can be derived from user-defined input data before running the model.
  members:
    download: >-
      Data can be downloaded within the tool from an external source.
    model_catalogue: >-
      Pre-built models can be retrieved from a catalogue as starting points.
    resource_conversion: >-
      Profiles can be derived from weather or resource data via physical response models
      (e.g. wind speed to capacity factor, temperature to heat demand).
    forecasting: >-
      A profile can be scaled or reshaped to meet forecast targets (e.g. annual total or peak).
    spatial_distribution:
      description: >-
        A parameter can be distributed spatially using other spatial parameters.
      members:
        demand: >-
          Nodal demand can be distributed from an aggregate total.
        network_geometry: >-
          Line or pipeline lengths or routes can be derived from node coordinates.
    scenario_generation: >-
      Scenario ensembles can be generated from parameters or sampling rules.
    input_validation: >-
      Input data can be validated against expected structure and value ranges before a run.

postprocessing:
  description: >-
    Analyses of model outputs that can be triggered by the tool.
  members:
    metrics:
      description: >-
        Quantities can be computed from model outputs, per asset or system-wide.
      members:
        operational:
          description: >-
            Operational analyses can be derived.
          members:
            capacity_factor: >-
              Average output relative to capacity can be calculated.
            operating_hours: >-
              The number of timesteps an asset is running can be calculated.
            binding_hours: >-
              The number of timesteps an asset's flow is at its upper bound can be calculated (e.g. line congestion hours).
            curtailment: >-
              Curtailment can be calculated.
        financial:
          description: >-
            Financial analyses can be derived.
          members:
            marginal_price: >-
              Locational marginal prices can be reported per node and carrier, optionally split into energy, congestion, and loss components.
            price_formation: >-
              Prices can be constructed by a documented market rule rather than taken directly from duals
              (e.g. uplift adders, uniform pricing via a relaxed re-solve).
            water_value: >-
              A reusable future cost function (water value) for seasonal storage can be constructed and exported.
            asset_accounts: >-
              Asset-level revenue / cost accounts can be produced.
            contract_settlement: >-
              Contracts can be settled post-hoc against realised dispatch and prices
              (e.g. Contracts-for-Difference <CfD>, Financial Transmission Rights <FTR>).
            levelised_cost: >-
              Levelised cost of electricity or other carriers can be calculated.
            net_present_value: >-
              Net present value of the system or a subset of assets can be calculated.
        impact_assessment:
          description: >-
            Auxiliary impacts can be calculated.
          members:
            emissions: >-
              GHG or other pollutant emissions can be calculated.
            resource_use: >-
              Non-carrier resource consumption (e.g. water, land, materials) can be calculated.
            socioeconomic: >-
              Socioeconomic impacts (e.g. job creation) can be calculated.
        network_transfer_metrics:
          description: >-
            Network transfer metrics can be derived.
          members:
            transfer_capacity: >-
              Transfer capacities between regions or zones can be calculated.
            flow_sensitivity: >-
              Flow-sensitivity factors (e.g. PTDF, LODF) can be calculated.
        probabilistic_reliability_assessment:
          description: >-
            Probabilistic resource-adequacy metrics can be calculated post-hoc.
          members:
            loss_of_load: >-
              Loss of load probability/expectation <LOLP/LOLE> can be calculated.
            unserved_energy: >-
              Expected energy not served <EENS> can be calculated.
            capacity_credit: >-
              Effective load carrying capability <ELCC> can be calculated.
    transformation:
      description: >-
        Model outputs can be reshaped and collated, without deriving new quantities.
      members:
        aggregation: >-
          Outputs can be aggregated into broader groups.
        disaggregation: >-
          Outputs can be redistributed back to the resolution before dimension reduction.
        scenario_comparison: >-
          Outputs of multiple runs can be collated and compared.

interface:
  description: >-
    Options for users and machines to drive the tool, by access mode (build / run / analyse), plus solver, execution, and visualisation options.
  members:
    gui:
      description: >-
        The tool can be driven via a graphical user interface.
      members:
        build: >-
          A model can be defined via a GUI.
        run: >-
          A model run can be executed via a GUI.
        analyse: >-
          Model outputs can be interacted with via a GUI.
    api:
      description: >-
        The tool can be driven via a programmatic interface (e.g. language API, web API).
      members:
        build: >-
          A model can be built programmatically.
        run: >-
          Runs can be launched and managed programmatically.
        analyse: >-
          Results can be analysed programmatically.
    cli:
      description: >-
        The tool can be driven via a command line interface.
      members:
        build: >-
          A model can be built or converted via CLI commands.
        run: >-
          A model run can be launched and managed via CLI commands.
        analyse: >-
          Reports can be created via CLI commands.
    solver_configuration: >-
      Solver parameters can be configured directly (e.g. tolerances, warm starts).
    remote_execution: >-
      Runs can be dispatched to and managed on remote compute (e.g. cloud, HPC) from the tool.
    visualisation:
      description: >-
        Model inputs or outputs can be rendered as visual artefacts by the tool.
      members:
        charts: >-
          Input or result data can be plotted (e.g. dispatch stacks, duration curves).
        network_maps: >-
          Network topology can be rendered schematically or geographically.
        report_templates: >-
          Templates can generate consistent reports or dashboards from model outputs.

traceability:
  description: >-
    Information can be traced through the modelling pipeline for debugging, diagnostics, and transparency.
  members:
    metadata:
      description: >-
        Metadata can be defined for modelling inputs and outputs.
      members:
        provenance: >-
          Data sources, versions, and licences can be recorded for inputs.
        units: >-
          Physical units can be tracked and validated through the pipeline.
        propagation: >-
          Outputs can be linked back to the inputs and settings that produced them.
    run_logs: >-
      Run logs can be made available.
    intermediate_access: >-
      Intermediate pipeline artefacts (e.g. built problem data, solver state) can be accessed in memory via the API.
    infeasibility_diagnosis: >-
      Infeasible problems can be diagnosed (e.g. irreducible infeasible subset <IIS>).
